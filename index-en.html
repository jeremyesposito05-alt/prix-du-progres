<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The price of progress</title>
<style>
/* ===================================================================
   LE PRIX DU PROGRÈS — Collège Alpin Beau Soleil — Unité 1, G10
   La marque tient le cadre (blason, SangBleu, barre navy),
   l'époque tient le plateau (brique, suie, ivoire, cuivre).
   Une situation, deux réponses, quatre forces qui vous jugent.
   =================================================================== */
:root{
  --bs-navy:#1A2047; --bs-wgrey:#9C9895; --bs-orange:#CA5007; --bs-gold:#F3BE31;
  --serif:"SangBleu OG Sans","SangBleu Sans","Didot","Bodoni MT","Playfair Display",Georgia,serif;
  --sans:Calibri,"Segoe UI",system-ui,sans-serif;
  --fond:#241C16; --fond2:#30251C; --papier:#EFE5D4; --accent:#C8872B;
  --trait:#5A4736; --vert:#8FBF7A; --rouge:#D97A5A;
}
/* Detroit : acier, bleu de travail, crème. Le cadre de marque ne bouge pas. */
body[data-niveau="II"]{
  --fond:#1B2026; --fond2:#262E36; --papier:#E9E5DD; --accent:#8FB4D9;
  --trait:#3D4954;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--papier);min-height:100vh;display:flex;flex-direction:column;
  font-family:var(--sans);font-size:16px;line-height:1.5}

header{background:var(--bs-navy);color:#fff;display:flex;align-items:center;gap:13px;
  padding:9px 18px;border-bottom:3px solid var(--accent)}
header svg.blason{width:24px;height:24px;flex:0 0 auto}
header .titre{font-family:var(--serif);font-size:18px;letter-spacing:.06em}
header .ecole{font-size:11.5px;color:#B9BCCB;margin-left:auto;letter-spacing:.08em}

main{max-width:900px;width:100%;margin:0 auto;padding:18px 18px 40px;flex:1;display:flex;flex-direction:column;justify-content:center}
h1{font-family:var(--serif);font-weight:normal;font-size:clamp(30px,5vw,50px);margin:.15em 0}
h2{font-family:var(--serif);font-weight:normal;font-size:20px;color:var(--accent);margin:1.4em 0 .5em}
.sous{color:var(--bs-wgrey);margin:0 0 1.3em}
.centre{text-align:center}
button{font-family:var(--sans);font-size:15px;cursor:pointer;border-radius:3px;
  border:1px solid var(--accent);background:transparent;color:var(--papier);padding:11px 22px}
button:hover{background:var(--accent);color:#241C16}
button.plein{background:var(--accent);color:#241C16}
button:disabled{opacity:.3;cursor:not-allowed;background:transparent;color:var(--papier)}

/* ---------- les quatre forces, toujours visibles ---------- */
.forces{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.force{background:var(--fond2);border:1px solid var(--trait);border-radius:4px;padding:10px 8px;text-align:center}
.force svg{width:29px;height:29px;fill:var(--accent);display:block;margin:0 auto 5px}
.force .nom b{color:var(--papier);font-weight:normal;font-size:13px}
.force .nom{font-size:11.5px;letter-spacing:.05em;color:#C3B39A;text-transform:uppercase}
.force .mini{height:6px;background:#1A130F;border-radius:3px;margin-top:7px;overflow:hidden}
.force .mini i{display:block;height:100%;transition:width .5s,background .5s}
.force.danger{border-color:var(--bs-orange);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(202,80,7,.5)}50%{box-shadow:0 0 0 6px rgba(202,80,7,0)}}

/* ---------- la situation ---------- */
.situ{background:var(--fond2);border:1px solid var(--trait);border-left:4px solid var(--accent);
  border-radius:4px;padding:22px 24px;margin-bottom:16px}
.situ .t{font-family:var(--serif);font-size:clamp(21px,3vw,27px);line-height:1.25;margin-bottom:8px}
.situ .d{color:#CDBCA2;font-size:16px;font-style:italic}
.situ .parle{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:9px}

/* ---------- les deux réponses ---------- */
.rep{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:stretch}
.rep.deux{grid-template-columns:repeat(2,1fr)}
@media(max-width:860px){.rep{grid-template-columns:1fr}}
@media(max-width:700px){.forces{grid-template-columns:repeat(2,1fr)}}
.choix{background:var(--fond2);border:1px solid var(--trait);border-radius:4px;padding:16px;
  display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;color:var(--papier);
  transition:border-color .15s,transform .12s}
.choix:hover{border-color:var(--accent);transform:translateY(-2px);background:var(--fond2)}
.choix .q{font-family:var(--serif);font-size:17px;line-height:1.3}
.choix .impacts{display:flex;flex-direction:column;gap:4px;align-items:flex-start;margin-top:auto}
.imp{display:inline-flex;align-items:center;gap:5px;width:100%}
.imp svg{width:18px;height:18px;flex:0 0 auto}
.imp .lb{font-size:12px;color:#B7A68C;letter-spacing:.02em}
.imp.up .lb,.imp.dn .lb{color:inherit;opacity:.85}
.imp .fl{font-size:13px;letter-spacing:-1px;margin-left:auto}
.up{fill:var(--vert);color:var(--vert)} .dn{fill:var(--rouge);color:var(--rouge)}

/* ---------- pied de plateau ---------- */
.pied{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:20px;
  border-top:1px solid var(--trait);padding-top:12px;font-size:13.5px;color:#A6947C}
.pied b{font-weight:normal;color:var(--accent);font-variant-numeric:tabular-nums}
.cond{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto}
.cond span{font-size:11px;padding:2px 8px;border-radius:11px;border:1px solid var(--trait);color:#7E6D59}
.cond span.ok{border-color:var(--accent);color:var(--accent)}

/* ---------- conséquence ---------- */
.niveaux{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0 6px}
@media(max-width:820px){.niveaux{grid-template-columns:1fr}}
.niv{background:var(--fond2);border:1px solid var(--trait);border-radius:4px;padding:16px;
  text-align:left;color:var(--papier);cursor:pointer;display:flex;flex-direction:column;gap:7px}
.niv:hover{border-color:var(--accent);transform:translateY(-2px)}
.niv .ord{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.niv .lieu{font-family:var(--serif);font-size:21px;line-height:1.2}
.niv .per{font-size:13px;color:#9C9895}
.niv .rec{font-size:12px;color:#8E7C66;margin-top:auto;padding-top:6px}
.niv[disabled]{opacity:.42;cursor:default;transform:none;border-style:dashed}
/* Un événement ne ressemble à rien d'autre : il entre en force. */
.ev{background:#2A1410;border:1px solid var(--bs-orange);border-left:5px solid var(--bs-orange);
  border-radius:4px;padding:20px 22px;animation:irruption .42s ease-out}
body[data-niveau="II"] .ev{background:#2B1A18}
@keyframes irruption{
  0%{opacity:0;transform:scale(.97) translateY(-8px)}
  55%{opacity:1;transform:scale(1.008) translateY(0)}
  100%{transform:scale(1)}
}
.ev .evd{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--bs-gold)}
.ev .evt{font-family:var(--serif);font-size:clamp(23px,3.4vw,31px);line-height:1.2;margin:6px 0 10px}
.ev .evx{margin:0 0 14px;font-size:16.5px;max-width:74ch}
.ev .evs{font-size:13.5px;color:#C4A98F;border-top:1px solid #5A3A2E;padding-top:11px;max-width:74ch}
.ev .evs strong{color:var(--bs-gold);font-weight:normal}
.ev .evi{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px}
.ev .evi .imp{width:auto}
.ev .evi .fl{margin-left:4px}
button.urg{background:var(--bs-orange);border-color:var(--bs-orange);color:#fff;animation:battement 1.1s infinite}
@keyframes battement{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}

.chrono{height:7px;background:#1A130F;border-radius:4px;overflow:hidden;margin-bottom:7px}
.chrono .jauge{height:100%;width:100%;background:var(--bs-orange)}
.compte{margin:0 0 14px;font-size:13px;color:var(--bs-orange);letter-spacing:.04em}
.compte b{font-size:16px}
.situ.urgent{border-left-color:var(--bs-orange)}
.situ.urgent .ct{color:var(--bs-orange);opacity:1}
.situ .pc{margin-top:13px;padding-top:11px;border-top:1px solid var(--trait);
  font-size:13.5px;line-height:1.55;color:#B2A188;max-width:80ch}
body[data-niveau="II"] .situ .pc{color:#9FB0C0}
.situ .pc span{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);opacity:.8;margin-bottom:4px}
.ct{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:#8E7C66;margin-bottom:7px}
.situ .ct{color:var(--accent);opacity:.72}
.consq{background:#1C1511;border-left:3px solid var(--accent);padding:12px 16px;margin:14px 0;
  border-radius:0 3px 3px 0;font-size:14.5px;color:#CDBCA2}

/* ---------- fin ---------- */
.gros{font-family:var(--serif);font-size:clamp(28px,5vw,44px);color:var(--accent);margin:.15em 0 .3em}
.temoin{background:var(--fond2);border:1px solid var(--trait);border-radius:4px;padding:18px;margin:12px 0}
.temoin .qui{font-family:var(--serif);font-size:17px;color:var(--accent);margin-bottom:6px}
.temoin .cit{font-style:italic;color:#DDCEB6;border-left:2px solid var(--trait);padding-left:13px;margin:9px 0}
.temoin .src{font-size:12px;color:var(--bs-wgrey)}
.bilan{background:#1C1511;border:1px solid var(--accent);border-radius:4px;padding:20px;margin:18px 0}
.bilan ul{margin:.5em 0;padding-left:1.2em} .bilan li{margin:.4em 0}
.role{background:#1C1511;border:1px solid var(--trait);border-radius:4px;padding:18px 20px;margin:18px 0}
.role .r{font-family:var(--serif);font-size:19px;color:var(--accent);margin-bottom:6px}
footer{color:#6E5F4E;font-size:11.5px;text-align:center;padding:26px 18px 8px}

/* ===================================================================
   MISE EN SCÈNE — le bureau du maître de la ville
   Une fenêtre d'atelier donne sur la ville ; sur la table, des dossiers.
   Tout est dessiné en CSS/SVG : le jeu reste beau sans aucune image.
   Si img/vue-I.jpg (ou vue-II.jpg) existe, elle remplace le décor peint.
   =================================================================== */
:root{
  --ciel-h:#F2E3C4; --ciel-b:#C9B79A; --soleil:#FFF6DC;
  --brique:#6B5645; --lointain:#9A8B79; --fumee:#8E8170;
  --bois:#2A2018; --bois-h:#3A2C20;
}
body[data-niveau="II"]{
  --ciel-h:#CBD6E0; --ciel-b:#8E9BA8; --soleil:#EDF3F8;
  --brique:#4A555F; --lointain:#6E7B86; --fumee:#79838D;
  --bois:#1D232A; --bois-h:#2A323B;
}

#scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#scene > div{position:absolute;inset:0}
#scene .ciel{
  background:
    radial-gradient(circle at 46% 26%, var(--soleil) 0 4%, transparent 32%),
    linear-gradient(to bottom, var(--ciel-h) 0%, var(--ciel-h) 34%, var(--ciel-b) 100%)}
#scene .vue{background-size:cover;background-position:center;opacity:0;transition:opacity .9s}
#scene.aimg .vue{opacity:1}
#scene.aimg .ciel,#scene.aimg .ville,#scene.aimg .fumees{opacity:0}

/* la ville au loin : une bande de toits et une forêt de cheminées */
#scene .ville{top:auto;bottom:0;height:58%}
#scene .ville svg{position:absolute;left:0;bottom:0;width:100%;height:100%}
#scene .fumees{top:4%;bottom:auto;height:68%;filter:blur(9px);opacity:.5;transition:opacity 1.4s}
#scene .fumees span{position:absolute;bottom:0;width:16%;height:100%;
  background:radial-gradient(ellipse at 50% 100%, var(--fumee) 0, transparent 64%);
  transform-origin:50% 100%;animation:monter 15s ease-in-out infinite}
@keyframes monter{
  0%{transform:translateY(18%) scaleX(.7);opacity:.14}
  50%{transform:translateY(-6%) scaleX(1.08);opacity:.46}
  100%{transform:translateY(18%) scaleX(.7);opacity:.14}
}

/* la vitre s'encrasse à mesure que la ville enfle : personne ne l'a décidé */
#scene .vitre{transition:opacity 1.6s;
  background:
    linear-gradient(118deg, rgba(255,255,255,.2) 0 15%, transparent 16% 33%,
                    rgba(255,255,255,.1) 34% 40%, transparent 41%),
    linear-gradient(to bottom, rgba(40,32,24,.08), rgba(26,20,15,.34));
  opacity:var(--suie,.2)}

/* deux jambages et une traverse : une fenêtre d'atelier, pas un quadrillage */
#scene .montants{
  background:
    linear-gradient(to right, transparent 0 11%, var(--bois) 11% 11.9%, transparent 11.9%),
    linear-gradient(to right, transparent 0 88%, var(--bois) 88% 88.9%, transparent 88.9%),
    linear-gradient(to bottom, transparent 0 41%, var(--bois) 41% 42%, transparent 42%);
  opacity:.82}
#scene .cadre{border:14px solid var(--bois);
  box-shadow:inset 0 0 44px rgba(20,14,10,.2), inset 0 0 0 3px var(--bois-h)}

/* Le voile n'assombrit que la colonne de lecture : sur les côtés, la ville
   reste visible. C'est ce qui fait la fenêtre plutôt que le filtre. */
#scene .voile{
  background:
    linear-gradient(to right, rgba(20,15,11,.04) 0, rgba(20,15,11,.78) 21%,
                    rgba(20,15,11,.85) 50%, rgba(20,15,11,.78) 79%, rgba(20,15,11,.04) 100%),
    linear-gradient(to bottom, rgba(26,20,15,0) 0, rgba(20,15,11,.30) 62%, rgba(20,15,11,.46) 100%)}
body[data-niveau="II"] #scene .voile{
  background:
    linear-gradient(to right, rgba(14,18,23,.04) 0, rgba(14,18,23,.78) 21%,
                    rgba(14,18,23,.85) 50%, rgba(14,18,23,.78) 79%, rgba(14,18,23,.04) 100%),
    linear-gradient(to bottom, rgba(16,20,25,0) 0, rgba(12,16,20,.32) 62%, rgba(12,16,20,.48) 100%)}

header,main,footer{position:relative;z-index:1}

/* ---------- LES DOSSIERS SUR LA TABLE ---------- */
/* Une règle : un statut de texte = un support. On distingue d'un coup
   d'œil ce qu'un personnage affirme de ce qu'un rapport établit. */
.dossier{position:relative;margin-top:24px;
  box-shadow:0 10px 26px rgba(0,0,0,.5);
  opacity:0;animation:poser .42s cubic-bezier(.2,.8,.3,1) forwards;animation-delay:var(--d,0s)}
@keyframes poser{
  0%{opacity:0;transform:translateY(-13px) rotate(-.45deg)}
  100%{opacity:1;transform:none}
}
/* un clic pose tout le reste d'un coup : on ne punit jamais qui lit vite */
#app.presse .dossier,#app.presse .forces{animation-delay:0s;animation-duration:.01s}
.dossier .onglet{position:absolute;top:0;left:20px;transform:translateY(-100%);
  background:var(--ong,var(--accent));color:#1C1511;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;padding:4px 13px 3px;border-radius:3px 3px 0 0;white-space:nowrap}
.dossier::after{content:"";position:absolute;right:-3px;top:9px;bottom:9px;width:3px;
  background:var(--ong,var(--accent));opacity:.45;border-radius:0 3px 3px 0}

.d-situation{--ong:var(--accent)}
.d-decision{--ong:#8FBF7A;border-left-color:#8FBF7A}
.d-enquete{--ong:#7E8D9C;background:#211A14;border:1px solid var(--trait);
  border-radius:3px;padding:16px 20px}
body[data-niveau="II"] .d-enquete{background:#1A2027}
.d-lettre{--ong:#C9A227;background:#241D14;border:1px solid var(--trait);
  border-radius:3px;padding:20px 22px}
body[data-niveau="II"] .d-lettre{background:#1E2229}

/* le rapport d'enquête : fermé par défaut, on choisit de l'ouvrir */
.d-enquete summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;
  font-size:14px;color:#B7A68C}
.d-enquete summary::-webkit-details-marker{display:none}
.d-enquete .pli{font-size:10.5px;color:var(--ong);border:1px solid var(--ong);border-radius:2px;
  padding:3px 9px;letter-spacing:.1em;text-transform:uppercase;margin-left:auto;white-space:nowrap}
.d-enquete .pli::before{content:"Ouvrir"}
.d-enquete[open] .pli::before{content:"Fermer"}
.d-enquete .pli::after{content:" ▼"}
.d-enquete[open] .pli::after{content:" ▲"}
.d-enquete[open]{--ong:var(--accent)}
.d-enquete .corps{font-size:14.5px;line-height:1.62;color:#B2A188;max-width:80ch;
  margin-top:14px;padding-top:13px;border-top:1px solid var(--trait)}
body[data-niveau="II"] .d-enquete .corps{color:#9FB0C0}

/* la lettre : un autre papier, une autre main */
.d-lettre .corps{font-style:italic;font-size:15.5px;line-height:1.7;color:#DDCEB6;max-width:70ch}
.d-lettre .sign{font-family:var(--serif);font-size:14.5px;color:var(--ong);margin-top:13px;text-align:right}
.d-lettre .prov{font-size:11.5px;color:var(--bs-wgrey);margin-top:11px;
  border-top:1px solid var(--trait);padding-top:9px}

.consq.dossier{margin-bottom:0}
.forces{opacity:0;animation:poser .4s ease-out forwards}

@media(prefers-reduced-motion:reduce){
  .dossier,.forces{animation:none;opacity:1}
  #scene .fumees span{animation:none}
}

</style>
<style>
/* ===================================================================
   SURCOUCHE « DOCUMENTS SUR LE BUREAU »

   La scène du fond — la fenêtre, la ville, les fumées, la vitre qui
   s'encrasse — n'est pas touchée : elle reste derrière, à sa place.
   Ce qui change est le premier plan. L'interface cesse d'être des
   panneaux sombres pour devenir ce qu'elle est dans la fiction :
   des papiers posés sur un sous-main, qu'on vous apporte et que vous
   signez.

   Gain pédagogique autant qu'esthétique : un rapport se lit en encre
   sombre sur papier clair. Au vidéoprojecteur, l'écart est net.

   Variables préfixées pour ne rien écraser de la feuille précédente.
   =================================================================== */
:root{
  --pap:#F0E6D2; --pap2:#E2D5BB; --enc:#2B2118; --enc2:#6B5741;
  --fil:#B9A583; --lai:#B8894A; --vrt:#3E7A3A; --rge:#B03A1E;
  --omb:0 16px 34px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.42);
}
body[data-niveau="II"]{
  --pap:#EFEDE7; --pap2:#DCD9D0; --enc:#23292F; --enc2:#5A6570;
  --fil:#A8AEB4; --lai:#8FA3B5; --vrt:#2F6B46; --rge:#B2382C;
}

/* le papier, une fois pour toutes */
.situ, .choix, .force, .niv, .role, .bilan, .temoin, .consq, .ev{
  background:
    linear-gradient(180deg, rgba(255,255,255,.5), transparent 30%),
    repeating-linear-gradient(94deg, rgba(160,140,110,.045) 0 2px, transparent 2px 5px),
    linear-gradient(152deg, var(--pap) 0%, var(--pap2) 100%) !important;
  color:var(--enc) !important;
  border:1px solid var(--fil);
  border-radius:2px;
  box-shadow:var(--omb);
}

/* ---------- les quatre forces : des jetons épinglés ---------------- */
.force{padding:12px 9px 10px;position:relative;box-shadow:0 8px 18px rgba(0,0,0,.45)}
.force::before{
  content:""; position:absolute; top:-5px; left:50%; width:10px; height:10px;
  transform:translateX(-50%); border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #FFE7B0, var(--lai) 55%, #6A4A22);
  box-shadow:0 2px 4px rgba(0,0,0,.55);
}
.force svg{fill:var(--enc2)}
.force .nom{color:var(--enc2)}
/* Le score ne doit pas se lire avant le nom : c'est la jauge qui dit
   l'état, et le mot « fragile » qui alerte. */
.force .nom b{color:var(--enc2);font-weight:normal;font-size:.92em;opacity:.75}
.force .mini{background:rgba(80,62,42,.22);box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.force.danger{border-color:var(--rge)}

/* ---------- la conséquence : une note glissée sous le sous-main ---- */
.consq{border-left:4px solid var(--lai) !important;transform:rotate(-.25deg);
  padding:13px 18px;margin:0 0 18px}
.ct{color:var(--enc2);font-weight:bold}

/* ---------- la carte : le rapport qu'on vous apporte ---------------- */
.situ{padding:24px 28px 22px;transform:rotate(.18deg);position:relative;
  border-left:1px solid var(--fil) !important}
.situ::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:linear-gradient(180deg,var(--lai),transparent);
}
.situ .t{color:var(--enc)}
.situ .parle{color:var(--rge);font-weight:bold}
.situ .d{color:#3A2E22;font-style:italic}
body[data-niveau="II"] .situ .d{color:#333B43}
.situ .pc{border-top:1px solid var(--fil);color:var(--enc2)}
.situ .pc span{color:var(--rge)}

/* ---------- les réponses : des billets à signer -------------------- */
.choix{padding:16px 17px;color:var(--enc) !important;margin:0;
  box-shadow:0 10px 22px rgba(0,0,0,.46)}
.choix:nth-child(1){transform:rotate(-.7deg)}
.choix:nth-child(2){transform:rotate(.45deg)}
.choix:nth-child(3){transform:rotate(-.3deg)}
.choix:hover{transform:rotate(0) translateY(-4px);border-color:var(--lai);
  box-shadow:0 18px 34px rgba(0,0,0,.58)}
.choix .q{color:var(--enc)}

<style>
/* ===================================================================
   LA COMPOSITION : un tableau au mur, un bureau en dessous

main{max-width:1240px}

/* ---------- le tableau accroché au mur ------------------------------ */

             inset 0 0 40px rgba(0,0,0,.5);

.tableau::before{

.bureau{position:relative;margin-top:6px}

.bureau::after{

  max-width:46ch;
}
.titre-ecran .accroche strong{color:#fff;font-weight:normal;font-family:var(--serif);
  font-size:1.12em}
.titre-ecran .demarrer{
  font-family:var(--serif); font-size:clamp(17px,min(2.5vw,3.4vh),26px); letter-spacing:.09em;
  padding:clamp(10px,2vh,16px) clamp(36px,6vw,62px); margin:0; border-radius:2px; color:#1A2047;
  background:linear-gradient(180deg,#FFE79C,var(--bs-gold) 60%,#D9A622);
  border:1px solid rgba(255,255,255,.35);
  box-shadow:0 14px 36px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.7);
}
.titre-ecran .demarrer:hover{
  transform:translateY(-3px) scale(1.02);
  box-shadow:0 20px 48px rgba(0,0,0,.66), inset 0 1px 0 rgba(255,255,255,.8);
}
.titre-ecran .mention{
  margin:0; font-size:clamp(9.5px,1.2vw,12px); letter-spacing:.14em;
  text-transform:uppercase; color:#A9B2CC; text-shadow:0 2px 10px rgba(0,0,0,.9);
  text-align:left; flex:0 1 auto;
}
@media(max-width:760px){
  /* plus assez de largeur pour tenir les coins : on réempile, centré */
  .te-haut,.te-bas{flex-direction:column;gap:7px;text-align:center}
  .titre-ecran .surtitre-txt,.titre-ecran .mention,.titre-ecran .paraphe{text-align:center}
  .titre-ecran .accroche{max-width:none}
  .titre-ecran .dedans{padding:14px 6px}
  .titre-ecran .filet{margin:18px auto 16px}
  .titre-ecran .demarrer{padding:14px 44px}
}

/* ---------- le menu : des feuilles posées sur la table --------------
   L'écran de titre porte la marque ; ici on est déjà dans le bureau.
   Quatre fiches numérotées expliquent, un filet sépare, trois dossiers
   proposent les époques.                                              */
body.surmenu main{max-width:1080px}

.menu-ecran{position:relative}
.menu-ecran .dedans-menu{position:relative;width:100%;padding:10px 0 20px;
  animation:paraitre .5s ease-out}
@keyframes paraitre{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.menu-ecran .entete{text-align:center;margin-bottom:26px}
.menu-ecran .entete h1{
  font-family:var(--serif);font-weight:normal;color:var(--pap);
  font-size:clamp(30px,5.4vw,52px);line-height:1.02;margin:.08em 0 0;
  text-shadow:0 3px 24px rgba(0,0,0,.75);
}
.menu-ecran .entete .surtitre-txt{
  font-size:clamp(11px,1.5vw,13.5px);letter-spacing:.3em;text-transform:uppercase;
  color:var(--lai);text-shadow:0 2px 10px rgba(0,0,0,.8);
}

/* les quatre temps de l'explication, en fiches de papier */
.etapes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.etapes{grid-template-columns:1fr}}
.etape{
  display:flex; gap:15px; align-items:flex-start;
  background:
    linear-gradient(180deg, rgba(255,255,255,.5), transparent 26%),
    repeating-linear-gradient(94deg, rgba(160,140,110,.045) 0 2px, transparent 2px 5px),
    linear-gradient(152deg, var(--pap) 0%, var(--pap2) 100%);
  border:1px solid var(--fil); border-radius:2px; padding:17px 19px;
  color:var(--enc); box-shadow:0 11px 26px rgba(0,0,0,.46);
}
.etape:nth-child(1){transform:rotate(-.5deg)}
.etape:nth-child(2){transform:rotate(.35deg)}
.etape:nth-child(3){transform:rotate(.3deg)}
.etape:nth-child(4){transform:rotate(-.4deg)}
.etape .num{
  flex:0 0 auto; width:33px; height:33px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-size:18px; color:#FFF4DE;
  background:radial-gradient(circle at 34% 30%, #C79A4E, var(--lai) 55%, #6A4A22);
  box-shadow:0 3px 9px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.3);
}
.etape h3{
  font-family:var(--serif); font-weight:normal; color:var(--enc);
  font-size:19.5px; margin:1px 0 7px; line-height:1.2;
}
.etape p{margin:0;font-size:14.5px;line-height:1.6;color:var(--enc2)}
.etape p strong{color:var(--enc);font-weight:bold}

.mini-forces{display:flex;flex-wrap:wrap;gap:15px;margin:0 0 10px}
.mini-forces span{display:flex;align-items:center;gap:6px}
.mini-forces svg{width:19px;height:19px;fill:var(--enc2)}
.mini-forces i{font-style:normal;font-size:11.5px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--rge);font-weight:bold}

/* la bascule vers le choix */
.separation{position:relative;text-align:center;margin:36px 0 20px}
.separation::before{
  content:""; position:absolute; left:0; right:0; top:50%; height:1px;
  background:linear-gradient(90deg,transparent,rgba(184,137,74,.55) 25%,rgba(184,137,74,.55) 75%,transparent);
}
.separation span{
  position:relative; padding:0 18px;
  font-family:var(--serif); font-size:clamp(17px,2.3vw,23px);
  color:var(--pap); text-shadow:0 2px 14px rgba(0,0,0,.85);
}
.separation span::before{
  content:""; position:absolute; inset:-4px -2px; z-index:-1;
  background:radial-gradient(ellipse at center, rgba(20,14,9,.85) 30%, transparent 75%);
}
.note-menu{
  margin:28px auto 0; max-width:74ch; text-align:center;
  font-size:12.5px; line-height:1.6; color:#A08A68;
  text-shadow:0 2px 10px rgba(0,0,0,.8);
}

/* Le rôle et ses notes, sur papier : l'encre, jamais un gris pâle. */
.role .note-role{margin:.8em 0 0;font-size:15px;line-height:1.6;color:var(--enc2)}
.role .note-role strong{color:var(--enc)}
.role .note-source{margin:.8em 0 0;padding-top:.7em;font-size:13.5px;line-height:1.55;
  color:var(--enc2);border-top:1px solid var(--fil);opacity:.92}

/* La réglette de volume, dans le bandeau, à côté de l'interrupteur. */
.son-reglage{display:flex;align-items:center;gap:9px;margin-left:14px}
#volson{
  -webkit-appearance:none; appearance:none; width:86px; height:16px;
  background:transparent; cursor:pointer; margin:0; padding:0; border:none;
}
#volson::-webkit-slider-runnable-track{
  height:4px; border-radius:2px;
  background:linear-gradient(90deg, var(--bs-gold), rgba(255,255,255,.28));
}
#volson::-moz-range-track{
  height:4px; border-radius:2px;
  background:linear-gradient(90deg, var(--bs-gold), rgba(255,255,255,.28));
}
#volson::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:13px; height:13px; margin-top:-4.5px;
  border-radius:50%; background:#fff; border:1px solid rgba(0,0,0,.35);
  box-shadow:0 1px 4px rgba(0,0,0,.5);
}
#volson::-moz-range-thumb{
  width:13px; height:13px; border-radius:50%; background:#fff;
  border:1px solid rgba(0,0,0,.35); box-shadow:0 1px 4px rgba(0,0,0,.5);
}
#volson:hover::-webkit-slider-thumb{background:var(--bs-gold)}
#volson:hover::-moz-range-thumb{background:var(--bs-gold)}
@media(max-width:620px){ #volson{width:58px} }

/* ---------- rendre sa trace avant de quitter ----------------------- */
.validation{border-left:4px solid var(--rge) !important}
.validation .jalons{list-style:none;margin:0 0 14px;padding:0}
.validation .jalons li{
  position:relative; padding:5px 0 5px 30px; font-size:14.5px; color:var(--enc2);
}
.validation .jalons li::before{
  content:"○"; position:absolute; left:6px; top:4px; font-size:15px; color:var(--fil);
}
.validation .jalons li.fait{color:var(--enc)}
.validation .jalons li.fait::before{content:"●";color:#3E7A3A}
.validation .coche{
  display:flex; align-items:flex-start; gap:9px; font-size:14.5px; color:var(--enc);
  cursor:pointer; padding:9px 11px; border:1px solid var(--fil); border-radius:2px;
  background:rgba(255,255,255,.4);
}
.validation .coche input{margin-top:2px;width:16px;height:16px;cursor:pointer;flex:0 0 auto}
#btvalid:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
.arendre{margin:12px 0 0;font-size:14px;color:#E0A88F;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.rendu{margin:12px 0 0;font-size:14px;color:#9FCE8E;text-shadow:0 2px 10px rgba(0,0,0,.8)}

/* ---------- les images -------------------------------------------- */
.illu{margin:0;padding:0}
.illu img{display:block;max-width:100%;height:auto}

/* la pièce jointe au dossier : une photographie posée sur le rapport,
   légèrement de travers, comme agrafée à la hâte */
.illu.piece{
  float:right; width:min(240px,42%); margin:0 0 12px 16px;
  background:#fff; padding:7px 7px 0; border:1px solid var(--fil);
  box-shadow:0 8px 20px rgba(0,0,0,.4); transform:rotate(1.1deg);
}
.illu.piece img{border:1px solid rgba(0,0,0,.12)}
.illu.piece figcaption{
  font-size:10.5px; line-height:1.4; color:var(--enc2); padding:6px 2px 7px;
  font-style:italic; text-align:center;
}
@media(max-width:700px){
  .illu.piece{float:none;width:100%;margin:0 0 12px;transform:none}
}

/* le portrait de celui qui plaide, à côté de son nom */
.situ .parle{display:flex;align-items:center;gap:10px}
.illu.vignette{flex:0 0 auto}
.illu.vignette img{
  width:38px;height:38px;object-fit:cover;border-radius:50%;
  border:2px solid var(--pap2); box-shadow:0 2px 7px rgba(0,0,0,.45);
}

/* le portrait d'un acteur, sur l'écran du niveau */
.acteur .tete{align-items:center}
.illu.portrait{flex:0 0 auto}
.illu.portrait img{
  width:52px;height:52px;object-fit:cover;border-radius:3px;
  border:1px solid var(--fil); box-shadow:0 3px 10px rgba(0,0,0,.4);
}

/* ---------- la galerie des acteurs --------------------------------
   Une fiche par force, repliée. L'emblème et le nom suffisent à la
   reconnaître ; le portrait et la scène récompensent celui qui ouvre. */
.acteurs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0 6px;
  align-items:start}   /* une fiche fermee ne doit pas s etirer */
@media(max-width:820px){.acteurs{grid-template-columns:1fr}}

details.acteur{
  background:
    linear-gradient(180deg, rgba(255,255,255,.5), transparent 26%),
    linear-gradient(152deg, var(--pap) 0%, var(--pap2) 100%);
  border:1px solid var(--fil); border-left:4px solid var(--lai); border-radius:2px;
  color:var(--enc); box-shadow:0 9px 22px rgba(0,0,0,.44); overflow:hidden;
}
details.acteur summary{
  list-style:none; cursor:pointer; display:flex; align-items:center; gap:13px;
  padding:12px 15px;
}
details.acteur summary::-webkit-details-marker{display:none}
details.acteur[open]{border-left-color:var(--rge)}

.embleme{margin:0;flex:0 0 auto}
.embleme img{width:58px;height:58px;object-fit:contain;display:block;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.3))}


.nom-acteur{font-family:var(--serif);font-size:20px;line-height:1.1}
summary .veut{font-size:12.5px;font-style:italic;color:var(--rge);
  flex:1 1 100%; order:3; margin-top:-4px}
@media(min-width:560px){ summary .veut{flex:1 1 auto; order:0; margin-top:0} }
details.acteur .pli{
  margin-left:auto; flex:0 0 auto; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--enc2);
  border:1px solid var(--fil); border-radius:2px; padding:3px 9px;
  background:rgba(255,255,255,.45); white-space:nowrap;
}
details.acteur .pli::before{content:"Ouvrir le dossier"}
details.acteur[open] .pli::before{content:"Fermer"}
details.acteur .pli::after{content:" ▼"}
details.acteur[open] .pli::after{content:" ▲"}

.acteur .fiche{padding:0 15px 15px;display:grid;gap:0 15px;
  grid-template-columns:122px minmax(0,1fr)}
@media(max-width:560px){ .acteur .fiche{grid-template-columns:1fr} }
.acteur .fiche .role{font-size:14px;line-height:1.6;color:var(--enc2);
  border-top:1px solid var(--fil);padding-top:12px;margin-top:12px}
.acteur .fiche .role strong{color:var(--enc)}

.portrait-acteur{margin:12px 0 0;width:100%}
.portrait-acteur img{
  width:100%;height:auto;display:block;border:1px solid var(--fil);
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}
.scene-acteur{grid-column:1 / -1;margin:13px 0 0}
.scene-acteur img{
  width:100%;height:auto;display:block;border:1px solid var(--fil);
  box-shadow:0 6px 18px rgba(0,0,0,.42);
}
@media(max-width:560px){ .portrait-acteur{float:none;width:100%;margin:0 0 10px} }

/* ---------- le blason au tableau ----------------------------------
   L'emblème gravé passe devant le pictogramme. Le pictogramme reste
   dans la page : si l'image manque, onerror la retire et la règle
   « img ~ svg » cesse de s'appliquer — il réapparaît de lui-même. */
.sceau{
  display:block;margin:0 auto 7px;width:56px;height:56px;position:relative;
  border-radius:50%;overflow:hidden;
}
.sceau img{
  width:100%;height:100%;object-fit:cover;display:block;
  transform:scale(1.38) translateY(-7%);   /* on serre sur le sceau */
}
/* le pictogramme reprend sa place si l'image manque : la règle ne
   s'applique plus dès que onerror a retiré l'image du document */
.sceau img ~ svg{display:none}
.sceau svg{width:29px;height:29px;display:block;margin:13px auto 0}
.sceau::after{
  content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  box-shadow:inset 0 0 0 1.5px rgba(120,88,40,.55), inset 0 2px 6px rgba(0,0,0,.28),
             0 3px 8px rgba(0,0,0,.3);
}
@media(max-width:700px){ .sceau{width:46px;height:46px} }

/* ---------- la force qui encaisse ---------------------------------
   Le chiffre descend, mais un chiffre ne se voit pas tomber. Le jeton
   tressaille une demi-seconde : on sait tout de suite qui a payé. */
@keyframes secousse{
  0%  {transform:translate3d(0,0,0) rotate(0)}
  10% {transform:translate3d(-5px,1px,0) rotate(-1.1deg)}
  24% {transform:translate3d(5px,-1px,0) rotate(1.1deg)}
  38% {transform:translate3d(-4px,1px,0) rotate(-.8deg)}
  52% {transform:translate3d(4px,0,0) rotate(.8deg)}
  68% {transform:translate3d(-2px,0,0) rotate(-.3deg)}
  84% {transform:translate3d(2px,0,0) rotate(.2deg)}
  100%{transform:translate3d(0,0,0) rotate(0)}
}
@keyframes rougir{
  0%  {box-shadow:0 8px 18px rgba(0,0,0,.45)}
  22% {box-shadow:0 8px 18px rgba(0,0,0,.45), 0 0 0 2px var(--rge), 0 0 22px rgba(154,42,30,.55)}
  100%{box-shadow:0 8px 18px rgba(0,0,0,.45)}
}
.force.secouee{animation:secousse .62s cubic-bezier(.36,.07,.19,.97) .45s both,
                         rougir .95s ease-out .45s both}
.force.secouee .nom b{color:var(--rge)}
@media(prefers-reduced-motion:reduce){
  .force.secouee{animation:rougir .95s ease-out both}
}

/* ---------- le rapport d'enquête ----------------------------------
   Trois gestes pour qu'on ait envie de l'ouvrir : une lettrine comme
   sur les imprimés de l'époque, un blanc au milieu, et les faits qui
   accrochent l'œil — dates, chiffres, notions du cours. */
.d-enquete .corps{color:var(--enc) !important;font-size:15px;line-height:1.68}

.d-enquete .corps .init{
  float:left; font-family:var(--serif); font-size:2.85em; line-height:.72;
  margin:.1em .12em -.04em 0; color:var(--rge); font-weight:normal;
}
.d-enquete .corps .alinea{display:block;height:.9em}

/* une date, une quantité : ce qu'on doit pouvoir citer de mémoire */
.d-enquete .corps .fait{
  font-style:normal; font-weight:bold; color:var(--rge);
  font-variant-numeric:tabular-nums; letter-spacing:.01em;
  white-space:nowrap;
}

/* les notions du cours, soulignées au crayon plutôt qu'au trait net */
.d-enquete .corps strong{
  color:var(--enc); font-weight:bold;
  background-image:linear-gradient(transparent 58%, rgba(176,138,54,.42) 58%, rgba(176,138,54,.42) 92%, transparent 92%);
  padding:0 .1em; border-radius:1px;
}

/* ---------- la signature ------------------------------------------ */
.signature{
  display:inline-block; margin-top:5px; font-family:var(--serif);
  font-style:italic; font-size:12px; color:#8A7558; letter-spacing:.02em;
}
.signature b{font-weight:normal;font-style:normal;color:#B99A62;letter-spacing:.04em}
.titre-ecran .paraphe{
  margin:0; font-family:var(--serif); font-style:italic;
  font-size:clamp(12px,1.25vw,14.5px); color:rgba(255,255,255,.7); letter-spacing:.03em;
  text-align:right; flex:0 0 auto; text-shadow:0 2px 10px rgba(0,0,0,.9);
}
.titre-ecran .paraphe b{font-weight:normal;font-style:normal;color:rgba(255,255,255,.86)}

/* ---------- la cinquième fiche du tutoriel ------------------------
   Cinq fiches sur deux colonnes : la dernière reste seule. Calée à
   gauche, elle déséquilibrait la page ; on la centre sur la largeur
   d'une colonne, pour qu'on la lise comme les quatre autres. */
.etapes .etape:last-child:nth-child(odd){
  grid-column:1 / -1; justify-self:center;
  width:min(100%, calc(50% - 8px));
}
@media(max-width:820px){
  .etapes .etape:last-child:nth-child(odd){width:100%}
}

/* ---------- le panneau de mission ---------------------------------
   C'est le seul moment où l'on s'adresse au joueur avant la partie :
   le texte se centre, la justification est tenue courte pour que les
   lignes restent lisibles, et tout s'écrit à la machine. */
.mission > .role{text-align:center;margin:0;grid-column:2}
.mission > .role > *{max-width:72ch;margin-left:auto;margin-right:auto}
.mission > .role .r-qui{margin-top:.3em;margin-bottom:.3em}
.mission > .role .r-but{margin-top:.6em;margin-bottom:0}
.mission > .role .note-source{max-width:82ch}

/* tant que ça s'écrit, le curseur clignote et le bloc se clique */
.mission > .role[data-encours]{cursor:pointer}
.mission > .role[data-encours] > *:not(:empty)::after{
  content:"▌"; color:var(--rge); opacity:.75;
  animation:battre-curseur .7s steps(1) infinite; margin-left:1px;
}
.mission > .role[data-encours] > *:empty::after{content:none}
@keyframes battre-curseur{0%,50%{opacity:.75}51%,100%{opacity:0}}

/* ---------- l'écran de fin ----------------------------------------
   Le verdict se lit sur du papier, comme tout ce qui vient du bureau.
   Sur fond sombre, il ressemblait à un écran de jeu vidéo ; ici il
   ressemble à un rapport qu'on classe. */

/* le cachet : on ne doit pas pouvoir rater que c'est fini */
.fin-cachet{display:flex;justify-content:center;margin:26px 0 4px}
.fin-cachet span{
  font-family:var(--serif); font-size:clamp(19px,3.1vw,30px);
  letter-spacing:.2em; text-transform:uppercase; color:var(--rge);
  border:3px double var(--rge); border-radius:4px;
  padding:9px 26px 8px; transform:rotate(-1.6deg);
  background:rgba(255,255,255,.07);
  box-shadow:0 2px 14px rgba(0,0,0,.4), inset 0 0 22px rgba(154,42,30,.12);
  opacity:.92;
}

.fin-panneau{
  background:
    linear-gradient(180deg, rgba(255,255,255,.5), transparent 18%),
    linear-gradient(152deg, var(--pap) 0%, var(--pap2) 100%);
  color:var(--enc); border:1px solid var(--fil); border-top:4px solid var(--rge);
  border-radius:2px; box-shadow:0 14px 34px rgba(0,0,0,.5);
  padding:24px 26px 20px; margin:14px 0 0;
}

/* l'emblème à gauche, le portrait à droite, le verdict au milieu.
   Une image absente se retire : la colonne disparaît avec elle. */
.fin-tete{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center}
.fin-embleme,.fin-portrait{margin:0;text-align:center;flex:0 0 auto}
.fin-embleme .rond{
  display:block;width:clamp(84px,11vw,132px);height:clamp(84px,11vw,132px);
  border-radius:50%;overflow:hidden;position:relative;
  box-shadow:inset 0 0 0 1.5px rgba(120,88,40,.5), 0 5px 14px rgba(0,0,0,.34);
}
.fin-embleme .rond img{
  width:100%;height:100%;object-fit:cover;display:block;
  transform:scale(1.34) translateY(-6%);
}
.fin-portrait img{
  width:clamp(96px,13vw,158px);height:auto;display:block;
  border:1px solid var(--fil);box-shadow:0 6px 18px rgba(0,0,0,.42);
}
.fin-embleme figcaption,.fin-portrait figcaption{
  font-size:11px;line-height:1.35;color:var(--enc2);font-style:italic;
  margin-top:7px;max-width:16ch;margin-left:auto;margin-right:auto;
}


.fin-mots .fin-lieu{
  font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--enc2);margin:0 0 2px;
}
.fin-mots .gros{color:var(--enc);margin:.05em 0 .25em;line-height:1.05}
.fin-texte{font-size:16.5px;line-height:1.62;margin:0;color:var(--enc2)}
.fin-texte strong{color:var(--enc)}

/* pourquoi ça s'arrête : la règle, puis les choix qui ont coûté */
.fin-pourquoi{border-top:1px solid var(--fil);margin-top:20px;padding-top:16px}
.fin-pourquoi h3{
  font-family:var(--serif);font-weight:normal;font-size:19px;
  color:var(--rge);margin:0 0 8px;
}
.fin-pourquoi p{font-size:15px;line-height:1.62;color:var(--enc2);margin:.45em 0}
.fin-pourquoi b{color:var(--enc)}
.fin-intro-coups{margin-bottom:.3em !important}
.fin-coups{list-style:none;margin:.2em 0 .6em;padding:0;display:grid;gap:8px}
.fin-coups li{
  display:flex;gap:12px;align-items:baseline;
  background:rgba(255,255,255,.4);border-left:3px solid var(--rge);
  padding:9px 13px;border-radius:2px;
}
.fin-cout{
  font-family:var(--serif);font-size:21px;color:var(--rge);
  font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:2.2em;text-align:right;
}
.fin-quoi{font-size:14.5px;line-height:1.5;color:var(--enc2)}
.fin-quoi b{color:var(--enc);display:block}
.fin-quoi i{font-size:13px;opacity:.85}
.fin-rattrape{font-style:italic;font-size:14px !important;opacity:.9}

/* les trois chiffres, chacun avec ce qu'il veut dire */
.fin-chiffres{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0 0}
.fin-ch{
  background:
    linear-gradient(180deg, rgba(255,255,255,.45), transparent 22%),
    linear-gradient(152deg, var(--pap) 0%, var(--pap2) 100%);
  color:var(--enc); border:1px solid var(--fil); border-left:4px solid var(--lai);
  border-radius:2px; padding:16px 18px 14px; box-shadow:0 9px 22px rgba(0,0,0,.42);
}
.fin-ch-large{grid-column:1 / -1}
.fin-ch .fin-n{
  font-family:var(--serif);font-size:clamp(30px,4.4vw,42px);line-height:1;
  color:var(--rge);font-variant-numeric:tabular-nums;
}
.fin-ch .fin-n small{font-size:.48em;color:var(--enc2);letter-spacing:.02em}
.fin-ch .fin-k{
  font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--enc2);margin:6px 0 8px;
}
.fin-ch .fin-k small{text-transform:none;letter-spacing:0;opacity:.8}
.fin-ch p{font-size:14px;line-height:1.6;color:var(--enc2);margin:.3em 0 0}
.fin-ch b{color:var(--enc)}
.fin-cond{margin:12px 0 0 !important;justify-content:flex-start}
.fin-cond span{border-color:var(--fil);color:var(--enc2);font-size:12px;padding:3px 10px}
.fin-cond span.ok{border-color:var(--vrt,#4E7A3A);color:#3F6A2E;background:rgba(120,160,90,.14);font-weight:bold}
.fin-manque{font-style:italic}
.fin-record{margin:14px 0 0;color:var(--enc2)}

@media(max-width:820px){
  .fin-tete{grid-template-columns:1fr;justify-items:center;text-align:center;gap:14px}
  .fin-chiffres{grid-template-columns:1fr}
  .fin-portrait{order:3}
}

/* ---------- les deux vues qui encadrent la mission ----------------
   Le jeu s'appelle « Le prix du progrès » : à gauche ce qu'on paie,
   à droite qui le paie. Dit avant la première carte, en deux images.
   Chacune se retire si son fichier manque, et le texte reprend la
   place — Detroit n'a pas encore les siennes. */
.mission{
  display:grid; gap:18px; align-items:stretch; margin:18px 0 0;
  grid-template-columns:auto minmax(0,1fr) auto;
}
.mission-illu{
  margin:0; display:flex; flex-direction:column; min-height:0;
  width:clamp(118px, 17vw, 268px);
  border:1px solid var(--fil); border-radius:2px; overflow:hidden;
  background:var(--pap2); box-shadow:0 12px 30px rgba(0,0,0,.5);
}
.mission-illu img{
  width:100%; flex:1 1 auto; min-height:0; object-fit:cover; display:block;
  object-position:50% 48%;
}
/* un filet d'encre du côté du texte, comme sur les autres papiers */
.mi-g{border-right:3px solid var(--lai)}
.mi-d{border-left:3px solid var(--rge)}

.mission:not(:has(.mission-illu)) + .mission-note{display:none}
.mission-note{
  text-align:center; font-size:12.5px; line-height:1.5; font-style:italic;
  color:#9C8A70; margin:10px 0 0;
}
.mission-note strong{font-style:normal;color:#C6AF86}

/* en dessous de 980 px, les deux vues passent au-dessus, côte à côte :
   le contraste tient, le texte garde toute la largeur */
@media(max-width:980px){
  .mission{grid-template-columns:1fr 1fr}
  .mission-illu{width:auto}
  .mission > .role{grid-column:1 / -1; order:3}
  .mission-illu{max-height:230px}
  .mission-illu img{min-height:120px}
}

/* ---------- le blason du bandeau ----------------------------------
   Le tracé reste dans la page : si l'image manque, onerror la retire
   et la règle « img ~ svg » cesse de s'appliquer. */
header .marque{display:flex;align-items:center;flex:0 0 auto}
header .marque img{height:30px;width:auto;display:block;
  filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
header .marque img ~ svg.blason{display:none}
@media(max-width:700px){ header .marque img{height:24px} }

/* ---------- le nom du niveau --------------------------------------
   « Manchester » se détachait mal du bureau : bois sombre, fenêtre
   claire, et le mot au milieu. On lui pose une plaque, comme sur les
   portes de bureau, et le nom redevient lisible. */
.entete-niveau{
  position:relative; margin:10px 0 2px; padding:13px 26px 14px 18px;
  border-left:4px solid var(--lai); border-radius:2px;
  background:linear-gradient(90deg,
    rgba(16,11,7,.88) 0%, rgba(16,11,7,.74) 55%, rgba(16,11,7,0) 100%);
  box-shadow:0 10px 26px rgba(0,0,0,.42);
}
.entete-niveau h1{
  margin:0; color:#F6EBD6; line-height:1.02;
  text-shadow:0 3px 20px rgba(0,0,0,.95), 0 1px 2px rgba(0,0,0,.8);
}
.entete-niveau .sous{
  margin:5px 0 0; color:#CBB596; font-size:12.5px;
  letter-spacing:.17em; text-transform:uppercase;
  text-shadow:0 2px 10px rgba(0,0,0,.9);
}
@media(max-width:700px){
  .entete-niveau{padding:11px 16px 12px 14px}
  .entete-niveau .sous{letter-spacing:.12em}
}

/* ---------- le carnet de bord -------------------------------------
   Un bloc à spirale posé sur le coin du bureau. Tout ce qui vivait
   dans la ligne grise du bas, là où personne ne le lisait. */
.carnet{
  background:
    linear-gradient(180deg, rgba(255,255,255,.55), transparent 9%),
    repeating-linear-gradient(180deg,
      transparent 0 21px, rgba(90,120,150,.17) 21px 22px),
    linear-gradient(152deg, #FBF6E6 0%, #EFE4C8 100%) !important;
  color:var(--enc); border:1px solid var(--fil); border-radius:2px;
  box-shadow:0 12px 28px rgba(0,0,0,.5);
  padding:27px 16px 14px; position:relative; --ong:#B08A36;
}
/* le filet rouge de la marge, comme sur un bloc d'écolier */
.carnet::after{
  content:""; position:absolute; left:11px; top:26px; bottom:0; width:1px;
  background:rgba(154,42,30,.22); pointer-events:none;
}
.carnet .feuille{position:relative; z-index:1; padding-left:7px}

/* la spirale : six anneaux de laiton pincés dans le haut de la feuille */
.carnet .spirale{
  position:absolute; left:0; right:0; top:7px; height:13px;
  display:flex; justify-content:space-evenly; align-items:center;
  pointer-events:none;
}
.carnet .spirale::before,.carnet .spirale::after{content:none}
.carnet .spirale{
  background-image:radial-gradient(circle at center,
    #C9A964 0 2.6px, #7A5E2A 2.6px 3.4px, transparent 3.5px);
  background-size:17% 100%; background-repeat:repeat-x;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));
}

.cn-ligne{display:flex; align-items:baseline; gap:10px; margin:0 0 2px}
.cn-k{
  font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--enc2); flex:1 1 auto;
}
.cn-v{font-family:var(--serif); font-size:17px; color:var(--enc);
  font-variant-numeric:tabular-nums}
.cn-v small{font-size:.66em; color:var(--enc2)}
.cn-annee .cn-v{font-size:30px; line-height:1.05; color:var(--rge)}

/* les décisions en bâtons */
.batons{display:flex; flex-wrap:wrap; gap:3px; margin:5px 0 12px}
.batons i{
  width:9px; height:13px; border:1px solid rgba(90,70,45,.4); border-radius:1px;
  background:rgba(255,255,255,.35);
}
.batons i.fait{background:var(--lai); border-color:#6A4A22}

/* la courbe */
.carnet .courbe{display:block; width:100%; height:56px; margin:3px 0 2px}
.carnet .courbe .aire{fill:rgba(154,42,30,.11)}
.carnet .courbe .trait{fill:none; stroke:var(--rge); stroke-width:1.8;
  stroke-linejoin:round; stroke-linecap:round; vector-effect:non-scaling-stroke}
.carnet .courbe .ici{fill:var(--rge); stroke:#FBF6E6; stroke-width:1.4}

.cn-note{font-size:11px; line-height:1.45; color:var(--enc2);
  font-style:italic; margin:2px 0 0}
.cn-sep{height:1px; background:var(--fil); margin:13px 0 11px}

/* les sept conditions, en liste à cocher */
.cn-cond{list-style:none; margin:7px 0 7px; padding:0;
  display:grid; grid-template-columns:1fr 1fr; gap:3px 9px}
.cn-cond li{
  font-size:11.5px; line-height:1.3; color:var(--enc2);
  padding-left:15px; position:relative;
}
.cn-cond li::before{
  content:"☐"; position:absolute; left:0; top:-1px; font-size:12px; opacity:.55;
}
.cn-cond li.ok{color:#3F6A2E; font-weight:bold}
.cn-cond li.ok::before{content:"☑"; opacity:1; color:#4E7A3A}
@media(max-width:1000px){ .cn-cond{grid-template-columns:1fr 1fr 1fr} }
@media(max-width:620px){ .cn-cond{grid-template-columns:1fr 1fr} }

/* ---------- le carnet se plie -------------------------------------
   Même geste que le rapport d'enquête. Replié, le rabat garde l'année
   et le numéro de la décision : on peut dégager le bureau sans perdre
   le fil. */
.carnet > summary{
  list-style:none; cursor:pointer; display:flex; align-items:center; gap:11px;
  margin:-27px -16px 0; padding:11px 16px 10px;
}
.carnet > summary::-webkit-details-marker{display:none}
.carnet[open] > summary{margin-bottom:4px}
.cn-rabat{font-size:13px; color:var(--enc2); flex:1 1 auto; line-height:1.3}
.cn-rabat b{font-family:var(--serif); font-size:17px; color:var(--rge);
  font-variant-numeric:tabular-nums}
.carnet .pli{
  flex:0 0 auto; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--enc2); border:1px solid var(--fil); border-radius:2px;
  padding:3px 9px; background:rgba(255,255,255,.45); white-space:nowrap;
}
.carnet .pli::before{content:"Ouvrir"}
.carnet[open] .pli::before{content:"Fermer"}
.carnet .pli::after{content:" ▼"}
.carnet[open] .pli::after{content:" ▲"}
.carnet[open] .pli{color:var(--rge); border-color:var(--rge)}
/* ouvert, la feuille dit déjà l’année : le rabat ne la répète pas */
.carnet[open] .cn-rabat{display:none}
/* replié, ni spirale ni filet de marge : il n'y a plus de feuille */
.carnet:not([open])::after{content:none}
.carnet:not([open]){padding-bottom:0}
/* ouvert, la spirale se replace sous le rabat */
.carnet[open] .spirale{top:auto; margin-top:-2px; position:relative; height:12px}
.carnet[open]::after{top:50px}

/* ---------- le courrier, devenu archive ---------------------------
   Déplié, il rend tous les plis reçus depuis le début : date, texte,
   source. Les questions de fin portent sur eux, et jusqu'ici rien ne
   permettait de les relire. */
.courrier > summary{
  list-style:none; cursor:pointer; display:flex; align-items:center; gap:12px;
}
.courrier > summary::-webkit-details-marker{display:none}
.cr-tete{flex:1 1 auto; min-width:0}
.cr-tete .cd{display:block}
.cr-tete .cq{display:block}
.courrier .pli{
  flex:0 0 auto; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--enc2); border:1px solid var(--fil); border-radius:2px;
  padding:3px 9px; background:rgba(255,255,255,.45); white-space:nowrap;
}
.courrier .pli::before{content:"Relire " attr(data-n)}
.courrier[open] .pli::before{content:"Fermer"}
.courrier .pli::after{content:" ▼"}
.courrier[open] .pli::after{content:" ▲"}
.courrier[open] .pli{color:var(--rge); border-color:var(--rge)}

.cr-plis{margin-top:13px; border-top:1px solid var(--fil); padding-top:11px;
  display:grid; gap:13px; max-height:none}
.cr-pli{border-left:3px solid var(--lai); padding-left:12px}
.cr-pli .cd{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--rge)}
.cr-pli .crt{font-family:var(--serif); font-size:17px; color:var(--enc);
  line-height:1.2; margin:2px 0 4px}
.cr-pli .crx{font-size:13.5px; line-height:1.55; color:var(--enc2); margin:0}
.cr-pli .crx strong{color:var(--enc)}
.cr-pli .crs{font-size:11.5px; line-height:1.45; color:var(--enc2);
  margin-top:5px; opacity:.9}
.cr-pli .crs strong{color:var(--rge); font-weight:normal}

/* ---------- la jauge des sept conditions -------------------------- */
.cn-jauge{
  height:7px; border-radius:4px; margin:5px 0 9px; overflow:hidden;
  background:rgba(80,62,42,.2); box-shadow:inset 0 1px 2px rgba(0,0,0,.28);
}
.cn-jauge i{
  display:block; height:100%; border-radius:4px;
  background:linear-gradient(90deg,#7FA862,#4E7A3A);
  transition:width .5s ease-out;
}

/* ---------- on doit voir qu'il y a un pli ------------------------- */

/* l'enveloppe reprend sa place dans le rabat du dossier */
.courrier > summary{flex-direction:column; align-items:stretch; gap:0}
.courrier > summary .env{display:block}
.cr-bas{display:flex; align-items:center; gap:12px}

/* le cachet de cire : un disque rouge posé sur le coin du dossier */
.courrier{position:relative}
.courrier .cachet{
  position:absolute; top:-11px; right:-9px; z-index:3;
  width:30px; height:30px; display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-size:15px; color:#FBE9D8;
  border-radius:47% 53% 51% 49%/49% 47% 53% 51%;
  background:radial-gradient(circle at 34% 28%, #D4553A, #8E2413 60%, #5A140A);
  box-shadow:0 3px 9px rgba(0,0,0,.6), inset 0 1px 2px rgba(255,255,255,.3);
  animation:cachet-bat 1.9s ease-in-out infinite;
}
@keyframes cachet-bat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.13)}
}
/* un halo qui s'écarte, pour attraper l'œil sans clignoter */
.courrier .cachet::after{
  content:""; position:absolute; inset:-4px; border-radius:inherit;
  border:2px solid rgba(190,60,35,.75);
  animation:cachet-onde 1.9s ease-out infinite;
}
@keyframes cachet-onde{
  0%{transform:scale(1); opacity:.8}
  70%,100%{transform:scale(1.75); opacity:0}
}

/* un pli neuf remue comme un pli en attente, et porte son cachet */
.courrier.neuf{opacity:0; animation:poser .42s cubic-bezier(.2,.8,.3,1) var(--d,0s) forwards,
             frisson 2.4s ease-in-out infinite;}
.courrier.neuf .env::after{
  content:""; position:absolute; left:50%; top:52%; width:22px; height:22px;
  transform:translate(-50%,-50%);
  border-radius:47% 53% 51% 49%/49% 47% 53% 51%;
  background:radial-gradient(circle at 36% 30%, #D4553A, #8E2413 62%, #5A140A);
  box-shadow:0 2px 5px rgba(0,0,0,.5);
}
.courrier.neuf{border-color:#8E2413 !important;
  box-shadow:0 10px 24px rgba(0,0,0,.46), 0 0 0 1px rgba(142,36,19,.45)}
.courrier.neuf .pli{color:#FBE9D8; background:#8E2413; border-color:#5A140A;
  font-weight:bold}
.courrier.neuf .pli::before{content:"Lire le pli"}
.courrier.neuf[open] .pli::before{content:"Fermer"}

@media(prefers-reduced-motion:reduce){
  .courrier.neuf,.courrier.attente{animation:none; opacity:1}
  .courrier .cachet{animation:none}
  .courrier .cachet::after{animation:none; opacity:.5}
}

/* ---------- le pli pas encore décacheté --------------------------- */
.courrier .pli.scelle::before{content:"Voir le pli"}
.courrier[open] .pli.scelle::before{content:"Fermer"}
.cr-pli.cr-scelle{border-left-color:var(--rge)}
.cr-pli.cr-scelle .cd{letter-spacing:.14em}
.cr-pli.cr-scelle .crt{color:var(--rge)}

/* ---------- le décor photographique --------------------------------
   Une seule image fixe : la pièce ne bouge pas pendant qu'on fait
   défiler les papiers, exactement comme on ne déplace pas les murs en
   se penchant sur son bureau. */
#decor{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-position:center top; background-size:cover;
  background-repeat:no-repeat; opacity:0; transition:opacity 1s ease-out;
}
body[data-decor="photo"] #decor{opacity:1}

/* la fenêtre dessinée s'efface, mais reste dans le fichier */
body[data-decor="photo"] #scene{display:none}
/* l'écran de titre a sa propre illustration : la pièce n'y est pas */
body.surtitre #decor{display:none}

/* Le bas de l'écran s'assombrit : les papiers blancs ont besoin d'un
   fond calme, et la boiserie seule ne suffit pas quand on fait défiler
   jusqu'aux propositions. */
body[data-decor="photo"] #decor::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg,
    rgba(12,9,6,0) 0%, rgba(12,9,6,0) 26%,
    rgba(12,9,6,.42) 54%, rgba(12,9,6,.72) 100%);
}

/* L'arête du plateau n'a plus de sens devant une boiserie : il n'y a
   plus de bureau dessiné, c'est la pièce qui en tient lieu. */
body[data-decor="photo"] .bureau::before{display:none}
body[data-decor="photo"] .bureau::after{
  left:-4vw; right:-4vw; top:-10px; bottom:-60px;
  background:linear-gradient(180deg, rgba(14,10,7,.55), rgba(14,10,7,.3) 55%, transparent);
  border-radius:4px;
}

/* Le tableau des forces pend devant la baie : on lui donne l'ombre
   portée d'un objet suspendu, et un peu de la lumière du couchant. */
body[data-decor="photo"] .tableau{
  box-shadow:0 26px 54px rgba(0,0,0,.72), 0 0 0 1px rgba(0,0,0,.35),
             0 -2px 18px rgba(255,190,110,.1);
}

/* Les papiers se détachent plus nettement sur une photographie que sur
   un aplat : on renforce leur ombre, sans toucher à leur couleur. */
body[data-decor="photo"] .dossier,
body[data-decor="photo"] .choix,
body[data-decor="photo"] .carnet,
body[data-decor="photo"] .courrier{
  box-shadow:0 14px 34px rgba(0,0,0,.6);
}

/* ==================================================================
   LE MENU, AU JOUR

   Une salle de classe claire : mur blanc, bois pâle, neige. Les fiches
   crème d'un bureau de 1820 y disparaissaient. C'est aussi le seul
   écran du jeu qui se passe aujourd'hui, à Beau Soleil — donc le seul
   où la charte de l'école commande la gamme plutôt que la période.

   Tout est conditionné à l'image réellement posée : si la salle manque
   et qu'on retombe sur la pièce de Manchester, le thème sombre reprend.
   ================================================================== */
body.surmenu[data-decor-ecran="menu"]{
  --bs-navy:#1A2047; --bs-mid:#14387F; --bs-vif:#0087CC;
  --bs-gris:#2E3945; --bs-doux:#5E6B7A; --bs-filet:#D8DEE8;
}
/* la lumière de la salle ne doit pas être éteinte : le voile sombre du
   décor devient un voile clair, juste assez pour calmer le sol */
body.surmenu[data-decor-ecran="menu"] #decor::after{
  background:linear-gradient(180deg,
    rgba(255,255,255,0) 0%, rgba(255,255,255,0) 34%,
    rgba(255,255,255,.34) 62%, rgba(255,255,255,.62) 100%);
}

/* ---------- les titres ---------- */
body.surmenu[data-decor-ecran="menu"] .menu-ecran .entete h1{
  color:var(--bs-navy);
  text-shadow:0 0 22px rgba(255,255,255,.95), 0 0 9px rgba(255,255,255,1),
              0 1px 0 rgba(255,255,255,.9);
}
body.surmenu[data-decor-ecran="menu"] .menu-ecran .entete .surtitre-txt{
  color:var(--bs-mid); font-weight:bold;
  text-shadow:0 0 14px rgba(255,255,255,1), 0 0 6px rgba(255,255,255,1);
}

/* ---------- les quatre fiches ----------
   Du papier posé bien droit sur une table d'école, plus un dossier
   jeté sur un bureau : ni rotation, ni grain, ni ombre portée lourde. */
body.surmenu[data-decor-ecran="menu"] .etape{
  background:rgba(255,255,255,.94);
  border:1px solid var(--bs-filet); border-radius:6px;
  color:var(--bs-gris);
  box-shadow:0 6px 18px rgba(26,32,71,.1), 0 1px 3px rgba(26,32,71,.08);
  transform:none;
}
body.surmenu[data-decor-ecran="menu"] .etape:hover{
  box-shadow:0 10px 26px rgba(26,32,71,.14);
}
body.surmenu[data-decor-ecran="menu"] .etape .num{
  color:#fff; background:var(--bs-navy);
  box-shadow:0 2px 6px rgba(26,32,71,.3); border:none;
}
body.surmenu[data-decor-ecran="menu"] .etape h3{color:var(--bs-navy)}
body.surmenu[data-decor-ecran="menu"] .etape p{color:var(--bs-gris)}
body.surmenu[data-decor-ecran="menu"] .etape p strong{color:var(--bs-navy)}
body.surmenu[data-decor-ecran="menu"] .mini-forces svg{fill:var(--bs-mid)}
body.surmenu[data-decor-ecran="menu"] .mini-forces i{color:var(--bs-mid)}

/* ---------- le filet qui sépare ---------- */
body.surmenu[data-decor-ecran="menu"] .separation::before{
  background:linear-gradient(90deg,transparent,
    rgba(243,190,49,.9) 25%, rgba(243,190,49,.9) 75%, transparent);
}
body.surmenu[data-decor-ecran="menu"] .separation span{
  color:var(--bs-navy); text-shadow:none;
}
body.surmenu[data-decor-ecran="menu"] .separation span::before{
  background:radial-gradient(ellipse at center,
    rgba(255,255,255,.95) 40%, rgba(255,255,255,0) 78%);
}

/* ---------- les trois époques ----------
   Un filet d'or en tête, qui passe au bleu vif quand on les survole :
   la seule couleur qui dit « on peut cliquer ». */
body.surmenu[data-decor-ecran="menu"] .niv{
  background:rgba(255,255,255,.94) !important;
  border:1px solid var(--bs-filet); border-top:3px solid var(--bs-gold);
  border-radius:6px; color:var(--bs-gris) !important; transform:none;
  box-shadow:0 6px 18px rgba(26,32,71,.1);
}
body.surmenu[data-decor-ecran="menu"] .niv:hover:not([disabled]){
  border-color:var(--bs-vif); border-top-color:var(--bs-vif);
  transform:translateY(-3px);
  box-shadow:0 14px 30px rgba(20,56,127,.2);
}
body.surmenu[data-decor-ecran="menu"] .niv .ord{color:var(--bs-mid);font-weight:bold}
body.surmenu[data-decor-ecran="menu"] .niv .lieu{color:var(--bs-navy)}
body.surmenu[data-decor-ecran="menu"] .niv .per{color:var(--bs-doux)}
body.surmenu[data-decor-ecran="menu"] .niv .rec{color:var(--bs-doux)}
body.surmenu[data-decor-ecran="menu"] .niv[disabled]{
  opacity:1; background:rgba(255,255,255,.62) !important;
  border-top-color:var(--bs-filet); border-style:solid;
  box-shadow:none; color:#8A94A3 !important;
}
body.surmenu[data-decor-ecran="menu"] .niv[disabled] .ord,
body.surmenu[data-decor-ecran="menu"] .niv[disabled] .lieu,
body.surmenu[data-decor-ecran="menu"] .niv[disabled] .per,
body.surmenu[data-decor-ecran="menu"] .niv[disabled] .rec{color:#99A3B2}

/* ---------- les mentions et le pied ---------- */
body.surmenu[data-decor-ecran="menu"] .note-menu{
  color:var(--bs-doux); text-shadow:none;
}
body.surmenu[data-decor-ecran="menu"] footer{color:var(--bs-doux)}
body.surmenu[data-decor-ecran="menu"] footer .signature{color:var(--bs-doux)}
body.surmenu[data-decor-ecran="menu"] footer .signature b{color:var(--bs-navy)}

/* ---------- « ce dossier s'ouvre » --------------------------------
   Seulement tant qu'aucun n'a été ouvert, et seulement les premiers
   tours. Une invite qu'on ne peut pas manquer, qui s'efface dès
   qu'elle a servi : on n'explique pas deux fois. */
.d-enquete .cq-txt{flex:1 1 auto;min-width:0}
.d-enquete .invite{
  display:block; margin-top:2px; font-style:italic; font-size:12px;
  line-height:1.35; color:var(--rge);
}
.d-enquete.guide{
  border-color:var(--lai) !important;
  box-shadow:0 10px 26px rgba(0,0,0,.5), 0 0 0 1px rgba(184,137,74,.5);
}
/* on ne change que la couleur : la pastille garde sa taille, son
   libellé et sa place, sinon elle pousse tout le dossier */
.d-enquete.guide .pli{
  color:#2A1F12; background:linear-gradient(180deg,#E7C27A,var(--lai));
  border-color:#6A4A22;
  animation:pli-bat 2.2s ease-in-out infinite;
}
@keyframes pli-bat{
  0%,100%{opacity:1}
  50%{opacity:.72}
}
@media(prefers-reduced-motion:reduce){ .d-enquete.guide .pli{animation:none} }

/* ---------- le retour sur le jeu ---------------------------------- */
.av-intro{margin:.2em 0 14px;font-size:13.5px;line-height:1.55;color:var(--enc2)}
.av-intro b{color:var(--rge);font-variant-numeric:tabular-nums}
.qz.av-q{margin:10px 0}
.qz.av-q .qq{font-size:15px;margin-bottom:8px}
.qz.av-q .qr{display:flex;flex-wrap:wrap;gap:7px}
.qz.av-q .qr button{
  font-size:13px; padding:6px 13px; border-radius:14px;
  border:1px solid var(--fil); background:rgba(255,255,255,.45);
  color:var(--enc2); cursor:pointer;
}
.qz.av-q .qr button:hover{border-color:var(--lai);color:var(--enc)}
.qz.av-q .qr button.pris{
  background:var(--lai); border-color:#6A4A22; color:#FFF4DE; font-weight:bold;
}

/* ---------- les quatre courbes de la trace ------------------------ */
.cfo{display:block;width:100%;height:auto;margin:14px 0 4px}
.cfo .g{stroke:rgba(90,70,45,.18);stroke-width:1}
.cfo .zero{stroke:rgba(142,36,19,.45);stroke-width:1.4}
.cfo .ax{fill:var(--enc2);font-size:11px;text-anchor:end;font-family:inherit}
.cfo .ax.an{text-anchor:middle;letter-spacing:.06em}

.cfo-leg{display:flex;flex-wrap:wrap;gap:8px 20px;margin:6px 0 2px}
.cfo-l{display:flex;align-items:baseline;gap:7px;font-size:13px;color:var(--enc2)}
.cfo-l i{width:14px;height:3px;border-radius:2px;flex:0 0 auto;align-self:center}
.cfo-l b{color:var(--enc);font-weight:normal}
.cfo-l em{font-style:normal;font-family:var(--serif);font-size:17px;color:var(--enc);
  font-variant-numeric:tabular-nums}
.cfo-l u{text-decoration:none;font-size:12px;font-variant-numeric:tabular-nums;opacity:.85}
.cfo-l u.up{color:#3F6A2E} .cfo-l u.dn{color:var(--rge)}
.cfo-note{font-size:12.5px;line-height:1.5;color:var(--enc2);font-style:italic;margin:4px 0 14px}

/* ce qu'une décision a fait, en face d'elle */
.carnet .efs{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:5px}
.carnet .ef{font-size:11.5px;letter-spacing:.02em;padding:1px 7px;border-radius:10px;
  border:1px solid var(--fil);background:rgba(255,255,255,.4);white-space:nowrap}
.carnet .ef.up{color:#3F6A2E;border-color:rgba(78,122,58,.5)}
.carnet .ef.dn{color:var(--rge);border-color:rgba(142,36,19,.45)}

/* ---------- les jalons de la courbe ------------------------------- */
.cfo .jalon{stroke:rgba(90,70,45,.13);stroke-width:1;stroke-dasharray:2 3}
.cfo .ax.an{font-size:9.5px;letter-spacing:0}

/* ---------- l'acteur qui s'explique -------------------------------
   Le chiffre de la dernière décision sous la jauge, et la raison au
   clic. On ne repeint pas l'écran : la bulle vit dans le jeton. */
.tableau:has(.force.ouvert){z-index:40}
.force.ouvert{z-index:60}
.force.causant{cursor:pointer}
.force.causant::after{
  content:"?"; position:absolute; top:6px; right:8px;
  width:15px; height:15px; border-radius:50%;
  font-size:10px; line-height:15px; text-align:center;
  color:var(--enc2); border:1px solid var(--fil);
  background:rgba(255,255,255,.5); opacity:.75;
}
.force.causant:hover::after{opacity:1;color:var(--rge);border-color:var(--rge)}
.force.ouvert::after{content:"×";color:var(--rge);border-color:var(--rge);opacity:1}

.force .delta{
  margin-top:5px; font-family:var(--serif); font-size:16px; line-height:1;
  font-variant-numeric:tabular-nums;
}
.force .delta.up{color:#3F6A2E}
.force .delta.dn{color:var(--rge)}

.force .pourquoi{
  display:none; position:absolute; z-index:9; left:50%; top:calc(100% + 10px);
  transform:translateX(-50%); width:min(290px, 78vw); text-align:left;
  background:linear-gradient(152deg, var(--pap) 0%, var(--pap2) 100%);
  border:1px solid var(--fil); border-top:3px solid var(--lai); border-radius:3px;
  box-shadow:0 16px 38px rgba(0,0,0,.6); padding:13px 15px 12px; cursor:default;
}
.force.ouvert .pourquoi{display:block; animation:paraitre .22s ease-out}
/* la pointe de la bulle, tournée vers son jeton */
.force .pourquoi::before{
  content:""; position:absolute; left:50%; top:-8px; transform:translateX(-50%);
  border:6px solid transparent; border-bottom-color:var(--lai);
}
.pourquoi .bt{font-family:var(--serif);font-size:16px;color:var(--enc);margin-bottom:7px}
.pourquoi .bt b{font-size:20px;margin-right:5px;font-variant-numeric:tabular-nums}
.pourquoi .bt b.up{color:#3F6A2E} .pourquoi .bt b.dn{color:var(--rge)}
.pourquoi p{margin:.3em 0;font-size:13px;line-height:1.5;color:var(--enc2)}
.pourquoi .bd{font-style:italic;color:var(--enc)}
.pourquoi .bq{border-top:1px solid var(--fil);padding-top:8px;margin-top:9px}
.pourquoi .bent{color:var(--rge);font-size:12.5px}

/* sur un petit écran, la bulle prend toute la largeur du tableau */
@media(max-width:700px){
  .force .pourquoi{position:static;transform:none;width:auto;margin-top:10px;
    box-shadow:none;border-top-width:2px}
  .force .pourquoi::before{display:none}
}

/* ---------- le son coupé se voit --------------------------------- */
#btson.muet{
  color:var(--bs-orange,#CA5007); border-color:rgba(202,80,7,.7);
  background:rgba(202,80,7,.14);
}
#btson.muet ~ .regl{opacity:.4}

/* ---------- l'humeur des acteurs ---------------------------------- */
.force .delta{
  margin-top:6px; font-size:12px; letter-spacing:.04em; line-height:1.2;
  display:flex; align-items:center; justify-content:center; gap:5px;
}
.force .delta .fl{font-size:9px;letter-spacing:-.5px}
.force .delta.up{color:#3F6A2E}
.force .delta.dn{color:var(--rge)}

.pourquoi .bt{font-family:var(--serif);font-size:17px;color:var(--enc2);margin-bottom:8px}
.pourquoi .bt b{font-weight:normal;color:var(--enc)}
.pourquoi .bt b.up{color:#3F6A2E} .pourquoi .bt b.dn{color:var(--rge)}
.pourquoi .bp{color:var(--enc);font-size:13.5px}
.pourquoi .bv{font-size:12.5px;opacity:.85}

/* ---------- deux réglettes dans le bandeau ------------------------ */
.son-reglage .regl{display:flex;align-items:center;gap:6px}
.son-reglage .regl i{
  font-style:normal; font-size:8.5px; letter-spacing:.11em;
  text-transform:uppercase; color:rgba(255,255,255,.52); white-space:nowrap;
}
#voleff{
  -webkit-appearance:none; appearance:none; width:62px; height:16px;
  background:transparent; cursor:pointer; margin:0; padding:0; border:none;
}
#voleff::-webkit-slider-runnable-track{height:4px;border-radius:2px;
  background:linear-gradient(90deg, var(--bs-gold), rgba(255,255,255,.28))}
#voleff::-moz-range-track{height:4px;border-radius:2px;
  background:linear-gradient(90deg, var(--bs-gold), rgba(255,255,255,.28))}
#voleff::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:13px; height:13px; margin-top:-4.5px;
  border-radius:50%; background:#fff; border:1px solid rgba(0,0,0,.35);
  box-shadow:0 1px 4px rgba(0,0,0,.5);
}
#voleff::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;
  border:1px solid rgba(0,0,0,.35);box-shadow:0 1px 4px rgba(0,0,0,.5)}
#voleff:hover::-webkit-slider-thumb{background:var(--bs-gold)}
#voleff:hover::-moz-range-thumb{background:var(--bs-gold)}

/* la place manque avant tout sur un téléphone : on garde la musique,
   les bruitages gardent leur réglage retenu */
@media(max-width:900px){ .son-reglage .regl i{display:none} }
@media(max-width:700px){ .son-reglage .regl:last-child{display:none} }

/* Le but du jeu, dit avant tout le reste : les eleves lisaient cinq
   points sans trouver l'objectif, parce qu'il n'etait ecrit nulle part. */
.but-jeu{
  margin:0 0 20px; padding:12px 16px; text-align:center;
  font-family:var(--serif); font-size:16.5px; line-height:1.45;
  color:var(--enc); background:rgba(243,190,49,.13);
  border-top:1px solid rgba(243,190,49,.5);
  border-bottom:1px solid rgba(243,190,49,.5);
}
.but-jeu strong{color:var(--enc)}
@media(max-width:600px){ .but-jeu{font-size:15px;padding:10px 12px} }

/* l'ordre du jour : on lit, puis on tranche. La question marque la bascule. */
.question{grid-column:1 / -1;text-align:center;margin:18px 0 -2px;
  font-family:var(--serif);font-size:clamp(19px,2.4vw,25px);color:#E8D8BC;
  letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.75)}
body[data-niveau="II"] .question{color:#D9E3ED}
@media(max-width:1000px){.question{margin:6px 0 2px}}

/* ---------- le courrier ---------------------------------------------- */
.courrier{
  background:linear-gradient(158deg,#EFE2C6,#DCCBA6) !important;
  border:1px solid #C2A470 !important; border-radius:2px;
  padding:15px 16px 14px; color:#2A1F12 !important;
  box-shadow:0 10px 24px rgba(0,0,0,.46);
}
/* l'enveloppe : un rabat triangulaire, deux traits */
.courrier .env{
  height:46px; margin:2px 0 11px; border:1px solid #B79A63; border-radius:2px;
  background:
    linear-gradient(135deg, transparent 49.4%, #B79A63 49.4% 50.6%, transparent 50.6%),
    linear-gradient(225deg, transparent 49.4%, #B79A63 49.4% 50.6%, transparent 50.6%),
    linear-gradient(160deg,#F3E8CE,#E3D3AE);
  background-size:100% 62%,100% 62%,100% 100%;
  background-position:top left,top left,center;
  background-repeat:no-repeat;
  position:relative;
}
.courrier .cd{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:#8E2413;font-weight:bold;margin-bottom:4px}
.courrier .cq{font-size:13.5px;line-height:1.45;color:#3A2E22}
.courrier .cq.vide{font-style:italic;color:#7D6A4E}
/* un pli non ouvert : le cachet, et il remue */
.courrier.attente .env::after{
  content:""; position:absolute; left:50%; top:52%; width:22px; height:22px;
  transform:translate(-50%,-50%);
  border-radius:47% 53% 51% 49%/49% 47% 53% 51%;
  background:radial-gradient(circle at 36% 30%, #D4553A, #8E2413 62%, #5A140A);
  box-shadow:0 2px 5px rgba(0,0,0,.5);
}
.courrier.attente{opacity:0; animation:poser .42s cubic-bezier(.2,.8,.3,1) var(--d,0s) forwards,
             frisson 2.4s ease-in-out infinite;}
@keyframes frisson{
  0%,88%,100%{transform:rotate(1.4deg)}
  91%{transform:rotate(.2deg) translateX(-1.5px)}
  94%{transform:rotate(2.4deg) translateX(1.5px)}
  97%{transform:rotate(1deg)}
}

/* ---------- la frappe ------------------------------------------------ */
/* un curseur tant que la ligne s'écrit, et une hauteur réservée pour que
   rien ne saute quand le texte s'allonge */
.situ .t{min-height:1.2em}
.situ .d{min-height:3.1em}

/* ---------- petits écrans -------------------------------------------- */
@media(max-width:1000px){
  .plateau{grid-template-columns:1fr}
  .plateau .col{gap:14px}
  .col-g > *,.col-c > *,.col-d > *{transform:none}
  .courrier.attente{animation:none}
  .tableau{padding:22px 14px 14px;border-width:9px}
  .bureau::before{left:-8px;right:-8px}
  .bureau::after{left:-8px;right:-8px}
}
</style>
</head>
