<script>
"use strict";
/* ==================================================================
   LE SON

   Trois boucles fournies, libres de droits, 80 kbit/s stéréo.

   Mesuré à la décompression, elles ont toutes le même défaut : un
   fondu descendant puis deux secondes de silence à la fin. Jouées en
   boucle simple, on entendrait un trou toutes les deux ou trois
   minutes. On ne les rejoue donc pas d'un bout à l'autre : on boucle
   sur la matière pleine, mesurée fichier par fichier, avec un fondu
   croisé de deux secondes et demie entre la fin et la reprise.

   Deux lecteurs alternent pour cela. Les niveaux relevés au point de
   reprise et au point de bouclage ne diffèrent que de 0,5 à 1,5 dB :
   le raccord est inaudible.

   Par-dessus, la tension du jeu ouvre un filtre, monte le volume et
   accélère de 5 % au plus ; et au-delà d'un seuil seulement, un
   battement de machine vient se poser sur la musique.
   ================================================================== */
const BOUCLES = {
  menu:{ f:"son/menu.mp3",      debut:2.00, fin:167.6 },
  fin: { f:"son/fin.mp3",       debut:0.00, fin:0     },  /* fin calée à la lecture */
  I:   { f:"son/niveau-I.mp3",  debut:0.00, fin:142.2 },
  II:  { f:"son/niveau-II.mp3", debut:0.75, fin:136.8 },
};
const CROISE = 2.5;   // secondes de fondu entre les deux lecteurs

const SON = {
  ctx:null, pret:false, actif:true, amb:null,
  /* deux réglages distincts : la musique de fond, et ce qui réagit */
  vmus:.85, veff:.9, gainMusU:null, gainEff:null,
  maitre:null, bruit:null, tension:0, tic:null,
  lecteurs:[], actifL:0, filtre:null, gainMus:null, veille:null, vmix:.55,
  horloge:null, prochain:0, battue:0,

  dispo(){ return typeof (window.AudioContext||window.webkitAudioContext)==="function"; },

  init(){
    if(this.ctx || !this.dispo()) return;
    try{
      const AC = window.AudioContext||window.webkitAudioContext;
      this.ctx = new AC();
      this.maitre = this.ctx.createGain();
      this.maitre.gain.value = this.actif ? 1 : 0;
      this.maitre.connect(this.ctx.destination);
      const n = this.ctx.sampleRate*2;
      this.bruit = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = this.bruit.getChannelData(0);
      for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
      /* la chaîne commune aux deux lecteurs : mélange, filtre, volume */
      this.filtre = this.ctx.createBiquadFilter();
      this.filtre.type="lowpass"; this.filtre.frequency.value=1600;
      this.gainMus = this.ctx.createGain(); this.gainMus.gain.value=1;
      /* La musique : filtre de tension, gain de tension, puis le volume
         choisi par le joueur. Les bruitages : leur propre volume. Les
         deux se rejoignent sous l'interrupteur. */
      this.gainMusU = this.ctx.createGain(); this.gainMusU.gain.value = this.vmus;
      this.gainEff  = this.ctx.createGain(); this.gainEff.gain.value  = this.veff;
      this.filtre.connect(this.gainMus); this.gainMus.connect(this.gainMusU);
      this.gainMusU.connect(this.maitre);
      this.gainEff.connect(this.maitre);
      this.pret = true;
      this.veiller();
    }catch(e){ this.pret=false; }
  },

  /* Deux lecteurs, créés une seule fois : createMediaElementSource ne
     peut être appelé qu'une fois par élément audio. */
  lecteur(i){
    if(this.lecteurs[i]) return this.lecteurs[i];
    const a = new Audio();
    /* Pas de crossOrigin : les fichiers viennent du même site, et le
       demander fait échouer le chargement — en file:// toujours, et sur
       un serveur qui n'envoie pas les en-têtes CORS. */
    a.preload="auto"; a.volume=1;
    const L = {a, g:null, ok:false};
    if(this.ctx){
      try{
        const src = this.ctx.createMediaElementSource(a);
        L.g = this.ctx.createGain(); L.g.gain.value = 0;
        src.connect(L.g); L.g.connect(this.filtre);
        L.ok = true;
      }catch(e){ L.g=null; a.volume=0; }
    } else { a.volume=0; }
    this.lecteurs[i]=L;
    return L;
  },

  vol(L, v, t){
    if(L.g) this.glisser(L.g.gain, v, t);
    else {
      /* repli sans Web Audio : on anime le volume de l'élément */
      const dep=L.a.volume, pas=(v-dep)/Math.max(1,t*20);
      clearInterval(L.anim);
      L.anim = setInterval(()=>{
        let x = L.a.volume + pas;
        if((pas>0 && x>=v) || (pas<0 && x<=v)){ x=v; clearInterval(L.anim); }
        try{ L.a.volume = Math.max(0,Math.min(1,x)) }catch(e){}
      }, 50);
    }
  },

  reveiller(){
    this.init();
    if(this.ctx && this.ctx.state==="suspended") this.ctx.resume().catch(()=>{});
    const L=this.lecteurs[this.actifL];
    if(L && this.actif && L.a.src) L.a.play().catch(()=>{});
  },

  couper(v){
    this.actif = v;
    try{ localStorage.setItem("pdp_son", v?"1":"0") }catch(e){}
    /* On coupe d'un coup : un fondu laisse le temps à une autre rampe
       de reprendre la main, et le joueur a cliqué pour que ça s'arrête
       maintenant. On rétablit en douceur, en revanche. */
    if(this.maitre){
      if(v) this.glisser(this.maitre.gain, 1, .3);
      else try{ this.maitre.gain.cancelScheduledValues(this.ctx.currentTime);
                this.maitre.gain.setValueAtTime(0, this.ctx.currentTime); }
           catch(e){ this.maitre.gain.value = 0; }
    }
    this.lecteurs.forEach(L=>{ if(!L) return;
      if(v){ if(L.a.src) L.a.play().catch(()=>{}) } else L.a.pause(); });
    const b=document.getElementById("btson");
    if(b){ b.textContent = v?"♪":"♪̸"; b.title = v?"Couper le son":"Rétablir le son";
            b.classList.toggle("muet", !v); }
  },

  /* La réglette. Rétablit le son si on la remonte alors qu'il était coupé :
     personne ne comprendrait qu'on pousse le volume sans rien entendre. */
  volume(v){
    this.vmus = Math.max(0, Math.min(1, v));
    try{ localStorage.setItem("pdp_vol", this.vmus.toFixed(2)) }catch(e){}
    if(this.vmus > 0 && !this.actif){ this.couper(true); }
    if(this.gainMusU) this.glisser(this.gainMusU.gain, this.vmus, .12);
  },

  /* Les bruitages : le même geste, l'autre chemin. */
  bruitage(v){
    this.veff = Math.max(0, Math.min(1, v));
    try{ localStorage.setItem("pdp_eff", this.veff.toFixed(2)) }catch(e){}
    if(this.veff > 0 && !this.actif){ this.couper(true); }
    if(this.gainEff) this.glisser(this.gainEff.gain, this.veff, .12);
    this.papier();                 /* on entend tout de suite ce qu'on règle */
  },

  glisser(param, val, t){
    if(!this.ctx) return;
    /* garde-fou : une cible qui n'est pas un nombre coupait le son en
       silence. Mieux vaut ne rien faire que tout mettre à zéro. */
    if(typeof val !== "number" || !isFinite(val)){
      console.warn("son : fondu ignoré, cible invalide", val); return;
    }
    const n=this.ctx.currentTime;
    try{ param.cancelScheduledValues(n); param.setValueAtTime(param.value,n);
         param.linearRampToValueAtTime(val, n+t); }
    catch(e){ param.value = val; }
  },

  /* Quelque chose joue-t-il, vraiment ? */
  joue(){
    return (this.lecteurs||[]).some(L => L && L.a && !L.a.paused && !L.a.ended);
  },

  /* Remettre l'ambiance en marche si elle s'est tue. Ne fait rien tant
     que tout va bien : on peut donc l'appeler aussi souvent qu'on veut. */
  relancer(){
    /* Le son est coupé : la veille ne se contente pas de ne rien faire,
       elle s'assure qu'il l'est resté. C'est la même boucle qui répare
       dans les deux sens. */
    if(!this.actif){
      try{ if(this.maitre && this.ctx){
             this.maitre.gain.cancelScheduledValues(this.ctx.currentTime);
             this.maitre.gain.setValueAtTime(0, this.ctx.currentTime); } }catch(e){}
      (this.lecteurs||[]).forEach(L=>{ if(L && L.a && !L.a.paused){
        try{ L.a.pause() }catch(e){} } });
      return;
    }
    if(!this.amb) return;
    const b = BOUCLES[this.amb];
    if(!b) return;
    this.init();
    if(!this.pret) return;
    try{ if(this.ctx.state==="suspended") this.ctx.resume().catch(()=>{}); }catch(e){}
    if(this.joue()) return;
    this.actifL = 0;
    this.demarrer(this.lecteur(0), b, true);
    this.lecteur(1);
    clearInterval(this.veille); this.veille = null;
    this.surveiller(b);
    this.lancerHorloge();
  },

  /* Le premier geste du joueur lève la règle de lecture automatique.
     Ensuite, une veille toutes les quatre secondes rattrape ce qu'un
     onglet endormi ou un refus de lecture aurait fait tomber. */
  veiller(){
    if(this.veilleGlobale) return;
    const reprise = ()=>{ try{ this.relancer() }catch(e){} };
    ["pointerdown","keydown","touchstart"].forEach(ev=>
      document.addEventListener(ev, reprise, {capture:true, passive:true}));
    document.addEventListener("visibilitychange", ()=>{
      if(!document.hidden) reprise();
    });
    this.veilleGlobale = setInterval(reprise, 4000);
  },

  /* Où brancher un bruitage. Avant l'initialisation, on retombe sur
     l'interrupteur : rien ne casse si le son n'est pas encore prêt. */
  eff(){ return this.gainEff || this.maitre; },

  /* ---------- l'ambiance --------------------------------------------- */
  ambiance(quoi){
    this.init();
    /* Pas seulement « est-ce la même ambiance ? » mais « la même, et
       elle joue vraiment ? ». Sans cela, une ambiance demandée avant
       que le son soit prêt restait inscrite et bloquait les suivantes. */
    if(this.amb===quoi && this.joue()) return;
    this.amb = quoi;
    const b = BOUCLES[quoi];
    /* hors d'une partie — menu, écran de fin — la tension retombe */
    if(quoi!=="I" && quoi!=="II"){
      this.tension = 0;
      if(this.filtre)  this.glisser(this.filtre.frequency, 7200, 2.5);
      if(this.gainMus) this.glisser(this.gainMus.gain, 1, 2.5);
      this.lecteurs.forEach(L=>{ if(L){ try{ L.a.playbackRate = 1 }catch(e){} } });
    }
    this.lecteurs.forEach(L=>{ if(L) this.vol(L, 0, .5); });
    clearInterval(this.veille); this.veille=null;
    if(!b || !this.pret){ setTimeout(()=>this.stopTous(), 700); return; }
    this.actifL = 0;
    this.demarrer(this.lecteur(0), b, true);
    this.lecteur(1);                       // prêt pour le premier croisement
    this.surveiller(b);
    this.lancerHorloge();
  },

  demarrer(L, b, fondu){
    try{
      if(L.a.getAttribute("src") !== b.f){
        L.a.src = b.f; L.a.load();
        /* fin:0 veut dire « on ne connaît pas la durée » : on la déduit
           du fichier dès qu'il est lu, pour pouvoir boucler dessus. */
        if(!b.fin) L.a.addEventListener("loadedmetadata", ()=>{
          if(L.a.duration && isFinite(L.a.duration)) b.fin = Math.max(1, L.a.duration - 1.2);
        }, {once:true});
      }
      L.a.currentTime = b.debut;
    }catch(e){}
    if(this.actif) L.a.play().catch(()=>{});
    this.vol(L, this.vmix, fondu ? 1.8 : CROISE);
  },

  /* On ne laisse jamais le fichier aller jusqu'au bout : à l'approche du
     point de bouclage, l'autre lecteur reprend au début en fondu. */
  surveiller(b){
    this.veille = setInterval(()=>{
      if(!this.amb || !BOUCLES[this.amb]) return;
      const L=this.lecteurs[this.actifL];
      if(!L || L.a.paused) return;
      /* Point de bouclage encore inconnu : on le prend dès que la durée
         est lisible, et surtout on ne boucle pas avant de le savoir —
         sinon « currentTime >= 0 - 2,5 » est vrai tout de suite. */
      if(!b.fin || !isFinite(b.fin)){
        if(L.a.duration && isFinite(L.a.duration))
          b.fin = Math.max(1, L.a.duration - 1.2);
        return;
      }
      if(L.a.currentTime >= b.fin - CROISE){
        const autre = this.lecteur(this.actifL^1);
        this.demarrer(autre, b, false);
        this.vol(L, 0, CROISE);
        const vieux = L;
        setTimeout(()=>{ try{ vieux.a.pause() }catch(e){} }, (CROISE+.4)*1000);
        this.actifL ^= 1;
      }
    }, 250);
  },

  stopTous(){
    this.lecteurs.forEach(L=>{ if(L){ try{ L.a.pause() }catch(e){} } });
  },

  /* ---------- le battement, au-delà du seuil seulement ---------------- */
  lancerHorloge(){
    if(this.horloge) return;
    this.horloge = setInterval(()=>{
      if(!this.ctx || !this.amb || this.amb==="menu") return;
      if(this.tension < .45){ this.prochain = this.ctx.currentTime + .2; return; }
      const pas = 60/(54 + this.tension*54);
      while(this.prochain < this.ctx.currentTime + .12){
        this.battre(this.prochain); this.prochain += pas;
      }
      if(this.prochain < this.ctx.currentTime) this.prochain = this.ctx.currentTime + .05;
    }, 25);
  },

  battre(t){
    this.battue++;
    const k=(this.tension-.45)/.55;
    if(this.amb==="I") this.vapeur(t, this.battue%2===0, k);
    else               this.chaine(t, this.battue%4===0, k);
  },

  vapeur(t, fort, k){
    const c=this.ctx, o=c.createOscillator(), g=c.createGain();
    o.type="sine"; o.frequency.setValueAtTime(fort?62:52, t);
    o.frequency.exponentialRampToValueAtTime(fort?30:26, t+.16);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime((fort?.17:.10)*k, t+.012);
    g.gain.exponentialRampToValueAtTime(.001, t+.22);
    o.connect(g); g.connect(this.eff()); o.start(t); o.stop(t+.26);
  },

  chaine(t, fort, k){
    const c=this.ctx, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=this.bruit; s.loop=true;
    f.type="bandpass"; f.frequency.value=fort?2600:3400; f.Q.value=9;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime((fort?.06:.035)*k, t+.004);
    g.gain.exponentialRampToValueAtTime(.001, t+(fort?.10:.05));
    s.connect(f); f.connect(g); g.connect(this.eff()); s.start(t); s.stop(t+.14);
  },

  /* « À cause de votre choix d'il y a quatre tours. » C'est le moment
     où le jeu referme une boucle, et il arrivait en silence. Trois
     notes d'un même accord, qui montent lentement et s'éteignent en
     trois secondes, posées sous la musique. Rien de perçant : des
     sinusoïdes filtrées, une attaque d'une demi-seconde, et un volume
     qui reste sous celui de la musique. */
  germe(bon){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.02;
    const f=c.createBiquadFilter(), g=c.createGain();
    f.type="lowpass"; f.frequency.value=1500; f.Q.value=.6;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.075, t+.55);     /* la nappe se lève */
    g.gain.setValueAtTime(.075, t+1.5);
    g.gain.exponentialRampToValueAtTime(.0008, t+3.2);
    f.connect(g); g.connect(this.eff());
    /* majeur quand la graine est heureuse, mineur quand elle l'est moins :
       l'oreille sait avant d'avoir lu. */
    const r = bon ? [1, 1.25, 1.5] : [1, 1.2, 1.5];
    r.forEach((x,i)=>{
      const o=c.createOscillator();
      o.type = i ? "sine" : "triangle";
      o.frequency.setValueAtTime(174.6*x, t);
      o.connect(f); o.start(t+i*.11); o.stop(t+3.3);
    });
  },

  /* Le tiroir du bureau d'enquête : du bois qui glisse sur du bois,
     puis la butée. Grave, court, sans claquement sec. */
  tiroir(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.01;
    const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=this.bruit; s.loop=true;
    f.type="lowpass"; f.frequency.setValueAtTime(380, t);
    f.frequency.linearRampToValueAtTime(900, t+.3);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.05, t+.09);
    g.gain.setValueAtTime(.05, t+.26);
    g.gain.exponentialRampToValueAtTime(.001, t+.4);
    s.connect(f); f.connect(g); g.connect(this.eff()); s.start(t); s.stop(t+.42);
    /* la butée, quand le tiroir arrive au bout */
    const o=c.createOscillator(), gb=c.createGain();
    o.type="triangle"; o.frequency.setValueAtTime(150, t+.3);
    o.frequency.exponentialRampToValueAtTime(82, t+.38);
    gb.gain.setValueAtTime(0, t+.3);
    gb.gain.linearRampToValueAtTime(.09, t+.31);
    gb.gain.exponentialRampToValueAtTime(.001, t+.42);
    o.connect(gb); gb.connect(this.eff()); o.start(t+.3); o.stop(t+.44);
  },

  /* L'enveloppe : le cachet casse, puis le papier se déchire. La
     déchirure monte en fréquence — c'est ce qui la rend reconnaissable. */
  enveloppe(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.01;
    /* le cachet */
    const o=c.createOscillator(), g0=c.createGain();
    o.type="triangle"; o.frequency.setValueAtTime(420, t);
    o.frequency.exponentialRampToValueAtTime(130, t+.07);
    g0.gain.setValueAtTime(0, t);
    g0.gain.linearRampToValueAtTime(.14, t+.006);
    g0.gain.exponentialRampToValueAtTime(.001, t+.1);
    o.connect(g0); g0.connect(this.eff()); o.start(t); o.stop(t+.12);
    /* la déchirure */
    const d=t+.1;
    const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=this.bruit; s.loop=true;
    f.type="bandpass"; f.Q.value=.9;
    f.frequency.setValueAtTime(1600, d);
    f.frequency.exponentialRampToValueAtTime(5200, d+.3);
    g.gain.setValueAtTime(0, d);
    g.gain.linearRampToValueAtTime(.055, d+.05);
    g.gain.linearRampToValueAtTime(.035, d+.2);
    g.gain.exponentialRampToValueAtTime(.001, d+.36);
    s.connect(f); f.connect(g); g.connect(this.eff()); s.start(d); s.stop(d+.38);
  },

  /* Le coup du verdict : un seul, grave et long. Il tombe trois secondes
     avant que la musique de fin s'installe. */
  verdict(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.02;
    const o=c.createOscillator(), o2=c.createOscillator(), g=c.createGain();
    o.type="sine";  o.frequency.setValueAtTime(74, t);
    o.frequency.exponentialRampToValueAtTime(44, t+1.6);
    o2.type="sine"; o2.frequency.setValueAtTime(111, t);
    o2.frequency.exponentialRampToValueAtTime(66, t+1.6);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.22, t+.04);
    g.gain.exponentialRampToValueAtTime(.0008, t+2.6);
    o.connect(g); o2.connect(g); g.connect(this.eff());
    o.start(t); o2.start(t); o.stop(t+2.8); o2.stop(t+2.8);
  },

  /* Une force passe sous quinze. Le bandeau rouge, un élève qui lit ne
     le voit pas : une note tenue, discrète, qui s'efface d'elle-même. */
  alerte(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.02;
    [466.2, 311.1].forEach((hz,i)=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type="sine"; o.frequency.value=hz;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(i?.05:.07, t+.25);
      g.gain.setValueAtTime(i?.05:.07, t+.7);
      g.gain.exponentialRampToValueAtTime(.0008, t+2.1);
      o.connect(g); g.connect(this.eff()); o.start(t); o.stop(t+2.2);
    });
  },

  /* La correction du questionnaire : une note par réponse, dans l'ordre.
     Claire quand elle est juste, sourde quand elle ne l'est pas. */
  bilan(justes){
    if(!this.pret || !justes || !justes.length) return;
    const c=this.ctx, t0=c.currentTime+.12;
    justes.forEach((ok,i)=>{
      const t=t0+i*.15;
      const o=c.createOscillator(), f=c.createBiquadFilter(), g=c.createGain();
      o.type = ok ? "sine" : "triangle";
      o.frequency.setValueAtTime(ok ? 784 : 174.6, t);
      if(!ok) o.frequency.exponentialRampToValueAtTime(146.8, t+.2);
      f.type="lowpass"; f.frequency.value = ok ? 6000 : 700;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(ok ? .1 : .085, t+.012);
      g.gain.exponentialRampToValueAtTime(.001, t+(ok ? .34 : .28));
      o.connect(f); f.connect(g); g.connect(this.eff());
      o.start(t); o.stop(t+.4);
    });
  },

  /* La machine tape tant qu'un texte s'écrit. Irrégulière, discrète, et
     toujours sous la musique : c'est une présence, pas un événement. */
  frappe(marche){
    if(!this.pret) return;
    if(!marche){ if(this.dactylo){ clearInterval(this.dactylo); this.dactylo=null; } return; }
    if(this.dactylo) return;
    const clic = ()=>{
      const c=this.ctx, t=c.currentTime+.005;
      const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
      s.buffer=this.bruit; s.loop=true;
      f.type="bandpass"; f.Q.value=2.2;
      f.frequency.value = 1900 + Math.random()*1300;   /* chaque touche sonne un peu autrement */
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.028 + Math.random()*.016, t+.003);
      g.gain.exponentialRampToValueAtTime(.001, t+.035);
      s.connect(f); f.connect(g); g.connect(this.eff()); s.start(t); s.stop(t+.05);
    };
    clic();
    this.dactylo = setInterval(()=>{
      clic();
      /* une frappe sur six se double : c'est ce qui fait la main humaine */
      if(Math.random() < .17) setTimeout(clic, 40 + Math.random()*30);
    }, 115);
  },

  /* La sonnette du chariot, quand la ligne est finie. */
  chariot(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.01;
    [2093, 3136].forEach((hz,i)=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type="sine"; o.frequency.value=hz;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(i?.022:.05, t+.004);
      g.gain.exponentialRampToValueAtTime(.0008, t+(i?.5:.8));
      o.connect(g); g.connect(this.eff()); o.start(t); o.stop(t+.9);
    });
  },

  /* ---------- la tension ---------------------------------------------- */
  majTension(){
    if(!this.pret) return;
    if(this.amb!=="I" && this.amb!=="II") return;   /* ni au menu, ni à la fin */
    if(typeof E==="undefined" || !E || !E.f) return;
    const bas = Math.min(E.f.i, E.f.o, E.f.m, E.f.p);
    const t = Math.max(0, Math.min(1, (62-bas)/52));
    this.tension = t;
    if(this.filtre)  this.glisser(this.filtre.frequency, 1100 + t*6000, 2.2);
    if(this.gainMus) this.glisser(this.gainMus.gain, 1 + t*.35, 2.2);
    this.lecteurs.forEach(L=>{ if(L){ try{ L.a.playbackRate = 1 + t*.05 }catch(e){} } });
  },

  /* ---------- les effets ponctuels ------------------------------------- */
  coup(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.02;
    const o=c.createOscillator(), g=c.createGain();
    o.type="sine"; o.frequency.setValueAtTime(96, t);
    o.frequency.exponentialRampToValueAtTime(34, t+.7);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.38, t+.02);
    g.gain.exponentialRampToValueAtTime(.001, t+1.1);
    o.connect(g); g.connect(this.eff()); o.start(t); o.stop(t+1.2);
    if(this.gainMus){
      this.glisser(this.gainMus.gain, .35, .2);
      setTimeout(()=>this.majTension(), 1100);
    }
  },

  papier(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.01;
    const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=this.bruit; s.loop=true;
    f.type="bandpass"; f.frequency.value=4200; f.Q.value=1.4;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.04, t+.03);
    g.gain.exponentialRampToValueAtTime(.001, t+.19);
    s.connect(f); f.connect(g); g.connect(this.eff()); s.start(t); s.stop(t+.22);
  },


  /* Un acteur qu'on interroge répond par une note : elle monte s'il a
     gagné, elle descend s'il a perdu, elle reste plate s'il n'a rien eu. */
  jeton(v){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.01;
    const o=c.createOscillator(), g=c.createGain();
    const base = 330;
    o.type="sine";
    o.frequency.setValueAtTime(base, t);
    if(v>0) o.frequency.exponentialRampToValueAtTime(base*1.5, t+.13);
    else if(v<0) o.frequency.exponentialRampToValueAtTime(base/1.5, t+.13);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.09, t+.012);
    g.gain.exponentialRampToValueAtTime(.001, t+.26);
    o.connect(g); g.connect(this.eff()); o.start(t); o.stop(t+.28);
  },

  horlogeUrgence(marche){
    if(!this.pret) return;
    if(!marche){ if(this.tic){ clearInterval(this.tic); this.tic=null; } return; }
    if(this.tic) return;
    let n=0;
    this.tic = setInterval(()=>{
      const c=this.ctx, t=c.currentTime+.01;
      const o=c.createOscillator(), g=c.createGain();
      o.type="square"; o.frequency.value=(n++%2)?1900:1500;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.06, t+.004);
      g.gain.exponentialRampToValueAtTime(.001, t+.05);
      o.connect(g); g.connect(this.eff()); o.start(t); o.stop(t+.07);
    }, 500);
  },

  fin(cause){
    if(!this.pret) return;
    this.horlogeUrgence(false);
    this.verdict();                  /* un seul coup, grave, sous le reste */
    const c=this.ctx, t=c.currentTime+.05;
    const freqs = cause==="verdict" ? [196, 261.6, 329.6] : [110, 146.8, 155.6];
    freqs.forEach((hz,i)=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type="sine"; o.frequency.value=hz;
      g.gain.setValueAtTime(0, t+i*.09);
      g.gain.linearRampToValueAtTime(.15, t+i*.09+.03);
      g.gain.exponentialRampToValueAtTime(.001, t+i*.09+2.6);
      o.connect(g); g.connect(this.eff()); o.start(t+i*.09); o.stop(t+i*.09+2.8);
    });
    /* la musique baisse mais ne s'arrête pas : on lit encore le verdict */
    if(this.gainMus) this.glisser(this.gainMus.gain, .45, 1.5);
  },
};

 f:"Industrial cities have almost no healthcare facilities for workers: medicine for the poor depends on private charity and a few dedicated practitioners. Epidemics spread all the faster because **urbanisation** crowds people together. Doctors are often the ones who, by keeping records, produce the first social statistics and make visible what industrialisation costs those who keep it running.",
 a:{q:"“Let us open the dispensary.”", e:{o:10,p:7,m:-6,i:-3},
    c:"The dispensary is always full. It reveals the scale of what had gone unseen."},
 b:{q:"“Let us refuse the dispensary.”", e:{o:-7,p:-4,i:3}, suite:{dans:4, t:"A fever spread for lack of treatment", x:"It started in a single courtyard and no one could stop it: there was neither a doctor nor a bed to isolate anyone. Entire families are counted among the dead.", e:{o:-6,p:-5,i:-2}},
    c:"Rait carries on alone, and tells anyone who will listen."},
 c:{q:"“Let us open it, paid for by the manufacturers.”", e:{o:6,p:4,i:-11,m:-3},
    c:"The manufacturers pay, and make sure everyone remembers that they are the ones paying."}},

{t:"Basements are now being rented out.", qui:"Reverend Ellis Hargreaves, minister in the district",
 d:"“I buried four children this week, all from the same cellar. The floor space is rented out as if it were a room. Close these dwellings.”",
 ex:"Because there are not enough homes, landlords have begun renting out the cellars beneath their houses: one underground room, with no window and no drainage, often flooded, where an entire family lives. It earns them as much as a room, and nothing forbids it. The minister keeps records of burials in his parish and has brought them with him. Banning these cellars would leave their residents homeless.",
 f:"At the beginning of the 1840s, an estimated fifteen to twenty thousand Manchester residents live in cellars: one underground room, with no window or drainage, often damp. Friedrich Engels, who stays in the city from 1842, describes them in *The Condition of the Working Class in England*. Cellar housing shows that growth in production and improvements in living conditions do not go together: **progress does not benefit everyone equally**.",
 a:{q:"“Close the cellar dwellings.”", e:{p:9,o:-6,i:-4,m:-2},
    c:"The cellars are bricked up, and those who lived there end up on the streets. Closing a slum does not create a home."},
 b:{q:"“Let people keep renting out the cellars.”", e:{o:-8,p:-6,i:4}, suite:{dans:4, t:"People die in the basements", x:"The parish death register is damning: one burial in three comes from a cellar dwelling. What the reverend described a few years ago has become a statistic.", e:{o:-6,p:-7}},
    c:"Under almost every house, one more family. Renting out the basement becomes a business."},
 c:{q:"“Close them as people are rehoused.”", e:{o:3,p:4,m:-10,i:-6},
    c:"Slow, expensive, and nobody sleeps outside. The council goes into debt."}},

{t:"A spinner asks to speak to you.", qui:"Mary Kearsley, spinner in the Ancoats district",
 d:"“My boy is eleven and spends all day under the looms. If he leaves, we do not eat. If he stays, he will stay there for good. You choose, not me.”",
 ex:"In the mills, children are employed to crawl beneath running machines and reconnect broken threads: they are the only ones small enough to fit underneath without stopping production. Many lose fingers there, some lose more. One female worker waited until the end of her shift to come and speak about it. She goes back to work in an hour.",
 f:"Children are employed as “piecers”: small enough to crawl beneath running machines and reconnect broken threads without stopping production. Child labour is not an invention of the factory, children already worked from a young age on farms, but the factory transforms it: it becomes continuous, supervised, dangerous, and above all **essential to the family income**. A working-class family cannot live on a single wage.",
 a:{q:"“Let us ban child labour.”", e:{p:11,o:3,i:-11,m:-4}, suite:{dans:4, t:"An evening school has opened", x:"The children who left the mills have been supported by a parish subscription. Eighty pupils in the first winter. The families lost a wage and gained something else.", e:{p:10,o:7,i:-3}},
    c:"Children leave. Their families lose one income in three, and tell them so."},
 b:{q:"“Let the children stay under the machines.”", e:{i:8,o:-4,p:-10},
    c:"They stay under the machines. Some will not come out whole."}},

{t:"A foreman wants to time every movement.", qui:"Abel Crompton, who supervises the teams in the workshop", req:["Savoirs techniques"],
 d:"“Everyone in their place, every movement timed. They will not like it, I know. They will get used to it, as they have elsewhere.”",
 ex:"Until now, each worker has worked more or less at their own pace, as craftsmen did before the factory. The foreman has spent three weeks secretly timing movements, watch in hand. He proposes assigning each person to a fixed station and setting the time allowed for every operation: one third more production, without buying a single machine. The workshop has realised what he was doing.",
 f:"Before the factory, the craftsman set his own pace and mastered the whole trade. The **division of labour** breaks production into simple tasks, each assigned to a different worker: output rises sharply, but each worker can now perform only one fragment. Adam Smith described this as early as 1776 in a pin factory. Workshop discipline, fixed hours, assigned stations, fines, is experienced by workers as a loss of control over their trade.",
 a:{q:"“Let us organise work into fixed stations.”", e:{i:12,m:6,o:-12}, g:["Organisation"],
    c:"Output rises. The worker no longer controls the work: the work controls the worker."},
 b:{q:"“Let us reject the timing system.”", e:{i:-8,o:7},
    c:"The workshop keeps its old habits. Costs remain unchanged."},
 c:{q:"“Let us organise it, with one break in each half-day.”", e:{i:3,o:-5,m:1}, g:["Organisation"],
    c:"The new pace takes hold, broken by two rests. People last, a little longer."}},

{t:"Three dead in the same alley.", qui:"Doctor William Rait, who treats the poor in the district", apres:1830,
 d:"“Three in one night, and I have not yet warned the neighbouring houses. Decide today, not next week.”",
 ex:"Three people died last night in the same alley, with the same symptoms. The doctor fears cholera, a disease from Asia that can kill within hours. No one yet knows that it spreads through contaminated water, but people have noticed that it strikes districts without sewers most severely. Closing the district would stop two mills. Doing nothing means betting that he is wrong.",
 f:"Cholera reaches Great Britain in 1831. No one yet knows that it spreads through contaminated water: it is blamed on foul smells. Districts without sewers suffer the heaviest toll, which will eventually establish the link between **urban living conditions** and public health. The great epidemics of the nineteenth century are one of the forces driving state intervention in areas previously left to property owners.",
 a:{q:"“Seal off the district and clean it up.”", e:{o:12,p:12,i:-12,m:-10},
    c:"The district is sealed off, the mills stopped. The epidemic dies out faster than elsewhere."},
 b:{q:"“Close nothing: keep producing.”", e:{i:8,m:6,o:-15,p:-12},
    c:"The machines never stopped. The district buried its dead without you."}},

{t:"The last open plot in the centre.", qui:"Miss Agnes Thorne, who runs a charitable organisation",
 d:"“There are six-year-old children in this city who have never seen a tree. This is the last plot. After this, there will be nothing left to decide.”",
 ex:"The city grew without a plan: every open plot was built on as soon as it was sold, and only one remains in the centre. Two offers are on the table. A merchant wants to build warehouses there to store cotton. A subscription raised by middle-class ladies has collected enough to turn it into a public garden. After this plot, there will be nothing left to share.",
 f:"Manchester grew without a plan: every open plot was built on as soon as it was sold, to the highest bidder. The first public parks in England appeared precisely in the 1840s, under pressure from doctors and philanthropists who linked air, light and health. The question here is the one raised by all rapid **urbanisation**: who owns a city's space, and who decides how it is used?",
 a:{q:"“Let us create a public park.”", e:{o:10,p:8,m:-9,i:-6},
    c:"A park among the chimneys. People come on Sundays, in their best clothes."},
 b:{q:"“Sell the land for warehouses.”", e:{m:10,i:7,o:-8,p:-5},
    c:"The warehouses rise in six months. The last tree in the centre falls with them."},
 c:{q:"“Half park, half warehouses.”", e:{o:4,p:2,i:-1,m:-7},
    c:"A small park and four sheds. The owner must be compensated, as he had hoped to sell the whole plot."}},

{t:"The price of bread has doubled since spring.", qui:"Mary Kearsley, spinner in the Ancoats district",
 d:"“We are not asking for a fortune, we are asking for enough to eat while we work. Otherwise the machines will stop by themselves, and it will not be our doing.”",
 ex:"Bread accounts for nearly half of what a working-class family spends: when its price doubles, hunger follows immediately. Yesterday afternoon, women workers from several mills stopped work for two hours, without damage and without a leader, then chose one of their number to come and speak. The manufacturers swear they cannot survive a general wage rise.",
 f:"Bread accounts for nearly half of a working-class family's budget: when its price rises, hunger follows immediately. Industrial wages are paid in money, which makes workers entirely dependent on the market, unlike peasants who produced part of their own food. The work stoppages of the 1830s and 1840s almost always begin with the price of bread before turning into political demands.",
 a:{q:"“Grant the wage rise.”", e:{o:13,i:-9,m:-6,p:3},
    c:"Wages rise. The manufacturers swear they will not last the year."},
 b:{q:"“Refuse the rise.”", e:{i:8,m:4,o:-13,p:-4}, suite:{dans:2, t:"The looms have stopped", x:"It is not a riot: they have simply stopped coming. Three mills have been idle since Monday, and there is no one to speak to because you refused to receive them.", e:{i:-8,m:-5,o:-2}},
    c:"The rise is refused, and hunger is expected to drive everyone back to their loom."}},

{t:"A petition against the grain duties.", qui:"Josiah Halliwell, owner of a cotton mill", apres:1830,
 d:"“It is the landowners who live off us, not us off our workers. Sign with us.”",
 ex:"A tax protects British wheat by making imported grain more expensive: it enriches large landowners and keeps bread prices high. The city's manufacturers are circulating a petition to abolish it, because expensive bread forces them to pay higher wages. Yet the same manufacturers refuse to raise those wages. London is watching closely to see who signs.",
 f:"The *Corn Laws* tax imported grain to protect large landowners, and therefore keep bread expensive. Industrialists see them as the reason workers demand higher wages: the Anti-Corn Law League is founded in Manchester in 1838 and secures their repeal in 1846. It is one of the first major conflicts between **old landed wealth and new industrial wealth**, two worlds that do not want the same politics.",
 a:{q:"“Sign the petition against the Corn Laws.”", e:{i:10,m:9,o:5,p:-11},
    c:"Manchester becomes the heart of the League. London notices, and does not approve."},
 b:{q:"“Take no side.”", e:{i:-5,m:-4,p:4},
    c:"No one is offended, and nothing is achieved."},
 c:{q:"“Support them, but secretly.”", e:{i:1,m:1,p:-5},
    c:"The League is funded discreetly. Everyone knows, no one says it."}},

{t:"The whole world passes through the Crystal Palace.", qui:"The town council secretary", apres:1840,
 d:"“We can prepare what they will see, or let them go wherever they want. Either way, they will write about us.”",
 ex:"London is organising a Great Exhibition under an immense hall of glass and iron: products from all over the world will be displayed there, and six million visitors are expected. The city has been asked to send its cotton goods. Journalists have already announced that they intend to visit the mills where they are made, and the districts around them.",
 f:"The Great Exhibition of 1851 brings together products from all over the world under a vast hall of glass and iron in London, and attracts six million visitors in five months. Great Britain presents its industrial supremacy to the world: it is then “the workshop of the world”. That same year, the census establishes that, for the first time, the country has **more urban than rural inhabitants**, the outcome of the rural exodus that began a century earlier.",
 a:{q:"“Repaint the façades before the visit.”", e:{m:8,i:6,p:5,o:-7},
    c:"Visitors see a prosperous, orderly city. Ancoats is ten minutes away, and no one goes there."},
 b:{q:"“Hide nothing from the visitors.”", e:{o:11,p:-8,i:-7,m:-5},
    c:"The cellars are shown alongside the chimneys. The London newspapers seize on the story."},
 c:{q:"“Exhibit the yarn, without a mill visit.”", e:{m:2,i:1,p:-1,o:-3},
    c:"Manchester yarn triumphs at the exhibition. The mills remain closed to curious visitors."}},

{t:"A mill burned down last night.", qui:"Abel Crompton, who supervises the teams in the workshop",
 d:"“The walls are still standing, the rest is on the ground. Forty families are waiting outside, and the owner is waiting for your answer.”",
 ex:"The fire started in the machines that card the cotton, where dust and oil accumulate. This is where almost all mill fires begin. The hand pumps, pulled by horses, took forty minutes to arrive: three floors collapsed. This morning, the forty families who worked there turned up at a locked gate, and now have no wages. The owner refuses to rebuild unless the city helps him.",
 f:"Mills often burn: cotton dust, machine oil and open-flame lamps make a deadly combination, in buildings with narrow staircases and no emergency exit. There are still no safety regulations. The fire also reveals a new vulnerability: hundreds of families depend on a single building and a single owner. This is the downside of the **concentration of production** in factories.",
 a:{q:"“Help the owner rebuild.”", e:{i:10,o:7,m:-9,p:-4},
    c:"The walls go back up in four months. No one discussed emergency exits."},
 b:{q:"“Do not help: let him pay on his own.”", e:{i:-9,o:-7,p:5,m:3},
    c:"He will not rebuild. Forty families look elsewhere."},
 c:{q:"“Lend him the money, to be repaid.”", e:{i:3,o:2,m:-7},
    c:"The loan is signed before a notary. One day, he will have to repay it."}},

{t:"A preacher describes what he sees.", qui:"Reverend Ellis Hargreaves, minister in the district",
 d:"“From my pulpit, I say what I see: cellars, fevers, children under the machines. People listen, and repeat my words in the street.”",
 ex:"In industrial cities, ministers from Churches that are independent of the state are often the first to describe workers' lives publicly. This one now draws larger crowds than the Sunday service, and his sermons circulate in print as far as London. He accuses no one by name, which makes him difficult to attack.",
 f:"In industrial cities, Churches that are independent of the state, Methodists and Baptists, are deeply rooted among workers, and their ministers are among the first to describe living conditions publicly. Together with doctors and journalists, they create what will become known as the **social investigation**: describing conditions in order to prompt action. These accounts will help bring about the first public health laws.",

    c:"The sermon is suppressed. The words keep circulating."},
 c:{q:"“Appoint him to the public health board.”", e:{p:5,o:3,i:-5,m:-4},
    c:"The reverend now has a seat, a register, and an obligation to be more measured."}},
];

/* ==================================================================
   ÉTAT
   ================================================================== */
let E=null;
const app=document.getElementById("app");
const clamp=(x)=>Math.max(0,Math.min(100,x));
const fmt=n=>Math.round(n).toLocaleString("fr-FR").replace(/ | /g," ");
/* Les notions du cours sont marquees **ainsi** dans les textes ; on les
   met en gras apres echappement, pour ne jamais injecter de HTML brut. */
const gras = t => t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

const esc =s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const AN=t=>Math.round(N.a0+(N.a1-N.a0)*t/(N.tours-1));

function nouvellePartie(mode,niv){
  remonter(true);
  if(niv) N=NIVEAUX[niv];
  document.body.classList.remove("surmenu");
  document.body.dataset.niveau=N.id; peindreVille(); chercherVue();
  try{ SON.ambiance(N.id) }catch(e){}
  if(E&&E.timer){ clearInterval(E.timer); }
  stopperMachines();
  E={mode,tour:0,lus:[],f:{i:60,o:60,m:60,p:60},pop:N.pop0,acquis:[],vues:[],carnet:[],carnetOuvert:true,crLus:0,courbe:[{t:0,pop:N.pop0}],releve:[{t:0,an:N.a0,i:60,o:60,m:60,p:60}],secousse:[],aveugle:0,avertiAveugle:false,evVus:[],derEv:-9,graines:[],consq:null,fini:null,timer:null};
  piocher(); rendre();
}
const ok=c=>!c.req||c.req.every(r=>E.acquis.includes(r));
function piocher(){
  const an=E.mode==="campagne"?AN(E.tour):9999;
  let lot=N.cartes.filter(c=>!E.vues.includes(c.t)&&ok(c)&&(!c.apres||c.apres<=an));
  if(!lot.length){ E.vues=[]; lot=N.cartes.filter(c=>ok(c)&&(!c.apres||c.apres<=an)); }
  if(!lot.length) lot=N.cartes.filter(c=>!c.req);
  E.carte=lot[Math.floor(Math.random()*lot.length)];
}

function choisir(quel){
  const c=E.carte, r=c[quel];
  appliquer(r.e);
  (r.g||[]).forEach(g=>{ if(!E.acquis.includes(g)) E.acquis.push(g); });
  /* ce que cette décision fera germer plus tard */
  if(r.suite) E.graines.push({tour:E.tour+r.suite.dans, s:r.suite, de:c.t, choix:r.q, semee:E.tour});
  E.vues.push(c.t);
  /* A-t-on ouvert le dossier d'enquête avant de trancher ? */
  if(c.f && !(E.lus||[]).includes(c.t)) E.aveugle = (E.aveugle||0) + 1;
  E.carnet.push({t:c.t, q:r.q, e:r.e, an:(E.mode==="campagne"?AN(E.tour):null),
                 lu:!c.f || (E.lus||[]).includes(c.t)});
  E.consq=r.c;
  E.tour++;

  /* La croissance de la ville est elle-même une pression : plus les
     industriels sont contents, plus la population enfle, et plus
     l'entassement use les ouvriers. C'est le mécanisme d'Ancoats. */
  const taux=1+.03+E.f.i/500+(r.pop||0);
  const avant=E.pop; E.pop=Math.round(E.pop*taux);
  (E.courbe||(E.courbe=[])).push({t:E.tour, pop:E.pop});
  /* L'état des quatre forces après cette décision. C'est ce relevé qui
     permettra, à la fin, de montrer qui a payé quoi et quand. */
  (E.releve||(E.releve=[])).push({t:E.tour, an:(E.mode==="campagne"?AN(E.tour):null),
    i:Math.round(E.f.i), o:Math.round(E.f.o), m:Math.round(E.f.m), p:Math.round(E.f.p)});
  /* L'entassement s'aggrave avec la TAILLE de la ville, pas seulement
     avec son rythme : loger 400 000 personnes est plus dur que d'en
     loger 40 000. Sans cela, il suffisait de ne jamais industrialiser
     pour survivre indéfiniment — une ville éternelle et minuscule. */
  const usure=(taux-1)*13*(1+E.pop/400000);
  E.f.o=clamp(E.f.o-usure);
  /* Et les marchands ne patientent pas devant une ville qui stagne. */
  let impatience="";
  if(E.f.i<40){ E.f.m=clamp(E.f.m-1.6); impatience=" "+N.impatience; }
  E.entassement=N.croissance(avant,E.pop,usure)+impatience;

  const mort=CLES.find(k=>E.f[k]<=0);
  if(mort) return finir(mort);
  if(E.mode==="campagne"&&E.tour>=N.tours) return finir("verdict");
  const ev=evenementDu();
  if(ev) return declencher(ev);
  const gr=graineMure();
  if(gr) return germer(gr);
  const av=avertissementLecture();
  if(av) return germer(av);
  piocher(); rendre();
}

function finir(cause){
  try{ SON.fin(cause); SON.ambiance("fin"); }catch(e){}
  E.fini=cause;
  if(E.mode==="infini"){
    /* On se mesure à la POPULATION atteinte, jamais au nombre de tours :
       sinon la meilleure tactique serait de ne rien industrialiser. */
    const rec=record();
    if(E.pop>rec) try{localStorage.setItem("pdp_pop_"+N.id,E.pop)}catch(e){}
  }
  rendreFin();
}

/* ==================================================================
   RENDU
   ================================================================== */
const icone=(k,cls)=>`<svg class="${cls||""}"><use href="#${N.forces[k].ic}"/></svg>`;
function fleches(v){
  const n=Math.abs(v)<=6?1:Math.abs(v)<=12?2:3;
  return (v>0?"▲":"▼").repeat(n);
}
function impacts(e){
  return CLES.filter(k=>e[k]).map(k=>{
    const cls=e[k]>0?"up":"dn";
    return `<span class="imp ${cls}" title="${N.forces[k].nom} ${e[k]>0?"+":""}${e[k]}">
      ${icone(k)}<span class="lb">${N.forces[k].nom}</span><span class="fl">${fleches(e[k])}</span></span>`;
  }).join("");
}
function barresForces(){
  oublierSecousse();
  return `<div class="forces">${CLES.map(k=>{
    const v=E.f[k];
    const col = v>55?"var(--vert)" : v>35?"var(--accent)" : v>20?"#D08A2A" : "var(--rge)";
    /* trois paliers, pour qu'on voie venir la rupture */
    const etat = v<=10 ? "critique" : v<=20 ? "danger" : v<=35 ? "fragile" : "";
    const mot  = v<=10 ? "au bord de la rupture" : v<=20 ? "ne tiendra pas longtemps"
               : v<=35 ? "fragile" : "";
    const coup = (E.secousse||[]).indexOf(k)>=0 ? " secouee" : "";
    const dc = dernierChoix(), dv = dc && dc.e ? (dc.e[k]||0) : 0;
    const bul = bulleForce(k);
    return `<div class="force ${etat}${coup}${bul?" causant":""}"
      title="${N.forces[k].nom} — ${N.forces[k].veut}"
      ${bul?`onclick="bulle(this,'${k}')"`:""}>
      <span class="sceau"><img src="img/acteurs/${N.id}-${k}-embleme.jpg" alt=""
        loading="lazy" onerror="this.remove()">${icone(k)}</span>
      <div class="nom">${N.forces[k].nom} <b>${Math.round(v)}</b></div>
      <div class="mini"><i style="width:${v}%;background:${col}"></i></div>
      ${(()=>{ const h=humeur(dv); return h
        ? `<div class="delta ${h.sens}"><span class="fl">${h.fl}</span>${h.mot}</div>` : ""; })()}
      ${mot?`<div class="etat">${mot}</div>`:""}
      ${bul}</div>`;
  }).join("")}</div>`;
}

/* La secousse ne vaut que pour le rendu qui suit le coup. On l'efface
   une fois l'animation passée, et une seule fois même si le tableau est
   peint à deux endroits. */
let SEC_T = null;
function oublierSecousse(){
  if(!E || !E.secousse || !E.secousse.length || SEC_T) return;
  SEC_T = setTimeout(()=>{ SEC_T=null; if(E) E.secousse=[]; }, 1500);
}

/* Le bandeau d'alerte : il nomme le risque et dit ce qu'il en coûte. */
function alerte(){
  if(!E || !E.f) return "";
  const bas = CLES.filter(k=>E.f[k]<=14).sort((a,b)=>E.f[a]-E.f[b]);
  if(!bas.length) return "";
  const noms = bas.map(k=>N.forces[k].nom.toLowerCase());
  const liste = noms.map(n=>"les "+n).join(" et ");
  return `<div class="alarme">
    <strong>Attention.</strong> Vous allez perdre ${liste}.
    Si ${noms.length>1?"l’une de ces forces tombe":"cette force tombe"} à zéro, la partie s’arrête
    immédiatement — ${esc(N.forces[bas[0]].veut)}.</div>`;
}

/* ==================================================================
   LE DÉCOR — la fenêtre du bureau
   La ville derrière la vitre n'est pas un ornement : elle est la jauge
   que le joueur ne peut pas lire en chiffres. Elle grandit avec la
   population, elle s'assombrit avec l'usure ouvrière — sans que
   personne ne l'ait voté. C'est la leçon du jeu, rendue visible.
   ================================================================== */
const SC = {
  el:null, loin:null, pres:null, fum:null, vitre:null, peinte:false,
  /* positions fixes : la ville ne doit pas danser d'un tour à l'autre */
  h(i){ return ((i*2654435761)%4294967296)/4294967296 }
};

function peindreVille(){
  SC.el    = document.getElementById("scene");
  if(!SC.el) return;
  SC.loin  = document.getElementById("loin");
  SC.pres  = document.getElementById("pres");
  SC.fum   = SC.el.querySelector(".fumees");
  SC.vitre = SC.el.querySelector(".vitre");
  if(SC.peinte) return;

  let a="",b="",f="";
  /* rangée lointaine : toits et clochers, ce que la ville était déjà */
  for(let i=0;i<34;i++){
    const x=SC.h(i)*1180, w=14+SC.h(i+90)*30, h=16+SC.h(i+40)*34;
    a+=`<rect x="${x.toFixed(0)}" y="${(238-h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}"/>`;
  }
  /* rangée proche : les cheminées, une par index, révélées peu à peu */
  for(let i=0;i<30;i++){
    const x=18+SC.h(i+7)*1150, w=7+SC.h(i+61)*5, h=52+SC.h(i+23)*86;
    b+=`<rect class="che" data-i="${i}" x="${x.toFixed(0)}" y="${(292-h).toFixed(0)}"
         width="${w.toFixed(0)}" height="${h.toFixed(0)}" opacity="0"/>`;
    if(i<9) f+=`<span style="left:${(SC.h(i+7)*88).toFixed(1)}%;animation-delay:${(i*1.6).toFixed(1)}s"></span>`;
  }
  SC.loin.innerHTML=a; SC.pres.innerHTML=b; SC.fum.innerHTML=f;

   peint ; si non, rien ne se voit — le jeu reste beau sans elle. */

  const src="img/vue-"+N.id+".jpg", im=new Image();
  im.onload=()=>{ SC.el.querySelector(".vue").style.backgroundImage=`url("${src}")`;
                  SC.el.classList.add("aimg"); };
  im.src=src;

function majVue(){
  if(!SC.el||!E) return;
  /* combien la ville a-t-elle enflé depuis le premier tour */
  const croiss = Math.min(1, Math.log(E.pop/N.pop0+1)/Math.log(9));
  /* la suie : l'usure ouvrière d'abord, la taille de la ville ensuite */
  const suie = .16 + .34*(1-E.f.o/100) + .18*croiss;
  SC.el.style.setProperty("--suie", suie.toFixed(3));
  /* les fumées suivent l'activité des fabriques */
  SC.fum.style.opacity = (.16 + .6*(E.f.i/100)).toFixed(3);
  /* les cheminées sortent de terre à mesure que la ville grandit */
  const n = Math.round(4 + croiss*26);
  SC.pres.querySelectorAll(".che").forEach(r=>{
    r.setAttribute("opacity", (+r.dataset.i < n) ? "0.92" : "0");
  });
}

document.addEventListener("click",e=>{

/* On compte les rapports d'enquête réellement ouverts : le rapport final
   dira au professeur qui a enquêté et qui a tranché à l'aveugle. */
document.addEventListener("toggle",e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains("acteur")&&t.open){
    document.body.dataset.acteursLus =
      String(document.querySelectorAll("details.acteur[open]").length);
  }
  if(t.classList&&t.classList.contains("carnet")&&E) E.carnetOuvert = t.open;
  /* un dossier qu'on déplie froisse, un pli qu'on décachette craque */
  if(t.open && t.classList){
    try{
      if(t.classList.contains("courrier")) SON.enveloppe();
      else if(t.classList.contains("d-enquete")) SON.tiroir();
      else if(t.classList.contains("carnet") || t.classList.contains("acteur")) SON.papier();
    }catch(e){}
  }
  if(t.classList&&t.classList.contains("courrier")&&t.open&&E){
    E.crLus = E.evVus.length;              /* tout est lu : le cachet tombe */
    t.classList.remove("neuf");
    const c=t.querySelector(".cachet"); if(c) c.remove();
    const p=t.querySelector(".pli"); if(p) p.classList.remove("aLire");
  }
  if(t.classList&&t.classList.contains("d-enquete")&&t.open&&E){
    if(!E.lus) E.lus=[];
    const k=(E.carte&&E.carte.t)||"";
    if(k&&!E.lus.includes(k)) E.lus.push(k);
  }
},true);


/* ==================================================================
   LES ÉVÉNEMENTS — ils tombent, on ne les choisit pas
   ================================================================== */
const SECONDES_URGENCE = 20;

function evenementDu(){
  const reste = N.ev.filter(v=>!E.evVus.includes(v.t));
  if(!reste.length) return null;
  /* Jamais deux coups du sort coup sur coup : il faut pouvoir respirer,
     et redresser les jauges, entre deux. */
  if(E.tour - E.derEv < 3) return null;
  if(E.mode==="campagne"){
    /* À sa date réelle : Peterloo en 1819, le krach en 1929. */
    const an = AN(E.tour);
    return reste.find(v=>v.an<=an) || null;
  }
  /* En survie il n'y a plus de calendrier, donc le hasard. */
  return Math.random()<.22 ? reste[Math.floor(Math.random()*reste.length)] : null;
}

function declencher(ev){
  try{ SON.coup() }catch(e){}
  E.evVus.push(ev.t);
  E.derEv = E.tour;
  E.evEnCours = ev;
  appliquer(ev.e);
  if(ev.pop) E.pop = Math.round(E.pop*(1+ev.pop));
  rendreEvenement(ev);
}

function rendreEvenement(ev){
  remonter();
  app.innerHTML=`
  ${barresForces()}
  <div class="ev">
    <div class="evd">${esc(ev.date)}</div>
    <div class="evt">${esc(ev.t)}</div>
    <p class="evx">${gras(esc(ev.x))}</p>
    <div class="evs"><strong>Historical fact.</strong> ${gras(esc(ev.src))}</div>
    <div class="evi">${impacts(ev.e)}</div>
  </div>
  <p class="centre" style="margin:20px 0 0">
    ${ev.urgence ? `<button class="plein urg" onclick="rendreUrgence()">You must decide now</button>`
                 : `<button class="plein" onclick="suiteEvenement()">Continue</button>`}
  </p>`;
}

function rendreUrgence(){
  remonter();
  const ev=E.evEnCours;
  if(!ev || !ev.urgence) return suiteEvenement();
  const u=ev.urgence;
  app.innerHTML=`
  ${barresForces()}
  <div class="chrono"><div class="jauge" id="jt"></div></div>
  <p class="compte">You have <b id="cpt">${SECONDES_URGENCE}</b> seconds</p>
  <div class="situ urgent">
    <div class="ct">Décision urgente — ${esc(ev.date)}</div>
    <div class="t">${esc(ev.t)}</div>
    <div class="d">${esc(u.q)}</div>
  </div>
  <div class="rep ${u.choix.length===2?"deux":""}">
    ${u.choix.map((c,i)=>`<button class="choix" onclick="urgenceChoix(${i})">
      <span class="q">${esc(c.q)}</span><span class="impacts">${impacts(c.e)}</span></button>`).join("")}
  </div>`;
  const jt=document.getElementById("jt");
  if(jt){ jt.style.transition=`width ${SECONDES_URGENCE}s linear`; requestAnimationFrame(()=>{ jt.style.width="0%" }); }
  if(window.SANS_CHRONO) return;
  try{ SON.horlogeUrgence(true) }catch(e){}
  E.reste=SECONDES_URGENCE;
  E.timer=setInterval(()=>{
    E.reste--;
    const c=document.getElementById("cpt");
    if(c) c.textContent=Math.max(0,E.reste);
    if(E.reste<=0) urgenceChoix(-1);
  },1000);
}

function urgenceChoix(i){
  try{ SON.horlogeUrgence(false) }catch(e){}
  if(E.timer){ clearInterval(E.timer); E.timer=null; }
  if(!E.evEnCours || !E.evEnCours.urgence) return suiteEvenement();
  const u=E.evEnCours.urgence;
  const r = i<0 ? u.defaut : u.choix[i];
  appliquer(r.e);
  E.consq = r.c;
  E.entassement = i<0 ? "Le temps a décidé à votre place." : "";
  suiteEvenement();
}

function suiteEvenement(){
  const mort=CLES.find(k=>E.f[k]<=0);
  if(mort) return finir(mort);
  if(E.mode==="campagne" && E.tour>=N.tours) return finir("verdict");
  piocher(); rendre();
}

/* ==================================================================
   LE COURRIER ET LA MACHINE À ÉCRIRE
   ================================================================== */

/* Un pli est-il sur le point d'arriver ? On rejoue la condition de
   evenementDu() pour le tour suivant. En survie il n'y a pas de
   calendrier, donc rien à annoncer : l'enveloppe reste muette. */
function courrierProche(){
  if(!E || E.mode!=="campagne") return false;
  const reste = N.ev.filter(v=>!E.evVus.includes(v.t));
  if(!reste.length) return false;
  if((E.tour+1) - E.derEv < 3) return false;
  const an = AN(Math.min(E.tour+1, N.tours-1));
  return reste.some(v=>v.an <= an);
}

/* Les nouvelles du dehors tombent en plein écran et disparaissent. Le
   courrier les garde : on peut les relire, et les questions de fin
   portent sur elles. */
function courrier(attr){
  const proche = courrierProche();
  const recus = E.evVus.map(t=>N.ev.find(v=>v.t===t)).filter(Boolean).reverse();
  const der = recus[0] || null;

  const resume = proche
    ? `<span class="cd">Just now</span>
       <span class="cq">A letter has just arrived. It is still sealed.</span>`
    : der
      ? `<span class="cd">${esc(der.date)}</span><span class="cq">${esc(der.t)}</span>`
      : `<span class="cq vide">No post this morning.</span>`;

  const neufs = Math.max(0, recus.length - (E.crLus||0));
  const classe = `courrier dossier ${proche?"attente":""} ${neufs?"neuf":""} ${der&&!proche?"ouvert":""}`;
  const cachet = neufs ? `<span class="cachet" aria-label="${neufs} pli${neufs>1?"s":""} à lire">${neufs}</span>` : "";

  /* Sans pli en attente et sans pli reçu, il n'y a rien à ouvrir : le
     dossier reste un simple carton, et il ne remue pas. */
  if(!recus.length && !proche)
    return `<div class="${classe}" ${attr}>
      <span class="onglet">Post</span>${cachet}
      <div class="env"></div>${resume}</div>`;

  /* Ce qu'un messager peut dire sans briser le cachet. */
  const scelle = proche ? `<article class="cr-pli cr-scelle">
      <div class="cd">Seal intact</div>
      <div class="crt">A messenger is waiting in the antechamber</div>
      <p class="crx">The letter is not opened here: it will be read before the council, at your
      <strong>next decision</strong>. Ce qu’on sait déjà, c’est qu’une nouvelle du
      dehors va tomber — et qu’elle ne vous demandera pas votre avis.
      Gardez-vous une marge sur vos quatre forces.</p>
    </article>` : "";

  return `<details class="${classe}" ${attr}>
    <summary>
      <span class="onglet">Post</span>${cachet}
      <span class="env"></span>
      <span class="cr-bas">
        <span class="cr-tete">${resume}</span>
        <span class="pli ${proche?"scelle":""}" data-n="${recus.length}"></span>
      </span>
    </summary>
    <div class="cr-plis">${scelle}${recus.map(v=>`<article class="cr-pli">
      <div class="cd">${esc(v.date)}</div>
      <div class="crt">${esc(v.t)}</div>
      <p class="crx">${gras(esc(v.x))}</p>
      <div class="crs"><strong>Historical fact.</strong> ${gras(esc(v.src))}</div>
    </article>`).join("")}</div>
  </details>`;
}

/* Le titre s'inscrit, puis la réplique. On garde le texte de côté pour
   pouvoir le poser d'un coup si le joueur clique. */
function ecrire(titre, expose, replique){
  stopperMachines();
  E.ecrit = {t:titre, ex:expose||"", d:replique};
  const t=app.querySelector(".situ .t"),
        x=app.querySelector(".situ .ex"),
        r=app.querySelector(".situ .d");
  if(!t||!r) return;
  if(window.SANS_CHRONO || app.classList.contains("presse")){
    t.textContent=titre; if(x) x.textContent=E.ecrit.ex; r.textContent=replique; return;
  }
  t.textContent=""; if(x) x.textContent=""; r.textContent="";
  /* Toute l'affaire s'écrit : le titre, puis l'exposé, puis la réplique.
     L'exposé défile vite — il fait près de quatre cents caractères — et
     un clic n'importe où pose l'ensemble d'un coup. */
  try{ SON.frappe(true) }catch(e){}
  const fini = ()=>{ try{ SON.frappe(false) }catch(e){} };
  E.machines=[ taper(t, titre, 15, ()=>{
    try{ SON.chariot() }catch(e){}          /* le titre est posé */
    if(!x || !E.ecrit.ex){ E.machines.push(taper(r, replique, 7, fini)); return; }
    E.machines.push(taper(x, E.ecrit.ex, 4, ()=>{
      E.machines.push(taper(r, replique, 7, fini));
    }));
  }) ];
}

function taper(el, txt, ms, fin){
  let i=0;
  const id=setInterval(()=>{
    el.textContent = txt.slice(0, ++i);
    if(i>=txt.length){ clearInterval(id); if(fin) fin(); }
  }, ms);
  return id;
}

function stopperMachines(){
  if(E && E.machines) E.machines.forEach(clearInterval);
  if(E) E.machines=[];
  try{ SON.frappe(false) }catch(e){}
}

/* Un clic n'importe où pose le texte en entier. */
function finirEcriture(){
  stopperMachines();
  if(!E || !E.ecrit) return;
  const t=app.querySelector(".situ .t"),
        x=app.querySelector(".situ .ex"),
        r=app.querySelector(".situ .d");
  if(t) t.textContent=E.ecrit.t;
  if(x) x.textContent=E.ecrit.ex||"";
  if(r) r.textContent=E.ecrit.d;
}

/* ==================================================================
   LES CONSÉQUENCES DIFFÉRÉES
   Ce que vous avez décidé revient vous chercher.
   ================================================================== */
function graineMure(){
  if(!E || !E.graines || !E.graines.length) return null;
  const i = E.graines.findIndex(g=>g.tour<=E.tour);
  return i<0 ? null : E.graines.splice(i,1)[0];
}

function germer(gr){
  /* heureuse ou non : la somme de ce qu'elle apporte aux quatre forces */
  try{ const e=(gr.s&&gr.s.e)||{};
       SON.germe(CLES.reduce((n,k)=>n+(e[k]||0),0) >= 0); }catch(e){}
  E.evEnCours = null;
  E.graineEnCours = gr;
  appliquer(gr.s.e);
  try{ SON.coup() }catch(e){}
  rendreGraine(gr);
}

function rendreGraine(gr){
  remonter();
  /* le sens se lit dans le bilan des effets : on ne l'écrit pas deux fois */
  const bilan = CLES.reduce((s,k)=>s+(gr.s.e[k]||0), 0);
  const bon = bilan >= 0;
  const ecart = (gr.semee!=null) ? (E.tour-gr.semee) : gr.s.dans;
  app.innerHTML=`
  <div class="tableau">
    <span class="plaque">Balance of forces</span>
    ${barresForces()}
  </div>
  <div class="bureau"><div class="plateau un">
    <div class="ev graine ${bon?"bonne":"mauvaise"}">
      <div class="evd">${bon?"Grâce à":"À cause de"} votre choix d’il y a ${ecart} tour${ecart>1?"s":""}</div>
      <div class="origine">
        You had answered <em>${esc(gr.choix||"—")}</em>
        à l’affaire « ${esc(gr.de).replace(/\s*\.$/,"")} ».
        <span>So this is not the result of your last decision.</span>
      </div>
      <div class="evt">${esc(gr.s.t)}</div>
      <p class="evx">${gras(esc(gr.s.x))}</p>
      <div class="evi">${impacts(gr.s.e)}</div>
    </div>
    ${gr.s.q ? `
    <div class="question">${esc(gr.s.q.texte)}</div>
    <div class="rep ${gr.s.q.choix.length===2?"deux":""}">
      ${gr.s.q.choix.map((c,i)=>`<button class="choix" onclick="graineChoix(${i})">
        <span class="q">${esc(c.q)}</span><span class="impacts">${impacts(c.e)}</span></button>`).join("")}
    </div>`
    : `<p class="centre" style="margin:22px 0 0">
      <button class="plein" onclick="suiteGraine()">Continue</button>
    </p>`}
  </div></div>`;
  try{ SON.majTension() }catch(e){}
  majVue();
}

/* Une conséquence peut appeler une décision de plus. */
function graineChoix(i){
  const gr=E.graineEnCours;
  if(!gr || !gr.s.q) return suiteGraine();
  const r=gr.s.q.choix[i];
  appliquer(r.e);
  E.consq=r.c; E.entassement="";
  suiteGraine();
}

function suiteGraine(){
  E.graineEnCours = null;
  const mort=CLES.find(k=>E.f[k]<=0);
  if(mort) return finir(mort);
  if(E.mode==="campagne" && E.tour>=N.tours) return finir("verdict");
  piocher(); rendre();
}

/* ==================================================================
   LES IMAGES — toutes facultatives
   Une image absente se retire d'elle-même : rien ne reste en suspens,
   aucune icône cassée, la mise en page se referme.
   ================================================================== */

/* Un nom de fichier stable, tiré du texte : « L’eau croupit devant les
   portes. » devient « l-eau-croupit-devant-les-portes ». */
function slug(t){
  return (t||"")
    .normalize("NFD").replace(/[̀-ͯ]/g,"")   // accents
    .replace(/[’'`]/g,"-")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"")
    .slice(0,60);
}

/* Le gabarit commun. onerror retire le bloc entier, légende comprise. */
function illu(src, legende, classe){
  return `<figure class="illu ${classe||""}">
    <img src="${src}" alt="" loading="lazy"
         onerror="this.closest('figure').remove()">
    ${legende?`<figcaption>${esc(legende)}</figcaption>`:""}
  </figure>`;
}

/* Le portrait d'un acteur : propre au niveau, car les quatre forces ne
   sont pas les mêmes à Manchester et à Detroit. */
function illuActeur(k){
  return illu("img/acteurs/"+N.id+"-"+k+".jpg", "", "portrait");
}

/* Celui qui plaide sur la carte du jour. On ne garde que le nom, pas la
   fonction : « Mary Kearsley, ouvrière fileuse… » donne mary-kearsley.jpg. */
function illuPersonne(qui){
  const nom = String(qui||"").split(",")[0]
    .replace(/^(le |la |l’|miss |sir |monsieur |madame |le docteur |le révérend )/i,"");
  return illu("img/gens/"+slug(nom)+".jpg", "", "vignette");
}

/* La pièce jointe au rapport d'enquête : gravure, photographie, article.
   C'est elle qui doit donner envie d'ouvrir le dossier. */
function illuDoc(c){
  return illu("img/docs/"+slug(c.t)+".jpg", c.doc||"", "piece");
}

/* Appliquer un effet — et retenir qui vient d'encaisser. Les forces qui
   reculent tressailleront au prochain rendu : la conséquence se voit
   avant de se lire. */
function appliquer(e){
  if(!e || !E) return;
  const frappees=[];
  let bascule=false;
  if(!E.alerte) E.alerte={};
  CLES.forEach(k=>{
    if(!e[k]) return;
    const avant = E.f[k];
    E.f[k] = clamp(E.f[k] + e[k]);
    if(e[k] < 0) frappees.push(k);
    /* La force vient de passer sous le seuil d'alarme : on le signale
       une fois, et on réarme dès qu'elle repasse au-dessus. */
    if(avant > 14 && E.f[k] <= 14 && !E.alerte[k]){ E.alerte[k]=true; bascule=true; }
    if(E.f[k] > 18) E.alerte[k]=false;
  });
  if(bascule) try{ SON.alerte() }catch(x){}
  E.secousse = frappees;
  if(frappees.length){ clearTimeout(SEC_T); SEC_T=null; }
}

/* ==================================================================
   LE RAPPORT D'ENQUÊTE, VERSION LISIBLE

   Il arrivait d'un bloc, gris sur gris, et personne ne l'ouvrait deux
   fois. Trois gestes, aucun sur le fond : on respire au milieu, on
   fait ressortir les dates et les chiffres, et les notions du cours —
   déjà en gras dans le texte — sont soulignées au crayon.
   ================================================================== */

/* Un pavé de huit lignes décourage : au-delà de trois phrases, on
   respire au milieu. Si le découpage ne retrouve pas le texte entier,
   on n'y touche pas — mieux vaut un pavé qu'une phrase perdue. */
function aerer(h){
  const ph = h.match(/[^.!?…]+[.!?…]+[»”"’']*\s*/g);
  if(!ph || ph.join("") !== h) return h;
  /* trois phrases courtes tiennent en un bloc ; trois longues, non */
  if(ph.length < 3 || (ph.length < 4 && h.length < 340)) return h;
  const c = Math.ceil(ph.length/2);
  const tete = ph.slice(0,c).join("");
  /* jamais au milieu d'une notion mise en gras */
  if((tete.match(/<strong>/g)||[]).length !== (tete.match(/<\/strong>/g)||[]).length) return h;
  return tete + '<span class="alinea"></span>' + ph.slice(c).join("");
}

/* Les dates et les chiffres portent l'essentiel d'un rapport : « 25 000
   habitants en 1772 », « douze heures ». On les détache, sans jamais
   toucher à ce qui est déjà balisé. */
function faits(h){
  return h.replace(/(<[^>]*>)|(&[a-zA-Z#0-9]+;)|([^<&]+)/g, (m,tag,ent,txt)=>{
    if(txt === undefined) return m;
    return txt.replace(/\d+(?:[   .,]\d+)*(?:\s?%)?/g,
                       x => '<em class="fait">'+x+'</em>');
  });
}

/* Le texte du rapport, prêt à lire : lettrine comprise. */
function corpsRapport(c){
  let h = faits(aerer(gras(esc(c.f))));
  h = h.replace(/^([A-ZÀ-ÖØ-Þ])/, '<span class="init">$1</span>');
  return h;
}

/* ==================================================================
   LA FRAPPE AVEC BALISES

   « taper » n'écrit que du texte nu. Le panneau de mission porte des
   notions en gras : coupé au milieu d'un « <strong> », le navigateur
   referme n'importe comment et la mise en forme saute. On découpe donc
   la chaîne en balises d'un côté, caractères de l'autre, et on referme
   à chaque image ce qui est resté ouvert.
   ================================================================== */

function decouperHTML(html){
  const jetons=[]; let i=0;
  while(i < html.length){
    if(html[i] === "<"){
      const j = html.indexOf(">", i);
      if(j < 0){ jetons.push({b:html.slice(i)}); break; }
      jetons.push({b:html.slice(i, j+1)}); i = j+1;
    } else if(html[i] === "&"){
      const j = html.indexOf(";", i);
      if(j > i && j-i <= 8){ jetons.push({c:html.slice(i, j+1)}); i = j+1; }
      else { jetons.push({c:"&"}); i++; }
    } else { jetons.push({c:html[i]}); i++; }
  }
  return jetons;
}

const SOLITAIRES = /^(br|img|hr|input|wbr|source)$/i;

function prefixeHTML(jetons, n){
  let out="", vus=0; const pile=[];
  for(const j of jetons){
    if(j.b !== undefined){
      const m = j.b.match(/^<\/?([a-zA-Z0-9]+)/);
      out += j.b;
      if(m){
        if(j.b[1] === "/") pile.pop();
        else if(!/\/>\s*$/.test(j.b) && !SOLITAIRES.test(m[1])) pile.push(m[1]);
      }
    } else {
      if(vus >= n) break;
      out += j.c; vus++;
    }
  }
  for(let k = pile.length-1; k >= 0; k--) out += "</"+pile[k]+">";
  return out;
}

/* Les frappes du menu ne vivent pas dans E : on y arrive avant qu'une
   partie existe. */
let MACH_MENU = [];
function stopperMenu(){ MACH_MENU.forEach(clearInterval); MACH_MENU = []; }

function taperHTML(el, html, ms, pas, fin){
  const jetons = decouperHTML(html);
  const total  = jetons.reduce((n,j)=> n + (j.c!==undefined ? 1 : 0), 0);
  let n = 0;
  el.innerHTML = "";
  el.dataset.fini = html;
  const id = setInterval(()=>{
    n += pas;
    if(n >= total){ clearInterval(id); el.innerHTML = html; if(fin) fin(); return; }
    el.innerHTML = prefixeHTML(jetons, n);
  }, ms);
  MACH_MENU.push(id);
  return id;
}

/* La mission s'écrit bloc par bloc : le titre d'abord, puis chaque
   paragraphe. Un clic n'importe où pose tout d'un coup — on ne retient
   personne qui a déjà lu. */
function ecrireMission(){
  const bloc = app.querySelector(".mission > .role");
  if(!bloc) return;
  const parts = Array.from(bloc.children);
  if(!parts.length) return;
  if(window.SANS_CHRONO){ return; }
  const textes = parts.map(e=>e.innerHTML);
  parts.forEach(e=>{ e.innerHTML=""; e.style.minHeight="1em"; });
  bloc.dataset.encours = "1";
  let k = 0;
  (function suivant(){
    if(k >= parts.length){ delete bloc.dataset.encours;
      parts.forEach(e=>e.style.minHeight=""); return; }
    const e = parts[k], t = textes[k];
    /* le titre se détache, le reste file, les notes filent encore plus */
    const vite = e.classList.contains("r") ? [18,1]
               : e.classList.contains("note-source") ? [10,4]
               : e.classList.contains("note-role") ? [10,3] : [12,2];
    k++;
    taperHTML(e, t, vite[0], vite[1], suivant);
  })();

  bloc.onclick = ()=>{
    stopperMenu();
    parts.forEach((e,i)=>{ e.innerHTML = textes[i]; e.style.minHeight=""; });
    delete bloc.dataset.encours; bloc.onclick = null;
  };
}

/* On remonte au tableau : c'est là que se voit ce qu'on vient de faire.
   En douceur, sauf si l'on a demandé moins d'animations. */
function remonter(sec){
  /* tout changement d’écran arrête la machine à écrire : elle ne
     reprendra que si un texte se remet à s’écrire. */
  try{ SON.frappe(false) }catch(e){}
  /* sec : d'un coup. On s'en sert quand l'écran change entièrement —
     glisser depuis le bas d'un menu n'aurait aucun sens. */
  const doux = !sec && (!window.matchMedia
    || !window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  try{ window.scrollTo({top:0, left:0, behavior: doux ? "smooth" : "auto"}); }
  catch(e){ window.scrollTo(0,0); }
}

/* ==================================================================
   L'ÉCRAN DE FIN

   C'est le dernier texte que l'élève lit avant d'écrire le sien : il
   doit expliquer, pas seulement constater. Trois chiffres y figuraient
   nus — « Conditions réunies 0 / 7 » ne veut rien dire pour qui vient
   de perdre. Chacun dit maintenant ce qu'il compte, et à quoi cela se

   ================================================================== */

/* La force en cause. Quand une force est tombée, c'est elle. Quand on
   est allé au bout, on montre celle qui a le plus soutenu et celle qui
   a le plus payé : c'est ce qui raconte la partie. */
function visagesFin(){
  if(CLES.indexOf(E.fini) >= 0){
    const k = E.fini;
    return { g:k, gl:"Ceux qui vous ont lâché",
             d:k, dl:esc(N.forces[k].veut) };
  }
  const tri = CLES.slice().sort((a,b)=> E.f[b]-E.f[a]);
  return { g:tri[0], gl:"Votre appui jusqu’au bout",
           d:tri[tri.length-1], dl:"Ceux qui ont le plus payé" };
}

/* Les décisions qui ont le plus coûté à cette force-là. C'est la
   réponse concrète à « pourquoi ai-je perdu ? » : on nomme les choix,
   on dit leur prix, on rappelle l'année. */
function coupsPortes(k, combien){
  return (E.carnet||[])
    .filter(d => d.e && d.e[k] < 0)
    .sort((a,b) => a.e[k] - b.e[k])
    .slice(0, combien);
}

function blocPourquoi(){

  }

    <p><b>${N.forces[k].nom}</b> est tombé à <b>zéro</b> sur 100. C’est la règle annoncée

    <p class="fin-rattrape">Une force prévient longtemps avant de tomber : le bandeau
    rouge apparaît dès qu’elle passe sous quinze. C’est le moment de lui céder

}

/* ==================================================================
   LE CARNET DE BORD

   Où en suis-je ? L'année, la décision, la population et sa courbe,
   les sept conditions. Posé à droite sous le courrier, sur du papier
   réglé : c'est le document qu'on consulte sans quitter l'affaire.
   ================================================================== */

/* La courbe de la population, tracée à l'encre. Elle ne vaut pas pour
   ses valeurs exactes mais pour sa forme : on voit si la ville enfle,
   et à quel moment elle s'est mise à enfler. */
function courbePop(){
  const c = (E.courbe||[]).filter(p=>isFinite(p.pop));
  if(c.length < 2) return "";
  const L=250, H=56, m=7;
  const xs=c.map(p=>p.t), ys=c.map(p=>p.pop);
  const xa=Math.min.apply(null,xs);
  const xb=Math.max(Math.max.apply(null,xs), E.mode==="campagne"? N.tours-1 : xa+1);
  const ya=Math.min.apply(null,ys), yb=Math.max.apply(null,ys);
  const px = t => m + (L-2*m) * (xb===xa ? 0 : (t-xa)/(xb-xa));
  const py = v => (H-m) - (H-2*m) * (yb===ya ? .5 : (v-ya)/(yb-ya));
  const pts = c.map(p=>px(p.t).toFixed(1)+","+py(p.pop).toFixed(1)).join(" ");
  const d = c[c.length-1];
  return `<svg class="courbe" viewBox="0 0 ${L} ${H}" preserveAspectRatio="none"

/* ==================================================================
   LE DÉCOR

   "photo"  : la pièce de bureau photographiée, baie vitrée comprise.
              Le tableau des forces pend devant la baie, les papiers
              se posent sur la boiserie.
   "dessin" : la fenêtre peinte en SVG, qui s'encrasse et dont les
              cheminées poussent à mesure que la ville enfle.

   Un seul mot à changer pour passer de l'un à l'autre. Rien n'est
   supprimé : les deux décors vivent côte à côte dans le fichier.
   ================================================================== */
const DECOR = "photo";

function poserDecor(ecran){
  const el = document.getElementById("decor");
  if(!el) return;
  if(DECOR !== "photo"){ document.body.dataset.decor = "dessin"; return; }

  /* L'écran de choix et le tutoriel se passent aujourd'hui, à Beau
     Soleil : on n'entre dans le siècle qu'en ouvrant une époque. */
  const voulu = (ecran === "menu")
    ? ["img/decor/menu.jpg", "img/decor/bureau-I.jpg"]
    : ["img/decor/bureau-" + ((typeof N!=="undefined" && N) ? N.id : "I") + ".jpg"];

  if(el.dataset.voulu === voulu[0]) return;     // déjà en place
  el.dataset.voulu = voulu[0];

  /* On essaie dans l'ordre et on s'arrête au premier qui charge. Si
     aucun ne vient, la fenêtre dessinée reprend la main : jamais de
     trou, quelle que soit l'image qui manque. */
  (function essayer(i){
    if(i >= voulu.length){ document.body.dataset.decor = "dessin"; return; }
    const src = voulu[i], im = new Image();
    im.onload  = ()=>{ el.style.backgroundImage = `url("${src}")`;
                       document.body.dataset.decor = "photo";
                       /* la salle de classe appelle un thème clair ; la
                          pièce de Manchester, non. */
                       document.body.dataset.decorEcran =
                         (src === "img/decor/menu.jpg") ? "menu" : "bureau"; };
    im.onerror = ()=>essayer(i+1);
    im.src = src;
  })(0);
}
