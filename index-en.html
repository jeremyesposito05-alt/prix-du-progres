/* ==================================================================
   LES QUATRE COURBES

   Une ligne par acteur, du premier tour au dernier. Ce n'est pas un
   ornement : c'est la seule page du jeu où l'élève voit d'un regard que
   sa décision du tour 7 a fait plonger les ouvriers, et que rien ne les
   a relevés ensuite.
   ================================================================== */
const COUL_F = { i:"#8E5A1E", o:"#9A2A1E", m:"#2F6B5E", p:"#2E3E7A" };

function courbesForces(){
  const r = (E.releve||[]).filter(p=>p && isFinite(p.i));
  if(r.length < 2) return "";
  const L=760, H=210, mg=34, md=14, mh=14, mb=26;
  const xb = Math.max(...r.map(p=>p.t)) || 1;
  const px = t => mg + (L-mg-md) * (t/xb);
  const py = v => (H-mb) - (H-mh-mb) * (v/100);

  /* les repères : zéro, cinquante, cent */
  const grille = [0,25,50,75,100].map(v=>`
    <line x1="${mg}" y1="${py(v).toFixed(1)}" x2="${L-md}" y2="${py(v).toFixed(1)}"
          class="${v===0?"zero":"g"}"></line>
    <text x="${mg-6}" y="${(py(v)+4).toFixed(1)}" class="ax">${v}</text>`).join("");

  const lignes = CLES.map(k=>{
    const pts = r.map(p=>px(p.t).toFixed(1)+","+py(p[k]).toFixed(1)).join(" ");
    const d = r[r.length-1];
    return `<polyline points="${pts}" fill="none" stroke="${COUL_F[k]}"
              stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"
              vector-effect="non-scaling-stroke"></polyline>
            <circle cx="${px(d.t).toFixed(1)}" cy="${py(d[k]).toFixed(1)}" r="3.4"
              fill="${COUL_F[k]}" stroke="#FBF6E6" stroke-width="1.3"></circle>`;
  }).join("");

  /* Chaque décision porte son année, et un trait la descend jusqu'à
     l'axe : c'est ce qui permet de lire le carnet en regard de la
     courbe, puisqu'il donne la même année en face de chaque choix.
     Au-delà de douze points, une année sur deux, pour ne pas les
     empiler. */
  const saut = r.length > 12 ? 2 : 1;
  const an = r[0].an ? r.map((p,n)=>{
    const x = px(p.t).toFixed(1);
    const trait = `<line x1="${x}" y1="${py(100).toFixed(1)}" x2="${x}"
                     y2="${py(0).toFixed(1)}" class="jalon"></line>`;
    const txt = (n % saut === 0 || n === r.length-1)
      ? `<text x="${x}" y="${H-7}" class="ax an">${p.an}</text>` : "";
    return trait + txt;
  }).join("") : "";

  return `<svg class="cfo" viewBox="0 0 ${L} ${H}" role="img"
     aria-label="Évolution des quatre forces au fil de la partie">
    ${grille}${lignes}${an}</svg>`;
}

function legendeForces(){
  const r = E.releve||[], d = r[r.length-1] || {};
  return `<div class="cfo-leg">${CLES.map(k=>{
    const v = d[k]==null ? 60 : d[k], ecart = v - 60;
    return `<span class="cfo-l">
      <i style="background:${COUL_F[k]}"></i>
      <b>${esc(N.forces[k].nom)}</b>
      <em>${v}</em>
      <u class="${ecart>0?"up":ecart<0?"dn":""}">${ecart>0?"+":""}${ecart}</u>
    </span>`;
  }).join("")}</div>`;
}

/* Ce qu'une décision a fait aux quatre forces, en clair. */
function effetsLigne(e){
  if(!e) return "";
  const l = CLES.filter(k=>e[k]).map(k=>
    `<span class="ef ${e[k]>0?"up":"dn"}">${esc(N.forces[k].nom)}&nbsp;${e[k]>0?"+":""}${e[k]}</span>`);
  return l.length ? `<span class="efs">${l.join("")}</span>` : "";
}

/* Le même relevé en texte, pour la trace copiée. */
function releveTexte(){
  const r = E.releve||[];
  if(r.length < 2) return [];
  const L = ["", "L’ÉTAT DES QUATRE FORCES, DÉCISION APRÈS DÉCISION",
    "  année   " + CLES.map(k=>N.forces[k].nom.padEnd(14)).join("")];
  r.forEach(p=>{
    L.push("  " + String(p.an||p.t).padEnd(8)

/* ==================================================================
   POURQUOI CET ACTEUR A BOUGÉ

   Le rapport de décision disait d'un bloc, et en général, ce qui venait
   d'arriver. Chaque acteur porte maintenant son propre chiffre et
   s'ouvre d'un clic sur sa raison. Tout vient de ce que la partie garde
   déjà : la dernière décision, ses effets, et ce que chaque force veut.
   ================================================================== */

/* Le dernier choix, s'il y en a un. */
function dernierChoix(){
  const c = E.carnet || [];
  return c.length ? c[c.length-1] : null;
}

/* Celui que la dernière décision a le plus remué : c'est dans sa bulle
   que va le récit de la conséquence, pour ne pas le répéter quatre fois. */
function plusRemue(){
  const d = dernierChoix();
  if(!d || !d.e) return null;
  let best=null, max=0;
  CLES.forEach(k=>{ const v=Math.abs(d.e[k]||0); if(v>max){ max=v; best=k; } });
  return best;
}

function bulleForce(k){
  const d = dernierChoix();
  const v = d && d.e ? (d.e[k]||0) : 0;
  if(!d) return "";
  const recit = (k === plusRemue() && E.consq) ? `<p class="bq">${esc(E.consq)}</p>` : "";
  const ent   = (k === "o" && E.entassement) ? `<p class="bent">${esc(E.entassement)}</p>` : "";
  if(!v && !recit && !ent) return "";
  const h = humeur(v);
  const logique = (N.forces[k].pourquoi || {})[v>0?"plus":"moins"] || "";
  return `<div class="pourquoi">
    <div class="bt"><b class="${h?h.sens:""}">${esc(N.forces[k].nom)}</b>${
      h?` — ${h.mot.toLowerCase()}`:""}</div>
    <p class="bd">${esc(d.q||"")}</p>
    ${logique?`<p class="bp">${esc(logique)}</p>`:""}
    <p class="bv">Ce qu’ils attendent de vous : ${esc(N.forces[k].veut)}.</p>
    ${recit}${ent}
  </div>`;
}

/* Un clic sur un acteur ouvre sa bulle et ferme les autres. On ne
   repeint rien : l'écran serait reconstruit et la bulle perdue. */
function bulle(el, k){
  if(!el) return;
  const etait = el.classList.contains("ouvert");
  document.querySelectorAll(".force.ouvert").forEach(x=>x.classList.remove("ouvert"));
  if(!etait){
    el.classList.add("ouvert");
    const d = dernierChoix();
    try{ SON.jeton(d && d.e ? (d.e[k]||0) : 0) }catch(e){}
  }
}

/* Une décision ne vaut pas « moins neuf » : elle contrarie, ou elle
   contente. Le chiffre reste dans la trace écrite, où il sert à
   corriger ; sur le bureau, il laisse place au mot. */
function humeur(v){
  if(!v) return null;
  const a = Math.abs(v);
  return {
    mot: v > 0 ? (a>=10 ? "Très satisfaits" : a>=5 ? "Satisfaits" : "Plutôt contents")
               : (a>=10 ? "Très mécontents" : a>=5 ? "Mécontents"  : "Contrariés"),
    sens: v > 0 ? "up" : "dn",
    fl: (v>0?"▲":"▼").repeat(a<=4 ? 1 : a<=9 ? 2 : 3)
  };
}

 b:{q:"“Let us keep fixed-station assembly.”", e:{i:-10,m:-7,o:5},
    c:"The team moves around the chassis as before. The competitor across the road has read the same plans."},
 c:{q:"“Let us install the line, but run it more slowly.”", e:{i:2,m:1,o:-5,p:2}, g:["Organisation"],
    c:"The conveyor moves more slowly than it could. The shareholders calculate what every lost minute costs."}},

{t:"No one stays more than a few days.", qui:"Frank Doyle, shareholder", req:["Organisation"],
 d:"“This is what your assembly line really produces. Three hundred and seventy per cent. We are no longer making motor cars, we are training beginners all year round.”",
 ex:"Assembly-line work is so repetitive that workers leave after a few days. The personnel department has calculated the figure: to keep one hundred men at their posts for a year, three hundred and seventy must be hired. So the company spends its time training people who leave, and that costs more than anything else.",
 f:"The staff turnover rate measures how many people must be hired to keep the workforce stable. At Ford, it reaches 370 % in 1913: the work is so repetitive that no one stays. This is the hidden cost of the **division of labour** pushed to the extreme. What is gained in **productivity** is lost in loyalty. The answer will be the five-dollar-a-day wage, in January 1914.",
 a:{q:"“Let us double the wage: five dollars a day.”", e:{o:16,m:6,i:-11,p:8}, suite:{dans:3, t:"They stop leaving", x:"Staff turnover has fallen from three hundred and seventy to sixteen per cent. The men stay, learn their job, and do it better. The press across the country is talking about it.", e:{i:8,o:10,m:6,p:5}, q:{texte:"Neighbouring factories demand the same wage, and the other industrialists in Detroit accuse you of driving up prices across the city.",
     choix:[
      {q:"“Let us extend the five dollars to the whole factory.”", e:{o:11,m:5,i:-9,p:4},
       c:"The principle applies to everyone. Competitors will have to follow, and they will not forgive you."},
      {q:"“Let us keep it only for the assembly lines.”", e:{i:6,o:-8,p:-3},
       c:"Two wages exist under the same roof for similar work. The workshop notices very quickly."}]}},
    c:"The wage doubles overnight. Ten thousand men queue outside the factory the next morning, and people stop leaving."},
 b:{q:"“Let us change nothing: hire every morning.”", e:{i:6,o:-13,p:-7}, suite:{dans:3, t:"No one knows how to do their task any more", x:"Quality control rejects one chassis in six. With men who stay four days, there is no more training, only replacement. Quality collapses just when reputation matters most.", e:{i:-7,m:-6,o:-3}},
    c:"People are hired at the gate every morning. No one ever learns their task properly."},
 c:{q:"“A bonus, for long-serving workers only.”", e:{o:4,i:-6,m:1,p:-3},
    c:"Those who stay benefit, newcomers do not. The workshop splits in two."}},

{t:"Who deserves the five dollars?", qui:"Doctor Emmett Crowe, tasked with investigating the workers", apres:1914,
 d:"“The doubled wage is a reward, not a right. Let my investigators enter their homes: we will know who deserves it.”",
 ex:"The wage that has just been doubled is not paid as something owed: management wants to make it a reward. It proposes creating a department whose investigators would visit workers' homes to check that they do not drink, that they save, and that the household is properly kept. Those judged unworthy would receive only half. The department can operate from Monday. What remains is to decide what it will be allowed to inspect.",
 f:"Ford creates a ‘Sociological Department’ in 1914: investigators visit workers' homes to check sobriety, savings and household standards, and only those judged deserving receive the full wage. The company is no longer content to buy labour. It intends to **shape the way of life** of its workers. This is one of the least known aspects of **Fordism**, and one of the most debated.",
 a:{q:"“Let us inspect the workers' private lives.”", e:{i:7,p:4,o:-11},
    c:"Investigators enter workers' homes to count bottles and read savings books. The wage is bought with obedience."},
 b:{q:"“Five dollars for everyone, without inspection.”", e:{o:12,p:5,i:-8},
    c:"What they do with their evening is none of your business. Some shareholders think the money is badly spent."}},

{t:"The customer asks for another colour.", qui:"Elias Bright, who sells our cars in Chicago",
 d:"“People are asking me for blue, green, a closed body for winter. I give them the answer I have been told to give: black. How long do you think that will last?”",
 ex:"Every car leaves the factory black, for a technical reason: black bitumen paint is the only one that dries quickly enough to keep pace with the assembly line. Any other colour would mean slowing production or building drying rooms. Salesmen have been reporting the same requests for six months: customers want a choice.",
 f:"Only one paint dried quickly enough to keep pace: a bitumen black. **Standardisation**, one model, one colour, identical parts, is what makes the low price possible. But it assumes that the customer accepts having no choice. While motor cars are rare, this works. Once the market is supplied, the lack of choice becomes a weakness. This is exactly what will bring down the Ford T.",
 a:{q:"“One colour only: black.”", e:{i:9,m:-8,o:2}, g:["Organisation"],
    c:"Only one shade dries quickly enough for the assembly line. The price falls again. Choice has disappeared."},
 b:{q:"“Let us offer several colours.”", e:{m:12,i:-9,o:-3},
    c:"The assembly line has to slow down to let the paint dry. Each car costs more to produce."},
 c:{q:"“Let us offer two colours, no more.”", e:{m:3,i:-8},
    c:"A compromise nobody asked for: too little choice to attract customers, enough to complicate the workshop."}},

{t:"A factory that would make everything.", qui:"Frank Doyle, shareholder", req:["Savoirs techniques"],
 d:"“Ore goes in at one end, the car comes out at the other. No more suppliers holding us to ransom. It will take a great deal of money, and we have to decide now.”",
 ex:"We buy steel, glass and rubber from suppliers who have all just raised their prices at the same time. The idea is to stop depending on them by owning every stage ourselves, from the mine to the sale: our own blast furnaces, our own glassworks, our own ships. This means building an enormous factory by the river and committing the company for ten years.",
 f:"**Vertical integration** means owning every stage, from raw material to sale. The River Rouge plant, built from 1917 onwards, will have its own blast furnaces, glassworks, power station, port and railway lines. The company no longer depends on anyone, but it ties up considerable **capital**, and becomes very vulnerable if demand stops.",
 a:{q:"“Let us build River Rouge: everything under one roof.”", e:{i:13,m:6,o:-7,p:-5}, g:["Ressources","Capitaux"],
    c:"The largest factory in the world. Nothing depends on anyone else, and no one escapes anything."},
 b:{q:"“Let us keep buying our parts from outside suppliers.”", e:{i:-7,m:-4,p:3},
    c:"We remain dependent on twenty suppliers, who now know the value of their signature."},
 c:{q:"“Let us buy only our foundries.”", e:{i:3,o:-4,m:-2}, g:["Ressources"],
    c:"The foundry is ours, the rest is bought elsewhere. Half-independence, at half the price."}},

{t:"The worker on line 4 asks to speak.", qui:"Anna Kowalczyk, assembly-line worker",
 d:"“I have fitted the same screw four hundred times a day for two years. I still do not know what the part next to it is for. You gave me five dollars, but you did not give me my trade back.”",
 ex:"On the assembly line, work is broken down into movements lasting a few seconds, repeated all day. The advantage is that an untrained worker can learn a station in an hour. The disadvantage is that they can no longer do anything else and never see the car they are making. A worker from line 4 has asked to be seen, which the foreman passed on without comment.",
 f:"Assembly-line work breaks production down into movements lasting a few seconds. The worker no longer needs a skill: they can be trained in an hour, and replaced just as quickly. Karl Marx had already used the term **alienation** for this relationship in which the worker becomes detached from what they produce. Antonio Gramsci, analysing Fordism in 1934, observes that a person reduced to a single movement nevertheless continues to think, and that this is where protest begins.",
 a:{q:"“Let us change nothing about her job.”", e:{i:8,o:-12,p:-6},
    c:"The task remains what it is. She goes back to her screw, and you now know what she thinks of it."},
 b:{q:"“Let us rotate workers from one station to another.”", e:{o:11,p:5,i:-9,m:-3},
    c:"Everyone changes stations during the week. Output falls. Work stoppages fall too."},
 c:{q:"“At least let us show them the finished car.”", e:{o:3,p:1,i:-5},
    c:"Teams are taken to see the car they assemble leave the factory. It is not much. It is not nothing."}},

{t:"General Motors changes its model every year.", qui:"Elias Bright, who sells our cars in Chicago", apres:1920,
 d:"“Their car for next year does not look like this year's. My customers come to look at ours, then leave.”",
 ex:"Our competitor has changed its method: instead of selling a single car as cheaply as possible, it offers a complete range and changes its appearance every year, making last year's model look outdated. It also sells on credit. Our sales have fallen for the third quarter in a row and the salesmen no longer know what to tell customers.",
 f:"Alfred Sloan, head of General Motors, counters Ford's single car with a complete range and a model renewed every year so that the old one appears outdated. This is the invention of commercial **obsolescence**, and the shift from mass production to **mass consumption**: it is no longer enough to produce more cheaply, you have to create the desire to buy. Ford will lose first place in 1927 for failing to see this.",
 a:{q:"“Let us change the model every year.”", e:{m:13,i:-10,o:-4}, g:["Marchés"],
    c:"The tooling has to be remade, the movements relearned, everything started again. The customer comes back."},
 b:{q:"“Let us keep the same model.”", e:{i:7,m:-14,o:3}, suite:{dans:4, t:"The warehouses are full", x:"Eleven thousand unsold cars. Dealers refuse deliveries and some have taken on another brand. The stock costs more every month it sits there.", e:{m:-9,i:-6}, q:{texte:"Eleven thousand unsold cars. We can sell them off at half price to free up cash, or hold on and hope the market recovers.",
     choix:[
      {q:"“Let us sell off the stock, we need the money.”", e:{m:8,i:-10,o:3},
       c:"The warehouses empty in six weeks. Those who paid full price last year will not forget it."},
      {q:"“Let us hold on: the market will recover eventually.”", e:{i:5,m:-9,o:-4},
       c:"We wait. The stock sits there, cash reserves melt away, and the market does not recover that year."}]}},
    c:"We keep producing the same car, better and better, more and more cheaply. And it is bought less and less often."},
 c:{q:"“Let us keep the chassis and change the bodywork.”", e:{m:4,i:-8,o:-3}, g:["Marchés"],
    c:"We dress the old model as a new one. The dealers breathe again. The competitors' engineers smile."}},

{t:"Should we sell on credit?", qui:"Frank Doyle, shareholder", apres:1920,
 d:"“The worker earns five dollars a day and the car costs four hundred. On credit, he buys it tomorrow instead of saving for three years.”",
 ex:"Until now, a motor car is bought when the buyer has the money, meaning after several years of saving. Credit means delivering it immediately in exchange for twelve monthly payments: the buyer drives using income they have not yet earned. Our competitor has set up its own bank for this. The figures show that a car sold on credit is sold two years earlier.",
 f:"Consumer credit spreads through the motor industry in the 1920s: General Motors creates its own finance company as early as 1919. It makes it possible to buy with income not yet earned, and it is what sustains **mass consumption**. It also leaves households permanently in debt, one of the weaknesses that will worsen the crisis of 1929.",
 a:{q:"“Let us sell on credit, in twelve payments.”", e:{m:14,i:6,p:-8,o:2}, g:["Capitaux","Marchés"],
    c:"We suddenly sell to people who did not have the money. We also sell them years of debt."},
 b:{q:"“Let us reject credit.”", e:{p:7,i:-5,m:-11},
    c:"The principle is preserved. The market goes to the neighbour who has no such principle."},
 c:{q:"“Short-term credit, reserved for our workers.”", e:{m:4,o:2,i:-2,p:-7}, g:["Marchés"],
    c:"The company's workers buy the car they assemble. We have invented the captive customer."}},

{t:"Five working days instead of six.", qui:"Harriet Vance, journalist in Detroit", apres:1922,
 d:"“You keep saying that a well-paid worker buys motor cars. Take the idea to its conclusion: give them time to use one as well.”",
 ex:"People work six days a week throughout American industry, and no law requires otherwise. Yet management keeps saying that a well-paid worker becomes the customer of what they make. The journalist takes the argument further: a worker who has Saturday off has time to use their car. The foremen predict a collapse in production.",
 f:"Ford introduces the five-day week in 1926, without being forced to do so by any law. His argument became famous: a well-paid worker with free time becomes the customer of what they make. This is the heart of **Fordism**. Mass production requires mass consumption, so some of the gains in **productivity** must be shared with employees. The other industrialists in Detroit will see it as a betrayal.",
 a:{q:"“Let us move to a five-day working week.”", e:{o:14,p:11,m:5,i:-13},
    c:"The whole world talks about it. The other factory owners in Detroit hate you for a long time."},
 b:{q:"“Let us keep the six-day week.”", e:{i:6,o:-9,p:-7},
    c:"People work on Saturday. The press recalls your own speeches about purchasing power."},
 c:{q:"“Five days, but only in summer.”", e:{o:3,p:1,i:-7},
    c:"The measure ends in September. No one knows whether it is a right or a favour."}},

{t:"An organiser hands out leaflets at the gate.", qui:"Sam Rusin, who is trying to form a trade union",
 d:"“We are not asking for your factory. We are asking to discuss the pace with someone who has the right to say no. Today, or outside the gates in ten years.”",
 ex:"In the American motor industry, trade unions are not recognised: management refuses to negotiate with them and employs a private security service to watch the workshops. A man hands out leaflets every morning on the pavement opposite, outside the factory grounds. The workers take them and read them. The security service proposes intervening. The lawyers point out that the street does not belong to us.",
 f:"Trade unions are not recognised in the American motor industry before the end of the 1930s: the major firms maintain private security services that watch the workshops and remove organisers. The UAW motor union will not be recognised at Ford until 1941, after years of confrontation. The **social balance of power** takes a generation to catch up with technical change.",
 a:{q:"“Let us meet the trade unionists.”", e:{o:13,p:9,i:-12,m:-3},
    c:"We sit at the same table. The shareholders call it abdication. Neighbouring factories call it contagion."},
 b:{q:"“Let the security service drive them away.”", e:{i:8,o:-14,p:-11}, suite:{dans:4, t:"The newspapers got the photographs", x:"A reporter was following the group. Photographs of the security men are on the front page of two newspapers, and a Michigan politician calls for an inquiry into the company's methods.", e:{p:-10,o:-5,m:-3}, q:{texte:"A Michigan politician calls for an inquiry. The legal department proposes a public denial. The personnel department proposes meeting the trade unionists.",
     choix:[
      {q:"“Let us publish a denial.”", e:{i:5,p:-11,o:-7},
       c:"The denial appears on page six. The photographs were on the front page."},
      {q:"“Let us meet them, and make sure it is known.”", e:{o:10,p:12,i:-10,m:-3},
       c:"The meeting takes place in front of journalists. The shareholders call it surrender. The inquiry is dropped."}]}},
    c:"They are dispersed, recorded, and the organisers are dismissed. The workshop falls silent, but it does not forget."}},

{t:"The stopwatch comes down to the workshop.", qui:"Walter Kessler, engineer in charge of organising production", req:["Organisation"],
 d:"“Eleven seconds per car, multiplied by the year's production. We only need to apply the times we have established.”",
 ex:"An American engineer, Frederick Taylor, proposed studying work as a science: break down each task, time every movement, eliminate unnecessary motions, and leave it to an office to decide how the work should be done. Our engineers have just completed these measurements on two lines and are saving eleven seconds per car. The workers saw them doing it, stopwatch in hand, and know what is coming.",
 f:"Frederick Taylor theorised **scientific management**: break down each task, time every movement, eliminate unnecessary motions. Knowledge passes from the worker to the methods office, the person carrying out the task no longer decides how it should be done. Taylorism comes before Fordism and makes it possible: without measured times, an assembly line cannot be regulated. Together, they drive **productivity** sharply upwards and turn skilled work into execution.",
 a:{q:"“Let us apply the timed standards.”", e:{i:12,m:5,o:-13},
    c:"Eleven seconds saved a thousand times a day. The worker pays for them, one by one."},
 b:{q:"“Let us abandon time-and-motion study.”", e:{o:9,p:4,i:-9,m:-3},
    c:"We keep the old timings. Production costs stop falling."},
 c:{q:"“Let us time the work, and share the gain.”", e:{i:3,o:-1,m:1,p:1},
    c:"Part of the time saved is returned in wages. The accountants watch that share very closely."}},

{t:"A man arrives with one leg missing.", qui:"Doctor Emmett Crowe, tasked with investigating the workers",
 d:"“The task has become so simple that it hardly requires a complete body any more. The question is no longer whether it is possible, but whether we do it.”",
 ex:"Because the work is broken down into very simple movements, the methods department has classified every job according to what it actually requires from the body: seven thousand can be done sitting down, one hundred and seventy by a man without legs, around ten by a blind man. No other factory in the city employs these men. With no rule to follow, the hiring office refers the decision to management.",
 f:"Because jobs are broken down into simple movements, Ford records which can be done sitting down, by an amputee or by a blind man, and employs several thousand such workers. This is the unexpected side of the **division of labour**: what strips the worker of a trade also opens the factory to men whom nobody else would employ. Technical progress does not have a single social effect, which is what makes it difficult to judge.",
 a:{q:"“Let us employ disabled workers.”", e:{o:8,p:12,m:4,i:-5},
    c:"Hundreds of men whom nobody wanted enter the factory. Broken-down work will at least have achieved that."},
 b:{q:"“Let us refuse to employ them.”", e:{i:5,o:-7,p:-12}, suite:{dans:3, t:"Your own figures come back to you", x:"A newspaper has published your engineers' study, the one listing the thousands of jobs that could be done by an amputee. Beside it is your refusal to hire them. The comparison makes itself.", e:{p:-8,o:-4}},
    c:"They are turned away at the gate. The press has the figures from your own engineers."},
 c:{q:"“Let us hire a few, for appearances.”", e:{p:1,i:-3,o:-1},
    c:"Twenty are hired and each one is photographed. The rest are still waiting."}},

{t:"The machines demand electricity.", qui:"Walter Kessler, engineer in charge of organising production",
 d:"“One belt breaks and the entire factory stops. With electricity, every station runs independently and we can arrange the machines however we want.”",
 ex:"In the workshop, one large steam engine drives all the others through belts stretched across the ceiling. When one breaks, everything stops. On Tuesday, two thousand men spent four hours doing nothing. Giving each machine its own electric motor would make them independent, and above all would allow them to be arranged in the order of production instead of lined up beneath the belts.",
 f:"In a steam-powered factory, one machine drives the whole workshop through belts on the ceiling: the layout of the machines is dictated by the mechanics, and one failure stops everything. The individual electric motor, which becomes widespread around 1900, frees each station and allows machines to be arranged in the order of production. Electricity is one of the **new forms of energy** that define the second industrial revolution, along with oil.",
 a:{q:"“Let us electrify the entire factory.”", e:{i:11,m:4,o:3,p:2}, g:["Ressources","Savoirs techniques"],
    c:"Each machine runs independently. At last, stations can be arranged in the order of production rather than beneath the belts."},
 b:{q:"“Let us keep the steam engine.”", e:{i:-9,o:-3,m:-4},
    c:"The belts keep snapping overhead. One break, and two thousand men wait."},
 c:{q:"“Let us electrify only the new workshops.”", e:{i:2,m:-1,o:-2}, g:["Savoirs techniques"],
    c:"The factory exists in two eras at once, and the foremen spend their day moving between them."}},

{t:"The parts do not fit together.", qui:"Walter Kessler, engineer in charge of organising production",
 d:"“Inspection rejected an entire batch yesterday. Let us impose the same measurement on every supplier, accurate to one hundredth, and the problem disappears.”",
 ex:"Our three suppliers deliver parts that are not exactly the same size. Skilled workers therefore spend their days filing them one by one until they fit, which is the most expensive part of making a car. If every copy of a part were identical to within one hundredth of a millimetre, any one of them would fit any car, without adjustment and without a skilled worker.",
 f:"**Interchangeability** means that every copy of a part is identical to within one hundredth: any one then fits any car without adjustment. It makes assembly-line production, repair without a workshop, and very large-scale production possible. On the other hand, it eliminates the trade of the fitter, the skilled worker who filed parts one by one. This is a typical shift: skill moves from the workshop to the design office.",
 a:{q:"“Let us impose a single standard measurement on everyone.”", e:{i:12,m:6,o:-4}, g:["Savoirs techniques","Organisation"],
    c:"Every part fits every car. The skilled fitter becomes a man who simply installs parts."},
 b:{q:"“Let us keep our fitters and their files.”", e:{o:7,i:-11,m:-6},
    c:"We file, adjust and correct. Every car is slightly different, and costs slightly more."},
 c:{q:"“One standard measurement for the engine only.”", e:{i:3,m:1,o:-4}, g:["Savoirs techniques"],
    c:"The engine is interchangeable, the bodywork is not. We have solved half the problem."}},

{t:"The market has stopped all at once.", qui:"Frank Doyle, shareholder", apres:1928,
 d:"“Cancellations are coming in faster than we can record them. We have to decide now, and it will be brutal either way.”",
 ex:"The New York Stock Exchange collapsed in October and the savings of millions of customers disappeared with it. A motor car is the first purchase people postpone: orders do not merely stop, they are cancelled. The warehouses are full and the cash reserves will last two months. What is decided this week will determine the lives of thousands of families in a city that depends entirely on the factory.",
 f:"The crash of October 1929 hits the motor industry harder than any other sector: people postpone buying a car long before they postpone buying bread. American production falls by three quarters in four years. **Mass production** then reveals its weakness: enormous factories designed to run at full capacity become ruinous as soon as demand falls. What had seemed like endless progress stops within a few weeks.",
 a:{q:"“Let us close the lines and lay people off.”", e:{i:9,o:-16,p:-12,m:-5},
    c:"Thousands of men out of work in one week, in a city that exists only because of you."},
 b:{q:"“Let us keep everyone, but slow production down.”", e:{o:14,p:10,i:-15,m:-4},
    c:"We pay workers to produce cars that nobody buys. The reserves melt away before our eyes."}},

{t:"They are marching towards the factory.", qui:"Harriet Vance, journalist in Detroit", apres:1930,
 d:"“The front of the march will be here in an hour. Your guards are armed. What should they do?”",
 ex:"The crisis has thrown nearly one worker in three out of work in Detroit, and marches of unemployed people are being organised across the country to demand work and relief. This one left the city centre late in the morning and grows at every junction: several thousand men, unarmed and with no call for violence. The guards are stationed at the gate and await instructions.",
 f:"At the depths of the Depression, Detroit has nearly one unemployed person in three: the city that produced cars for the whole world now lives with the unemployment it created. The Dearborn Hunger March, on 7 March 1932, ends with gunfire from the police and the security service, four dead on the spot and a fifth later. The **crisis** finally shows that industrial prosperity is neither guaranteed nor shared.",
 a:{q:"“Let us block the gate by force.”", e:{i:4,o:-17,p:-16},
    c:"Shots are fired. Four dead on the road, and photographs that will travel around the country for a century."},
 b:{q:"“Let us open the gates and receive a delegation.”", e:{o:13,p:14,i:-12,m:-3},
    c:"Six men enter, speak for an hour, and leave with little. But nobody dies that day."}},

{t:"Advertising costs a million.", qui:"Elias Bright, who sells our cars in Chicago",
 d:"“We publish figures, they inspire dreams. The cheapest car in the world does not sell itself when the neighbour offers a better-looking one at the same price.”",
 ex:"The company has never advertised except by publishing its prices. Our competitors, meanwhile, buy full pages in illustrated magazines and sell not a car but an image of oneself: success, freedom, travel. Advertising agencies offer us the same thing for a sum larger than the budget of an entire workshop.",
 f:"Mass advertising develops with the illustrated press in the 1920s. It no longer sells a product but an image of oneself, and the motor car becomes its main field. It is the instrument of **mass consumption**: producing a lot is not enough, you have to create the desire to buy, and renew it. Ford, which had never needed to persuade customers, discovers that a low price is no longer enough.",
 a:{q:"“Let us buy advertising pages.”", e:{m:11,i:-7,p:-3}, g:["Marchés"],
    c:"We now sell an idea with the car. It costs more than the sheet metal."},
 b:{q:"“Let us publish only our prices.”", e:{i:6,m:-9},
    c:"We keep printing figures. Figures have never made anyone desire anything."},
 c:{q:"“Advertising, but focused on reliability.”", e:{m:3,i:-5,p:1}, g:["Marchés"],
    c:"We praise the car for what it really is. It is honest, and a little dull."}},

{t:"Two men are waiting to be hired.", qui:"Sam Rusin, who is trying to form a trade union",
 d:"“This man comes from Georgia and no factory in this city will put him anywhere but the foundry. I want to know what you will do with him.”",
 ex:"Hundreds of thousands of African Americans are leaving the southern United States, where the law separates them from white people and denies them almost every kind of employment, for the factories of the North. In most Detroit firms, they are confined to the foundry, the hottest and hardest jobs. Two men have the same work record and are applying for the same position. No written rule says what should be done.",
 f:"Hundreds of thousands of African Americans leave the segregated South for the factories of the North: this is the Great Migration. In most firms, they are confined to the foundry, to the hardest jobs. Ford is an exception by employing them on the assembly lines, which attracts a large Black community to Detroit. The factory is also a place where a country's **social hierarchies** are played out, not merely a technical organisation.",
 a:{q:"“Let us hire him on the line, like the others.”", e:{o:9,p:13,i:-6,m:-2},
    c:"Few factories in Detroit do this. People come from far away to work there, and the workshop grumbles for a few weeks."},
 b:{q:"“Send him to the foundry, as usual.”", e:{i:4,o:-6,p:-11}, suite:{dans:4, t:"The foundry has emptied", x:"Two hundred men have left for a competitor that is opening its lines to everyone. The hardest jobs can no longer be filled, and they are the ones that keep the factory running.", e:{o:-6,i:-6,p:-4}},
    c:"The hardest and hottest jobs, always the same men. Custom is not a reason."}},

{t:"Should you stop making the car that made you?", qui:"Frank Doyle, shareholder", apres:1924, req:["Marchés"],
 d:"“It is the best-selling car in history, and it is unsellable. Stopping the lines means sixty thousand men without wages for six months.”",
 ex:"Our single model has sold more than fifteen million units in twenty years, and its price has fallen from eight hundred and fifty to less than three hundred dollars. But it no longer sells: stocks are piling up and dealers are stopping their orders. Replacing it means shutting down the lines for several months and remaking every tool in the company. Nobody in the industry has ever attempted a shutdown on this scale.",
 f:"More than fifteen million Ford T cars were produced between 1908 and 1927, and the price fell from 850 to less than 300 dollars thanks to **mass production** alone. Its discontinuation in May 1927 shuts the factories for six months and deprives sixty thousand workers of wages. The **standardisation** that made the company's fortune becomes its trap: the more specialised production is, the more expensive it is to change.",
 a:{q:"“Let us stop everything and change the model.”", e:{m:13,i:-12,o:-9,p:2}, g:["Marchés"],
    c:"Six months of silent factories, sixty thousand men without wages, then a queue outside the dealerships."},
 b:{q:"“Let us keep producing the same one to the end.”", e:{i:8,m:-13,o:4},
    c:"We keep producing it for another two years, less and less. The stock sits in the warehouses."},
 c:{q:"“Let us prepare the next model without stopping production.”", e:{m:4,i:-9,o:-5}, g:["Marchés"],
    c:"Two factories, two models, twice the costs. But not a single day with the assembly line stopped."}},

{t:"A foreman bans talking.", qui:"Anna Kowalczyk, assembly-line worker",
 d:"“We are watched even in the way we hold our heads. You call it discipline. We have another word for it.”",
 ex:"A rule posted last week bans sitting down, whistling and talking to a neighbour while working. Two workers have already been punished for speaking to each other at their posts. The workers have developed a way of talking without moving their lips. The worker who has come to see you speaks for her entire line.",

/* On ne tire que des questions portant sur ce qu'il a réellement vu. */
function questionsDeLaPartie(){
  const vues = new Set(E.carnet.map(d=>d.t));
  const evs  = new Set(E.evVus);
  let lot = N.quiz.filter(q => (q.c && vues.has(q.c)) || (q.ev && evs.has(q.ev)));
  /* s'il en manque, on complète avec le reste du niveau */
  if(lot.length < 8){
    const reste = N.quiz.filter(q => !lot.includes(q));
    melanger(reste);
    lot = lot.concat(reste.slice(0, 8-lot.length));
  }
  melanger(lot);

  /* LES REPONSES ELLES-MEMES. Les questions ont ete ecrites avec la
     bonne reponse en premier — b:0 partout. Sans ce melange, un eleve
     qui l'a remarque repond juste huit fois sur huit sans rien savoir.
     On rend une COPIE de chaque question : « N.quiz » est partage entre
     les parties, et melanger l'original le melangerait a nouveau a la
     partie suivante, jusqu'a ce que « b » ne designe plus rien. */
  return lot.slice(0, 8).map(q => {
    const juste = q.r[q.b];
    const r = q.r.slice();
    melanger(r);
    return Object.assign({}, q, { r, b: r.indexOf(juste) });
  });
}

function melanger(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
}

/* Le document à rendre : du texte simple, qui se colle partout. */
function texteTrace(){
  const note = E.rep.filter((x,i)=>x===E.quiz[i].b).length;
  const pct  = Math.round(100*note/E.quiz.length);
  const L = [];
  L.push("LE PRIX DU PROGRÈS — trace de travail");
  L.push(N.lieu+", "+N.sous.replace(N.lieu+", ","")+"  ·  "+(E.mode==="campagne"?"campagne":"survie"));
  L.push("Nom : "+((E.t_rnom||"").trim()||"…"));
  L.push("");
  L.push("RÉSULTAT DE LA PARTIE");
  L.push("  "+(E.fini==="verdict" ? "Menée jusqu’au bout." : "Interrompue : "+(N.fins[E.fini]?N.fins[E.fini].t:E.fini)));
  L.push("  Décisions prises : "+E.carnet.length);
  L.push("  "+N.unite+" finale : "+fmt(E.pop));
  L.push("  Conditions réunies : "+E.acquis.length+" / "+CONDITIONS.length
    +(E.acquis.length?"  ("+condListe(E.acquis)+")":""));
  L.push("  Rapports d’enquête consultés : "+((E.lus&&E.lus.length)||0)+" sur "+E.carnet.length);
  L.push("");
  L.push("MON CARNET DE BORD");
  E.carnet.forEach((d,i)=>{
    L.push("  "+String(i+1).padStart(2)+". "+(d.an?"["+d.an+"] ":"")+d.t);
    L.push("      → "+(d.q||""));
  });
  L.push("");
  L.push("CE QUE J’AI RETENU  —  "+(E.corrige ? pct+" % ("+note+"/"+E.quiz.length+")" : "questionnaire non corrigé"));
  if(E.corrige) E.quiz.forEach((q,i)=>{
    const j=E.rep[i];
    L.push("  "+(j===q.b?"[juste]":"[faux] ")+" "+q.q);
    L.push("      ma réponse : "+(j==null?"—":q.r[j]));
    if(j!==q.b) L.push("      réponse attendue : "+q.r[q.b]);
  });
  L.push("");
  L.push("MA RÉFLEXION");
  L.push("  La décision dont je suis le plus sûr :");
  L.push("      "+((E.t_r1||"").trim()||"…"));
  L.push("  La décision que je regrette :");
  L.push("      "+((E.t_r2||"").trim()||"…"));
  L.push("  Ce que cette partie m’apprend sur le progrès industriel :");
  L.push("      "+((E.t_r3||"").trim()||"…"));
  releveTexte().forEach(x=>L.push(x));
  L.push("");
  L.push("MON AVIS SUR LE JEU");
  avisLignes().forEach(p=>{ L.push("  "+p[0]); L.push("      "+p[1]); });
  L.push("  Un moment où j’étais perdu ou ennuyé :");
  L.push("      "+((E.t_av1||"").trim()||"…"));
  L.push("  À ajouter, retirer ou corriger :");
  L.push("      "+((E.t_av2||"").trim()||"…"));
  return L.join("\n");
}

function copierTrace(){
  const t = texteTrace(), m = document.getElementById("msgcopie");
  const dire = ok => { if(m) m.textContent = ok
    ? "Copié. Vous pouvez le coller dans un document ou dans Teams."
    : "La copie a échoué — utilisez « Télécharger »."; };
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(()=>{E.traceEnregistree=true;dire(true);rafraichirValidation()}).catch(()=>dire(false));
  else dire(false);
}

  const e = t => String(t==null?"":t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const g = t => e(t).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  const dt = new Date().toLocaleDateString("fr-CH",{day:"numeric",month:"long",year:"numeric"});

  const carnet = E.carnet.map((d,i)=>`
    <tr>
      <td class=n>${i+1}</td>
      <td class=an>${d.an?e(d.an):""}</td>
      <td>${e(d.t)}<div class=dec>${e(d.q||"")}</div></td>

      }).join("")}
    </tr>`).join("");

  /* L'état après chaque décision : Word ne trace pas de courbe, mais un
     tableau chiffré s'imprime, se corrige et se compare. */
  const releve = (E.releve||[]).map(p=>`
    <tr>
      <td class=an>${p.an?e(p.an):e(String(p.t))}</td>
      ${CLES.map(k=>`<td class=num>${p[k]}</td>`).join("")}
    </tr>`).join("");

  const quiz = !E.corrige ? "<p class=vide>Le questionnaire n’a pas été corrigé.</p>"
    : E.quiz.map((q,i)=>{
      const j=E.rep[i], ok=(j===q.b);
      return `<div class="q ${ok?'ok':'ko'}">
        <p class=qq><b>${i+1}.</b> ${e(q.q)}</p>
        <p class=qr><span class=et>${ok?"Juste":"Faux"}</span>
           Votre réponse : ${j==null?"—":e(q.r[j])}</p>
        ${ok?"":`<p class=qa>Expected answer: <b>${e(q.r[q.b])}</b></p>`}
        <p class=qx>${g(q.x)}</p>
      </div>`;
    }).join("");

  return `<html xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">

  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "prix-du-progres-"+nom+"-"+N.lieu.toLowerCase()+".doc";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);

/* ---------- la validation de la trace ------------------------------ */
function etatValidation(){
  const nom = ((E.t_rnom||"").trim().length >= 3);
  const cor = !!E.corrige;
  const enr = !!E.traceEnregistree;
  const env = !!(document.getElementById("jenvoi")||{}).checked;
  return {nom, cor, enr, env, tout: nom && cor && enr && env};
}

function rafraichirValidation(){
  const v = etatValidation();
  const mk = (id, ok) => { const e=document.getElementById(id); if(e) e.className = ok?"fait":""; };
  mk("j1", v.nom); mk("j2", v.cor); mk("j3", v.enr);
  const b = document.getElementById("btvalid");
  if(b){
    b.disabled = !v.tout;
    b.textContent = v.tout ? "Valider et terminer"
      : !v.nom ? "Écrivez d’abord votre nom"
      : !v.cor ? "Corrigez d’abord le questionnaire"
      : !v.enr ? "Enregistrez d’abord votre trace"
      : "Cochez la case ci-dessus";
  }
}

function validerTrace(){
  if(!etatValidation().tout) return;
  E.traceValidee = true;
  rendreFin();
}

  <div class="acteurs">${CLES.map(k=>`<details class="acteur">
     <summary>
       <figure class="embleme"><img src="img/acteurs/${N.id}-${k}-embleme.jpg" alt=""
         onerror="this.closest('figure').remove()"></figure>
       <span class="nom-acteur">${N.forces[k].nom}</span>
       <span class="veut">${esc(N.forces[k].veut)}</span>
       <span class="pli"></span>
     </summary>
     <div class="fiche">
       <figure class="portrait-acteur"><img src="img/acteurs/${N.id}-${k}-portrait.jpg" alt="" loading="lazy"
         onerror="this.closest('figure').remove()"></figure>
       <div class="role">${gras(esc(N.forces[k].role))}</div>
       <figure class="scene-acteur"><img src="img/acteurs/${N.id}-${k}-scene.jpg" alt="" loading="lazy"
         onerror="this.closest('figure').remove()"></figure>
     </div>
   </details>`).join("")}</div>
  <p class="centre" style="margin:24px 0 8px">
    <button class="plein" onclick="nouvellePartie('campagne',N.id)">Campagne · ${N.tours} décisions jusqu’en ${N.a1}</button>
    <button onclick="nouvellePartie('infini',N.id)">Survie${rec?` · record ${fmt(rec)} ${N.unite2}`:""}</button>
    <button onclick="accueil()">Change level</button>
  </p>
  <div class="bilan"><h2 style="margin-top:0">One thing to know before you begin</h2>
    <p style="margin:.3em 0">${N.avant} C’est ce qui rendra la fin de partie difficile.</p></div>`;
  ecrireMission();
}
titre();
</script>
</body>
</html>
