    c:"Les clients gagnent du choix, mais les ouvriers doivent apprendre deux fabrications.", dit:{m:"Nous aurons le choix entre une voiture simple et une luxueuse.",o:"Nous devrons apprendre à fabriquer deux modèles différents."}}},

{n:"04", t:"Un modèle unique pour nos ateliers", qui:"Thomas Reed, mécanicien d’assemblage",
 d:"« Je veux cesser de chercher une pièce différente pour chaque voiture. »",
 ex:"Six versions de voiture compliquent le travail des ateliers. Un mécanicien propose de fabriquer les mêmes pièces pour un seul modèle.",
 l:"Révisez Trace écrite 3 §3 · vocabulaire. Le terme **standardisation** désigne la fabrication de pièces ou de produits selon un modèle identique. Qu’est-ce qui resterait pareil, et qu’est-ce qui changerait avec votre décision ?",
 av:{m:"Nous voulons retrouver facilement les mêmes pièces en cas de panne.", o:"Nous craignons de répéter le même montage toute la journée."},
 a:{q:"« Je conserve un modèle unique. »", e:{o:-8,m:9},
    c:"Les clients trouvent plus facilement des pièces de rechange, mais les ouvriers répètent davantage les mêmes tâches.", dit:{m:"Nous pourrons remplacer une pièce sans chercher six versions.",o:"Nous risquons de refaire sans cesse les mêmes gestes."}},
 b:{q:"« Je maintiens les six versions. »", e:{i:-8,m:9},
    c:"Les clients conservent un large choix, mais les actionnaires paient des fabrications complexes.", dit:{i:"Nous continuerons à payer pour six fabrications compliquées.",m:"Nous garderons le choix parmi les six voitures proposées."}},
 c:{q:"« Je garde deux modèles seulement. »", e:{i:9,m:-8},
    c:"Les actionnaires simplifient les ateliers, mais les clients perdent plusieurs versions.", dit:{i:"Nous simplifierons les ateliers avec seulement deux modèles.",m:"Nous perdrons plusieurs modèles que nous aimions comparer."}}},

{n:"05", t:"Le pari d’une nouvelle Ford", qui:"James Couzens, responsable de l’entreprise",
 d:"« Je veux lancer une voiture robuste que beaucoup pourront acheter. »",
 ex:"En 1908, nos ateliers savent déjà construire des voitures. Un projet nouveau permettrait d’en fabriquer beaucoup plus à un prix accessible.",
 l:"Révisez Trace écrite 3 §2 · partie I. Le terme **innovation** désigne une nouveauté appliquée qui transforme les façons de fabriquer ou de vivre. Pourquoi cette décision pourrait-elle compter dans l’histoire de l’usine ?",
 av:{i:"Nous craignons de financer un modèle dont personne ne connaît les ventes.", o:"Nous voulons être formés avant de fabriquer cette nouvelle voiture."},
 a:{q:"« Je lance le nouveau modèle. »", e:{i:-8,m:9},
    c:"Les clients espèrent un véhicule accessible, mais les actionnaires financent une fabrication encore incertaine.", dit:{i:"Nous devons engager notre argent sans connaître le succès du modèle.",m:"Nous pourrons enfin attendre une Ford moins chère."}},
 b:{q:"« Je perfectionne la voiture actuelle. »", e:{i:9,m:-8},
    c:"Les actionnaires protègent leurs investissements existants, mais les clients attendent une automobile moins chère.", dit:{i:"Nous conservons des ateliers que nous savons déjà faire fonctionner.",m:"Nous attendrons encore une automobile à prix abordable."}},
 c:{q:"« Je teste le modèle avant son lancement. »", e:{o:9,m:-8},
    c:"Les ouvriers apprennent progressivement la nouvelle fabrication, mais les clients attendent sa sortie.", dit:{m:"Nous devrons patienter jusqu’à la sortie de cette Ford.",o:"Nous apprendrons le nouveau montage avant la vente."}}},

{n:"06", t:"Des pièces qui ne s’ajustent pas", qui:"Frederick Hall, chef du contrôle des pièces",
 d:"« Je veux assembler les voitures sans devoir corriger chaque pièce. »",
 ex:"Trois ateliers livrent des pièces légèrement différentes. Les ouvriers passent des heures à les retailler pour monter chaque voiture.",
 l:"Révisez Trace écrite 3 §3. Le terme **standardisation** désigne la fabrication de pièces ou de produits selon un modèle identique. Quelles causes expliquent la situation, et quelles conséquences votre choix aura-t-il ?",
 av:{m:"Nous voulons des pièces de rechange qui entrent sans retouche.", o:"Nous voulons conserver la valeur de notre travail précis."},
 a:{q:"« J’impose des mesures identiques. »", e:{i:-8,m:9},
    c:"Les clients obtiennent des réparations plus simples, mais les actionnaires paient de nouveaux outils de contrôle.", dit:{i:"Nous devrons payer les outils qui vérifient chaque mesure.",m:"Nous pourrons faire réparer nos voitures avec des pièces identiques."}},
 b:{q:"« Je conserve les retouches manuelles. »", e:{o:9,m:-8},
    c:"Les ouvriers qualifiés gardent leur activité, mais les clients attendent plus longtemps leur voiture.", dit:{m:"Nous attendrons encore pendant que les ouvriers ajustent les pièces.",o:"Nous garderons les heures de travail nécessaires aux retouches."}},
 c:{q:"« Je contrôle d’abord les pièces essentielles. »", e:{i:9,o:-8},
    c:"Les actionnaires limitent les dépenses immédiates, mais les ouvriers continuent certaines retouches.", dit:{i:"Nous limiterons les dépenses en vérifiant d’abord les pièces essentielles.",o:"Nous devrons encore retailler les pièces laissées sans contrôle."}}},

{n:"07", t:"La voiture avance vers l’ouvrier", qui:"William Klann, ingénieur des ateliers",
 d:"« Je veux éviter que les équipes perdent du temps à circuler. »",
 ex:"Une équipe se déplace autour de chaque voiture pour la monter. Un ingénieur propose un tapis mobile faisant passer la voiture devant chaque poste.",
 l:"Révisez Trace écrite 3 §2. Le terme **chaîne de montage** désigne un système où le produit avance devant des ouvriers affectés à différentes tâches. Qu’est-ce qui resterait pareil, et qu’est-ce qui changerait avec votre décision ?",
 av:{i:"Nous voulons assembler plus de voitures sans déplacements inutiles.", o:"Nous voulons pouvoir bouger et régler notre propre geste."},
 a:{q:"« J’installe le tapis mobile. »", e:{i:9,o:-8},
    c:"Les actionnaires accélèrent la fabrication, mais les ouvriers perdent une part de liberté dans leurs gestes.", dit:{i:"Nous espérons monter davantage de voitures avec le tapis mobile.",o:"Nous devrons suivre la vitesse du tapis sans choisir notre rythme."}},
 b:{q:"« Je garde le montage immobile. »", e:{i:-8,o:9},
    c:"Les ouvriers conservent leurs déplacements variés, mais les actionnaires renoncent à une fabrication plus rapide.", dit:{i:"Nous renonçons à gagner du temps sur chaque assemblage.",o:"Nous garderons la liberté de circuler autour de la voiture."}},
 c:{q:"« Je teste la méthode sur une ligne. »", e:{i:9,m:-8},
    c:"Les actionnaires découvrent la nouvelle méthode, mais les clients attendent une offre plus abondante.", dit:{i:"Nous pourrons juger cette méthode sur une première ligne.",m:"Nous attendrons encore une production plus abondante."}}},

{n:"08", t:"Quatre-vingt-treize minutes par voiture", qui:"Harold Foster, ingénieur de production",
 d:"« Je veux sortir davantage de voitures chaque jour. »",
 ex:"Une nouvelle chaîne pourrait réduire fortement le temps de montage. L’équiper coûterait cher et imposerait un rythme strict aux équipes.",
 l:"Révisez Trace écrite 3 §3 · je m’entraîne. Le terme **production de masse** désigne la fabrication de très grandes quantités de produits semblables. Pourquoi cette décision pourrait-elle compter dans l’histoire de l’usine ?",
 av:{i:"Nous voulons connaître le coût des nouvelles chaînes avant de payer.", m:"Nous voulons acheter une voiture moins coûteuse grâce au montage rapide."},
 a:{q:"« Je transforme toutes les lignes. »", e:{o:-8,m:9},
    c:"Les clients espèrent des prix plus bas, mais les ouvriers doivent suivre le rythme des machines.", dit:{m:"Nous espérons que les voitures fabriquées plus vite coûteront moins.",o:"Nous devrons suivre la nouvelle chaîne sans ralentir les gestes."}},
 b:{q:"« Je conserve l’assemblage actuel. »", e:{i:-8,o:9},
    c:"Les ouvriers gardent leurs habitudes, mais les actionnaires renoncent à des ventes supplémentaires.", dit:{i:"Nous renoncerons aux ventes que permettrait un montage plus rapide.",o:"Nous conserverons notre manière actuelle de monter les voitures."}},
 c:{q:"« Je transforme une seule ligne. »", e:{i:9,m:-8},
    c:"Les actionnaires essaient la nouvelle installation, mais les clients attendent encore une baisse générale des prix.", dit:{i:"Nous pourrons mesurer les effets d’une seule chaîne transformée.",m:"Nous attendrons encore la baisse de prix promise par cette méthode."}}},

{n:"09", t:"Un seul geste par poste", qui:"Edwin Palmer, responsable de la formation",
 d:"« Je veux préparer rapidement les nouvelles équipes à leur poste. »",
 ex:"Les contremaîtres veulent confier à chacun une tâche très simple. La formation serait rapide, mais les ouvriers perdraient une partie de leur métier.",
 l:"Révisez Trace écrite 3 §3 · vocabulaire. Le terme **division du travail** désigne le partage de la fabrication en tâches confiées à des personnes différentes. Qu’est-ce qui resterait pareil, et qu’est-ce qui changerait avec votre décision ?",
 av:{i:"Nous voulons former vite les nouveaux ouvriers pour lancer les lignes.", o:"Nous voulons conserver plusieurs gestes plutôt que devenir remplaçables."},
 a:{q:"« Je donne un geste à chacun. »", e:{i:9,o:-8},
    c:"Les actionnaires accélèrent l’embauche, mais les ouvriers perdent leur maîtrise de la voiture entière.", dit:{i:"Nous pourrons recruter rapidement pour chaque geste simple.",o:"Nous ne saurons bientôt plus assembler une voiture entière."}},
 b:{q:"« Je maintiens des postes polyvalents. »", e:{i:-8,o:9},
    c:"Les ouvriers conservent plusieurs savoir-faire, mais les actionnaires doivent financer des formations longues.", dit:{i:"Nous paierons de longues formations pour chaque recrue.",o:"Nous conserverons le savoir-faire acquis sur plusieurs opérations."}},
 c:{q:"« Je permets d’apprendre plusieurs postes. »", e:{i:-8,o:9},
    c:"Les ouvriers gagnent des compétences variées, mais les actionnaires financent du temps de formation.", dit:{i:"Nous devrons rémunérer le temps consacré à ces apprentissages.",o:"Nous pourrons apprendre plusieurs postes au lieu d’un seul."}}},

{n:"10", t:"La vitesse du tapis roulant", qui:"George Wilson, contremaître de montage",
 d:"« Je veux davantage de voitures sans ajouter une seconde ligne. »",
 ex:"Les contremaîtres proposent d’accélérer le tapis qui transporte les voitures. Chaque ouvrier devrait alors accomplir ses gestes plus vite.",
 l:"Révisez Trace écrite 3 §4 · vocabulaire. Le terme **cadence** désigne le rythme auquel les gestes et les produits se succèdent au travail. Quelles causes expliquent la situation, et quelles conséquences votre choix aura-t-il ?",
 av:{i:"Nous voulons augmenter le nombre de voitures sorties chaque jour.", o:"Nous voulons assez de temps pour fixer correctement chaque pièce."},
 a:{q:"« J’augmente la vitesse du tapis. »", e:{i:9,o:-8},
    c:"Les actionnaires obtiennent plus de voitures, mais les ouvriers subissent des gestes plus pressés.", dit:{i:"Nous aurons davantage de voitures à vendre chaque semaine.",o:"Nous devrons courir après un tapis devenu plus rapide."}},
 b:{q:"« Je maintiens le rythme actuel. »", e:{i:-8,o:9},
    c:"Les ouvriers conservent un rythme connu, mais les actionnaires renoncent à des voitures supplémentaires.", dit:{i:"Nous renoncerons aux voitures supplémentaires promises par les chefs.",o:"Nous pourrons effectuer nos gestes au rythme déjà connu."}},
 c:{q:"« Je ralentis le tapis aux postes difficiles. »", e:{o:9,m:-8},
    c:"Les ouvriers gagnent du temps pour les gestes délicats, mais les clients doivent patienter davantage.", dit:{m:"Nous attendrons plus longtemps la livraison de notre voiture.",o:"Nous pourrons terminer les fixations délicates sans nous presser."}}},

{n:"11", t:"Le silence obligatoire à l’atelier", qui:"Henry Brooks, responsable de la discipline",
 d:"« Je veux que chacun reste concentré sur son travail. »",
 ex:"Un règlement interdit de parler et de s’asseoir pendant le service. Les chefs affirment que ces interdictions évitent les retards.",
 l:"Révisez Trace écrite 3 §4. Le terme **cadence** désigne le rythme auquel les gestes et les produits se succèdent au travail. Pourquoi cette décision pourrait-elle compter dans l’histoire de l’usine ?",
 av:{i:"Nous craignons que les conversations interrompent les lignes.", o:"Nous voulons pouvoir parler brièvement sans être punis."},
 a:{q:"« J’applique toutes les interdictions. »", e:{i:9,o:-8},
    c:"Les actionnaires espèrent moins d’arrêts, mais les ouvriers perdent des libertés ordinaires.", dit:{i:"Nous espérons éviter les pauses imprévues avec ces interdictions.",o:"Nous ne pourrons même plus échanger quelques mots au poste."}},
 b:{q:"« J’autorise la parole entre les tâches. »", e:{i:-8,o:9},
    c:"Les ouvriers peuvent échanger, mais les actionnaires craignent des interruptions plus fréquentes.", dit:{i:"Nous craignons que les conversations ralentissent certains ateliers.",o:"Nous pourrons nous parler entre deux opérations."}},
 c:{q:"« Je conserve seulement les règles de sécurité. »", e:{i:-8,p:9},
    c:"L’opinion voit des règles plus justes, mais les actionnaires abandonnent une partie de leur contrôle.", dit:{i:"Nous perdrons une partie du contrôle imposé aux équipes.",p:"Nous verrons une discipline limitée aux vrais dangers des machines."}}},

{n:"12", t:"Une usine que les ouvriers quittent", qui:"Samuel Carter, chef du recrutement",
 d:"« Je veux garder assez longtemps les hommes que nous formons. »",
 ex:"Les ouvriers quittent souvent leur poste après quelques semaines. Les embauches incessantes désorganisent les ateliers.",
 l:"Révisez Trace écrite 3 §4 · vocabulaire. Le terme **aliénation** désigne la perte de liberté et de sens que peut ressentir un travailleur dans son activité. Quelles causes expliquent la situation, et quelles conséquences votre choix aura-t-il ?",
 av:{i:"Nous voulons éviter de former sans cesse de nouveaux employés.", o:"Nous voulons un salaire qui compense ces journées épuisantes."},
 a:{q:"« J’augmente les salaires pour les retenir. »", e:{i:-8,o:9},
    c:"Les ouvriers ont une raison de rester, mais les actionnaires paient davantage chaque journée.", dit:{i:"Nous dépenserons davantage pour chaque journée travaillée.",o:"Nous aurons une meilleure paie pour supporter les postes difficiles."}},
 b:{q:"« Je recrute sans changer le travail. »", e:{i:9,o:-8},
    c:"Les actionnaires évitent une hausse salariale, mais les ouvriers continuent de subir un emploi épuisant.", dit:{i:"Nous éviterons de relever les salaires malgré les départs.",o:"Nous continuerons à quitter ces tâches qui nous épuisent."}},
 c:{q:"« Je rends les postes moins répétitifs. »", e:{i:-8,o:9},
    c:"Les ouvriers retrouvent de la variété, mais les actionnaires acceptent une fabrication moins rapide.", dit:{i:"Nous accepterons un montage plus lent pour retenir les équipes.",o:"Nous changerons enfin de gestes pendant la journée."}}},

{n:"13", t:"Cinq dollars par jour", qui:"James Couzens, administrateur de Ford",
 d:"« Je veux fidéliser les équipes même si les salaires augmentent. »",
 ex:"Les ouvriers quittent l’usine malgré les recrutements permanents. Une proposition prévoit de leur verser cinq dollars par jour, sous certaines conditions.",
 l:"Révisez Trace écrite 3 · vocabulaire. Le terme **fordisme** désigne une méthode associant fabrication en série, modèles uniformes et salaires élevés. Qu’est-ce qui resterait pareil, et qu’est-ce qui changerait avec votre décision ?",
 av:{i:"Nous craignons le coût de cette hausse dans tous les ateliers.", o:"Nous voulons savoir si les cinq dollars seront versés régulièrement."},
 a:{q:"« Je propose cinq dollars par jour. »", e:{i:-8,o:9},
    c:"Les ouvriers peuvent mieux vivre, mais les actionnaires supportent une forte hausse des salaires.", dit:{i:"Nous devrons consacrer beaucoup plus d’argent aux paies.",o:"Nous pourrons mieux nourrir nos familles avec cinq dollars."}},
 b:{q:"« Je garde les salaires actuels. »", e:{i:9,o:-8},
    c:"Les actionnaires préservent leurs dépenses, mais les ouvriers continuent à quitter les ateliers.", dit:{i:"Nous garderons les dépenses salariales au niveau actuel.",o:"Nous n’aurons aucune raison nouvelle de rester dans cette usine."}},
 c:{q:"« J’augmente les salaires par étapes. »", e:{o:9,m:-8},
    c:"Les ouvriers voient leur paie progresser, mais les clients attendent les effets d’une usine plus stable.", dit:{m:"Nous attendrons encore les voitures promises par des équipes plus stables.",o:"Nous verrons notre salaire augmenter sans attendre un seul grand changement."}}},

{n:"14", t:"Une place pour d’autres travailleurs", qui:"Edward Price, responsable de l’affectation des postes",
 d:"« Je veux donner une chance aux candidats capables de travailler assis. »",
 ex:"Plusieurs postes peuvent se tenir assis et demandent peu d’efforts physiques. Des candidats jusque-là écartés demandent à les occuper.",
 l:"Révisez Trace écrite 3 §4. Le terme **division du travail** désigne le partage de la fabrication en tâches confiées à des personnes différentes. Quels intérêts influencent les points de vue des personnes concernées ?",
 av:{i:"Nous craignons le coût des changements nécessaires aux postes.", p:"Nous voulons que les candidats écartés puissent travailler assis."},
 a:{q:"« J’ouvre les postes adaptés. »", e:{i:-8,p:9},
    c:"L’opinion soutient un accès élargi au travail, mais les actionnaires paient les aménagements nécessaires.", dit:{i:"Nous devrons financer les nouveaux aménagements des ateliers.",p:"Nous verrons davantage de personnes accéder aux postes adaptés."}},
 b:{q:"« Je garde les recrutements habituels. »", e:{i:9,o:-8},
    c:"Les actionnaires évitent de modifier les ateliers, mais les ouvriers exclus perdent des possibilités d’emploi.", dit:{i:"Nous n’aurons pas à modifier les postes déjà installés.",o:"Nous resterons exclus malgré notre capacité à travailler assis."}},
 c:{q:"« Je commence par un atelier accessible. »", e:{o:9,p:-8},
    c:"Les ouvriers concernés obtiennent quelques postes, mais l’opinion juge l’effort encore limité.", dit:{o:"Nous pourrons enfin occuper quelques postes adaptés.",p:"Nous jugeons cet unique atelier trop limité pour les autres candidats."}}},

{n:"15", t:"Le noir ou davantage de couleurs", qui:"Helen Wright, responsable des commandes automobiles",
 d:"« Je veux pouvoir promettre aux acheteurs une couleur qui leur plaît. »",
 ex:"La peinture noire utilisée sèche rapidement sur nos voitures. Offrir davantage de couleurs imposerait d’autres délais de finition.",
 l:"Révisez Trace écrite 3 §3. Le terme **standardisation** désigne la fabrication de pièces ou de produits selon un modèle identique. Quelles causes expliquent la situation, et quelles conséquences votre choix aura-t-il ?",
 av:{m:"Nous voulons choisir la couleur de la voiture que nous achetons.", p:"Nous voulons savoir pourquoi les couleurs ne sont pas accessibles à tous."},
 a:{q:"« Je conserve uniquement le noir. »", e:{i:9,m:-8},
    c:"Les actionnaires maintiennent un rythme rapide, mais les clients perdent le choix de la couleur.", dit:{i:"Nous conserverons une peinture rapide pour la chaîne.",m:"Nous ne pourrons toujours commander que des voitures noires."}},
 b:{q:"« Je propose plusieurs couleurs. »", e:{i:-8,m:9},
    c:"Les clients choisissent davantage, mais les actionnaires acceptent des délais et des coûts supplémentaires.", dit:{i:"Nous devrons ralentir la finition pour ces nouvelles peintures.",m:"Nous pourrons choisir une couleur à notre goût."}},
 c:{q:"« Je propose des couleurs avec un supplément. »", e:{m:9,p:-8},
    c:"Les clients fortunés gagnent des options, mais l’opinion critique un choix réservé aux plus riches.", dit:{m:"Nous pourrons commander une autre couleur en payant davantage.",p:"Nous critiquons ce choix réservé aux acheteurs les plus riches."}}},

{n:"16", t:"Encore réduire le prix", qui:"Robert Jenkins, vendeur de voitures",
 d:"« Je veux toucher les familles qui hésitent devant le prix. »",
 ex:"Le prix de notre voiture a déjà fortement diminué. De nouveaux acheteurs pourraient arriver si nous le baissions encore.",
 l:"Révisez Trace écrite 3 §3 · je m’entraîne. Le terme **société de consommation** désigne une société où l’achat de biens fabriqués en série prend une grande place. Quelles causes expliquent la situation, et quelles conséquences votre choix aura-t-il ?",
 av:{m:"Nous voulons une baisse de prix qui rende la Ford accessible.", p:"Nous voulons voir davantage de familles pouvoir se déplacer."},
 a:{q:"« Je baisse encore le prix. »", e:{i:-8,m:9},
    c:"Les clients paient moins cher, mais les actionnaires gagnent moins sur chaque voiture.", dit:{i:"Nous toucherons moins d’argent sur chaque vente.",m:"Nous paierons moins cher notre prochaine voiture."}},
 b:{q:"« Je maintiens le tarif actuel. »", e:{i:9,m:-8},
    c:"Les actionnaires préservent leurs recettes par vente, mais les clients modestes restent hésitants.", dit:{i:"Nous garderons le montant actuel de chaque vente.",m:"Nous hésiterons encore à acheter malgré notre besoin de voiture."}},
 c:{q:"« J’accorde une remise aux familles modestes. »", e:{i:-8,p:9},
    c:"L’opinion apprécie cet accès élargi, mais les actionnaires financent les réductions.", dit:{i:"Nous financerons la réduction accordée à ces acheteurs.",p:"Nous approuvons cette remise réservée aux familles moins aisées."}}},

{n:"17", t:"Une voiture payée en plusieurs fois", qui:"Daniel Morgan, directeur commercial",
 d:"« Je veux convaincre des familles qui ne peuvent pas payer comptant. »",
 ex:"Des familles souhaitent acheter une voiture sans disposer du prix entier. Un vendeur propose de les laisser payer par mensualités.",
 l:"Révisez Trace écrite 3 §3 · vocabulaire. Le terme **société de consommation** désigne une société où l’achat de biens fabriqués en série prend une grande place. Quelles causes expliquent la situation, et quelles conséquences votre choix aura-t-il ?",
 av:{i:"Nous craignons que certaines familles cessent de payer leurs mensualités.", m:"Nous voulons payer notre voiture sans verser tout le prix immédiatement."},
 a:{q:"« J’autorise les paiements échelonnés. »", e:{i:-8,m:9},
    c:"Les clients achètent plus tôt, mais les actionnaires risquent des versements impayés.", dit:{i:"Nous risquons de ne jamais recevoir certains versements.",m:"Nous pourrons conduire avant d’avoir réuni tout le prix."}},
 b:{q:"« J’exige le paiement immédiat. »", e:{i:9,m:-8},
    c:"Les actionnaires évitent les créances impayées, mais les clients sans épargne renoncent à acheter.", dit:{i:"Nous recevrons tout le prix au moment de chaque vente.",m:"Nous devrons renoncer faute d’avoir la somme entière."}},
 c:{q:"« Je demande un acompte important. »", e:{i:9,m:-8},
    c:"Les actionnaires limitent les impayés, mais les clients pauvres restent écartés.", dit:{i:"Nous limiterons les pertes possibles avec un acompte important.",m:"Nous ne pourrons toujours pas réunir assez d’argent au départ."}}},

{n:"18", t:"La concurrence change de voiture", qui:"Frank Adams, concessionnaire Ford",
 d:"« Je veux garder mes acheteurs face aux nouveaux modèles. »",
 ex:"Un constructeur rival renouvelle régulièrement la forme de ses automobiles. Des acheteurs trouvent notre modèle ancien malgré son faible prix.",
 l:"Révisez Trace écrite 3 §3. Le terme **société de consommation** désigne une société où l’achat de biens fabriqués en série prend une grande place. Qu’est-ce qui resterait pareil, et qu’est-ce qui changerait avec votre décision ?",
 av:{i:"Nous voulons conserver nos acheteurs face aux modèles concurrents.", o:"Nous voulons éviter une nouvelle organisation qui menace nos postes."},
 a:{q:"« Je renouvelle la carrosserie. »", e:{i:-8,m:9},
    c:"Les clients découvrent une allure nouvelle, mais les actionnaires paient la transformation des machines.", dit:{i:"Nous devrons remplacer des outils encore utilisables.",m:"Nous retrouverons une carrosserie qui paraît moins ancienne."}},
 b:{q:"« Je conserve le dessin actuel. »", e:{i:9,m:-8},
    c:"Les actionnaires évitent des dépenses, mais les clients attirés par la nouveauté partent ailleurs.", dit:{i:"Nous éviterons le coût d’un changement de carrosserie.",m:"Nous irons voir les concurrents qui proposent des formes nouvelles."}},
 c:{q:"« Je propose une nouvelle finition. »", e:{o:-8,m:9},
    c:"Les clients gagnent un peu de choix, mais les ouvriers doivent gérer davantage de variantes.", dit:{m:"Nous aurons enfin une finition différente au catalogue.",o:"Nous devrons apprendre à monter ces variantes supplémentaires."}}},

{n:"19", t:"Une pleine page de publicité", qui:"Alice Parker, responsable des annonces",
 d:"« Je veux donner aux lecteurs envie de conduire notre voiture. »",
 ex:"Une agence propose une grande annonce dans les magazines illustrés. Elle promet de présenter la voiture comme un signe de liberté.",
 l:"Révisez Trace écrite 3 §3. Le terme **société de consommation** désigne une société où l’achat de biens fabriqués en série prend une grande place. Pourquoi cette décision pourrait-elle compter dans l’histoire de l’usine ?",
 av:{i:"Nous craignons de payer une pleine page sans vendre davantage.", m:"Nous voulons voir clairement ce que cette Ford peut nous apporter."},
 a:{q:"« J’achète la grande annonce. »", e:{i:-8,m:9},
    c:"Les clients découvrent notre offre, mais les actionnaires paient une campagne coûteuse.", dit:{i:"Nous engagerons une forte somme pour une annonce.",m:"Nous découvrirons la voiture présentée dans nos magazines."}},
 b:{q:"« Je préfère les démonstrations en ville. »", e:{i:9,m:-8},
    c:"Les actionnaires évitent une grande facture, mais les clients éloignés connaissent moins notre voiture.", dit:{i:"Nous éviterons la facture de cette publicité grand format.",m:"Nous connaîtrons mal cette Ford loin des villes de démonstration."}},
 c:{q:"« Je publie une petite annonce. »", e:{i:9,m:-8},
    c:"Les actionnaires limitent les frais, mais les clients voient moins souvent notre modèle.", dit:{i:"Nous limiterons la dépense en choisissant un petit espace.",m:"Nous verrons moins souvent cette voiture dans nos magazines."}}},

{n:"20", t:"Des voitures sans acheteurs", qui:"Oliver Scott, responsable des entrepôts",
 d:"« Je veux libérer les hangars avant qu’ils soient pleins. »",
 ex:"Nos entrepôts se remplissent de voitures invendues. Continuer à fabriquer au même rythme augmenterait encore les stocks.",
 l:"Révisez Trace écrite 3 §5. Le terme **production de masse** désigne la fabrication de très grandes quantités de produits semblables. Quelles causes expliquent la situation, et quelles conséquences votre choix aura-t-il ?",
 av:{i:"Nous voulons éviter que les hangars débordent encore.", m:"Nous voulons profiter de prix plus bas sur les voitures invendues."},
 a:{q:"« Je baisse les prix pour vendre. »", e:{i:-8,m:9},
    c:"Les clients trouvent des voitures moins chères, mais les actionnaires acceptent moins d’argent par vente.", dit:{i:"Nous recevrons moins d’argent pour chaque voiture écoulée.",m:"Nous achèterons certaines Ford à un prix plus accessible."}},
 b:{q:"« Je ralentis les chaînes. »", e:{i:9,o:-8},
    c:"Les actionnaires limitent les stocks, mais les ouvriers perdent des heures payées.", dit:{i:"Nous empêcherons les stocks de grossir trop vite.",o:"Nous perdrons des heures de travail et une partie de la paie."}},
 c:{q:"« Je conserve la fabrication actuelle. »", e:{i:-8,o:9},
    c:"Les ouvriers gardent leur activité immédiate, mais les actionnaires accumulent les voitures invendues.", dit:{i:"Nous accumulerons encore des voitures que personne ne commande.",o:"Nous garderons notre travail pendant que les chaînes tournent."}}},

{n:"21", t:"La fin d’un modèle célèbre", qui:"George Marshall, directeur des usines",
 d:"« Je veux préparer un autre modèle sans ruiner notre organisation. »",
 ex:"La Ford T se vend moins bien malgré son immense succès. Concevoir sa remplaçante oblige à arrêter une partie des ateliers.",
 l:"Révisez Trace écrite 3 · je m’entraîne. Le terme **standardisation** désigne la fabrication de pièces ou de produits selon un modèle identique. Pourquoi cette décision pourrait-elle compter dans l’histoire de l’usine ?",
 av:{i:"Nous voulons remplacer la Ford T sans engager une ruine.", o:"Nous voulons connaître la durée de l’arrêt avant de perdre notre paie."},
 a:{q:"« J’arrête la chaîne pour changer de modèle. »", e:{o:-8,m:9},
    c:"Les clients attendent une nouvelle voiture, mais les ouvriers risquent une période sans salaire.", dit:{m:"Nous espérons découvrir enfin une voiture adaptée à nos goûts.",o:"Nous risquons plusieurs semaines sans travail durant le changement."}},
 b:{q:"« Je prolonge la fabrication actuelle. »", e:{o:9,m:-8},
    c:"Les ouvriers conservent leur poste à court terme, mais les clients cherchent des modèles plus récents.", dit:{m:"Nous continuerons à voir un modèle qui ne nous attire plus.",o:"Nous conserverons nos postes tant que l’ancienne Ford est fabriquée."}},
 c:{q:"« Je transforme les ateliers progressivement. »", e:{i:9,m:-8},
    c:"Les actionnaires étalent les dépenses, mais les clients attendent plus longtemps la nouveauté.", dit:{i:"Nous pourrons répartir le coût des nouvelles installations.",m:"Nous patienterons davantage avant de découvrir la remplaçante."}}},

{n:"22", t:"La semaine de cinq jours", qui:"Joseph Allen, responsable des horaires",
 d:"« Je veux garder des équipes reposées sans perdre nos commandes. »",
 ex:"La direction envisage de passer de six à cinq jours de travail. Les ouvriers gagneraient du repos, mais les ateliers fermeraient davantage.",
 l:"Révisez Trace écrite 3 · vocabulaire. Le terme **fordisme** désigne une méthode associant fabrication en série, modèles uniformes et salaires élevés. Pourquoi cette décision pourrait-elle compter dans l’histoire de l’usine ?",
 av:{m:"Nous voulons recevoir les voitures commandées sans nouveaux retards.", o:"Nous voulons une journée libre de plus chaque semaine."},
 a:{q:"« Je passe à cinq jours. »", e:{i:-8,o:9},
    c:"Les ouvriers gagnent du repos, mais les actionnaires craignent moins de voitures fabriquées.", dit:{i:"Nous craignons de fabriquer moins de voitures chaque semaine.",o:"Nous pourrons nous reposer deux jours sans venir à l’usine."}},
 b:{q:"« Je conserve six jours. »", e:{i:9,o:-8},
    c:"Les actionnaires maintiennent les journées de fabrication, mais les ouvriers restent davantage à l’usine.", dit:{i:"Nous garderons six journées de fabrication dans les ateliers.",o:"Nous continuerons à travailler presque toute la semaine."}},
 c:{q:"« Je teste cinq jours dans un atelier. »", e:{m:-8,p:9},
    c:"L’opinion salue l’essai d’horaires plus courts, mais les clients attendent des résultats incertains.", dit:{m:"Nous ignorons encore si cet essai retardera nos livraisons.",p:"Nous approuvons cet essai de repos supplémentaire dans un atelier."}}},

{n:"23", t:"Quatre cents fois la même vis", qui:"Margaret Lewis, ouvrière à la ligne de montage",
 d:"« Je veux que vous entendiez ce que mes journées sont devenues. »",
 ex:"Une ouvrière fixe la même vis depuis des mois. Elle demande à expliquer ce que cette répétition lui fait ressentir.",
 l:"Révisez Trace écrite 3 §4. Le terme **aliénation** désigne la perte de liberté et de sens que peut ressentir un travailleur dans son activité. Quels intérêts influencent les points de vue des personnes concernées ?",
 av:{o:"Nous voulons que la direction entende notre fatigue à la chaîne.", p:"Nous voulons que les témoignages ouvriers soient entendus publiquement."},
 a:{q:"« Je l’écoute devant les responsables. »", e:{i:-8,o:9},
    c:"Les ouvriers peuvent décrire leur fatigue, mais les actionnaires affrontent des critiques publiques.", dit:{i:"Nous craignons que ces critiques abîment la réputation de l’usine.",o:"Nous pourrons dire devant les chefs ce que répéter cette vis nous fait."}},
 b:{q:"« Je demande un rapport écrit. »", e:{i:9,o:-8},
    c:"Les actionnaires préservent l’ordre des réunions, mais les ouvriers perdent une parole directe.", dit:{i:"Nous pourrons recevoir le témoignage sans bouleverser la réunion.",o:"Nous perdons la possibilité de raconter directement notre journée."}},
 c:{q:"« Je lui propose un autre poste. »", e:{o:9,p:-8},
    c:"Les ouvriers gagnent une possibilité de changement, mais l’opinion regrette une réponse seulement individuelle.", dit:{o:"Nous pourrons quitter ce poste où nous répétons la même vis.",p:"Nous trouvons insuffisant de changer un poste sans écouter les autres."}}},

{n:"24", t:"Changer de poste pendant la semaine", qui:"Peter Howard, chef d’atelier",
 d:"« Je veux garder mes équipes sans briser notre rythme de travail. »",
 ex:"Répéter le même geste épuise plusieurs équipes. Échanger régulièrement les postes ralentirait toutefois la fabrication.",
 l:"Révisez Trace écrite 3 §4 · vocabulaire. Le terme **aliénation** désigne la perte de liberté et de sens que peut ressentir un travailleur dans son activité. Quelles causes expliquent la situation, et quelles conséquences votre choix aura-t-il ?",
 av:{i:"Nous voulons éviter toute baisse du nombre de voitures montées.", o:"Nous voulons alterner les tâches pour ne plus répéter le même geste."},
 a:{q:"« J’organise une rotation régulière. »", e:{i:-8,o:9},
    c:"Les ouvriers retrouvent des tâches variées, mais les actionnaires acceptent un rythme plus lent.", dit:{i:"Nous accepterons un montage moins rapide avec ces changements.",o:"Nous apprendrons plusieurs tâches et subirons moins la répétition."}},
 b:{q:"« Je maintiens les postes fixes. »", e:{i:9,o:-8},
    c:"Les actionnaires gardent une cadence élevée, mais les ouvriers continuent de subir la monotonie.", dit:{i:"Nous garderons le rythme obtenu avec les postes fixes.",o:"Nous répéterons toujours le même geste toute la journée."}},
 c:{q:"« Je propose une rotation volontaire. »", e:{o:9,m:-8},
    c:"Les ouvriers qui le souhaitent changent de tâche, mais les clients risquent des délais supplémentaires.", dit:{m:"Nous risquons d’attendre nos voitures si les équipes alternent.",o:"Nous pourrons choisir de changer de poste pendant la semaine."}}},

{n:"25", t:"Voir enfin la voiture terminée", qui:"Richard Evans, responsable des équipes",
 d:"« Je veux montrer à chacun ce que nous construisons ensemble. »",
 ex:"Les équipes ne voient presque jamais les voitures achevées. Une visite de la sortie des chaînes interromprait une demi-journée de travail.",
 l:"Révisez Trace écrite 3 §4 · vocabulaire. Le terme **aliénation** désigne la perte de liberté et de sens que peut ressentir un travailleur dans son activité. Quels intérêts influencent les points de vue des personnes concernées ?",
 av:{i:"Nous voulons éviter une demi-journée d’arrêt de fabrication.", o:"Nous voulons voir la voiture terminée grâce à nos gestes."},
 a:{q:"« J’organise la visite pour tous. »", e:{i:-8,o:9},
    c:"Les ouvriers découvrent la voiture entière, mais les actionnaires financent une demi-journée sans fabrication.", dit:{i:"Nous paierons une demi-journée pendant laquelle les chaînes seront arrêtées.",o:"Nous comprendrons enfin ce que toutes nos tâches permettent de construire."}},
 b:{q:"« Je conserve les horaires habituels. »", e:{i:9,o:-8},
    c:"Les actionnaires préservent le travail du jour, mais les ouvriers restent éloignés du résultat final.", dit:{i:"Nous garderons une journée entière de fabrication.",o:"Nous resterons sans voir les voitures sortir des ateliers."}},
 c:{q:"« Je propose des visites par petits groupes. »", e:{o:9,m:-8},
    c:"Les ouvriers voient le produit terminé, mais les clients attendent une fabrication légèrement ralentie.", dit:{m:"Nous patienterons un peu plus pour recevoir certaines commandes.",o:"Nous pourrons découvrir la voiture achevée par petits groupes."}}},

{n:"26", t:"Les paroles du patron", qui:"Eleanor Davis, journaliste locale",
 d:"« Je veux publier aussi les réactions de ceux qui travaillent ici. »",
 ex:"Henry Ford publie sa vision du travail ouvrier. Certains passages prétendent que beaucoup d’hommes préfèrent répéter un geste sans réfléchir.",
 l:"Révisez Trace écrite 3 §4. Le terme **perspective** désigne le point de vue d’une personne, influencé par sa place et ses intérêts. Quels intérêts influencent les points de vue des personnes concernées ?",
 av:{i:"Nous voulons que le texte de Ford inspire confiance dans les ateliers.", p:"Nous voulons entendre aussi ceux qui répètent ces gestes chaque jour."},
 a:{q:"« Je publie le texte du patron seul. »", e:{i:9,o:-8},
    c:"Les actionnaires diffusent la vision de Ford, mais les ouvriers ne peuvent pas donner la leur.", dit:{i:"Nous diffuserons la vision du travail défendue par notre patron.",o:"Nous n’aurons pas l’occasion de contester ses paroles."}},
 b:{q:"« Je publie aussi des paroles ouvrières. »", e:{i:-8,o:9},
    c:"Les ouvriers exposent leur expérience, mais les actionnaires redoutent des critiques de l’usine.", dit:{i:"Nous craignons que ces récits dévoilent les difficultés de l’usine.",o:"Nous pourrons raconter notre expérience derrière les machines."}},
 c:{q:"« Je fais débattre plusieurs témoins. »", e:{i:-8,p:9},
    c:"L’opinion entend différents points de vue, mais les actionnaires perdent le contrôle du récit.", dit:{i:"Nous ne déciderons plus seuls de ce qui sera raconté.",p:"Nous pourrons comparer les avis du patron et des ouvriers."}}},

{n:"27", t:"Des tracts devant nos portes", qui:"Michael Turner, chef de la sécurité",
 d:"« Je veux éviter tout trouble devant les entrées de l’usine. »",
 ex:"Un organisateur distribue des tracts appelant les ouvriers à se réunir. Le service de sécurité propose de le chasser du trottoir.",
 l:"Révisez Trace écrite 3 §5. Le terme **inégalité** désigne une différence de traitement, de ressources ou de droits entre des personnes. Qu’est-ce qui resterait pareil, et qu’est-ce qui changerait avec votre décision ?",
 av:{i:"Nous craignons que ces tracts déclenchent un arrêt des chaînes.", p:"Nous voulons que chacun puisse entendre les revendications des ouvriers."},
 a:{q:"« Je laisse distribuer les tracts. »", e:{i:-8,o:9},
    c:"Les ouvriers peuvent s’organiser, mais les actionnaires craignent un mouvement de contestation.", dit:{i:"Nous craignons de voir les équipes contester notre autorité.",o:"Nous pourrons lire les tracts et préparer une réunion."}},
 b:{q:"« Je demande aux gardes d’intervenir. »", e:{i:9,o:-8},
    c:"Les actionnaires préservent leur autorité, mais les ouvriers perdent une occasion de s’exprimer.", dit:{i:"Nous conserverons le contrôle des entrées de l’usine.",o:"Nous ne pourrons pas distribuer librement nos appels à nous organiser."}},
 c:{q:"« Je propose une rencontre avec les délégués. »", e:{i:-8,p:9},
    c:"L’opinion apprécie le dialogue, mais les actionnaires doivent écouter des revendications.", dit:{i:"Nous devrons répondre directement aux demandes des délégués.",p:"Nous approuvons une rencontre plutôt qu’une intervention des gardes."}}},

{n:"28", t:"Un candidat venu du Sud", qui:"James Robinson, candidat à un emploi industriel",
 d:"« Je veux être jugé sur mon travail plutôt que sur ma couleur. »",
 ex:"Un homme noir venu de Géorgie se présente à l’embauche. Les usages discriminatoires locaux limitent souvent ces candidats aux emplois les plus pénibles.",
 l:"Révisez Trace écrite 3 §5. Le terme **inégalité** désigne une différence de traitement, de ressources ou de droits entre des personnes. Pourquoi cette décision pourrait-elle compter dans l’histoire de l’usine ?",
 av:{i:"Nous craignons les réactions de ceux qui refusent de travailler avec lui.", p:"Nous voulons que ce candidat soit jugé selon ses capacités."},
 a:{q:"« Je lui ouvre tous les postes accessibles. »", e:{i:-8,p:9},
    c:"L’opinion favorable à l’égalité soutient cette possibilité, mais les actionnaires affrontent les résistances discriminatoires.", dit:{i:"Nous risquons des tensions en rompant avec les usages discriminatoires.",p:"Nous soutenons l’accès de cet homme aux mêmes postes que les autres."}},
 b:{q:"« Je le recrute seulement à la fonderie. »", e:{i:9,o:-8},
    c:"Les actionnaires conservent les usages de recrutement, mais les ouvriers noirs restent cantonnés aux tâches difficiles.", dit:{i:"Nous conserverons les affectations habituelles des nouveaux embauchés.",o:"Nous resterons confinés aux tâches les plus pénibles à la fonderie."}},
 c:{q:"« Je crée une sélection par épreuve pratique. »", e:{i:-8,o:9},
    c:"Les ouvriers candidats gagnent un critère plus équitable, mais les actionnaires doivent revoir leurs procédures.", dit:{i:"Nous devrons revoir les méthodes de recrutement de nos ateliers.",o:"Nous pourrons montrer nos capacités dans une épreuve pratique."}}},

{n:"29", t:"Après le krach de la Bourse", qui:"Thomas Baker, directeur financier",
 d:"« Je veux éviter que nos entrepôts se remplissent sans fin. »",
 ex:"Après octobre 1929, les commandes de voitures diminuent. Nos ateliers doivent choisir entre produire moins et conserver l’ensemble des équipes.",
 l:"Révisez Trace écrite 3 §5. Le terme **production de masse** désigne la fabrication de très grandes quantités de produits semblables. Quelles causes expliquent la situation, et quelles conséquences votre choix aura-t-il ?",
 av:{i:"Nous voulons éviter de fabriquer des voitures qui restent invendues.", m:"Nous voulons des Ford moins chères malgré les difficultés du pays."},
 a:{q:"« Je réduis les heures de fabrication. »", e:{i:9,o:-8},
    c:"Les actionnaires limitent les stocks, mais les ouvriers touchent moins de salaire.", dit:{i:"Nous limiterons l’accumulation des voitures après la chute des commandes.",o:"Nous toucherons moins d’argent avec nos heures supprimées."}},
 b:{q:"« Je maintiens les équipes à plein temps. »", e:{i:-8,o:9},
    c:"Les ouvriers conservent leur salaire, mais les actionnaires paient des voitures difficiles à vendre.", dit:{i:"Nous paierons les équipes pour des voitures difficiles à vendre.",o:"Nous garderons notre salaire malgré la baisse des commandes."}},
 c:{q:"« Je baisse les prix des modèles restants. »", e:{i:-8,m:9},
    c:"Les clients profitent de tarifs réduits, mais les actionnaires perdent une partie de leurs recettes.", dit:{i:"Nous recevrons moins de dollars pour chaque voiture vendue.",m:"Nous pourrons acheter les derniers modèles à prix réduit."}}},

{n:"30", t:"Des chômeurs devant l’usine", qui:"William Cooper, représentant des chômeurs",
 d:"« Je veux présenter nos demandes sans être frappé par les gardes. »",
 ex:"Des milliers de personnes sans emploi marchent vers les ateliers Ford. Les gardes demandent comment recevoir la foule qui réclame du travail.",
 l:"Révisez Trace écrite 3, conclusion. Le terme **progrès technique** désigne une amélioration des outils ou des méthodes de fabrication. Pourquoi cette décision pourrait-elle compter dans l’histoire de l’usine ?",
 av:{i:"Nous voulons protéger les ateliers sans aggraver le rassemblement.", p:"Nous voulons que les gardes respectent la foule sans emploi."},
 a:{q:"« Je reçois une délégation. »", e:{i:-8,o:9},
    c:"Les ouvriers obtiennent une écoute, mais les actionnaires doivent affronter des demandes d’embauche.", dit:{i:"Nous devrons discuter de demandes d’embauche difficiles à satisfaire.",o:"Nous pourrons présenter nos demandes de travail à la direction."}},
 b:{q:"« Je fais fermer les grilles. »", e:{i:9,p:-8},
    c:"Les actionnaires protègent l’accès aux ateliers, mais l’opinion condamne le refus de dialogue.", dit:{i:"Nous empêcherons la foule d’entrer dans les bâtiments.",p:"Nous condamnons des grilles fermées devant des familles sans emploi."}},
 c:{q:"« J’organise une distribution de secours. »", e:{i:-8,p:9},
    c:"L’opinion salue une aide immédiate, mais les actionnaires financent les distributions.", dit:{i:"Nous devrons financer des secours alors que les ventes baissent.",p:"Nous approuvons cette aide aux personnes privées de salaire."}}},
];

/* ---- les fins du niveau II ------------------------------------- */
const FINS_II = {

    x:"Les ouvriers vous ont lâché. Grèves, sabotages, postes désertés : la chaîne ne tient que si chaque maillon est occupé, et vous avez fini par n’avoir plus personne à y mettre. <strong>Le travail décomposé rend chaque homme remplaçable — et l’usine entière dépendante de tous à la fois.</strong>"},
 i:{t:"Les actionnaires ont repris la main",

    x:"Les clients vous ont lâché. On a préféré la voiture d’en face, plus neuve, vendue à crédit et changée chaque année. Les stocks dorment dans les entrepôts. <strong>Produire moins cher ne sert à rien si personne ne veut plus de ce que vous produisez.</strong>"},
 p:{t:"La commission d’enquête est arrivée",
    x:"L’opinion vous a lâché. Journaux, élus, tribunaux : ce qui se passait derrière vos grilles est devenu une affaire publique. <strong>Une entreprise assez grande finit toujours par relever de la politique.</strong>"},
};

const FORD={qui:"Henry Ford, sur le travail à la chaîne",
 cit:"L’homme moyen cherche un travail où il n’ait pas à se dépenser, et par-dessus tout un travail où il n’ait pas à penser. Pour la plupart des esprits, la tâche qui se répète est un soulagement.",
 src:"D’après Ma vie et mon œuvre, 1922 — traduction pédagogique adaptée."};
const GRAMSCI={qui:"Antonio Gramsci, en prison",
 cit:"On cherche à obtenir de l’ouvrier des gestes qui ne demandent plus aucune participation de son intelligence. Mais l’homme, même réduit au geste, continue de penser — et c’est en pensant qu’il devient non conformiste.",
 src:"D’après Américanisme et fordisme, 1934 — traduction pédagogique adaptée."};

function VERDICT_II(f){
  const prod=(f.i+f.m)/2, humain=(f.o+f.p)/2;
  if(prod>=62&&humain>=58) return {t:"Une usine que l’on peut défendre",
    x:"Vous avez produit en masse sans broyer ceux qui produisaient. C’est rare, et ce n’est pas ce qu’a fait l’histoire. Vos deux témoins ne décrivent pas la même usine, et ils ont tous les deux raison : <strong>c’est exactement cela, nuancer l’idée de progrès.</strong>",
    tem:[FORD,GRAMSCI]};
  if(prod>=55) return {t:"Quinze millions de voitures, et des hommes usés",
    x:"Les chiffres sont écrasants : jamais on n’avait produit autant, ni si bon marché. Reste ce qu’un observateur en a écrit depuis sa cellule. <strong>Le gain de productivité est réel — la question est de savoir qui l’a payé.</strong>",
    tem:[GRAMSCI]};
  if(prod<45) return {t:"L’atelier qui n’est pas devenu une usine",
    x:"Sans organisation nouvelle, sans capitaux, sans marché de masse, la voiture reste ce qu’elle était en 1900 : un objet de luxe monté à la main. <strong>La deuxième révolution industrielle n’est pas une invention, c’est une méthode.</strong>",
    tem:[]};
  return {t:"Une maison qui a hésité",
    x:"Ni Highland Park, ni la faillite. Vous avez avancé prudemment, alors que l’époque, elle, ne l’a pas fait — et que vos concurrents non plus.",
    tem:[FORD]};
}

/* ==================================================================
   LES ÉVÉNEMENTS
   Ils ne se choisissent pas : ils tombent. Tous sont authentiques,
   datés, et le jeu dit lequel — c'est ce qui les sépare des cartes,
   où les personnages sont des figures composites.

   En campagne ils arrivent à leur date réelle : Peterloo en 1819,
   le krach en 1929. En survie ils sont tirés au sort, parce qu'il
   n'y a plus de calendrier.

   Certains laissent une décision à prendre dans l'urgence. Le temps
   qui s'écoule fait partie de la leçon : ne pas trancher est aussi
   une façon de trancher.
   ================================================================== */

/* ==================================================================
   LA TRACE DE TRAVAIL
   Ce que l'élève emporte, et ce que le professeur récupère.
   ================================================================== */

/* On ne tire que des questions portant sur ce qu'il a réellement vu. */
function questionsDeLaPartie(){
  const vues = new Set(E.carnet.map(d=>d.t));
  const evs  = new Set(E.evVus);
  let lot = N.quiz.filter(q => (q.c && vues.has(q.c)) || (q.ev && evs.has(q.ev)));
  /* s'il en manque, on complète avec le reste du niveau */
  if(lot.length < 8){
    const reste = N.quiz.filter(q => !lot.includes(q));
    melanger(reste);
    lot = lot.concat(reste.slice(0, 8-lot.length));
  }
  melanger(lot);

  /* LES REPONSES ELLES-MEMES. Les questions ont ete ecrites avec la
     bonne reponse en premier — b:0 partout. Sans ce melange, un eleve
     qui l'a remarque repond juste huit fois sur huit sans rien savoir.
     On rend une COPIE de chaque question : « N.quiz » est partage entre
     les parties, et melanger l'original le melangerait a nouveau a la
     partie suivante, jusqu'a ce que « b » ne designe plus rien. */
  return lot.slice(0, 8).map(q => {
    const juste = q.r[q.b];
    const r = q.r.slice();
    melanger(r);
    return Object.assign({}, q, { r, b: r.indexOf(juste) });
  });
}

function melanger(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
}

function rendreTrace(){
  /* y étions-nous déjà ? alors on garde la place du lecteur */
  const dejaLa = !!app.querySelector(".trace");
  const place  = dejaLa ? window.scrollY : 0;
  if(!dejaLa) remonter(true);
  if(!E.quiz) { E.quiz = questionsDeLaPartie(); E.rep = E.quiz.map(()=>null); E.corrige=false; }
  const rep = E.rep;
  const fait = rep.filter(x=>x!==null).length;
  const note = E.corrige ? rep.filter((x,i)=>x===E.quiz[i].b).length : 0;
  const pct  = Math.round(100*note/E.quiz.length);

  app.innerHTML=`
  <div class="bureau"><div class="plateau un trace">
    <h1 style="font-size:clamp(26px,4vw,40px)">Ma trace de travail</h1>
    <p class="sous">${N.lieu}, ${N.sous.replace(N.lieu+", ","")} — ${E.mode==="campagne"?"campagne":"survie"}</p>

    <div class="bilan">
      <h2 style="margin-top:0">Mon carnet de bord</h2>
      <p style="margin:.2em 0 .8em;font-size:14px;color:var(--enc2)">
        ${E.carnet.length} décision${E.carnet.length>1?"s":""} prise${E.carnet.length>1?"s":""}.</p>
      ${courbesForces()}
      ${legendeForces()}
      <p class="cfo-note">Chaque force part de 60 sur 100. La courbe dit qui a payé vos
      décisions, et à quel moment.</p>
      <ol class="carnet">${E.carnet.map(d=>`<li>
        ${d.an?`<span class="an">${d.an}</span>`:""}
        <span class="aff">${esc(d.t)}</span>
        <span class="dec">${esc(d.q||"")}</span>
        ${effetsLigne(d.e)}</li>`).join("")}</ol>
    </div>

    <div class="bilan">
      <h2 style="margin-top:0">Ce que j’ai retenu</h2>
      <p style="margin:.2em 0 1em;font-size:14px;color:var(--enc2)">
        Huit questions, tirées des affaires que vous avez traitées.</p>
      ${E.quiz.map((q,i)=>`<div class="qz ${E.corrige?(rep[i]===q.b?"juste":"faux"):""}">
        <div class="qzq">${i+1}. ${esc(q.q)}</div>
        <div class="qzr">${q.r.map((t,j)=>`
          <button class="${rep[i]===j?"pris":""} ${E.corrige&&j===q.b?"bonne":""}"
            ${E.corrige?"disabled":""} onclick="repondre(${i},${j})">${esc(t)}</button>`).join("")}</div>
        ${E.corrige?`<div class="qzx">${gras(esc(q.x))}</div>`:""}
      </div>`).join("")}
      ${E.corrige
        ? `<div class="score">Connaissances acquises : <b>${pct}&nbsp;%</b>
             <span>${note} bonne${note>1?"s":""} réponse${note>1?"s":""} sur ${E.quiz.length}</span></div>`
        : `<p class="centre" style="margin:18px 0 0">
             <button class="plein" ${fait<E.quiz.length?"disabled":""} onclick="corriger()">
               ${fait<E.quiz.length?`Encore ${E.quiz.length-fait} question${E.quiz.length-fait>1?"s":""}`:"Corriger mes réponses"}</button></p>`}
    </div>

    <div class="bilan">
      <h2 style="margin-top:0">Ma réflexion</h2>
      <label>La décision dont je suis le plus sûr, et pourquoi :
        <textarea id="r1" rows="3" placeholder="…"></textarea></label>
      <label>La décision que je regrette, et ce que je ferais autrement :
        <textarea id="r2" rows="3" placeholder="…"></textarea></label>
      <label>Ce que cette partie m’apprend sur le progrès industriel :
        <textarea id="r3" rows="3" placeholder="…"></textarea></label>
      <label class="nom">Mon nom :
        <input id="rnom" type="text" placeholder="Prénom et nom"></label>
    </div>

    ${blocAvis()}

    <p class="centre" style="margin:22px 0 0">
      <button class="plein" onclick="telechargerTrace()">Télécharger (Word)</button>
      <button onclick="copierTrace()">Copier ma trace</button>
      <button onclick="window.print()">Imprimer</button>
      <button onclick="rendreFin()">Retour au verdict</button>
    </p>

/* Le document à rendre : du texte simple, qui se colle partout. */
function texteTrace(){
  const note = E.rep.filter((x,i)=>x===E.quiz[i].b).length;
  const pct  = Math.round(100*note/E.quiz.length);
  const L = [];
  L.push("LE PRIX DU PROGRÈS — trace de travail");
  L.push(N.lieu+", "+N.sous.replace(N.lieu+", ","")+"  ·  "+(E.mode==="campagne"?"campagne":"survie"));
  L.push("Nom : "+((E.t_rnom||"").trim()||"…"));
  L.push("");
  L.push("RÉSULTAT DE LA PARTIE");
  L.push("  "+(E.fini==="verdict" ? "Menée jusqu’au bout." : "Interrompue : "+(N.fins[E.fini]?N.fins[E.fini].t:E.fini)));
  L.push("  Décisions prises : "+E.carnet.length);
  L.push("  "+N.unite+" finale : "+fmt(E.pop));
  L.push("  Rapports d’enquête consultés : "+((E.lus&&E.lus.length)||0)+" sur "+E.carnet.length);
  L.push("");
  L.push("MON CARNET DE BORD");
  E.carnet.forEach((d,i)=>{
    L.push("  "+String(i+1).padStart(2)+". "+(d.an?"["+d.an+"] ":"")+d.t);
    L.push("      → "+(d.q||""));
  });
  L.push("");
  L.push("CE QUE J’AI RETENU  —  "+(E.corrige ? pct+" % ("+note+"/"+E.quiz.length+")" : "questionnaire non corrigé"));
  if(E.corrige) E.quiz.forEach((q,i)=>{
    const j=E.rep[i];
    L.push("  "+(j===q.b?"[juste]":"[faux] ")+" "+q.q);
    L.push("      ma réponse : "+(j==null?"—":q.r[j]));
    if(j!==q.b) L.push("      réponse attendue : "+q.r[q.b]);
  });
  L.push("");
  L.push("MA RÉFLEXION");
  L.push("  La décision dont je suis le plus sûr :");
  L.push("      "+((E.t_r1||"").trim()||"…"));
  L.push("  La décision que je regrette :");
  L.push("      "+((E.t_r2||"").trim()||"…"));
  L.push("  Ce que cette partie m’apprend sur le progrès industriel :");
  L.push("      "+((E.t_r3||"").trim()||"…"));
  releveTexte().forEach(x=>L.push(x));
  L.push("");
  L.push("MON AVIS SUR LE JEU");
  avisLignes().forEach(p=>{ L.push("  "+p[0]); L.push("      "+p[1]); });
  L.push("  Un moment où j’étais perdu ou ennuyé :");
  L.push("      "+((E.t_av1||"").trim()||"…"));
  L.push("  À ajouter, retirer ou corriger :");
  L.push("      "+((E.t_av2||"").trim()||"…"));
  return L.join("\n");
}

function copierTrace(){
  const t = texteTrace(), m = document.getElementById("msgcopie");
  const dire = ok => { if(m) m.textContent = ok
    ? "Copié. Vous pouvez le coller dans un document ou dans Teams."
    : "La copie a échoué — utilisez « Télécharger »."; };
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(()=>{E.traceEnregistree=true;dire(true);rafraichirValidation()}).catch(()=>dire(false));
  else dire(false);
}


/* ==================================================================

   Un HTML aux espaces de noms d'Office, servi en .doc : Word l'ouvre

  const pct  = note===null ? null : Math.round(100*note/E.quiz.length);
  const nom  = (E.t_rnom||"").trim() || "…";
  const e = t => String(t==null?"":t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const g = t => e(t).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  const dt = new Date().toLocaleDateString("fr-CH",{day:"numeric",month:"long",year:"numeric"});

  const carnet = E.carnet.map((d,i)=>`
    <tr>
      <td class=n>${i+1}</td>
      <td class=an>${d.an?e(d.an):""}</td>
      <td>${e(d.t)}<div class=dec>${e(d.q||"")}</div></td>
      ${CLES.map(k=>{ const v=(d.e||{})[k]||0;
        return `<td class="num ${v>0?"up":v<0?"dn":""}">${v?(v>0?"+":"")+v:"·"}</td>`;
      }).join("")}
    </tr>`).join("");

  /* L'état après chaque décision : Word ne trace pas de courbe, mais un
     tableau chiffré s'imprime, se corrige et se compare. */
  const releve = (E.releve||[]).map(p=>`
    <tr>
      <td class=an>${p.an?e(p.an):e(String(p.t))}</td>
      ${CLES.map(k=>`<td class=num>${p[k]}</td>`).join("")}
    </tr>`).join("");

  const quiz = !E.corrige ? "<p class=vide>Le questionnaire n’a pas été corrigé.</p>"
    : E.quiz.map((q,i)=>{
      const j=E.rep[i], ok=(j===q.b);
      return `<div class="q ${ok?'ok':'ko'}">
        <p class=qq><b>${i+1}.</b> ${e(q.q)}</p>
        <p class=qr><span class=et>${ok?"Juste":"Faux"}</span>
           Votre réponse : ${j==null?"—":e(q.r[j])}</p>
        ${ok?"":`<p class=qa>Réponse attendue : <b>${e(q.r[q.b])}</b></p>`}
        <p class=qx>${g(q.x)}</p>
      </div>`;
    }).join("");

  return `<html xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8">

  <div class="role">
    <div class="r">${N.role}</div>
    <p class="r-qui">${N.qui}</p>
    <p class="r-but">${N.but}</p>
    <p class="note-role">${N.note}</p>
    <p class="note-source">Les personnages sont inventés ; ce qu’ils disent, non. Les deux seuls témoignages authentiques vous attendent à la fin de la partie.</p>
  </div>
    <figure class="mission-illu mi-d">
      <img src="img/niveau/${N.id}-droite.jpg" alt="${esc(N.vues.d)}" loading="lazy"
           onerror="this.closest('figure').remove()">
    </figure>
  </div>
  <p class="mission-note">Ces deux vues sont des <strong>illustrations</strong>, pas des documents
  d’époque : elles montrent le contraste, elles ne le prouvent pas.</p>
  <div class="ronde-tete">
    <p class="rc-t">Les quatre groupes qui vous jugent</p>
    <p class="rc-x">Chaque décision en contente un et en fâche un autre.
    Si l’un d’eux vous abandonne tout à fait, la partie s’arrête.</p>
  </div>
  <div class="ronde">
    ${["i","m","o","p"].map(fichActeur).join("")}
  </div>
  <p class="centre" style="margin:24px 0 8px">
    <button class="plein" onclick="nouvellePartie('campagne',N.id)">Campagne · ${N.tours} décisions jusqu’en ${N.a1}</button>
    <button onclick="nouvellePartie('infini',N.id)">Survie${rec?` · record ${fmt(rec)} ${N.unite2}`:""}</button>
    <button onclick="accueil()">Changer de niveau</button>
  </p>
  <div class="bilan"><h2 style="margin-top:0">Une chose à savoir avant de commencer</h2>
    <p style="margin:.3em 0">${N.avant} C’est ce qui rendra la fin de partie difficile.</p></div>`;
  ecrireMission();
}
titre();
</script>
</body>
</html>
