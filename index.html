const icone=(k,cls)=>`<svg class="${cls||""}"><use href="#${N.forces[k].ic}"/></svg>`;
function fleches(v){
  const n=Math.abs(v)<=6?1:Math.abs(v)<=12?2:3;
  return (v>0?"▲":"▼").repeat(n);
}
function impacts(e){
  return CLES.filter(k=>e[k]).map(k=>{
    const cls=e[k]>0?"up":"dn";
    return `<span class="imp ${cls}" title="${N.forces[k].nom} ${e[k]>0?"+":""}${e[k]}">
      ${icone(k)}<span class="lb">${N.forces[k].nom}</span><span class="fl">${fleches(e[k])}</span></span>`;
  }).join("");
}
/* « chiffres » n'est vrai qu'a l'ecran de fin. Pendant la partie, le
   joueur decide parce que c'est ce qu'il pense, pas parce qu'il a lu
   un nombre — les fleches et les mots suffisent a dire ce qui vient
   de bouger. */
function barresForces(chiffres){
  oublierSecousse();
  return `<div class="forces">${CLES.map(k=>{
    const v=E.f[k];
    const col = v>55?"var(--vert)" : v>35?"var(--accent)" : v>20?"#D08A2A" : "var(--rge)";
    /* trois paliers, pour qu'on voie venir la rupture */
    const etat = v<=10 ? "critique" : v<=20 ? "danger" : v<=35 ? "fragile" : "";
    const mot  = v<=10 ? "au bord de la rupture" : v<=20 ? "ne tiendra pas longtemps"
               : v<=35 ? "fragile" : "";
    const coup = (E.secousse||[]).indexOf(k)>=0 ? " secouee" : "";
    const dc = dernierChoix(), dv = dc && dc.e ? (dc.e[k]||0) : 0;
    const bul = bulleForce(k);
    return `<div class="force ${etat}${coup}${bul?" causant":""}"
      title="${N.forces[k].nom} — ${N.forces[k].veut}"
      ${bul?`onclick="bulle(this,'${k}')"`:""}>
      <span class="sceau"><img src="img/acteurs/${N.id}-${k}-embleme.jpg" alt=""
        loading="lazy" onerror="this.remove()">${icone(k)}</span>
      <div class="nom">${N.forces[k].nom}${chiffres?` <b>${Math.round(v)}</b>`:""}</div>
      <div class="mini"><i style="width:${v}%;background:${col}"></i></div>
      ${(()=>{ const h=humeur(dv); return h
        ? `<div class="delta ${h.sens}"><span class="fl">${h.fl}</span>${h.mot}</div>` : ""; })()}
      ${mot?`<div class="etat">${mot}</div>`:""}
      ${bul}</div>`;
  }).join("")}</div>`;
}

/* La secousse ne vaut que pour le rendu qui suit le coup. On l'efface
   une fois l'animation passée, et une seule fois même si le tableau est
   peint à deux endroits. */
let SEC_T = null;
function oublierSecousse(){
  if(!E || !E.secousse || !E.secousse.length || SEC_T) return;
  SEC_T = setTimeout(()=>{ SEC_T=null; if(E) E.secousse=[]; }, 1500);
}

/* Le bandeau d'alerte : il nomme le risque et dit ce qu'il en coûte. */
function alerte(){
  if(!E || !E.f) return "";
  const bas = CLES.filter(k=>E.f[k]<=14).sort((a,b)=>E.f[a]-E.f[b]);
  if(!bas.length) return "";
  const noms = bas.map(k=>N.forces[k].nom.toLowerCase());
  const liste = noms.map(n=>"les "+n).join(" et ");
  return `<div class="alarme">
    <strong>Attention.</strong> Vous allez perdre ${liste}.
    Si ${noms.length>1?"l’une de ces forces tombe":"cette force tombe"} à zéro, la partie s’arrête
    immédiatement — ${esc(N.forces[bas[0]].veut)}.</div>`;
}

/* ==================================================================
   LE DÉCOR — la fenêtre du bureau
   La ville derrière la vitre n'est pas un ornement : elle est la jauge
   que le joueur ne peut pas lire en chiffres. Elle grandit avec la
   population, elle s'assombrit avec l'usure ouvrière — sans que
   personne ne l'ait voté. C'est la leçon du jeu, rendue visible.
   ================================================================== */
const SC = {
  el:null, loin:null, pres:null, fum:null, vitre:null, peinte:false,
  /* positions fixes : la ville ne doit pas danser d'un tour à l'autre */
  h(i){ return ((i*2654435761)%4294967296)/4294967296 }
};

function peindreVille(){
  SC.el    = document.getElementById("scene");
  if(!SC.el) return;
  SC.loin  = document.getElementById("loin");
  SC.pres  = document.getElementById("pres");
  SC.fum   = SC.el.querySelector(".fumees");
  SC.vitre = SC.el.querySelector(".vitre");
  if(SC.peinte) return;

  let a="",b="",f="";
  /* rangée lointaine : toits et clochers, ce que la ville était déjà */
  for(let i=0;i<34;i++){
    const x=SC.h(i)*1180, w=14+SC.h(i+90)*30, h=16+SC.h(i+40)*34;
    a+=`<rect x="${x.toFixed(0)}" y="${(238-h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}"/>`;
  }
  /* rangée proche : les cheminées, une par index, révélées peu à peu */
  for(let i=0;i<30;i++){
    const x=18+SC.h(i+7)*1150, w=7+SC.h(i+61)*5, h=52+SC.h(i+23)*86;
    b+=`<rect class="che" data-i="${i}" x="${x.toFixed(0)}" y="${(292-h).toFixed(0)}"
         width="${w.toFixed(0)}" height="${h.toFixed(0)}" opacity="0"/>`;
    if(i<9) f+=`<span style="left:${(SC.h(i+7)*88).toFixed(1)}%;animation-delay:${(i*1.6).toFixed(1)}s"></span>`;
  }
  SC.loin.innerHTML=a; SC.pres.innerHTML=b; SC.fum.innerHTML=f;
  SC.peinte=true;
}

/* Une image existe-t-elle pour ce niveau ? Si oui elle remplace le décor
   peint ; si non, rien ne se voit — le jeu reste beau sans elle. */
/* Ou en est la partie : le debut, la pleine croissance, ou ce que la
   ville est devenue. Trois tiers, pas davantage — au-dela, le fond
   changerait trop souvent pour qu'on le remarque. */
function phaseVue(){
  if(typeof E === "undefined" || !E || !N.tours) return "debut";
  const p = E.tour / N.tours;
  return p < .34 ? "debut" : p < .67 ? "milieu" : "fin";
}

function chercherVue(ecran){
  poserDecor(ecran);
  if(!SC.el) return;
  const ph = N.id + "/" + phaseVue();
  if(SC.phase === ph) return;                 /* deja en place */
  SC.phase = ph;
  /* On essaie dans l'ordre et on s'arrete au premier qui charge. Le
     « aimg » n'est retire qu'en cas d'echec complet : l'enlever tout
     de suite faisait clignoter le fond a chaque changement de tiers. */
  const liste = [ "img/" + N.id + "-vue-" + phaseVue() + ".jpg",
                  "img/" + N.id + "-vue-" + phaseVue() + ".png",
                  "img/vue-" + N.id + ".jpg" ];
  (function essayer(i){
    if(i >= liste.length){ SC.el.classList.remove("aimg"); SC.phase = null; return; }
    const im = new Image();
    im.onload  = ()=>{ SC.el.querySelector(".vue").style.backgroundImage =
                         `url("${liste[i]}")`;
                       SC.el.classList.add("aimg"); };
    im.onerror = ()=>essayer(i+1);
    im.src = liste[i];
  })(0);
}

function majVue(){
  if(!SC.el||!E) return;
  /* Le tiers a pu changer depuis la derniere decision. */
  if(SC.phase !== N.id + "/" + phaseVue()) chercherVue();
  /* combien la ville a-t-elle enflé depuis le premier tour */
  const croiss = Math.min(1, Math.log(E.pop/N.pop0+1)/Math.log(9));
  /* la suie : l'usure ouvrière d'abord, la taille de la ville ensuite */
  const suie = .16 + .34*(1-E.f.o/100) + .18*croiss;
  SC.el.style.setProperty("--suie", suie.toFixed(3));
  /* les fumées suivent l'activité des fabriques */
  SC.fum.style.opacity = (.16 + .6*(E.f.i/100)).toFixed(3);
  /* les cheminées sortent de terre à mesure que la ville grandit */
  const n = Math.round(4 + croiss*26);
  SC.pres.querySelectorAll(".che").forEach(r=>{
    r.setAttribute("opacity", (+r.dataset.i < n) ? "0.92" : "0");
  });
}

/* ==================================================================
   RENDU — un statut de texte, un dossier
   ================================================================== */
/* ==================================================================
   LA SCENE — quatre acteurs autour de l'affaire du jour
   Chaque poste porte un visage, un nom, une jauge SANS CHIFFRE, et une
   bulle qui parle tout le temps : avant la decision ce qu'il attend,
   apres ce qu'il a encaisse.
   ================================================================== */

/* Qui est concerne par la carte du jour : un acteur qu'au moins une des
   reponses touche. On ne le dit pas au joueur — on fait seulement
   avancer un peu ceux qui ont quelque chose a perdre ou a gagner. */
function concernes(c){
  /* Presque toute carte touche les quatre : les marquer tous ne dit
     rien. On garde les deux dont le sort depend LE PLUS du choix,
     c'est-a-dire ceux pour qui l'ecart entre la meilleure et la pire
     reponse est le plus grand. Le dilemme se voit, sans un chiffre. */
  const ecart = {};
  for(const fk of CLES){
    let bas = 0, haut = 0, vu = false;
    for(const k of ["a","b","c"]){
      const ch = c && c[k];
      if(!ch || !ch.e) continue;
      const v = ch.e[fk] || 0;
      if(!vu){ bas = haut = v; vu = true; }
      if(v < bas) bas = v;
      if(v > haut) haut = v;
    }
    ecart[fk] = haut - bas;
  }
  const tri = CLES.slice().filter(k=>ecart[k] > 0)
    .sort((a,b)=>ecart[b]-ecart[a]).slice(0,2);
  return new Set(tri);
}

/* Ce que l'acteur dit maintenant. Deux cas, jamais plus :
   — on vient de decider : il reagit, et sa raison est celle que porte
     la force (« pourquoi »), deja ecrite carte par carte ;
   — on n'a pas encore decide : il rappelle ce qu'il attend. */
function diraActeur(k){
  const d = dernierChoix();
  const v = d && d.e ? (d.e[k]||0) : 0;
  /* LE VISAGE PORTE LA DERNIERE DECISION, LA BULLE PORTE L'AFFAIRE EN
     COURS. « sens » commande le mouvement du portrait — celui qui a
     gagne avance, celui qui a perdu recule et tremble — tandis que le
     texte parle toujours de ce qui est sur le bureau maintenant. Ce
     qui s'est passe au tour precedent est dit en haut, par
     « retombee », ou il ne peut pas etre confondu.
     QUI N'A RIEN A DIRE SE TAIT. Les deux acteurs que la carte
     concerne ont un avis ecrit pour elle ; les deux autres n'en ont
     pas, et affichaient alors leur phrase generale — la meme a chaque
     tour, sans rapport avec l'affaire. On rend une chaine vide : le
     poste ne dessine aucune bulle. Le silence dit qui est concerne. */
  const sens = (d && v) ? (v>0 ? "gagne" : (v<=-8 ? "perd-fort" : "perd")) : "attend";
  /* Sur l'ecran de ce qui est arrive, l'affaire du moment EST la
     decision qu'on vient de prendre : la bulle porte la reaction. */
  if(E.montreConsq) return { txt: (d && d.dit || {})[k] || "", sens };
  const avis = (E.carte && E.carte.av || {})[k];
  return { txt: avis || "", sens };
}

/* UNE IMAGE QUI MANQUE NE DOIT RIEN CASSER.
   « data-repli » porte les adresses de rechange, separees par une
   barre. A chaque echec on essaie la suivante ; quand la liste est
   vide, l'image s'efface et ce qui est dessous — le pictogramme grave
   — reprend la main de lui-meme. */
function secours(img){
  const l = (img.dataset.repli || "").split("|").filter(Boolean);
  if(!l.length){ img.remove(); return; }
  img.dataset.repli = l.slice(1).join("|");
  img.src = l[0];
}

function poste(k, c, vus){
  const v = E.f[k];
  const etat = v<=10 ? "critique" : v<=20 ? "danger" : v<=35 ? "fragile" : "";
  const mot  = v<=10 ? "au bord de la rupture" : v<=20 ? "ne tiendra pas longtemps"
             : v<=35 ? "fragile" : "";
  const dit  = diraActeur(k);
  /* avant la decision seulement : apres, la reaction parle deja */
  const pres = (!dernierChoix() && vus.has(k)) ? " concerne" : "";
  const col  = v>55?"var(--vert)" : v>35?"var(--accent)" : v>20?"#D08A2A" : "var(--rge)";
  /* Le visage dit l'etat durable, pas la derniere decision : celle-la
     est deja dite par le mouvement, le tremblement et la bulle. Les
     quatre bornes sont celles du mot affiche sous le nom : le visage
     et le mot changent ensemble. « neutre » est le portrait d'origine,
     qui existe deja — il n'y a donc que trois images a faire. */
  /* Bornes mesurees, non pas reparties egalement : 46 / 26 / 19 / 7 / 2 %
     du temps d'ecran. « portrait » est le visage neutre d'origine. */
  const vis  = v>58 ? "content" : v>48 ? "portrait" : v>35 ? "contrarie"
             : v>20 ? "fache" : "au-bord";
  const base = `img/acteurs/${N.id}-${k}-`;
  return `<div class="poste p-${k} ${dit.sens}${pres} ${etat}">
    <div class="visage">
      <img src="${base}${vis}.jpg" alt="" loading="lazy"
           data-repli="${base}${vis}.png|${base}portrait.jpg"
           onerror="secours(this)">
      <span class="jeton">${icone(k)}</span>
    </div>
    <div class="ident">
      <span class="nm">${esc(N.forces[k].nom)}</span>
      ${mot?`<span class="et">${mot}</span>`:""}
    </div>
    <div class="tige"><i style="width:${Math.max(3,v)}%;background:${col}"></i></div>
    ${dit.txt ? `<div class="dit"><span>${esc(dit.txt)}</span></div>` : ""}
  </div>`;
}

/* « mode » vaut « consq » sur l'ecran de ce qui est arrive : meme
   scene, memes portraits aux memes places — c'est le centre qui
   change, et les bulles avec lui. */
function scene(c, reponses, mode){
  const vus = concernes(c);
  const d = dernierChoix();
  const cq = mode === "consq";
  return `<div class="scene" data-phase="${cq?"consq":(d?"apres":"avant")}">
    ${poste("i", c, vus)}
    ${poste("m", c, vus)}
    <div class="centre">
      <div class="situ ordre dossier ${cq?"d-consq":"d-situation"}">
        <i class="encoche eg" aria-hidden="true"></i>
        <i class="encoche ed" aria-hidden="true"></i>
        <span class="onglet">${cq?"Ce qui est arrivé":"Affaire du jour"}</span>
        <div class="t"></div>
        <div class="ex"></div>
        <div class="parle">${cq?`<span>Votre décision</span>`
          :`${illuPersonne(c.qui)}<span>${esc(c.qui)}</span>`}</div>
        <div class="d"></div>
      </div>
      <div class="moi" aria-hidden="true"><span></span></div>
    </div>
    ${poste("o", c, vus)}
    ${poste("p", c, vus)}
  </div>
  <div class="tranche centre">
    ${cq?"":`<div class="question">Que décidez-vous ?</div>`}
    ${reponses}
  </div>`;
}

/* LES BULLES ET LE TEXTE QU'ELLES NE DOIVENT PAS COUVRIR.
   Une bulle est posee par-dessus l'ordre du jour, en absolu : elle
   ignore le texte, et le texte l'ignore. On mesure donc, apres coup,
   de combien elle mord sur la feuille, et on donne cette taille aux
   deux flotteurs places en tete du bloc. Le texte les contourne, donc
   il contourne les bulles. Mesure plutot que calcul : la largeur des
   colonnes depend de la fenetre, et une formule se serait trompee. */
function calerBulles(){
  const sc = app.querySelector(".scene"); if(!sc) return;
  const ord = sc.querySelector(".ordre"); if(!ord) return;

  /* Au telephone la scene est une colonne : les bulles ne debordent
     sur rien, et toute mesure posee ici serait a defaire. */
  const rep = sc.querySelector(".rep");
  if(innerWidth <= 860){
    for(const e of sc.querySelectorAll(".encoche")) e.style.cssText = "";
    if(rep){ rep.style.marginLeft = rep.style.marginRight = "" }
    return;
  }

  /* LES BULLES NE MORDENT PLUS SUR L'ORDRE DU JOUR. Elles se posent
     au-dessus de la carte de leur acteur, dans la colonne laterale :
     il n'y a plus rien a reserver au texte, et les trois choix ne
     sont plus coinces entre elles puisqu'ils sont passes en bandeau
     sous la scene. La fonction se contente donc d'effacer ce que les
     versions precedentes avaient pose. */
  for(const e of sc.querySelectorAll(".encoche")) e.style.cssText = "";
  if(rep){ rep.style.marginLeft = rep.style.marginRight = "" }
  return;

  /* eslint-disable no-unreachable */
  const r = ord.getBoundingClientRect();
  if(!r.width) return;
  const cs = getComputedStyle(ord);
  const hg = r.left  + parseFloat(cs.paddingLeft);
  const hd = r.right - parseFloat(cs.paddingRight);
  const ht = r.top   + parseFloat(cs.paddingTop);
  for(const [cote, cle] of [["eg","i"],["ed","m"]]){
    const e = ord.querySelector(".encoche." + cote);
    const b = sc.querySelector(".p-" + cle + " .dit");
    if(!e) continue;
    if(!b){ e.style.width = e.style.height = "0px"; continue; }
    /* Pendant la mise en scene, une bulle qui n'a pas encore ete
       ecrite est vide donc minuscule : la mesurer retrecirait
       l'encoche, et la bulle finirait par passer sur le texte. On
       garde celle d'avant. */
    if(!(b.textContent || "").trim()) continue;
    const bb = b.getBoundingClientRect();
    const l = (cote === "eg") ? (bb.right - hg) : (hd - bb.left);
    const h = bb.bottom - ht;
    e.style.width  = Math.max(0, Math.round(l) + 14) + "px";
    e.style.height = Math.max(0, Math.round(h) + 10) + "px";
  }
}
let calage = 0;
addEventListener("resize", ()=>{
  clearTimeout(calage); calage = setTimeout(calerBulles, 120);
});

/* LA LETTRE DU PROFESSEUR — une fois par carte, avant de decider.
   On garde les titres deja lus plutot qu'un simple drapeau : apres la
   consequence, « rendre » repasse sur la meme carte, et la lettre se
   rouvrirait a chaque fois. */
function lettreAlire(){
  const c = E && E.carte;
  return !!(c && c.l && !(E.lettresLues || []).includes(c.t));
}
function lettreLue(){
  if(!E || !E.carte) return;
  E.lettresLues = E.lettresLues || [];
  if(!E.lettresLues.includes(E.carte.t)) E.lettresLues.push(E.carte.t);
  const el = document.getElementById("pli-prof");
  if(el){ el.classList.add("parti"); setTimeout(()=>el.remove(), 260); }
  try{ SON.papier() }catch(e){}
  /* la suite reprend la ou la retombee s'etait arretee */
  if(E.scene && E.scene.i < E.scene.etapes.length){
    try{ SON.frappe(true) }catch(e){}
    setTimeout(jouerEtape, 280);
  }
}
/* La lettre est POSEE au moment voulu, pas rendue d'avance puis
   cachee : une animation CSS part au rendu de l'element, et non a son
   apparition — cachee puis devoilee, elle se serait jouee dans le
   vide. */
function ouvrirLettre(){
  if(document.getElementById("pli-prof")) return;
  const html = pliProf();
  if(!html) return;
  const b = document.createElement("div");
  b.innerHTML = html;
  const el = b.firstElementChild;
  if(el) app.appendChild(el);
}

function pliProf(){
  if(!lettreAlire()) return "";
  /* La toute premiere de la partie dit, en une phrase, ce que ces
     courriers seront. Les suivantes entrent dans l'affaire. */
  const premiere = !(E.lettresLues || []).length;
  const intro = premiere ? `<p class="cp-ouverture">Je vous glisserai un mot avant
      chaque décision — juste de quoi relier ce qui arrive sur votre bureau à ce que
      nous avons vu en classe.</p>` : "";

  /* Plus de delai : la lettre n'est posee qu'au moment ou la retombee
     a fini de s'ecrire. Il reste un souffle pour que l'enveloppe ne
     saute pas a la figure. */
  const retard = ".2s";
  const d = decoupeLettre(E.carte.l);

  /* Decoupee, elle se lit en trois temps. Non decoupee — si un texte
     futur echappait au motif —, elle s'affiche d'un bloc : jamais
     rien d'invisible. */
  const corps = d ? `
      <div class="cp-notion">
        <span class="cp-n-k">À retenir · ${esc(d.mot)}</span>
        <p>${esc(d.def)}</p>
      </div>
      <p class="cp-q">${esc(d.question)}</p>
      <p class="cp-ref">À réviser : ${esc(d.ref)}</p>`
    : `<p class="cp-q">${gras(esc(E.carte.l))}</p>`;

  return `<div class="pli-prof" id="pli-prof" style="--retard:${retard}">
    <div class="enveloppe" aria-hidden="true">
      <span class="env-rabat"></span><span class="env-cire"></span>
    </div>
    <article class="lettre-prof courrier-prof">
      <div class="cp-tete">
        <span class="cp-qui">Le courrier du professeur</span>
        <span class="cp-ou">${esc(N.lieu)}${
          E.mode === "campagne" ? " · " + AN(E.tour) : ""}</span>
      </div>
      <div class="cp-titre">
        <span class="cp-icone" aria-hidden="true"><svg viewBox="0 0 24 24"
          ><path d="M3 6h18v12H3z"/><path d="M3.5 7l8.5 6 8.5-6"/></svg></span>
        <div>
          <h2>${esc(E.carte.t)}</h2>
          <p class="cp-sous">Comprendre avant de décider</p>
        </div>
      </div>
      ${intro}
      ${corps}
      <button class="plein" onclick="lettreLue()">J’ai compris · place au choix</button>
    </article>
  </div>`;
}

/* LE DECOUPAGE DES SOIXANTE LETTRES.
   Elles ont toutes la meme forme : ou reviser, le mot du cours et sa
   definition, puis la question a se poser. Mesure avant d'y toucher :
   les 60 se decoupent, aucune ne resiste. Rend « null » si une lettre
   future echappait au motif — l'affichage se replie alors sur le
   paragraphe entier. */
function decoupeLettre(l){
  if(!l) return null;
  const m = l.match(
    /^(?:Consultez|Révisez)\s+(.+?)\.\s*(?:Retenez\s+\*\*(.+?)\*\*\s*:\s*|Le terme\s+\*\*(.+?)\*\*\s+désigne\s+)(.+?)\.\s+([A-ZÀ-Þ].*)$/);
  if(!m) return null;
  /* La definition est extraite au milieu d une phrase : elle arrive
     en minuscule et sans point. On la rend lisible comme une
     definition de dictionnaire. */
  let d = m[4].trim();
  d = d.charAt(0).toUpperCase() + d.slice(1);
  if(!/[.!?]$/.test(d)) d += ".";
  return { ref:m[1], mot:(m[2] || m[3]), def:d, question:m[5] };
}

/* CE QUE LA DECISION PRECEDENTE A PRODUIT.
   Il n'y a pas d'ecran de consequence dans ce jeu : on passe de la
   decision a l'affaire suivante. La phrase qui dit ce qui est arrive
   doit donc se lire ICI, sur le plateau suivant — sinon elle n'est
   jamais lue. */
function retombee(){
  const d = dernierChoix();
  /* LE BANDEAU A ETE REMPLACE PAR UN ECRAN. Il partageait la page avec
     la nouvelle affaire : on ne savait plus ou finissait le passe, et
     ses cent vingt pixels repoussaient les portraits hors de l'ecran
     au moment meme ou ils reagissaient. Ce qui est arrivé a desormais
     sa page — « rendreConsequence » — et les deux voix sont retournees
     dans les bulles, ou elles sont a leur place. */
  return "";
}

/* L ECRAN DE CE QUI EST ARRIVE.
   La meme scene que l'affaire : memes portraits, memes places. Rien ne
   defile, rien n'est hors champ — on regarde qui a gagne et qui a
   perdu aussi longtemps qu'on veut. */
function rendreConsequence(){
  remonter();
  const c = E.carte, d = dernierChoix();
  let n = 0; const D = ()=>`style="--d:${(n += .085).toFixed(3)}s"`;
  app.innerHTML = `
  ${alerte()}
  <div class="bureau"><div class="plateau large">
    ${scene(c, `<div class="apres" ${D()}>
      <button class="plein" onclick="suiteApresConsq()">Affaire suivante</button>
    </div>`, "consq")}
    <div class="appoints" ${D()}>${courrier("")}${carnet("")}</div>
  </div></div>`;
  app.classList.remove("presse");
  document.body.style.setProperty("--age",
    Math.min(1, E.tour / (N.tours || 18)).toFixed(3));
  calerBulles();
  requestAnimationFrame(calerBulles);
  ecrire(c.t, E.consq || "", d ? d.q : "");
  try{ SON.majTension(); SON.papier() }catch(e){}
  majVue();
}

function rendre(){
  if(E && E.montreConsq) return rendreConsequence();
  remonter();
  const c=E.carte;
  /* Personne n'a encore ouvert un dossier, et on est au début : on le
     montre. Dès le premier ouvert, on se tait — et de toute façon on se
     tait après le cinquième tour. */
  const guide  = ((E.lus||[]).length === 0) && E.tour < 5;
  const invite = guide && E.tour === 0;     /* la phrase, une seule fois */
  let d=0; const D=()=>`style="--d:${(d+=.085).toFixed(3)}s"`;
  const trois=["a","b","c"].filter(k=>c[k]);

  /* Les chiffres ne se montrent plus : l'eleve decide parce que c'est ce
     qu'il pense, pas parce qu'il a lu une flèche. Les dossiers passent
     sous les reponses : ils restent la, ils ne disputent plus
     l'attention a l'affaire du jour. */
  app.innerHTML=`
  ${alerte()}
  <div class="bureau"><div class="plateau large">
    ${scene(c, `<div class="rep" ${D()}>
      ${trois.map(k=>`<button class="choix" onclick="choisir('${k}')">
        <span class="q">${esc(c[k].q)}</span></button>`).join("")}
    </div>`)}
    <div class="appoints" ${D()}>
      ${c.f?`<details class="dossier d-enquete ${guide?"guide":""}">
          <summary><span class="onglet">Rapport d’enquête</span>
            <span class="cq-txt">Le bureau d’enquête a joint une note.${
              invite?`<i class="invite">Le fait historique est dedans.</i>`:""}</span>
            <span class="pli"></span></summary>
          <div class="corps">${illuDoc(c)}${corpsRapport(c)}</div></details>`:""}
      ${courrier("")}
      ${carnet("")}
    </div>
  </div></div>
  `;
  app.classList.remove("presse");
  /* L'age de la partie, de 0 a 1 : le CSS s'en sert pour vieillir les
     portraits. En survie il n'y a pas de terme, on prend dix-huit
     decisions comme echelle. */
  document.body.style.setProperty("--age",
    Math.min(1, E.tour / (N.tours || 18)).toFixed(3));
  /* LA MESURE PASSE AVANT L'ECRITURE. « ecrire » vide les bulles pour
     les faire paraitre une a une ; mesure apres lui, « calerBulles »
     mesurerait du vide et le texte de l'ordre du jour ne contournerait
     plus rien. */
  calerBulles();
  requestAnimationFrame(calerBulles);
  addEventListener("load", calerBulles, { once:true });
  ecrire(c.t, c.ex, c.d);
  try{ SON.majTension(); SON.papier() }catch(e){}
  majVue();
}

/* Un clic termine d'abord l'étape en cours de la mise en scène. Quand
   il n'y a plus rien à écrire, il reprend son rôle d'avant : poser le
   reste des dossiers d'un coup. */
document.addEventListener("click",e=>{
  if(e.target.closest("button, summary, a")) return;
  /* la lettre est ouverte : rien a sauter derriere elle */
  if(document.getElementById("pli-prof")) return;
  if(finirEcriture()) return;
  app.classList.add("presse");
});
/* On compte les rapports d'enquête réellement ouverts : le rapport final
   dira au professeur qui a enquêté et qui a tranché à l'aveugle. */
document.addEventListener("toggle",e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains("carnet")&&E) E.carnetOuvert = t.open;
  /* un dossier qu'on déplie froisse, un pli qu'on décachette craque */
  if(t.open && t.classList){
    try{
      if(t.classList.contains("courrier")) SON.enveloppe();
      else if(t.classList.contains("d-enquete")) SON.tiroir();
      else if(t.classList.contains("carnet") || t.classList.contains("acteur")) SON.papier();
    }catch(e){}
  }
  if(t.classList&&t.classList.contains("courrier")&&t.open&&E){
    E.crLus = E.evVus.length;              /* tout est lu : le cachet tombe */
    t.classList.remove("neuf");
    const c=t.querySelector(".cachet"); if(c) c.remove();
    const p=t.querySelector(".pli"); if(p) p.classList.remove("aLire");
  }
  if(t.classList&&t.classList.contains("d-enquete")&&t.open&&E){
    if(!E.lus) E.lus=[];
    const k=(E.carte&&E.carte.t)||"";
    if(k&&!E.lus.includes(k)) E.lus.push(k);
  }
},true);


/* ==================================================================
   LES ÉVÉNEMENTS — ils tombent, on ne les choisit pas
   ================================================================== */
const SECONDES_URGENCE = 20;

function evenementDu(){
  const reste = N.ev.filter(v=>!E.evVus.includes(v.t));
  if(!reste.length) return null;
  /* Jamais deux coups du sort coup sur coup : il faut pouvoir respirer,
     et redresser les jauges, entre deux. */
  if(E.tour - E.derEv < 3) return null;
  if(E.mode==="campagne"){
    /* À sa date réelle : Peterloo en 1819, le krach en 1929. */
    const an = AN(E.tour);
    return reste.find(v=>v.an<=an) || null;
  }
  /* En survie il n'y a plus de calendrier, donc le hasard. */
  return Math.random()<.22 ? reste[Math.floor(Math.random()*reste.length)] : null;
}

function declencher(ev){
  try{ SON.coup() }catch(e){}
  E.evVus.push(ev.t);
  E.derEv = E.tour;
  E.evEnCours = ev;
  appliquer(ev.e);
  if(ev.pop) E.pop = Math.round(E.pop*(1+ev.pop));
  rendreEvenement(ev);
}

function rendreEvenement(ev){
  remonter();
  app.innerHTML=`
  ${barresForces()}
  <div class="ev">
    <div class="evd">${esc(ev.date)}</div>
    <div class="evt">${esc(ev.t)}</div>
    <p class="evx">${gras(esc(ev.x))}</p>
    <div class="evs"><strong>Fait authentique.</strong> ${gras(esc(ev.src))}</div>
    <div class="evi">${impacts(ev.e)}</div>
  </div>
  <p class="centre" style="margin:20px 0 0">
    ${ev.urgence ? `<button class="plein urg" onclick="rendreUrgence()">Il faut décider maintenant</button>`
                 : `<button class="plein" onclick="suiteEvenement()">Continuer</button>`}
  </p>`;
}

function rendreUrgence(){
  remonter();
  const ev=E.evEnCours;
  if(!ev || !ev.urgence) return suiteEvenement();
  const u=ev.urgence;
  app.innerHTML=`
  ${barresForces()}
  <div class="chrono"><div class="jauge" id="jt"></div></div>
  <p class="compte">Il vous reste <b id="cpt">${SECONDES_URGENCE}</b> secondes</p>
  <div class="situ urgent">
    <div class="ct">Décision urgente — ${esc(ev.date)}</div>
    <div class="t">${esc(ev.t)}</div>
    <div class="d">${esc(u.q)}</div>
  </div>
  <div class="rep ${u.choix.length===2?"deux":""}">
    ${u.choix.map((c,i)=>`<button class="choix" onclick="urgenceChoix(${i})">
      <span class="q">${esc(c.q)}</span></button>`).join("")}
  </div>`;
  const jt=document.getElementById("jt");
  if(jt){ jt.style.transition=`width ${SECONDES_URGENCE}s linear`; requestAnimationFrame(()=>{ jt.style.width="0%" }); }
  if(window.SANS_CHRONO) return;
  try{ SON.horlogeUrgence(true) }catch(e){}
  E.reste=SECONDES_URGENCE;
  E.timer=setInterval(()=>{
    E.reste--;
    const c=document.getElementById("cpt");
    if(c) c.textContent=Math.max(0,E.reste);
    if(E.reste<=0) urgenceChoix(-1);
  },1000);
}

function urgenceChoix(i){
  try{ SON.horlogeUrgence(false) }catch(e){}
  if(E.timer){ clearInterval(E.timer); E.timer=null; }
  if(!E.evEnCours || !E.evEnCours.urgence) return suiteEvenement();
  const u=E.evEnCours.urgence;
  const r = i<0 ? u.defaut : u.choix[i];
  appliquer(r.e);
  E.consq = r.c;
  E.entassement = i<0 ? "Le temps a décidé à votre place." : "";
  suiteEvenement();
}

function suiteEvenement(){
  const mort=CLES.find(k=>E.f[k]<=0);
  if(mort) return finir(mort);
  if(E.mode==="campagne" && E.tour>=N.tours) return finir("verdict");
  piocher(); rendre();
}

/* ==================================================================
   LE COURRIER ET LA MACHINE À ÉCRIRE
   ================================================================== */

/* Un pli est-il sur le point d'arriver ? On rejoue la condition de
   evenementDu() pour le tour suivant. En survie il n'y a pas de
   calendrier, donc rien à annoncer : l'enveloppe reste muette. */
function courrierProche(){
  if(!E || E.mode!=="campagne") return false;
  const reste = N.ev.filter(v=>!E.evVus.includes(v.t));
  if(!reste.length) return false;
  if((E.tour+1) - E.derEv < 3) return false;
  const an = AN(Math.min(E.tour+1, N.tours-1));
  return reste.some(v=>v.an <= an);
}

/* Les nouvelles du dehors tombent en plein écran et disparaissent. Le
   courrier les garde : on peut les relire, et les questions de fin
   portent sur elles. */
function courrier(attr){
  const proche = courrierProche();
  const recus = E.evVus.map(t=>N.ev.find(v=>v.t===t)).filter(Boolean).reverse();
  const der = recus[0] || null;

  const resume = proche
    ? `<span class="cd">À l’instant</span>
       <span class="cq">Un pli vient d’arriver. Il n’est pas encore ouvert.</span>`
    : der
      ? `<span class="cd">${esc(der.date)}</span><span class="cq">${esc(der.t)}</span>`
      : `<span class="cq vide">Rien au courrier ce matin.</span>`;

  const neufs = Math.max(0, recus.length - (E.crLus||0));
  const classe = `courrier dossier ${proche?"attente":""} ${neufs?"neuf":""} ${der&&!proche?"ouvert":""}`;
  const cachet = neufs ? `<span class="cachet" aria-label="${neufs} pli${neufs>1?"s":""} à lire">${neufs}</span>` : "";

  /* Sans pli en attente et sans pli reçu, il n'y a rien à ouvrir : on
     n'affiche rien. Un carton vide occupait un tiers de la bande pour
     annoncer qu'il était vide. */
  if(!recus.length && !proche) return "";

  /* Ce qu'un messager peut dire sans briser le cachet. */
  const scelle = proche ? `<article class="cr-pli cr-scelle">
      <div class="cd">Cachet intact</div>
      <div class="crt">Un messager attend dans l’antichambre</div>
      <p class="crx">Le pli ne s’ouvre pas ici : il sera lu devant le conseil, à votre
      <strong>prochaine décision</strong>. Ce qu’on sait déjà, c’est qu’une nouvelle du
      dehors va tomber — et qu’elle ne vous demandera pas votre avis.
      Gardez-vous une marge sur vos quatre forces.</p>
    </article>` : "";

  return `<details class="${classe}" ${attr}>
    <summary>
      <span class="onglet">Courrier</span>${cachet}
      <span class="env"></span>
      <span class="cr-bas">
        <span class="cr-tete">${resume}</span>
        <span class="pli ${proche?"scelle":""}" data-n="${recus.length}"></span>
      </span>
    </summary>
    <div class="cr-plis">${scelle}${recus.map(v=>`<article class="cr-pli">
      <div class="cd">${esc(v.date)}</div>
      <div class="crt">${esc(v.t)}</div>
      <p class="crx">${gras(esc(v.x))}</p>
      <div class="crs"><strong>Fait authentique.</strong> ${gras(esc(v.src))}</div>
    </article>`).join("")}</div>
  </details>`;
}

/* LA MISE EN SCENE.
   Une ETAPE est une liste de textes a écrire l'un après l'autre :
   l'ordre du jour en forme une — titre, exposé, réplique —, puis
   chaque bulle la sienne. Un clic termine l'étape en cours et lance
   la suivante. */
function ecrire(titre, expose, replique){
  stopperMachines();
  E.ecrit = {t:titre, ex:expose||"", d:replique};
  const t=app.querySelector(".situ .t"),
        x=app.querySelector(".situ .ex"),
        r=app.querySelector(".situ .d");
  if(!t||!r) return;

  /* Chaque entrée : [où écrire, quoi, vitesse, la bulle à dévoiler]. */
  const etapes = [];
  const ordre = [[t, titre, 15]];
  if(x && E.ecrit.ex) ordre.push([x, E.ecrit.ex, 4]);
  if(replique) ordre.push([r, replique, 7]);
  etapes.push(ordre);

  /* LA LETTRE S OUVRE UNE FOIS L AFFAIRE ECRITE, pas avant. Elle porte
     alors sur ce qu'on a sous les yeux : impossible de la prendre pour
     la consequence de la decision precedente, qui a eu son ecran. */
  const pause = etapes.length;

  /* L'ordre des bulles est celui du regard, pas celui des données. */
  for(const k of ["i","m","o","p"]){
    const b  = app.querySelector(".p-"+k+" .dit");
    const sp = b && b.querySelector("span");
    const txt = sp ? sp.textContent : "";
    if(!txt) continue;
    sp.textContent = "";
    b.dataset.attente = "1";
    etapes.push([[sp, txt, 9, b]]);
  }
  E.scene = { etapes, i:0, pause };

  /* Les trois choix sont la derniere etape : ils n'apparaissent
     qu'une fois les quatre groupes ayant parle. C'est la premiere des
     trois separations d'avec les bulles — celle du temps. */
  for(const sel of [".scene .question", ".scene .rep", ".scene .apres"]){
    const el = app.querySelector(sel);
    if(el) el.dataset.attente = "1";
  }

  let dro = false;
  try{ dro = matchMedia("(prefers-reduced-motion: reduce)").matches }catch(e){}
  if(window.SANS_CHRONO || app.classList.contains("presse") || dro){
    for(const etape of etapes) poserEtape(etape);
    E.scene.i = etapes.length;
    revelerChoix();
    /* La lettre reste obligatoire meme sans animation : sans cela,
       un eleve qui a demande a reduire les animations ne la verrait
       jamais, et le lien avec le cours disparaitrait pour lui. */
    if(lettreAlire()) ouvrirLettre();
    return;
  }
  t.textContent=""; if(x) x.textContent=""; r.textContent="";
  try{ SON.frappe(true) }catch(e){}
  jouerEtape();
}

/* Les trois plaques montent l'une après l'autre. « montre » déclenche
   l'animation : la poser en même temps qu'on retire l'attente, sinon
   l'animation se jouerait pendant que le bloc est encore invisible. */
function revelerChoix(){
  finParole();
  for(const sel of [".scene .question", ".scene .rep", ".scene .apres"]){
    const el = app.querySelector(sel);
    if(!el) continue;
    delete el.dataset.attente;
    el.classList.add("montre");
  }
}

/* QUI PARLE AVANCE. Le poste dont la bulle vient d'etre decouverte
   prend « dit-maintenant » ; celui d'avant le rend mais garde
   « parle », donc sa bulle et sa pleine presence. */
function avance(b){
  if(!b) return;
  const p = b.closest(".poste"); if(!p) return;
  for(const q of app.querySelectorAll(".poste.dit-maintenant"))
    if(q !== p) q.classList.remove("dit-maintenant");
  p.classList.add("parle", "dit-maintenant");
}
/* Plus personne n'a la parole : le regard va aux trois choix. */
function finParole(){
  for(const q of app.querySelectorAll(".poste.dit-maintenant"))
    q.classList.remove("dit-maintenant");
}

/* Poser une étape, c'est écrire d'un coup tout ce qu'elle devait
   écrire — et montrer la bulle, s'il y en a une. */
function poserEtape(etape){
  for(const e of app.querySelectorAll(".frappe")) e.classList.remove("frappe");
  for(const [el, txt, , b] of etape){
    el.textContent = txt;
    if(b){ delete b.dataset.attente; avance(b) }
  }
}

function jouerEtape(){
  const s = E && E.scene;
  if(!s) return;
  /* Le courrier n'attend plus un delai fixe : il attend que ce qui
     vient d'arriver ait ete ecrit. */
  /* Jamais de lettre sur l'écran de ce qui est arrivé : elle porte sur
     une affaire à venir, pas sur une décision passée. */
  if(s.i === s.pause && !E.montreConsq && lettreAlire()
     && !document.getElementById("pli-prof")){
    try{ SON.frappe(false) }catch(e){}
    ouvrirLettre();
    return;
  }
  if(s.i >= s.etapes.length){ try{ SON.frappe(false) }catch(e){} revelerChoix(); return; }
  const etape = s.etapes[s.i];
  const lancer = j=>{
    const [el, txt, ms, b] = etape[j];
    if(b){ delete b.dataset.attente; avance(b) }
    el.textContent = "";
    E.machines.push(taper(el, txt, ms, ()=>{
      /* le chariot revient quand le titre est posé */
      if(j === 0 && etape.length > 1){ try{ SON.chariot() }catch(e){} }
      if(j + 1 < etape.length){ lancer(j + 1); return; }
      s.i++; jouerEtape();
    }));
  };
  lancer(0);
}

function taper(el, txt, ms, fin){
  let i=0;
  /* une seule ligne porte le curseur a la fois */
  for(const e of app.querySelectorAll(".frappe")) e.classList.remove("frappe");
  el.classList.add("frappe");
  const id=setInterval(()=>{
    el.textContent = txt.slice(0, ++i);
    if(i>=txt.length){ clearInterval(id); el.classList.remove("frappe");
                       if(fin) fin(); }
  }, ms);
  return id;
}

function stopperMachines(){
  try{ for(const e of app.querySelectorAll(".frappe")) e.classList.remove("frappe") }
  catch(e){}
  if(E && E.machines) E.machines.forEach(clearInterval);
  if(E) E.machines=[];
  try{ SON.frappe(false) }catch(e){}
}

/* Un clic pose l'étape en cours et lance la suivante. Rend « true »
   tant qu'il restait quelque chose à écrire : au-delà, le clic reprend
   son rôle d'avant et pose les dossiers. */
function finirEcriture(){
  const s = E && E.scene;
  if(!s || s.i >= s.etapes.length) return false;
  stopperMachines();
  poserEtape(s.etapes[s.i]);
  s.i++;
  jouerEtape();
  return true;
}

/* ==================================================================
   LES CONSÉQUENCES DIFFÉRÉES
   Ce que vous avez décidé revient vous chercher.
   ================================================================== */
function graineMure(){
  if(!E || !E.graines || !E.graines.length) return null;
  const i = E.graines.findIndex(g=>g.tour<=E.tour);
  return i<0 ? null : E.graines.splice(i,1)[0];
}

function germer(gr){
  /* heureuse ou non : la somme de ce qu'elle apporte aux quatre forces */
  try{ const e=(gr.s&&gr.s.e)||{};
       SON.germe(CLES.reduce((n,k)=>n+(e[k]||0),0) >= 0); }catch(e){}
  E.evEnCours = null;
  E.graineEnCours = gr;
  appliquer(gr.s.e);
  try{ SON.coup() }catch(e){}
  rendreGraine(gr);
}

function rendreGraine(gr){
  remonter();
  /* le sens se lit dans le bilan des effets : on ne l'écrit pas deux fois */
  const bilan = CLES.reduce((s,k)=>s+(gr.s.e[k]||0), 0);
  const bon = bilan >= 0;
  const ecart = (gr.semee!=null) ? (E.tour-gr.semee) : gr.s.dans;
  app.innerHTML=`
  <div class="tableau">
    <span class="plaque">État des forces</span>
    ${barresForces()}
  </div>
  <div class="bureau"><div class="plateau un">
    <div class="ev graine ${bon?"bonne":"mauvaise"}">
      <div class="evd">${bon?"Grâce à":"À cause de"} votre choix d’il y a ${ecart} tour${ecart>1?"s":""}</div>
      <div class="origine">
        Vous aviez répondu <em>${esc(gr.choix||"—")}</em>
        à l’affaire « ${esc(gr.de).replace(/\s*\.$/,"")} ».
        <span>Ce n’est donc pas votre dernière décision qui produit ceci.</span>
      </div>
      <div class="evt">${esc(gr.s.t)}</div>
      <p class="evx">${gras(esc(gr.s.x))}</p>
      <div class="evi">${impacts(gr.s.e)}</div>
    </div>
    ${gr.s.q ? `
    <div class="question">${esc(gr.s.q.texte)}</div>
    <div class="rep ${gr.s.q.choix.length===2?"deux":""}">
      ${gr.s.q.choix.map((c,i)=>`<button class="choix" onclick="graineChoix(${i})">
        <span class="q">${esc(c.q)}</span></button>`).join("")}
    </div>`
    : `<p class="centre" style="margin:22px 0 0">
      <button class="plein" onclick="suiteGraine()">Continuer</button>
    </p>`}
  </div></div>`;
  try{ SON.majTension() }catch(e){}
  majVue();
}

/* Une conséquence peut appeler une décision de plus. */
function graineChoix(i){
  const gr=E.graineEnCours;
  if(!gr || !gr.s.q) return suiteGraine();
  const r=gr.s.q.choix[i];
  appliquer(r.e);
  E.consq=r.c; E.entassement="";
  suiteGraine();
}

function suiteGraine(){
  E.graineEnCours = null;
  const mort=CLES.find(k=>E.f[k]<=0);
  if(mort) return finir(mort);
  if(E.mode==="campagne" && E.tour>=N.tours) return finir("verdict");
  piocher(); rendre();
}

   Une seule fois par partie, et jamais collée à un autre événement. */

/* ==================================================================
   LES IMAGES — toutes facultatives
   Une image absente se retire d'elle-même : rien ne reste en suspens,
   aucune icône cassée, la mise en page se referme.
   ================================================================== */

/* Un nom de fichier stable, tiré du texte : « L’eau croupit devant les
   portes. » devient « l-eau-croupit-devant-les-portes ». */
function slug(t){
  return (t||"")
    .normalize("NFD").replace(/[̀-ͯ]/g,"")   // accents
    .replace(/[’'`]/g,"-")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"")
    .slice(0,60);
}

/* Le gabarit commun. onerror retire le bloc entier, légende comprise. */
function illu(src, legende, classe){
  return `<figure class="illu ${classe||""}">
    <img src="${src}" alt="" loading="lazy"
         onerror="this.closest('figure').remove()">
    ${legende?`<figcaption>${esc(legende)}</figcaption>`:""}
  </figure>`;
}

/* Le portrait d'un acteur : propre au niveau, car les quatre forces ne
   sont pas les mêmes à Manchester et à Detroit. */
function illuActeur(k){
  return illu("img/acteurs/"+N.id+"-"+k+".jpg", "", "portrait");
}

/* Celui qui plaide sur la carte du jour. On ne garde que le nom, pas la
   fonction : « Mary Kearsley, ouvrière fileuse… » donne mary-kearsley.jpg. */
function illuPersonne(qui){
  const nom = String(qui||"").split(",")[0]
    .replace(/^(le |la |l’|miss |sir |monsieur |madame |le docteur |le révérend )/i,"");
  return illu("img/gens/"+slug(nom)+".jpg", "", "vignette");
}

/* La pièce jointe au rapport d'enquête : gravure, photographie, article.
   C'est elle qui doit donner envie d'ouvrir le dossier. */
function illuDoc(c){
  return illu("img/docs/"+slug(c.t)+".jpg", c.doc||"", "piece");
}

/* Appliquer un effet — et retenir qui vient d'encaisser. Les forces qui
   reculent tressailleront au prochain rendu : la conséquence se voit
   avant de se lire. */
function appliquer(e){
  if(!e || !E) return;
  const frappees=[];
  let bascule=false;
  if(!E.alerte) E.alerte={};
  CLES.forEach(k=>{
    if(!e[k]) return;
    const avant = E.f[k];
    E.f[k] = clamp(E.f[k] + e[k]);
    if(e[k] < 0) frappees.push(k);
    /* La force vient de passer sous le seuil d'alarme : on le signale
       une fois, et on réarme dès qu'elle repasse au-dessus. */
    if(avant > 14 && E.f[k] <= 14 && !E.alerte[k]){ E.alerte[k]=true; bascule=true; }
    if(E.f[k] > 18) E.alerte[k]=false;
  });
  if(bascule) try{ SON.alerte() }catch(x){}
  E.secousse = frappees;
  if(frappees.length){ clearTimeout(SEC_T); SEC_T=null; }
}

/* ==================================================================
   LE RAPPORT D'ENQUÊTE, VERSION LISIBLE

   Il arrivait d'un bloc, gris sur gris, et personne ne l'ouvrait deux
   fois. Trois gestes, aucun sur le fond : on respire au milieu, on
   fait ressortir les dates et les chiffres, et les notions du cours —
   déjà en gras dans le texte — sont soulignées au crayon.
   ================================================================== */

/* Un pavé de huit lignes décourage : au-delà de trois phrases, on
   respire au milieu. Si le découpage ne retrouve pas le texte entier,
   on n'y touche pas — mieux vaut un pavé qu'une phrase perdue. */
function aerer(h){
  const ph = h.match(/[^.!?…]+[.!?…]+[»”"’']*\s*/g);
  if(!ph || ph.join("") !== h) return h;
  /* trois phrases courtes tiennent en un bloc ; trois longues, non */
  if(ph.length < 3 || (ph.length < 4 && h.length < 340)) return h;
  const c = Math.ceil(ph.length/2);
  const tete = ph.slice(0,c).join("");
  /* jamais au milieu d'une notion mise en gras */
  if((tete.match(/<strong>/g)||[]).length !== (tete.match(/<\/strong>/g)||[]).length) return h;
  return tete + '<span class="alinea"></span>' + ph.slice(c).join("");
}

/* Les dates et les chiffres portent l'essentiel d'un rapport : « 25 000
   habitants en 1772 », « douze heures ». On les détache, sans jamais
   toucher à ce qui est déjà balisé. */
function faits(h){
  return h.replace(/(<[^>]*>)|(&[a-zA-Z#0-9]+;)|([^<&]+)/g, (m,tag,ent,txt)=>{
    if(txt === undefined) return m;
    return txt.replace(/\d+(?:[   .,]\d+)*(?:\s?%)?/g,
                       x => '<em class="fait">'+x+'</em>');
  });
}

/* Le texte du rapport, prêt à lire : lettrine comprise. */
function corpsRapport(c){
  let h = faits(aerer(gras(esc(c.f))));
  h = h.replace(/^([A-ZÀ-ÖØ-Þ])/, '<span class="init">$1</span>');
  return h;
}

/* ==================================================================
   LA FRAPPE AVEC BALISES

   « taper » n'écrit que du texte nu. Le panneau de mission porte des
   notions en gras : coupé au milieu d'un « <strong> », le navigateur
   referme n'importe comment et la mise en forme saute. On découpe donc
   la chaîne en balises d'un côté, caractères de l'autre, et on referme
   à chaque image ce qui est resté ouvert.
   ================================================================== */

function decouperHTML(html){
  const jetons=[]; let i=0;
  while(i < html.length){
    if(html[i] === "<"){
      const j = html.indexOf(">", i);
      if(j < 0){ jetons.push({b:html.slice(i)}); break; }
      jetons.push({b:html.slice(i, j+1)}); i = j+1;
    } else if(html[i] === "&"){
      const j = html.indexOf(";", i);
      if(j > i && j-i <= 8){ jetons.push({c:html.slice(i, j+1)}); i = j+1; }
      else { jetons.push({c:"&"}); i++; }
    } else { jetons.push({c:html[i]}); i++; }
  }
  return jetons;
}

const SOLITAIRES = /^(br|img|hr|input|wbr|source)$/i;

function prefixeHTML(jetons, n){
  let out="", vus=0; const pile=[];
  for(const j of jetons){
    if(j.b !== undefined){
      const m = j.b.match(/^<\/?([a-zA-Z0-9]+)/);
      out += j.b;
      if(m){
        if(j.b[1] === "/") pile.pop();
        else if(!/\/>\s*$/.test(j.b) && !SOLITAIRES.test(m[1])) pile.push(m[1]);
      }
    } else {
      if(vus >= n) break;
      out += j.c; vus++;
    }
  }
  for(let k = pile.length-1; k >= 0; k--) out += "</"+pile[k]+">";
  return out;
}

/* Les frappes du menu ne vivent pas dans E : on y arrive avant qu'une
   partie existe. */
let MACH_MENU = [];
function stopperMenu(){ MACH_MENU.forEach(clearInterval); MACH_MENU = []; }

function taperHTML(el, html, ms, pas, fin){
  const jetons = decouperHTML(html);
  const total  = jetons.reduce((n,j)=> n + (j.c!==undefined ? 1 : 0), 0);
  let n = 0;
  el.innerHTML = "";
  el.dataset.fini = html;
  const id = setInterval(()=>{
    n += pas;
    if(n >= total){ clearInterval(id); el.innerHTML = html; if(fin) fin(); return; }
    el.innerHTML = prefixeHTML(jetons, n);
  }, ms);
  MACH_MENU.push(id);
  return id;
}

/* La mission s'écrit bloc par bloc : le titre d'abord, puis chaque
   paragraphe. Un clic n'importe où pose tout d'un coup — on ne retient
   personne qui a déjà lu. */
function ecrireMission(){
  const bloc = app.querySelector(".mission > .role");
  if(!bloc) return;
  const parts = Array.from(bloc.children);
  if(!parts.length) return;
  if(window.SANS_CHRONO){ return; }
  const textes = parts.map(e=>e.innerHTML);
  parts.forEach(e=>{ e.innerHTML=""; e.style.minHeight="1em"; });
  bloc.dataset.encours = "1";
  let k = 0;
  (function suivant(){
    if(k >= parts.length){ delete bloc.dataset.encours;
      parts.forEach(e=>e.style.minHeight=""); return; }
    const e = parts[k], t = textes[k];
    /* le titre se détache, le reste file, les notes filent encore plus */
    const vite = e.classList.contains("r") ? [18,1]
               : e.classList.contains("note-source") ? [10,4]
               : e.classList.contains("note-role") ? [10,3] : [12,2];
    k++;
    taperHTML(e, t, vite[0], vite[1], suivant);
  })();

  bloc.onclick = ()=>{
    stopperMenu();
    parts.forEach((e,i)=>{ e.innerHTML = textes[i]; e.style.minHeight=""; });
    delete bloc.dataset.encours; bloc.onclick = null;
  };
}

/* On remonte au tableau : c'est là que se voit ce qu'on vient de faire.
   En douceur, sauf si l'on a demandé moins d'animations. */
function remonter(sec){
  /* tout changement d’écran arrête la machine à écrire : elle ne
     reprendra que si un texte se remet à s’écrire. */
  try{ SON.frappe(false) }catch(e){}
  /* sec : d'un coup. On s'en sert quand l'écran change entièrement —
     glisser depuis le bas d'un menu n'aurait aucun sens. */
  const doux = !sec && (!window.matchMedia
    || !window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  try{ window.scrollTo({top:0, left:0, behavior: doux ? "smooth" : "auto"}); }
  catch(e){ window.scrollTo(0,0); }
}

/* ==================================================================
   L'ÉCRAN DE FIN

   C'est le dernier texte que l'élève lit avant d'écrire le sien : il
   doit expliquer, pas seulement constater. Trois chiffres y figuraient
   nus — « Conditions réunies 0 / 7 » ne veut rien dire pour qui vient
   de perdre. Chacun dit maintenant ce qu'il compte, et à quoi cela se
   compare dans l'histoire réelle.
   ================================================================== */

/* La force en cause. Quand une force est tombée, c'est elle. Quand on
   est allé au bout, on montre celle qui a le plus soutenu et celle qui
   a le plus payé : c'est ce qui raconte la partie. */
function visagesFin(){
  if(CLES.indexOf(E.fini) >= 0){
    const k = E.fini;
    return { g:k, gl:"Ceux qui vous ont lâché",
             d:k, dl:esc(N.forces[k].veut) };
  }
  const tri = CLES.slice().sort((a,b)=> E.f[b]-E.f[a]);
  return { g:tri[0], gl:"Votre appui jusqu’au bout",
           d:tri[tri.length-1], dl:"Ceux qui ont le plus payé" };
}

/* Les décisions qui ont le plus coûté à cette force-là. C'est la
   réponse concrète à « pourquoi ai-je perdu ? » : on nomme les choix,
   on dit leur prix, on rappelle l'année. */
function coupsPortes(k, combien){
  return (E.carnet||[])
    .filter(d => d.e && d.e[k] < 0)
    .sort((a,b) => a.e[k] - b.e[k])
    .slice(0, combien);
}

function blocPourquoi(){
  const perdue = CLES.indexOf(E.fini) >= 0;
  if(!perdue){
    const bas = CLES.slice().sort((a,b)=> E.f[a]-E.f[b])[0];
    return `<h3>Pourquoi la partie s’arrête ici</h3>
      <p>Vous êtes allé au bout : <b>${E.tour}</b> décisions, de ${N.a0} à ${N.a1},
      sans qu’aucune des quatre forces ne tombe à zéro. Le verdict ci-dessus dépend
      de l’état dans lequel vous les laissez — la plus basse est
      <b>${N.forces[bas].nom}</b>, à ${Math.round(E.f[bas])} sur 100.</p>`;
  }
  const k = E.fini, coups = coupsPortes(k, 3);
  return `<h3>Pourquoi la partie s’arrête ici</h3>
    <p><b>${N.forces[k].nom}</b> est tombé à <b>zéro</b> sur 100. C’est la règle annoncée
    au départ : une force à zéro cesse de vous suivre, et sans elle plus rien ne
    fonctionne — ${esc(N.forces[k].veut)}, c’était ce qu’elle réclamait.</p>
    ${coups.length ? `<p class="fin-intro-coups">Les décisions qui lui ont le plus coûté :</p>
    <ol class="fin-coups">${coups.map(d=>`<li>
      <span class="fin-cout">${d.e[k]}</span>
      <span class="fin-quoi"><b>${esc(d.q)}</b>
      <i>${d.an?d.an+" — ":""}à l’affaire « ${esc(d.t)} »</i></span>
    </li>`).join("")}</ol>` : ""}
    <p class="fin-rattrape">Une force prévient longtemps avant de tomber : le bandeau
    rouge apparaît dès qu’elle passe sous quinze. C’est le moment de lui céder
    quelque chose, même au prix d’une autre.</p>`;
}

/* Les deux chiffres, chacun expliqué. Il y en avait trois : le

/* ==================================================================
   LE CARNET DE BORD

   Où en suis-je ? L'année, la décision, la population et sa courbe,
   les sept conditions. Posé à droite sous le courrier, sur du papier
   réglé : c'est le document qu'on consulte sans quitter l'affaire.
   ================================================================== */

/* La courbe de la population, tracée à l'encre. Elle ne vaut pas pour
   ses valeurs exactes mais pour sa forme : on voit si la ville enfle,
   et à quel moment elle s'est mise à enfler. */
function courbePop(){
  const c = (E.courbe||[]).filter(p=>isFinite(p.pop));
  if(c.length < 2) return "";
  const L=250, H=56, m=7;
  const xs=c.map(p=>p.t), ys=c.map(p=>p.pop);
  const xa=Math.min.apply(null,xs);
  const xb=Math.max(Math.max.apply(null,xs), E.mode==="campagne"? N.tours-1 : xa+1);
  const ya=Math.min.apply(null,ys), yb=Math.max.apply(null,ys);
  const px = t => m + (L-2*m) * (xb===xa ? 0 : (t-xa)/(xb-xa));
  const py = v => (H-m) - (H-2*m) * (yb===ya ? .5 : (v-ya)/(yb-ya));
  const pts = c.map(p=>px(p.t).toFixed(1)+","+py(p.pop).toFixed(1)).join(" ");
  const d = c[c.length-1];
  return `<svg class="courbe" viewBox="0 0 ${L} ${H}" preserveAspectRatio="none"
     role="img" aria-label="Courbe de la ${N.unite.toLowerCase()}">
    <polygon points="${px(xa).toFixed(1)},${H-m} ${pts} ${px(d.t).toFixed(1)},${H-m}"
             class="aire"></polygon>
    <polyline points="${pts}" class="trait"></polyline>
    <circle cx="${px(d.t).toFixed(1)}" cy="${py(d.pop).toFixed(1)}" r="3.2" class="ici"></circle>
  </svg>`;
}

/* Les décisions en bâtons : dix-huit cases, on voit d'un coup ce qui
   est derrière et ce qui reste. */
function batons(){
  if(E.mode!=="campagne") return "";
  let out="";
  for(let i=0;i<N.tours;i++) out += `<i class="${i<E.tour?"fait":""}"></i>`;
  return `<div class="batons">${out}</div>`;
}

function carnet(d){

  /* Fermé par défaut. Ouvert, il étalait l'année, la population, la
     courbe et les sept conditions sous les réponses : trois écrans de
     chiffres pour une décision qui ne s'en sert pas. Il reste à un
     clic — son rabat montre déjà l'année et le numéro du tour. */
  const ouvert = (E.carnetOuvert === true);
  return `<details class="carnet dossier" ${ouvert?"open":""} ${d||""}>
    <summary>
      <span class="onglet">Carnet de bord</span>
      <span class="cn-rabat">${E.mode==="campagne"
        ? `<b>${AN(E.tour)}</b> · décision ${E.tour+1} sur ${N.tours}`
        : `<b>Survie</b> · décision ${E.tour+1}`}</span>
      <span class="pli"></span>
    </summary>
    <div class="spirale" aria-hidden="true"></div>
    <div class="feuille">

      <div class="cn-ligne cn-annee">
        <span class="cn-k">${E.mode==="campagne"?"Année":"Mode"}</span>
        <span class="cn-v">${E.mode==="campagne"?AN(E.tour):"survie"}</span>
      </div>

      <div class="cn-ligne">
        <span class="cn-k">Décision</span>
        <span class="cn-v cn-petit">${E.tour+1}${E.mode==="campagne"?` <small>sur ${N.tours}</small>`:""}</span>
      </div>
      ${batons()}

      <div class="cn-ligne">
        <span class="cn-k">${N.unite}</span>
        <span class="cn-v cn-petit">${fmt(E.pop)}</span>
      </div>
      ${courbePop()}
      <p class="cn-note">${N.a0} : ${fmt(N.pop0)} ${N.unite2}.</p>


    </div>
  </details>`;
}

/* ==================================================================
   LE DÉCOR

   "photo"  : la pièce de bureau photographiée, baie vitrée comprise.
              Le tableau des forces pend devant la baie, les papiers
              se posent sur la boiserie.
   "dessin" : la fenêtre peinte en SVG, qui s'encrasse et dont les
              cheminées poussent à mesure que la ville enfle.

   Un seul mot à changer pour passer de l'un à l'autre. Rien n'est
   supprimé : les deux décors vivent côte à côte dans le fichier.
   ================================================================== */
const DECOR = "photo";

function poserDecor(ecran){
  const el = document.getElementById("decor");
  if(!el) return;
  if(DECOR !== "photo"){ document.body.dataset.decor = "dessin"; return; }

  /* L'écran de choix et le tutoriel se passent aujourd'hui, à Beau
     Soleil : on n'entre dans le siècle qu'en ouvrant une époque. */
  const id = (typeof N!=="undefined" && N) ? N.id : "I";
  /* La pièce est la même, la ville qu'on voit par la baie ne l'est
     pas : trois états, au premier et au deuxième tiers de la partie.
     Repli en cascade — la phase, puis le décor unique du niveau, puis
     celui de Manchester : tant qu'une image manque, rien ne casse. */
  const voulu = (ecran === "menu")
    ? ["img/decor/menu.jpg", "img/decor/bureau-I.jpg"]
    : ["img/decor/bureau-" + id + "-" + phaseVue() + ".jpg",
       "img/decor/bureau-" + id + "-" + phaseVue() + ".png",
       "img/decor/bureau-" + id + ".jpg",
       "img/decor/bureau-I.jpg"];

  if(el.dataset.voulu === voulu[0]) return;     // déjà en place
  el.dataset.voulu = voulu[0];

  /* On essaie dans l'ordre et on s'arrête au premier qui charge. Si
     aucun ne vient, la fenêtre dessinée reprend la main : jamais de
     trou, quelle que soit l'image qui manque. */
  (function essayer(i){
    if(i >= voulu.length){ document.body.dataset.decor = "dessin"; return; }
    const src = voulu[i], im = new Image();
    im.onload  = ()=>{ el.style.backgroundImage = `url("${src}")`;
                       document.body.dataset.decor = "photo";
                       /* la salle de classe appelle un thème clair ; la
                          pièce de Manchester, non. */
                       document.body.dataset.decorEcran =
                         (src === "img/decor/menu.jpg") ? "menu" : "bureau"; };
    im.onerror = ()=>essayer(i+1);
    im.src = src;
  })(0);
}

/* ==================================================================
   LE RETOUR SUR LE JEU

   Ce que l'élève pense du jeu part avec sa trace. Les questions sont
   choisies pour qu'une réponse serve à décider quelque chose : si la
   moitié d'une classe répond « souvent difficiles », on réécrit ; si
   elle répond « trop longue », on coupe.
   ================================================================== */
const AVIS = [

/* ==================================================================
   LES QUATRE COURBES

   Une ligne par acteur, du premier tour au dernier. Ce n'est pas un
   ornement : c'est la seule page du jeu où l'élève voit d'un regard que
   sa décision du tour 7 a fait plonger les ouvriers, et que rien ne les
   a relevés ensuite.
   ================================================================== */
const COUL_F = { i:"#8E5A1E", o:"#9A2A1E", m:"#2F6B5E", p:"#2E3E7A" };

function courbesForces(){
  const r = (E.releve||[]).filter(p=>p && isFinite(p.i));
  if(r.length < 2) return "";
  const L=760, H=210, mg=34, md=14, mh=14, mb=26;
  const xb = Math.max(...r.map(p=>p.t)) || 1;
  const px = t => mg + (L-mg-md) * (t/xb);
  const py = v => (H-mb) - (H-mh-mb) * (v/100);

  /* les repères : zéro, cinquante, cent */
  const grille = [0,25,50,75,100].map(v=>`
    <line x1="${mg}" y1="${py(v).toFixed(1)}" x2="${L-md}" y2="${py(v).toFixed(1)}"
          class="${v===0?"zero":"g"}"></line>
    <text x="${mg-6}" y="${(py(v)+4).toFixed(1)}" class="ax">${v}</text>`).join("");

  const lignes = CLES.map(k=>{
    const pts = r.map(p=>px(p.t).toFixed(1)+","+py(p[k]).toFixed(1)).join(" ");
    const d = r[r.length-1];
    return `<polyline points="${pts}" fill="none" stroke="${COUL_F[k]}"
              stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"
              vector-effect="non-scaling-stroke"></polyline>
            <circle cx="${px(d.t).toFixed(1)}" cy="${py(d[k]).toFixed(1)}" r="3.4"
              fill="${COUL_F[k]}" stroke="#FBF6E6" stroke-width="1.3"></circle>`;
  }).join("");

  /* Chaque décision porte son année, et un trait la descend jusqu'à
     l'axe : c'est ce qui permet de lire le carnet en regard de la
     courbe, puisqu'il donne la même année en face de chaque choix.
     Au-delà de douze points, une année sur deux, pour ne pas les
     empiler. */
  const saut = r.length > 12 ? 2 : 1;
  const an = r[0].an ? r.map((p,n)=>{
    const x = px(p.t).toFixed(1);
    const trait = `<line x1="${x}" y1="${py(100).toFixed(1)}" x2="${x}"
                     y2="${py(0).toFixed(1)}" class="jalon"></line>`;
    const txt = (n % saut === 0 || n === r.length-1)
      ? `<text x="${x}" y="${H-7}" class="ax an">${p.an}</text>` : "";
    return trait + txt;
  }).join("") : "";

  return `<svg class="cfo" viewBox="0 0 ${L} ${H}" role="img"
     aria-label="Évolution des quatre forces au fil de la partie">
    ${grille}${lignes}${an}</svg>`;
}

function legendeForces(){
  const r = E.releve||[], d = r[r.length-1] || {};
  return `<div class="cfo-leg">${CLES.map(k=>{
    const v = d[k]==null ? 60 : d[k], ecart = v - 60;
    return `<span class="cfo-l">
      <i style="background:${COUL_F[k]}"></i>
      <b>${esc(N.forces[k].nom)}</b>
      <em>${v}</em>
      <u class="${ecart>0?"up":ecart<0?"dn":""}">${ecart>0?"+":""}${ecart}</u>
    </span>`;
  }).join("")}</div>`;
}

/* Ce qu'une décision a fait aux quatre forces, en clair. */
function effetsLigne(e){
  if(!e) return "";
  const l = CLES.filter(k=>e[k]).map(k=>
    `<span class="ef ${e[k]>0?"up":"dn"}">${esc(N.forces[k].nom)}&nbsp;${e[k]>0?"+":""}${e[k]}</span>`);
  return l.length ? `<span class="efs">${l.join("")}</span>` : "";
}

/* Le même relevé en texte, pour la trace copiée. */
function releveTexte(){
  const r = E.releve||[];
  if(r.length < 2) return [];
  const L = ["", "L’ÉTAT DES QUATRE FORCES, DÉCISION APRÈS DÉCISION",
    "  année   " + CLES.map(k=>N.forces[k].nom.padEnd(14)).join("")];
  r.forEach(p=>{
    L.push("  " + String(p.an||p.t).padEnd(8)
      + CLES.map(k=>String(p[k]).padEnd(14)).join(""));
  });
  return L;
}

/* ==================================================================
   POURQUOI CET ACTEUR A BOUGÉ

   Le rapport de décision disait d'un bloc, et en général, ce qui venait
   d'arriver. Chaque acteur porte maintenant son propre chiffre et
   s'ouvre d'un clic sur sa raison. Tout vient de ce que la partie garde
   déjà : la dernière décision, ses effets, et ce que chaque force veut.
   ================================================================== */

/* Le dernier choix, s'il y en a un. */
function dernierChoix(){
  const c = E.carnet || [];
  return c.length ? c[c.length-1] : null;
}

/* Celui que la dernière décision a le plus remué : c'est dans sa bulle
   que va le récit de la conséquence, pour ne pas le répéter quatre fois. */
function plusRemue(){
  const d = dernierChoix();
  if(!d || !d.e) return null;
  let best=null, max=0;
  CLES.forEach(k=>{ const v=Math.abs(d.e[k]||0); if(v>max){ max=v; best=k; } });
  return best;
}

function bulleForce(k){
  const d = dernierChoix();
  const v = d && d.e ? (d.e[k]||0) : 0;
  if(!d) return "";
  const recit = (k === plusRemue() && E.consq) ? `<p class="bq">${esc(E.consq)}</p>` : "";
  const ent   = (k === "o" && E.entassement) ? `<p class="bent">${esc(E.entassement)}</p>` : "";
  if(!v && !recit && !ent) return "";
  const h = humeur(v);
  const logique = (N.forces[k].pourquoi || {})[v>0?"plus":"moins"] || "";
  return `<div class="pourquoi">
    <div class="bt"><b class="${h?h.sens:""}">${esc(N.forces[k].nom)}</b>${
      h?` — ${h.mot.toLowerCase()}`:""}</div>
    <p class="bd">${esc(d.q||"")}</p>
    ${logique?`<p class="bp">${esc(logique)}</p>`:""}
    <p class="bv">Ce qu’ils attendent de vous : ${esc(N.forces[k].veut)}.</p>
    ${recit}${ent}
  </div>`;
}

/* Un clic sur un acteur ouvre sa bulle et ferme les autres. On ne
   repeint rien : l'écran serait reconstruit et la bulle perdue. */
function bulle(el, k){
  if(!el) return;
  const etait = el.classList.contains("ouvert");
  document.querySelectorAll(".force.ouvert").forEach(x=>x.classList.remove("ouvert"));
  if(!etait){
    el.classList.add("ouvert");
    const d = dernierChoix();
    try{ SON.jeton(d && d.e ? (d.e[k]||0) : 0) }catch(e){}
  }
}

/* Une décision ne vaut pas « moins neuf » : elle contrarie, ou elle
   contente. Le chiffre reste dans la trace écrite, où il sert à
   corriger ; sur le bureau, il laisse place au mot. */
function humeur(v){
  if(!v) return null;
  const a = Math.abs(v);
  return {
    mot: v > 0 ? (a>=10 ? "Très satisfaits" : a>=5 ? "Satisfaits" : "Plutôt contents")
               : (a>=10 ? "Très mécontents" : a>=5 ? "Mécontents"  : "Contrariés"),
    sens: v > 0 ? "up" : "dn",
    fl: (v>0?"▲":"▼").repeat(a<=4 ? 1 : a<=9 ? 2 : 3)
  };
}
