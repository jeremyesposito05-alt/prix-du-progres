/* ==================================================================
   LES IMAGES — toutes facultatives
   Une image absente se retire d'elle-même : rien ne reste en suspens,
   aucune icône cassée, la mise en page se referme.
   ================================================================== */

/* Un nom de fichier stable, tiré du texte : « L’eau croupit devant les
   portes. » devient « l-eau-croupit-devant-les-portes ». */
function slug(t){
  return (t||"")
    .normalize("NFD").replace(/[̀-ͯ]/g,"")   // accents
    .replace(/[’'`]/g,"-")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"")
    .slice(0,60);
}

/* Le gabarit commun. onerror retire le bloc entier, légende comprise. */
function illu(src, legende, classe){
  return `<figure class="illu ${classe||""}">
    <img src="${src}" alt="" loading="lazy"
         onerror="this.closest('figure').remove()">
    ${legende?`<figcaption>${esc(legende)}</figcaption>`:""}
  </figure>`;
}

/* Le portrait d'un acteur : propre au niveau, car les quatre forces ne
   sont pas les mêmes à Manchester et à Detroit. */
function illuActeur(k){
  return illu("img/acteurs/"+N.id+"-"+k+".jpg", "", "portrait");
}

/* Celui qui plaide sur la carte du jour. On ne garde que le nom, pas la
   fonction : « Mary Kearsley, ouvrière fileuse… » donne mary-kearsley.jpg. */
function illuPersonne(qui){
  const nom = String(qui||"").split(",")[0]
    .replace(/^(le |la |l’|miss |sir |monsieur |madame |le docteur |le révérend )/i,"");
  return illu("img/gens/"+slug(nom)+".jpg", "", "vignette");
}

/* La pièce jointe au rapport d'enquête : gravure, photographie, article.
   C'est elle qui doit donner envie d'ouvrir le dossier. */
function illuDoc(c){
  return illu("img/docs/"+slug(c.t)+".jpg", c.doc||"", "piece");
}

/* Appliquer un effet — et retenir qui vient d'encaisser. Les forces qui
   reculent tressailleront au prochain rendu : la conséquence se voit
   avant de se lire. */
function appliquer(e){
  if(!e || !E) return;
  const frappees=[];
  let bascule=false;
  if(!E.alerte) E.alerte={};
  CLES.forEach(k=>{
    if(!e[k]) return;
    const avant = E.f[k];
    E.f[k] = clamp(E.f[k] + e[k]);
    if(e[k] < 0) frappees.push(k);
    /* La force vient de passer sous le seuil d'alarme : on le signale
       une fois, et on réarme dès qu'elle repasse au-dessus. */
    if(avant > 14 && E.f[k] <= 14 && !E.alerte[k]){ E.alerte[k]=true; bascule=true; }
    if(E.f[k] > 18) E.alerte[k]=false;
  });
  if(bascule) try{ SON.alerte() }catch(x){}
  E.secousse = frappees;
  if(frappees.length){ clearTimeout(SEC_T); SEC_T=null; }
}

/* ==================================================================
   LE RAPPORT D'ENQUÊTE, VERSION LISIBLE

   Il arrivait d'un bloc, gris sur gris, et personne ne l'ouvrait deux
   fois. Trois gestes, aucun sur le fond : on respire au milieu, on
   fait ressortir les dates et les chiffres, et les notions du cours —
   déjà en gras dans le texte — sont soulignées au crayon.
   ================================================================== */

/* Un pavé de huit lignes décourage : au-delà de trois phrases, on
   respire au milieu. Si le découpage ne retrouve pas le texte entier,
   on n'y touche pas — mieux vaut un pavé qu'une phrase perdue. */
function aerer(h){
  const ph = h.match(/[^.!?…]+[.!?…]+[»”"’']*\s*/g);
  if(!ph || ph.join("") !== h) return h;
  /* trois phrases courtes tiennent en un bloc ; trois longues, non */
  if(ph.length < 3 || (ph.length < 4 && h.length < 340)) return h;
  const c = Math.ceil(ph.length/2);
  const tete = ph.slice(0,c).join("");
  /* jamais au milieu d'une notion mise en gras */
  if((tete.match(/<strong>/g)||[]).length !== (tete.match(/<\/strong>/g)||[]).length) return h;
  return tete + '<span class="alinea"></span>' + ph.slice(c).join("");
}

/* Les dates et les chiffres portent l'essentiel d'un rapport : « 25 000
   habitants en 1772 », « douze heures ». On les détache, sans jamais
   toucher à ce qui est déjà balisé. */
function faits(h){
  return h.replace(/(<[^>]*>)|(&[a-zA-Z#0-9]+;)|([^<&]+)/g, (m,tag,ent,txt)=>{
    if(txt === undefined) return m;
    return txt.replace(/\d+(?:[   .,]\d+)*(?:\s?%)?/g,
                       x => '<em class="fait">'+x+'</em>');
  });
}

/* Le texte du rapport, prêt à lire : lettrine comprise. */
function corpsRapport(c){
  let h = faits(aerer(gras(esc(c.f))));
  h = h.replace(/^([A-ZÀ-ÖØ-Þ])/, '<span class="init">$1</span>');
  return h;
}

/* ==================================================================
   LA FRAPPE AVEC BALISES

   « taper » n'écrit que du texte nu. Le panneau de mission porte des
   notions en gras : coupé au milieu d'un « <strong> », le navigateur
   referme n'importe comment et la mise en forme saute. On découpe donc
   la chaîne en balises d'un côté, caractères de l'autre, et on referme
   à chaque image ce qui est resté ouvert.
   ================================================================== */

function decouperHTML(html){
  const jetons=[]; let i=0;
  while(i < html.length){
    if(html[i] === "<"){
      const j = html.indexOf(">", i);
      if(j < 0){ jetons.push({b:html.slice(i)}); break; }
      jetons.push({b:html.slice(i, j+1)}); i = j+1;
    } else if(html[i] === "&"){
      const j = html.indexOf(";", i);
      if(j > i && j-i <= 8){ jetons.push({c:html.slice(i, j+1)}); i = j+1; }
      else { jetons.push({c:"&"}); i++; }
    } else { jetons.push({c:html[i]}); i++; }
  }
  return jetons;
}

const SOLITAIRES = /^(br|img|hr|input|wbr|source)$/i;

function prefixeHTML(jetons, n){
  let out="", vus=0; const pile=[];
  for(const j of jetons){
    if(j.b !== undefined){
      const m = j.b.match(/^<\/?([a-zA-Z0-9]+)/);
      out += j.b;
      if(m){
        if(j.b[1] === "/") pile.pop();
        else if(!/\/>\s*$/.test(j.b) && !SOLITAIRES.test(m[1])) pile.push(m[1]);
      }
    } else {
      if(vus >= n) break;
      out += j.c; vus++;
    }
  }
  for(let k = pile.length-1; k >= 0; k--) out += "</"+pile[k]+">";
  return out;
}

/* Les frappes du menu ne vivent pas dans E : on y arrive avant qu'une
   partie existe. */
let MACH_MENU = [];
function stopperMenu(){ MACH_MENU.forEach(clearInterval); MACH_MENU = []; }

function taperHTML(el, html, ms, pas, fin){
  const jetons = decouperHTML(html);
  const total  = jetons.reduce((n,j)=> n + (j.c!==undefined ? 1 : 0), 0);
  let n = 0;
  el.innerHTML = "";
  el.dataset.fini = html;
  const id = setInterval(()=>{
    n += pas;
    if(n >= total){ clearInterval(id); el.innerHTML = html; if(fin) fin(); return; }
    el.innerHTML = prefixeHTML(jetons, n);
  }, ms);
  MACH_MENU.push(id);
  return id;
}

/* La mission s'écrit bloc par bloc : le titre d'abord, puis chaque
   paragraphe. Un clic n'importe où pose tout d'un coup — on ne retient
   personne qui a déjà lu. */
function ecrireMission(){
  const bloc = app.querySelector(".mission > .role");
  if(!bloc) return;
  const parts = Array.from(bloc.children);
  if(!parts.length) return;
  if(window.SANS_CHRONO){ return; }
  const textes = parts.map(e=>e.innerHTML);
  parts.forEach(e=>{ e.innerHTML=""; e.style.minHeight="1em"; });
  bloc.dataset.encours = "1";
  let k = 0;
  (function suivant(){
    if(k >= parts.length){ delete bloc.dataset.encours;
      parts.forEach(e=>e.style.minHeight=""); return; }
    const e = parts[k], t = textes[k];
    /* le titre se détache, le reste file, les notes filent encore plus */
    const vite = e.classList.contains("r") ? [18,1]
               : e.classList.contains("note-source") ? [10,4]
               : e.classList.contains("note-role") ? [10,3] : [12,2];
    k++;
    taperHTML(e, t, vite[0], vite[1], suivant);
  })();

  bloc.onclick = ()=>{
    stopperMenu();
    parts.forEach((e,i)=>{ e.innerHTML = textes[i]; e.style.minHeight=""; });
    delete bloc.dataset.encours; bloc.onclick = null;
  };
}

/* On remonte au tableau : c'est là que se voit ce qu'on vient de faire.
   En douceur, sauf si l'on a demandé moins d'animations. */
function remonter(sec){
  /* tout changement d’écran arrête la machine à écrire : elle ne
     reprendra que si un texte se remet à s’écrire. */
  try{ SON.frappe(false) }catch(e){}
  /* sec : d'un coup. On s'en sert quand l'écran change entièrement —
     glisser depuis le bas d'un menu n'aurait aucun sens. */
  const doux = !sec && (!window.matchMedia
    || !window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  try{ window.scrollTo({top:0, left:0, behavior: doux ? "smooth" : "auto"}); }
  catch(e){ window.scrollTo(0,0); }
}

   L'ÉCRAN DE FIN

   C'est le dernier texte que l'élève lit avant d'écrire le sien : il
   doit expliquer, pas seulement constater. Trois chiffres y figuraient
   nus — « Conditions réunies 0 / 7 » ne veut rien dire pour qui vient

/* La force en cause. Quand une force est tombée, c'est elle. Quand on
   est allé au bout, on montre celle qui a le plus soutenu et celle qui
   a le plus payé : c'est ce qui raconte la partie. */
function visagesFin(){
  if(CLES.indexOf(E.fini) >= 0){
    const k = E.fini;
    return { g:k, gl:"Ceux qui vous ont lâché",
             d:k, dl:esc(N.forces[k].veut) };
  }
  const tri = CLES.slice().sort((a,b)=> E.f[b]-E.f[a]);
  return { g:tri[0], gl:"Votre appui jusqu’au bout",
           d:tri[tri.length-1], dl:"Ceux qui ont le plus payé" };
}

/* Les décisions qui ont le plus coûté à cette force-là. C'est la
   réponse concrète à « pourquoi ai-je perdu ? » : on nomme les choix,
   on dit leur prix, on rappelle l'année. */
function coupsPortes(k, combien){
  return (E.carnet||[])
    .filter(d => d.e && d.e[k] < 0)
    .sort((a,b) => a.e[k] - b.e[k])
    .slice(0, combien);
}

function blocPourquoi(){

  if(!perdue){

    return `<h3>Pourquoi la partie s’arrête ici</h3>
      <p>Vous êtes allé au bout : <b>${E.tour}</b> décisions, de ${N.a0} à ${N.a1},

      de l’état dans lequel vous les laissez — la plus basse est
      <b>${N.forces[bas].nom}</b>, à ${Math.round(E.f[bas])} sur 100.</p>`;
  }
  const k = E.fini, coups = coupsPortes(k, 3);
  return `<h3>Pourquoi la partie s’arrête ici</h3>
    <p><b>${N.forces[k].nom}</b> est tombé à <b>zéro</b> sur 100. C’est la règle annoncée
    au départ : une force à zéro cesse de vous suivre, et sans elle plus rien ne
    fonctionne — ${esc(N.forces[k].veut)}, c’était ce qu’elle réclamait.</p>
    ${coups.length ? `<p class="fin-intro-coups">Les décisions qui lui ont le plus coûté :</p>
    <ol class="fin-coups">${coups.map(d=>`<li>

    rouge apparaît dès qu’elle passe sous quinze. C’est le moment de lui céder
    quelque chose, même au prix d’une autre.</p>`;
}

/* ==================================================================
   LE CARNET DE BORD

   Où en suis-je ? L'année, la décision, la population et sa courbe,
   les sept conditions. Posé à droite sous le courrier, sur du papier
   réglé : c'est le document qu'on consulte sans quitter l'affaire.
   ================================================================== */

/* La courbe de la population, tracée à l'encre. Elle ne vaut pas pour
   ses valeurs exactes mais pour sa forme : on voit si la ville enfle,
   et à quel moment elle s'est mise à enfler. */
function courbePop(){
  const c = (E.courbe||[]).filter(p=>isFinite(p.pop));
  if(c.length < 2) return "";
  const L=250, H=56, m=7;
  const xs=c.map(p=>p.t), ys=c.map(p=>p.pop);
  const xa=Math.min.apply(null,xs);
  const xb=Math.max(Math.max.apply(null,xs), E.mode==="campagne"? N.tours-1 : xa+1);
  const ya=Math.min.apply(null,ys), yb=Math.max.apply(null,ys);
  const px = t => m + (L-2*m) * (xb===xa ? 0 : (t-xa)/(xb-xa));
  const py = v => (H-m) - (H-2*m) * (yb===ya ? .5 : (v-ya)/(yb-ya));
  const pts = c.map(p=>px(p.t).toFixed(1)+","+py(p.pop).toFixed(1)).join(" ");
  const d = c[c.length-1];
  return `<svg class="courbe" viewBox="0 0 ${L} ${H}" preserveAspectRatio="none"
     role="img" aria-label="Courbe de la ${N.unite.toLowerCase()}">
    <polygon points="${px(xa).toFixed(1)},${H-m} ${pts} ${px(d.t).toFixed(1)},${H-m}"
             class="aire"></polygon>
    <polyline points="${pts}" class="trait"></polyline>
    <circle cx="${px(d.t).toFixed(1)}" cy="${py(d.pop).toFixed(1)}" r="3.2" class="ici"></circle>
  </svg>`;
}

/* Les décisions en bâtons : dix-huit cases, on voit d'un coup ce qui
   est derrière et ce qui reste. */

  if(E.mode!=="campagne") return "";

  for(let i=0;i<N.tours;i++) out += `<i class="${i<E.tour?"fait":""}"></i>`;
  return `<div class="batons">${out}</div>`;
}

function carnet(d){

  /* Fermé par défaut. Ouvert, il étalait l'année, la population, la

  const ouvert = (E.carnetOuvert === true);

/* ==================================================================
   LE DÉCOR

   "photo"  : la pièce de bureau photographiée, baie vitrée comprise.
              Le tableau des forces pend devant la baie, les papiers
              se posent sur la boiserie.
   "dessin" : la fenêtre peinte en SVG, qui s'encrasse et dont les
              cheminées poussent à mesure que la ville enfle.

   Un seul mot à changer pour passer de l'un à l'autre. Rien n'est
   supprimé : les deux décors vivent côte à côte dans le fichier.
   ================================================================== */
const DECOR = "photo";

function poserDecor(ecran){
  const el = document.getElementById("decor");
  if(!el) return;
  if(DECOR !== "photo"){ document.body.dataset.decor = "dessin"; return; }

  /* L'écran de choix et le tutoriel se passent aujourd'hui, à Beau
     Soleil : on n'entre dans le siècle qu'en ouvrant une époque. */
  const voulu = (ecran === "menu")
    ? ["img/decor/menu.jpg", "img/decor/bureau-I.jpg"]
    : ["img/decor/bureau-" + ((typeof N!=="undefined" && N) ? N.id : "I") + ".jpg"];

  if(el.dataset.voulu === voulu[0]) return;     // déjà en place
  el.dataset.voulu = voulu[0];

  /* On essaie dans l'ordre et on s'arrête au premier qui charge. Si
     aucun ne vient, la fenêtre dessinée reprend la main : jamais de
     trou, quelle que soit l'image qui manque. */
  (function essayer(i){
    if(i >= voulu.length){ document.body.dataset.decor = "dessin"; return; }
    const src = voulu[i], im = new Image();
    im.onload  = ()=>{ el.style.backgroundImage = `url("${src}")`;
                       document.body.dataset.decor = "photo";
                       /* la salle de classe appelle un thème clair ; la
                          pièce de Manchester, non. */
                       document.body.dataset.decorEcran =
                         (src === "img/decor/menu.jpg") ? "menu" : "bureau"; };
    im.onerror = ()=>essayer(i+1);
    im.src = src;
  })(0);
}

/* ==================================================================

   choisies pour qu'une réponse serve à décider quelque chose : si la

   ================================================================== */
const AVIS = [
 {q:"Les textes du jeu étaient-ils clairs ?",

 {q:"Qu’est-ce qui vous a le plus appris ?",

];

function avis(i,j){ (E.av || (E.av = AVIS.map(()=>null)))[i] = j; rendreTrace(); }

function blocAvis(){

    ${AVIS.map((x,i)=>`<div class="qz av-q">
      <div class="qq">${esc(x.q)}</div>

        onclick="avis(${i},${j})">${esc(t)}</button>`).join("")}</div>
    </div>`).join("")}
    <label>Y a-t-il eu un moment où vous avez été perdu, ou bien où vous vous êtes ennuyé ?

}

/* ==================================================================
   LES QUATRE COURBES

   Une ligne par acteur, du premier tour au dernier. Ce n'est pas un
   ornement : c'est la seule page du jeu où l'élève voit d'un regard que
   sa décision du tour 7 a fait plonger les ouvriers, et que rien ne les
   a relevés ensuite.
   ================================================================== */
const COUL_F = { i:"#8E5A1E", o:"#9A2A1E", m:"#2F6B5E", p:"#2E3E7A" };

function courbesForces(){
  const r = (E.releve||[]).filter(p=>p && isFinite(p.i));
  if(r.length < 2) return "";
  const L=760, H=210, mg=34, md=14, mh=14, mb=26;
  const xb = Math.max(...r.map(p=>p.t)) || 1;
  const px = t => mg + (L-mg-md) * (t/xb);
  const py = v => (H-mb) - (H-mh-mb) * (v/100);

  /* les repères : zéro, cinquante, cent */
  const grille = [0,25,50,75,100].map(v=>`
    <line x1="${mg}" y1="${py(v).toFixed(1)}" x2="${L-md}" y2="${py(v).toFixed(1)}"
          class="${v===0?"zero":"g"}"></line>
    <text x="${mg-6}" y="${(py(v)+4).toFixed(1)}" class="ax">${v}</text>`).join("");

  const lignes = CLES.map(k=>{
    const pts = r.map(p=>px(p.t).toFixed(1)+","+py(p[k]).toFixed(1)).join(" ");
    const d = r[r.length-1];
    return `<polyline points="${pts}" fill="none" stroke="${COUL_F[k]}"
              stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"
              vector-effect="non-scaling-stroke"></polyline>
            <circle cx="${px(d.t).toFixed(1)}" cy="${py(d[k]).toFixed(1)}" r="3.4"
              fill="${COUL_F[k]}" stroke="#FBF6E6" stroke-width="1.3"></circle>`;
  }).join("");

  /* Chaque décision porte son année, et un trait la descend jusqu'à
     l'axe : c'est ce qui permet de lire le carnet en regard de la
     courbe, puisqu'il donne la même année en face de chaque choix.
     Au-delà de douze points, une année sur deux, pour ne pas les
     empiler. */
  const saut = r.length > 12 ? 2 : 1;
  const an = r[0].an ? r.map((p,n)=>{
    const x = px(p.t).toFixed(1);
    const trait = `<line x1="${x}" y1="${py(100).toFixed(1)}" x2="${x}"
                     y2="${py(0).toFixed(1)}" class="jalon"></line>`;
    const txt = (n % saut === 0 || n === r.length-1)
      ? `<text x="${x}" y="${H-7}" class="ax an">${p.an}</text>` : "";
    return trait + txt;
  }).join("") : "";

  return `<svg class="cfo" viewBox="0 0 ${L} ${H}" role="img"
     aria-label="Évolution des quatre forces au fil de la partie">
    ${grille}${lignes}${an}</svg>`;
}

function legendeForces(){
  const r = E.releve||[], d = r[r.length-1] || {};
  return `<div class="cfo-leg">${CLES.map(k=>{
    const v = d[k]==null ? 60 : d[k], ecart = v - 60;
    return `<span class="cfo-l">
      <i style="background:${COUL_F[k]}"></i>
      <b>${esc(N.forces[k].nom)}</b>
      <em>${v}</em>
      <u class="${ecart>0?"up":ecart<0?"dn":""}">${ecart>0?"+":""}${ecart}</u>
    </span>`;
  }).join("")}</div>`;
}

/* Ce qu'une décision a fait aux quatre forces, en clair. */
function effetsLigne(e){
  if(!e) return "";
  const l = CLES.filter(k=>e[k]).map(k=>
    `<span class="ef ${e[k]>0?"up":"dn"}">${esc(N.forces[k].nom)}&nbsp;${e[k]>0?"+":""}${e[k]}</span>`);
  return l.length ? `<span class="efs">${l.join("")}</span>` : "";
}

/* Le même relevé en texte, pour la trace copiée. */
function releveTexte(){
  const r = E.releve||[];
  if(r.length < 2) return [];
  const L = ["", "L’ÉTAT DES QUATRE FORCES, DÉCISION APRÈS DÉCISION",
    "  année   " + CLES.map(k=>N.forces[k].nom.padEnd(14)).join("")];
  r.forEach(p=>{
    L.push("  " + String(p.an||p.t).padEnd(8)
      + CLES.map(k=>String(p[k]).padEnd(14)).join(""));
  });
  return L;
}

/* ==================================================================
   POURQUOI CET ACTEUR A BOUGÉ

   Le rapport de décision disait d'un bloc, et en général, ce qui venait
   d'arriver. Chaque acteur porte maintenant son propre chiffre et
   s'ouvre d'un clic sur sa raison. Tout vient de ce que la partie garde
   déjà : la dernière décision, ses effets, et ce que chaque force veut.
   ================================================================== */

/* Le dernier choix, s'il y en a un. */
function dernierChoix(){
  const c = E.carnet || [];
  return c.length ? c[c.length-1] : null;
}

/* Celui que la dernière décision a le plus remué : c'est dans sa bulle
   que va le récit de la conséquence, pour ne pas le répéter quatre fois. */
function plusRemue(){
  const d = dernierChoix();
  if(!d || !d.e) return null;
  let best=null, max=0;
  CLES.forEach(k=>{ const v=Math.abs(d.e[k]||0); if(v>max){ max=v; best=k; } });
  return best;
}

function bulleForce(k){
  const d = dernierChoix();
  const v = d && d.e ? (d.e[k]||0) : 0;
  if(!d) return "";
  const recit = (k === plusRemue() && E.consq) ? `<p class="bq">${esc(E.consq)}</p>` : "";
  const ent   = (k === "o" && E.entassement) ? `<p class="bent">${esc(E.entassement)}</p>` : "";
  if(!v && !recit && !ent) return "";
  const h = humeur(v);
  const logique = (N.forces[k].pourquoi || {})[v>0?"plus":"moins"] || "";
  return `<div class="pourquoi">
    <div class="bt"><b class="${h?h.sens:""}">${esc(N.forces[k].nom)}</b>${
      h?` — ${h.mot.toLowerCase()}`:""}</div>
    <p class="bd">${esc(d.q||"")}</p>
    ${logique?`<p class="bp">${esc(logique)}</p>`:""}
    <p class="bv">Ce qu’ils attendent de vous : ${esc(N.forces[k].veut)}.</p>
    ${recit}${ent}
  </div>`;
}

/* Un clic sur un acteur ouvre sa bulle et ferme les autres. On ne
   repeint rien : l'écran serait reconstruit et la bulle perdue. */
function bulle(el, k){
  if(!el) return;
  const etait = el.classList.contains("ouvert");
  document.querySelectorAll(".force.ouvert").forEach(x=>x.classList.remove("ouvert"));
  if(!etait){
    el.classList.add("ouvert");
    const d = dernierChoix();
    try{ SON.jeton(d && d.e ? (d.e[k]||0) : 0) }catch(e){}
  }
}

/* Une décision ne vaut pas « moins neuf » : elle contrarie, ou elle
   contente. Le chiffre reste dans la trace écrite, où il sert à
   corriger ; sur le bureau, il laisse place au mot. */
function humeur(v){
  if(!v) return null;
  const a = Math.abs(v);
  return {
    mot: v > 0 ? (a>=10 ? "Très satisfaits" : a>=5 ? "Satisfaits" : "Plutôt contents")
               : (a>=10 ? "Très mécontents" : a>=5 ? "Mécontents"  : "Contrariés"),
    sens: v > 0 ? "up" : "dn",
    fl: (v>0?"▲":"▼").repeat(a<=4 ? 1 : a<=9 ? 2 : 3)
  };
}

function VERDICT_I(f){
  const prod=(f.i+f.m)/2, humain=(f.o+f.p)/2;
  if(prod>=58&&humain>=52) return {t:"Une ville que l’on peut défendre",
    x:"Vous avez industrialisé sans briser ceux qui y travaillaient. C’est rare. Vos deux visiteurs n’ont pas vu la même ville, et ils ont tous les deux raison : <strong>c’est exactement cela, nuancer l’idée de progrès.</strong>",
    tem:[SCHOP,ENGELS]};
  if(prod>=55) return {t:"Une puissance bâtie sur des caves",
    x:"Vos filatures tournent, votre population a explosé, vos marchands se sont enrichis. Et voici ce qu’un visiteur allemand a vu de vos quartiers ouvriers. Le progrès technique a bien eu lieu — <strong>il n’a pas profité à tout le monde</strong>.",
    tem:[ENGELS]};
  if(prod<45) return {t:"La ville qui n’a pas basculé",
    x:"Les conditions ne se sont jamais toutes réunies. Sans énergie, sans capitaux, sans bras ni débouchés, les machines restent des curiosités. <strong>Une révolution industrielle n’est pas une invention : c’est un système.</strong>",
    tem:[]};
  return {t:"Un équilibre fragile",
    x:"Ni grande puissance, ni désastre. Vous avez gouverné prudemment — l’histoire de Manchester, elle, ne l’a pas été.",
    tem:[SCHOP]};
}

 b:{q:"« Faisons tourner les ouvriers de poste en poste. »", e:{o:11,p:5,i:-9,m:-3},
    c:"Chacun change de poste dans la semaine. Le rendement baisse ; les arrêts de travail aussi."},
 c:{q:"« Montrons-leur au moins la voiture finie. »", e:{o:3,p:1,i:-5},
    c:"On emmène les équipes voir sortir l’automobile qu’elles montent. C’est peu. Ce n’est pas rien."}},

{t:"General Motors change de modèle chaque année.", qui:"Elias Bright, qui vend nos voitures à Chicago", apres:1920,
 d:"« Chez eux, la voiture de l’an prochain ne ressemble pas à celle de cette année. Mes clients viennent regarder la nôtre, puis ils repartent. »",
 ex:"Notre concurrent a changé de méthode : au lieu de vendre une voiture unique le moins cher possible, il en propose toute une gamme et en renouvelle l’allure chaque année, pour que celle de l’an dernier paraisse démodée. Il la vend aussi à crédit. Nos ventes reculent pour le troisième trimestre de suite et les vendeurs ne savent plus quoi répondre aux clients.",
 f:"Alfred Sloan, à la tête de General Motors, oppose à la voiture unique de Ford une gamme complète et un modèle renouvelé chaque année, pour que l’ancien paraisse démodé. C’est l’invention de l’**obsolescence** commerciale, et le passage de la production de masse à la **consommation de masse** : il ne suffit plus de produire moins cher, il faut créer le désir d’acheter. Ford perdra sa première place en 1927 pour ne pas l’avoir vu.",
 a:{q:"« Changeons de modèle chaque année. »", e:{m:13,i:-10,o:-4}, g:["Marchés"],
    c:"Il faut refaire les outillages, réapprendre les gestes, tout recommencer. Le client, lui, revient."},
 b:{q:"« Gardons le même modèle. »", e:{i:7,m:-14,o:3}, suite:{dans:4, t:"Les entrepôts sont pleins", x:"Onze mille voitures invendues. Les concessionnaires refusent les livraisons et certains ont pris la représentation d’une autre marque. Le stock coûte plus cher chaque mois qu’il dort.", e:{m:-9,i:-6}, q:{texte:"Onze mille voitures invendues. On peut les brader à moitié prix pour libérer la trésorerie, ou tenir en espérant que le marché reparte.",
     choix:[
      {q:"« Bradons le stock, il faut de l’argent. »", e:{m:8,i:-10,o:3},
       c:"Les entrepôts se vident en six semaines. Ceux qui avaient payé le prix fort l’an dernier ne l’oublieront pas."},
      {q:"« Tenons : le marché finira par repartir. »", e:{i:5,m:-9,o:-4},
       c:"On attend. Le stock dort, la trésorerie fond, et le marché ne repart pas cette année-là."}]}},
    c:"On produit toujours la même, de mieux en mieux, de moins en moins cher. Et de moins en moins souvent achetée."},
 c:{q:"« Gardons le châssis, changeons la carrosserie. »", e:{m:4,i:-8,o:-3}, g:["Marchés"],
    c:"On habille l’ancienne en neuve. Les concessionnaires respirent ; les ingénieurs de la concurrence sourient."}},

{t:"Faut-il vendre à crédit ?", qui:"Frank Doyle, actionnaire", apres:1920,
 d:"« L’ouvrier gagne cinq dollars par jour et la voiture en coûte quatre cents. À crédit, il l’achète demain au lieu d’économiser trois ans. »",
 ex:"Jusqu’ici, on achète une automobile quand on a l’argent — soit après plusieurs années d’économies. Le crédit consiste à la livrer tout de suite contre douze versements mensuels : l’acheteur roule avec un revenu qu’il n’a pas encore gagné. Notre concurrent a monté sa propre banque pour cela. Les chiffres montrent qu’une voiture vendue à crédit se vend deux ans plus tôt.",
 f:"Le crédit à la consommation se répand par l’automobile dans les années 1920 : General Motors crée sa propre société de financement dès 1919. Il permet d’acheter avec un revenu qu’on n’a pas encore gagné, et c’est lui qui soutient la **consommation de masse**. Il fait aussi entrer durablement les ménages dans l’endettement — l’une des fragilités qui aggraveront la crise de 1929.",
 a:{q:"« Vendons à crédit, en douze versements. »", e:{m:14,i:6,p:-8,o:2}, g:["Capitaux","Marchés"],
    c:"On vend d’un coup à des gens qui n’avaient pas l’argent. On leur vend aussi des années de dettes."},
 b:{q:"« Refusons le crédit. »", e:{p:7,i:-5,m:-11},
    c:"Le principe est sauf. Le marché, lui, passe chez le voisin qui n’en a pas."},
 c:{q:"« Un crédit court, réservé à nos ouvriers. »", e:{m:4,o:2,i:-2,p:-7}, g:["Marchés"],
    c:"Les ouvriers de la maison achètent la voiture qu’ils montent. On a inventé le client captif."}},

{t:"Cinq jours de travail au lieu de six.", qui:"Harriet Vance, journaliste à Detroit", apres:1922,
 d:"« Vous dites partout qu’un ouvrier bien payé achète des automobiles. Osez aller au bout : donnez-lui aussi le temps de s’en servir. »",
 ex:"On travaille six jours par semaine dans toute l’industrie américaine, et aucune loi n’oblige à faire autrement. La direction répète pourtant qu’un ouvrier bien payé devient le client de ce qu’il fabrique. La journaliste pousse le raisonnement : un ouvrier qui a son samedi a le temps de se servir de sa voiture. Les contremaîtres prédisent l’effondrement de la production.",
 f:"Ford instaure la semaine de cinq jours en 1926, sans y être contraint par aucune loi. Son argument est resté célèbre : un ouvrier bien payé et disponible devient le client de ce qu’il fabrique. C’est le cœur du **fordisme** — produire en masse suppose de consommer en masse, donc de partager une part des gains de **productivité** avec les salariés. Les autres industriels de Detroit y verront une trahison.",
 a:{q:"« Passons à cinq jours de travail. »", e:{o:14,p:11,m:5,i:-13},
    c:"Le monde entier en parle. Les autres patrons de Detroit vous détestent pour longtemps."},
 b:{q:"« Gardons la semaine de six jours. »", e:{i:6,o:-9,p:-7},
    c:"On travaille le samedi. La presse rappelle vos propres discours sur le pouvoir d’achat."},
 c:{q:"« Cinq jours, mais l’été seulement. »", e:{o:3,p:1,i:-7},
    c:"La mesure s’arrête en septembre. Personne ne sait si c’est un droit ou une faveur."}},

{t:"Un organisateur distribue des tracts à la grille.", qui:"Sam Rusin, qui cherche à créer un syndicat",
 d:"« Nous ne demandons pas votre usine. Nous demandons de discuter de la cadence avec quelqu’un qui ait le droit de dire non. Aujourd’hui, ou dans dix ans dehors. »",
 ex:"Dans l’automobile américaine, les syndicats ne sont pas reconnus : la direction refuse de discuter avec eux et emploie un service de sécurité privé pour surveiller les ateliers. Un homme distribue chaque matin des tracts sur le trottoir d’en face, hors du terrain de l’usine. Les ouvriers les prennent et les lisent. Le service de sécurité propose d’intervenir ; les juristes rappellent que la rue ne nous appartient pas.",
 f:"Les syndicats ne sont pas reconnus dans l’automobile américaine avant la fin des années 1930 : les grandes firmes entretiennent des services de sécurité privés qui surveillent les ateliers et écartent les meneurs. Le syndicat automobile UAW ne sera reconnu chez Ford qu’en 1941, après des années d’affrontements. Le **rapport de force social** met une génération à rattraper la transformation technique.",
 a:{q:"« Recevons les syndicalistes. »", e:{o:13,p:9,i:-12,m:-3},
    c:"On s’assoit à la même table. Les actionnaires parlent d’abdication ; les usines voisines, de contagion."},
 b:{q:"« Chassons-les par le service d’ordre. »", e:{i:8,o:-14,p:-11}, suite:{dans:4, t:"Les journaux ont eu les photographies", x:"Un reporter suivait le groupe. Les clichés des hommes de la sécurité sont en première page de deux quotidiens, et un élu du Michigan demande une enquête sur les méthodes de la maison.", e:{p:-10,o:-5,m:-3}, q:{texte:"Un élu du Michigan demande une enquête. Le service juridique propose un démenti public ; le service du personnel propose de recevoir les syndicalistes.",
     choix:[
      {q:"« Publions un démenti. »", e:{i:5,p:-11,o:-7},
       c:"Le démenti paraît en page six. Les photographies, elles, étaient en première page."},
      {q:"« Recevons-les, et que cela se sache. »", e:{o:10,p:12,i:-10,m:-3},
       c:"La rencontre a lieu devant les journalistes. Les actionnaires parlent de reddition ; l’enquête est abandonnée."}]}},
    c:"On disperse, on fiche, on licencie les meneurs. L’atelier se tait — et n’oublie pas."}},

{t:"Le chronomètre descend à l’atelier.", qui:"Walter Kessler, ingénieur chargé d’organiser la production", req:["Organisation"],
 d:"« Onze secondes par voiture, multipliées par la production de l’année. Il suffit d’appliquer les temps que nous avons établis. »",
 ex:"Un ingénieur américain, Frederick Taylor, a proposé d’étudier le travail comme une science : décomposer chaque tâche, chronométrer chaque geste, supprimer les mouvements inutiles, et confier à un bureau le soin de dire comment travailler. Nos ingénieurs viennent d’achever ces mesures sur deux lignes et gagnent onze secondes par voiture. Les ouvriers les ont vus faire, montre en main, et savent ce qui se prépare.",
 f:"Frederick Taylor a théorisé l’**organisation scientifique du travail** : décomposer chaque tâche, chronométrer chaque geste, supprimer les mouvements inutiles. Le savoir passe de l’ouvrier au bureau des méthodes — celui qui exécute ne décide plus de la manière. Le taylorisme précède le fordisme et le rend possible : sans temps mesurés, une chaîne ne peut pas être réglée. Ensemble, ils font exploser la **productivité** et transforment le métier en exécution.",
 a:{q:"« Appliquons les temps chronométrés. »", e:{i:12,m:5,o:-13},
    c:"Onze secondes gagnées mille fois par jour. C’est l’ouvrier qui les paie, une par une."},
 b:{q:"« Renonçons au chronométrage. »", e:{o:9,p:4,i:-9,m:-3},
    c:"On garde les temps anciens. Le prix de revient ne baisse plus."},
 c:{q:"« Chronométrons, et partageons le gain. »", e:{i:3,o:-1,m:1,p:1},
    c:"Une part du temps gagné revient en salaire. Les comptables surveillent la part de très près."}},

{t:"Un homme se présente avec une jambe en moins.", qui:"Le docteur Emmett Crowe, chargé d’enquêter sur les ouvriers",
 d:"« Le geste est devenu si simple qu’il n’exige presque plus de corps. La question n’est plus de savoir si c’est possible : c’est de savoir si nous le faisons. »",
 ex:"Puisque le travail est découpé en gestes très simples, le service des méthodes a classé tous les postes selon ce qu’ils exigent réellement du corps : sept mille peuvent être tenus assis, cent soixante-dix par un homme sans jambes, une dizaine par un aveugle. Aucune autre usine de la ville n’embauche ces hommes. Le bureau d’embauche renvoie la décision à la direction, faute de règle.",
 f:"Parce que les postes sont décomposés en gestes simples, Ford recense ceux qui peuvent être tenus assis, par un homme amputé ou par un aveugle, et en emploie plusieurs milliers. C’est la face inattendue de la **division du travail** : ce qui dépossède l’ouvrier de son métier ouvre l’usine à des hommes que personne n’embauchait. Le progrès technique n’a pas un seul effet social, et c’est ce qui rend son jugement difficile.",
 a:{q:"« Embauchons les ouvriers handicapés. »", e:{o:8,p:12,m:4,i:-5},
    c:"Des centaines d’hommes que personne ne voulait entrent à l’usine. Le travail décomposé aura eu cela pour lui."},
 b:{q:"« Refusons de les embaucher. »", e:{i:5,o:-7,p:-12}, suite:{dans:3, t:"Vos propres chiffres vous reviennent", x:"Un journal a publié l’étude de vos ingénieurs — celle qui recensait les milliers de postes tenables par un homme amputé. En face, votre refus d’embaucher. La comparaison se fait toute seule.", e:{p:-8,o:-4}},
    c:"On les renvoie à la grille. La presse a les chiffres de vos propres ingénieurs."},
 c:{q:"« Embauchons-en quelques-uns, pour l’image. »", e:{p:1,i:-3,o:-1},
    c:"On en embauche vingt et l’on photographie chacun d’eux. Le reste attend toujours."}},

{t:"Les machines réclament du courant.", qui:"Walter Kessler, ingénieur chargé d’organiser la production",
 d:"« Une courroie casse et l’usine entière s’arrête. Avec l’électricité, chaque poste vit sa vie et nous rangeons les machines comme nous voulons. »",
 ex:"Dans l’atelier, une seule grosse machine à vapeur entraîne toutes les autres par des courroies tendues au plafond : quand l’une casse, tout s’arrête. Mardi, deux mille hommes sont restés quatre heures sans rien faire. Donner à chaque machine son propre moteur électrique les rendrait indépendantes — et permettrait surtout de les disposer dans l’ordre du travail au lieu de les aligner sous les courroies.",
 f:"Dans une usine à vapeur, une seule machine entraîne tout l’atelier par des courroies au plafond : la disposition des machines est imposée par la mécanique, et une panne arrête tout. Le moteur électrique individuel, qui se généralise vers 1900, libère chaque poste et permet de ranger les machines dans l’ordre du travail. L’électricité est l’une des **énergies nouvelles** qui définissent la deuxième révolution industrielle, avec le pétrole.",
 a:{q:"« Électrifions toute l’usine. »", e:{i:11,m:4,o:3,p:2}, g:["Ressources","Savoirs techniques"],
    c:"Chaque machine tourne pour elle-même. On peut enfin disposer les postes dans l’ordre du travail, et non sous les courroies."},
 b:{q:"« Gardons la machine à vapeur. »", e:{i:-9,o:-3,m:-4},
    c:"Les courroies continuent de claquer au plafond. Une rupture, et deux mille hommes attendent."},
 c:{q:"« N’électrifions que les ateliers neufs. »", e:{i:2,m:-1,o:-2}, g:["Savoirs techniques"],
    c:"L’usine vit à deux époques à la fois, et les contremaîtres passent leur journée entre les deux."}},

{t:"Les pièces ne s’emboîtent pas.", qui:"Walter Kessler, ingénieur chargé d’organiser la production",
 d:"« Le contrôle a refusé un lot entier hier. Imposons la même mesure à tous les fournisseurs, au centième près, et le problème disparaît. »",
 ex:"Nos trois fournisseurs livrent des pièces qui ne font pas exactement la même taille. Des ouvriers qualifiés passent donc leurs journées à les limer une à une pour qu’elles entrent — c’est ce qui coûte le plus cher dans une voiture. Si toutes les copies d’une pièce étaient identiques au centième de millimètre, n’importe laquelle entrerait dans n’importe quelle voiture, sans retouche et sans ouvrier qualifié.",
 f:"L’**interchangeabilité** suppose que toutes les copies d’une pièce soient identiques au centième près : n’importe laquelle entre alors dans n’importe quelle voiture, sans retouche. Elle permet le montage à la chaîne, la réparation sans atelier, et la production en très grande série. Elle supprime en revanche le métier d’ajusteur, l’ouvrier qualifié qui limait les pièces une à une. C’est un déplacement typique : la qualification passe de l’atelier au bureau d’études.",
 a:{q:"« Imposons une cote unique à tous. »", e:{i:12,m:6,o:-4}, g:["Savoirs techniques","Organisation"],
    c:"Toute pièce entre dans toute voiture. L’ajusteur qualifié devient un homme qui pose."},
 b:{q:"« Gardons nos ajusteurs et leurs limes. »", e:{o:7,i:-11,m:-6},
    c:"On lime, on ajuste, on rattrape. Chaque voiture est un peu différente, et coûte un peu plus."},
 c:{q:"« Une cote unique sur le moteur seulement. »", e:{i:3,m:1,o:-4}, g:["Savoirs techniques"],
    c:"Le moteur est interchangeable, la carrosserie non. On a réglé la moitié du problème."}},

{t:"Le marché s’est arrêté d’un coup.", qui:"Frank Doyle, actionnaire", apres:1928,
 d:"« Les annulations arrivent plus vite qu’on ne les enregistre. Il faut trancher maintenant, et ce sera brutal dans tous les cas. »",
 ex:"La Bourse de New York s’est effondrée en octobre et l’épargne de millions de clients a disparu avec elle. L’automobile est le premier achat qu’on repousse : les commandes ne se contentent pas de cesser, elles s’annulent. Les entrepôts sont pleins et la trésorerie tiendra deux mois. Ce qui se décide cette semaine décidera de la vie de milliers de familles, dans une ville qui ne vit que de l’usine.",
 f:"Le krach d’octobre 1929 frappe l’automobile plus que tout autre secteur : on repousse l’achat d’une voiture bien avant celui du pain. La production américaine chute des trois quarts en quatre ans. La **production de masse** révèle alors sa fragilité : des usines immenses, conçues pour tourner à plein, deviennent ruineuses dès que la demande faiblit. Ce que l’on croyait un progrès sans fin s’arrête en quelques semaines.",
 a:{q:"« Fermons les lignes et licencions. »", e:{i:9,o:-16,p:-12,m:-5},
    c:"Des milliers d’hommes dehors en une semaine, dans une ville qui n’existe que par vous."},
 b:{q:"« Gardons tout le monde, au ralenti. »", e:{o:14,p:10,i:-15,m:-4},
    c:"On paie des ouvriers à produire des voitures que personne n’achète. Les réserves fondent à vue d’œil."}},

{t:"Ils marchent vers l’usine.", qui:"Harriet Vance, journaliste à Detroit", apres:1930,
 d:"« La tête du cortège sera là dans une heure. Vos gardes sont armés. Que doivent-ils faire ? »",
 ex:"La crise a jeté dehors près d’un ouvrier sur trois à Detroit, et des marches de chômeurs s’organisent dans tout le pays pour réclamer du travail et des secours. Celle-ci est partie du centre-ville en fin de matinée et grossit à chaque carrefour : plusieurs milliers d’hommes, sans armes et sans mot d’ordre de violence. Les gardes sont postés à la grille et attendent des instructions.",
 f:"Au creux de la Dépression, Detroit compte près d’un chômeur sur trois : la ville qui produisait les automobiles du monde entier vit du chômage qu’elle a créé. La marche de la faim de Dearborn, le 7 mars 1932, se termine par des tirs de la police et du service de sécurité — quatre morts sur le coup, un cinquième ensuite. La **crise** achève de montrer que la prospérité industrielle n’est ni acquise ni partagée.",
 a:{q:"« Bloquons la grille par la force. »", e:{i:4,o:-17,p:-16},
    c:"On tire. Quatre morts sur la route, et des photographies qui feront le tour du pays pour un siècle."},
 b:{q:"« Ouvrons et recevons une délégation. »", e:{o:13,p:14,i:-12,m:-3},
    c:"Six hommes entrent, parlent une heure, repartent avec peu. Mais personne n’est mort ce jour-là."}},

{t:"La publicité coûte un million.", qui:"Elias Bright, qui vend nos voitures à Chicago",
 d:"« Nous publions des chiffres, ils font rêver. La voiture la moins chère du monde ne se vend pas toute seule quand le voisin en propose une plus belle au même prix. »",
 ex:"La maison n’a jamais fait de réclame autrement qu’en publiant ses tarifs. Nos concurrents, eux, achètent des pages entières dans les magazines illustrés et n’y vendent pas une voiture mais une image de soi : la réussite, la liberté, le voyage. Les agences nous proposent la même chose pour une somme qui dépasse le budget d’un atelier entier.",
 f:"La publicité de masse se développe avec la presse illustrée dans les années 1920. Elle ne vend plus un produit mais une image de soi, et l’automobile en devient le terrain privilégié. Elle est l’instrument de la **consommation de masse** : produire beaucoup ne suffit pas, il faut créer le désir d’acheter, et le renouveler. Ford, qui n’avait jamais eu besoin de convaincre, découvre qu’un prix bas ne suffit plus.",
 a:{q:"« Achetons des pages de publicité. »", e:{m:11,i:-7,p:-3}, g:["Marchés"],
    c:"On vend désormais une idée avec la voiture. Elle coûte plus cher que la tôle."},
 b:{q:"« Ne publions que nos tarifs. »", e:{i:6,m:-9},
    c:"On continue d’imprimer des chiffres. Les chiffres n’ont jamais fait envie à personne."},
 c:{q:"« De la publicité, mais sur la fiabilité. »", e:{m:3,i:-5,p:1}, g:["Marchés"],
    c:"On vante ce que la voiture est vraiment. C’est honnête, et un peu terne."}},

{t:"Deux hommes attendent à l’embauche.", qui:"Sam Rusin, qui cherche à créer un syndicat",
 d:"« Celui-ci vient de Géorgie et aucune usine de cette ville ne le mettra ailleurs qu’à la fonderie. Je veux savoir ce que vous, vous en faites. »",
 ex:"Des centaines de milliers d’Afro-Américains quittent alors le sud des États-Unis, où la loi les sépare des Blancs et leur refuse presque tout emploi, pour les usines du Nord. Dans la plupart des firmes de Detroit, on les cantonne à la fonderie — les postes les plus chauds et les plus durs. Deux hommes ont les mêmes états de service et postulent au même poste. Aucune règle écrite ne dit quoi faire.",
 f:"Des centaines de milliers d’Afro-Américains quittent alors le Sud ségrégué pour les usines du Nord : c’est la Grande Migration. Dans la plupart des firmes, on les cantonne à la fonderie, aux postes les plus pénibles. Ford fait exception en les embauchant sur les lignes de montage, ce qui attire à Detroit une importante communauté noire. L’usine est aussi un lieu où se jouent les **hiérarchies sociales** d’un pays, pas seulement une organisation technique.",
 a:{q:"« Embauchons-le sur la ligne, comme les autres. »", e:{o:9,p:13,i:-6,m:-2},
    c:"Detroit compte peu d’usines qui le font. On vient de loin pour y travailler — et l’atelier gronde quelques semaines."},
 b:{q:"« Envoyons-le à la fonderie, comme d’usage. »", e:{i:4,o:-6,p:-11}, suite:{dans:4, t:"La fonderie s’est vidée", x:"Deux cents hommes sont partis chez un concurrent qui ouvre ses lignes à tout le monde. Ce sont les postes les plus durs qu’on ne parvient plus à pourvoir, et ce sont eux qui tiennent l’usine.", e:{o:-6,i:-6,p:-4}},
    c:"Les postes les plus durs et les plus chauds, toujours les mêmes hommes. L’usage n’est pas une raison."}},

{t:"Faut-il arrêter la voiture qui vous a faits ?", qui:"Frank Doyle, actionnaire", apres:1924, req:["Marchés"],
 d:"« C’est la voiture la plus vendue de l’histoire, et elle est invendable. Arrêter les chaînes, c’est soixante mille hommes sans salaire pendant six mois. »",
 ex:"Notre modèle unique s’est vendu à plus de quinze millions d’exemplaires en vingt ans, et son prix est tombé de huit cent cinquante à moins de trois cents dollars. Mais il ne se vend plus : les stocks s’accumulent et les vendeurs cessent de commander. Le remplacer suppose d’arrêter les chaînes plusieurs mois et de refaire chaque outil de la maison. Personne dans l’industrie n’a jamais tenté un arrêt de cette ampleur.",
 f:"La Ford T fut produite à plus de quinze millions d’exemplaires entre 1908 et 1927, et son prix tomba de 850 à moins de 300 dollars grâce à la seule **production de masse**. Son arrêt en mai 1927 immobilise les usines six mois et prive soixante mille ouvriers de salaire. La **standardisation** qui avait fait la fortune de l’entreprise devient son piège : plus une production est spécialisée, plus il coûte cher d’en changer.",
 a:{q:"« Arrêtons tout et changeons de modèle. »", e:{m:13,i:-12,o:-9,p:2}, g:["Marchés"],
    c:"Six mois d’usine muette, soixante mille hommes sans salaire — puis une file d’attente devant les concessions."},
 b:{q:"« Produisons la même jusqu’au bout. »", e:{i:8,m:-13,o:4},
    c:"On la produit encore deux ans, de moins en moins. Le stock dort dans les entrepôts."},
 c:{q:"« Préparons la suivante sans rien arrêter. »", e:{m:4,i:-9,o:-5}, g:["Marchés"],
    c:"Deux usines, deux modèles, deux fois les frais. Mais pas un jour de chaîne arrêtée."}},

{t:"Un contremaître interdit de parler.", qui:"Anna Kowalczyk, ouvrière à la chaîne",
 d:"« On nous surveille jusque dans la façon de tenir la tête. Vous appelez cela de la discipline. Nous avons un autre mot. »",
 ex:"Un règlement affiché la semaine dernière interdit de s’asseoir, de siffler et de parler à son voisin pendant le travail. Deux ouvriers ont déjà été sanctionnés pour s’être adressé la parole à leur poste. Les ouvriers ont mis au point une façon de se parler sans remuer les lèvres. L’ouvrière qui vient vous voir parle au nom de toute sa ligne.",

function VERDICT_II(f){
  const prod=(f.i+f.m)/2, humain=(f.o+f.p)/2;
  if(prod>=62&&humain>=58) return {t:"Une usine que l’on peut défendre",
    x:"Vous avez produit en masse sans broyer ceux qui produisaient. C’est rare, et ce n’est pas ce qu’a fait l’histoire. Vos deux témoins ne décrivent pas la même usine, et ils ont tous les deux raison : <strong>c’est exactement cela, nuancer l’idée de progrès.</strong>",
    tem:[FORD,GRAMSCI]};
  if(prod>=55) return {t:"Quinze millions de voitures, et des hommes usés",
    x:"Les chiffres sont écrasants : jamais on n’avait produit autant, ni si bon marché. Reste ce qu’un observateur en a écrit depuis sa cellule. <strong>Le gain de productivité est réel — la question est de savoir qui l’a payé.</strong>",
    tem:[GRAMSCI]};
  if(prod<45) return {t:"L’atelier qui n’est pas devenu une usine",
    x:"Sans organisation nouvelle, sans capitaux, sans marché de masse, la voiture reste ce qu’elle était en 1900 : un objet de luxe monté à la main. <strong>La deuxième révolution industrielle n’est pas une invention, c’est une méthode.</strong>",
    tem:[]};
  return {t:"Une maison qui a hésité",
    x:"Ni Highland Park, ni la faillite. Vous avez avancé prudemment, alors que l’époque, elle, ne l’a pas fait — et que vos concurrents non plus.",
    tem:[FORD]};
}

/* On ne tire que des questions portant sur ce qu'il a réellement vu. */
function questionsDeLaPartie(){
  const vues = new Set(E.carnet.map(d=>d.t));
  const evs  = new Set(E.evVus);
  let lot = N.quiz.filter(q => (q.c && vues.has(q.c)) || (q.ev && evs.has(q.ev)));
  /* s'il en manque, on complète avec le reste du niveau */
  if(lot.length < 8){
    const reste = N.quiz.filter(q => !lot.includes(q));
    melanger(reste);
    lot = lot.concat(reste.slice(0, 8-lot.length));
  }
  melanger(lot);

  /* LES REPONSES ELLES-MEMES. Les questions ont ete ecrites avec la
     bonne reponse en premier — b:0 partout. Sans ce melange, un eleve
     qui l'a remarque repond juste huit fois sur huit sans rien savoir.
     On rend une COPIE de chaque question : « N.quiz » est partage entre
     les parties, et melanger l'original le melangerait a nouveau a la
     partie suivante, jusqu'a ce que « b » ne designe plus rien. */
  return lot.slice(0, 8).map(q => {
    const juste = q.r[q.b];
    const r = q.r.slice();
    melanger(r);
    return Object.assign({}, q, { r, b: r.indexOf(juste) });
  });
}

function melanger(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
}

    L.push("  "+String(i+1).padStart(2)+". "+(d.an?"["+d.an+"] ":"")+d.t);
    L.push("      → "+(d.q||""));
  });
  L.push("");
  L.push("CE QUE J’AI RETENU  —  "+(E.corrige ? pct+" % ("+note+"/"+E.quiz.length+")" : "questionnaire non corrigé"));
  if(E.corrige) E.quiz.forEach((q,i)=>{
    const j=E.rep[i];
    L.push("  "+(j===q.b?"[juste]":"[faux] ")+" "+q.q);
    L.push("      ma réponse : "+(j==null?"—":q.r[j]));
    if(j!==q.b) L.push("      réponse attendue : "+q.r[q.b]);
  });
  L.push("");

  return L.join("\n");
}

function copierTrace(){
  const t = texteTrace(), m = document.getElementById("msgcopie");
  const dire = ok => { if(m) m.textContent = ok
    ? "Copié. Vous pouvez le coller dans un document ou dans Teams."
    : "La copie a échoué — utilisez « Télécharger »."; };
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(()=>{E.traceEnregistree=true;dire(true);rafraichirValidation()}).catch(()=>dire(false));
  else dire(false);
}

      <p class="mention">Unité 1 — Quand l’innovation change la société · Grade 10</p>
      <p class="paraphe">Conçu et écrit par <b>Jeremy Esposito</b></p>
    </div>
  </div>`;
}

function demarrer(){
  document.body.classList.remove("surtitre");
  try{ SON.reveiller(); SON.relancer(); }catch(e){}
  accueil();
}

/* ---------- la validation de la trace ------------------------------ */
function etatValidation(){
  const nom = ((E.t_rnom||"").trim().length >= 3);
  const cor = !!E.corrige;
  const enr = !!E.traceEnregistree;
  const env = !!(document.getElementById("jenvoi")||{}).checked;
  return {nom, cor, enr, env, tout: nom && cor && enr && env};
}

function rafraichirValidation(){
  const v = etatValidation();
  const mk = (id, ok) => { const e=document.getElementById(id); if(e) e.className = ok?"fait":""; };
  mk("j1", v.nom); mk("j2", v.cor); mk("j3", v.enr);
  const b = document.getElementById("btvalid");
  if(b){
    b.disabled = !v.tout;
    b.textContent = v.tout ? "Valider et terminer"
      : !v.nom ? "Écrivez d’abord votre nom"
      : !v.cor ? "Corrigez d’abord le questionnaire"
      : !v.enr ? "Enregistrez d’abord votre trace"
      : "Cochez la case ci-dessus";
  }
}

function validerTrace(){
  if(!etatValidation().tout) return;
  E.traceValidee = true;
  rendreFin();
}

/* Le navigateur avertit si l'on ferme l'onglet avec une trace non rendue. */
window.addEventListener("beforeunload", ev=>{
  if(typeof E!=="undefined" && E && E.fini && !E.traceValidee){
    ev.preventDefault(); ev.returnValue = "";
  }
});

/* ---------- accueil ---------- */
function accueil(){
  remonter(true);
  document.body.dataset.niveau="I"; N=NIVEAUX.I; peindreVille(); chercherVue("menu"); try{ SON.ambiance("menu") }catch(e){}
  const carte=(id,dispo)=>{
    const n = NIVEAUX[id];
    if(!dispo){
      /* La troisième époque n'existe pas encore comme niveau : elle est
         décrite à la main. Les autres se décrivent toutes seules. */
      const o = n ? n.ord  : "3e révolution industrielle";
      const l = n ? n.lieu : "La révolution numérique";
      const p = n ? n.sous.replace(n.lieu+", ","") : "1970 — aujourd’hui";
      return `<button class="niv" disabled>
        <span class="ord">${o}</span>
        <span class="lieu">${l}</span>
        <span class="per">${p}</span>
        <span class="rec">En préparation.</span></button>`;
    }
    let r=0; try{ r=+(localStorage.getItem("pdp_pop_"+id)||0) }catch(e){}
    return `<button class="niv" onclick="menuNiveau('${id}')">
      <span class="ord">${n.ord}</span>
      <span class="lieu">${n.lieu}</span>
      <span class="per">${n.sous.replace(n.lieu+", ","")}</span>
      <span class="rec">${r?`Record : ${fmt(r)} ${n.unite2}`:"Jamais joué"}</span></button>`; };
  document.body.classList.add("surmenu");
  app.innerHTML=`
  <div class="menu-ecran">
    <div class="dedans-menu">

      <div class="entete">
        <div class="surtitre-txt">Avant de commencer</div>
        <h1>Comment on joue</h1>
      </div>

      <p class="but-jeu">Quatre groupes vous jugent. <strong>Gardez-les tous les quatre jusqu’à la fin.</strong></p>

      <div class="etapes">
        <div class="etape sans-titre">
          <span class="num">1</span>
          <div>
            <p>Un problème arrive sur votre bureau. Quelqu’un vient vous demander quelque chose. Vous avez <strong>trois réponses</strong>.</p>
          </div>
        </div>
        <div class="etape sans-titre">
          <span class="num">2</span>
          <div>
            <div class="mini-forces">${ROLES.map(r=>`<span>
              ${icone(r.k)}<i>${esc(r.t)}</i></span>`).join("")}</div>
            <p>Vous choisissez. Chaque réponse <strong>fait un content et un mécontent</strong>. Aucune ne plaît aux quatre.</p>
          </div>
        </div>
        <div class="etape sans-titre">
          <span class="num">3</span>
          <div>
            <p>Si un groupe vous abandonne, <strong>la partie s’arrête</strong>. Sinon vous allez au bout, et vous voyez la ville que vous avez faite.</p>
          </div>
        </div>
      </div>

      <div class="separation"><span>Choisissez votre époque</span></div>
      <div class="niveaux">${carte("I",1)}${carte("II",1)}${carte("III",0)}</div>

      <p class="note-menu">Les personnages qui vous parlent sont des figures composites.
      Les événements datés, eux, sont authentiques — le jeu cite ses sources.</p>
    </div>
  </div>`;
}

/* Une fiche d'acteur, ouverte : le portrait entier, le nom, ce qu'il
   veut, et son rôle. C'est le seul endroit du jeu où on les présente
   au calme — autant qu'ils soient lus. */
function fichActeur(k){
  return `<div class="fich r-${k}">
    <figure><img src="img/acteurs/${N.id}-${k}-portrait.jpg" alt="" loading="lazy"
      onerror="this.closest('figure').remove()"></figure>
    <div class="fi-t">${esc(N.forces[k].nom)}</div>
    <div class="fi-v">${esc(N.forces[k].veut)}</div>
    <p class="fi-r">${gras(esc(N.forces[k].role))}</p>
  </div>`;
}

function menuNiveau(id){
  remonter(true);
  stopperMenu();
  document.body.classList.remove("surmenu");
  N=NIVEAUX[id]; document.body.dataset.niveau=id; peindreVille(); chercherVue(); try{ SON.ambiance("menu") }catch(e){}
  const rec=record();
  app.innerHTML=`
  <div class="entete-niveau">
    <h1>${N.lieu}</h1>
    <p class="sous">${N.sous}</p>
  </div>
  <div class="mission">
    <figure class="mission-illu mi-g">
      <img src="img/niveau/${N.id}-gauche.jpg" alt="${esc(N.vues.g)}" loading="lazy"
           onerror="this.closest('figure').remove()">
    </figure>
  <div class="role">
    <div class="r">${N.role}</div>
    <p class="r-qui">${N.qui}</p>
    <p class="r-but">${N.but}</p>
    <p class="note-role">${N.note}</p>
    <p class="note-source">Les personnages sont inventés ; ce qu’ils disent, non. Les deux seuls témoignages authentiques vous attendent à la fin de la partie.</p>
  </div>
    <figure class="mission-illu mi-d">
      <img src="img/niveau/${N.id}-droite.jpg" alt="${esc(N.vues.d)}" loading="lazy"
           onerror="this.closest('figure').remove()">
    </figure>
  </div>
  <p class="mission-note">Ces deux vues sont des <strong>illustrations</strong>, pas des documents
  d’époque : elles montrent le contraste, elles ne le prouvent pas.</p>
  <div class="ronde">
    ${["i","m"].map(fichActeur).join("")}
    <div class="ronde-c">
      <p class="rc-t">Les quatre groupes qui vous jugent</p>
      <p class="rc-x">Chaque décision en contente un et en fâche un autre.
      Si l’un d’eux vous abandonne tout à fait, la partie s’arrête.</p>
    </div>
    ${["o","p"].map(fichActeur).join("")}
  </div>
  <p class="centre" style="margin:24px 0 8px">
    <button class="plein" onclick="nouvellePartie('campagne',N.id)">Campagne · ${N.tours} décisions jusqu’en ${N.a1}</button>
    <button onclick="nouvellePartie('infini',N.id)">Survie${rec?` · record ${fmt(rec)} ${N.unite2}`:""}</button>
    <button onclick="accueil()">Changer de niveau</button>
  </p>
  <div class="bilan"><h2 style="margin-top:0">Une chose à savoir avant de commencer</h2>
    <p style="margin:.3em 0">${N.avant} C’est ce qui rendra la fin de partie difficile.</p></div>`;
  ecrireMission();
}
titre();
</script>
</body>
</html>
