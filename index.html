  color:#7A5A22; font-weight:bold; margin-bottom:5px;
}
.courrier-prof .cp-notion p{margin:0; font-size:15.5px; line-height:1.5; color:var(--enc)}

.courrier-prof .cp-q{
  margin:0 0 16px; font-family:var(--serif); font-size:17.5px; line-height:1.45;
  color:var(--enc);
}
/* la reference au cours : elle reste, mais elle n'est plus la premiere
   chose qu'on lit — c'est ce qui la faisait passer pour une consigne */
.courrier-prof .cp-ref{
  margin:0 0 18px; padding-top:10px; border-top:1px solid var(--fil);
  font-size:12px; line-height:1.5; color:var(--enc2); letter-spacing:.01em;
}
.courrier-prof button{display:block; margin:0 auto}

/* l'en-tete d'une vraie lettre : d'ou elle vient, et de quand */
.lettre-prof .lt-entete{
  display:flex; align-items:baseline; justify-content:space-between;
  gap:12px; flex-wrap:wrap; margin-bottom:16px; padding-bottom:9px;
  border-bottom:1px solid var(--fil);
}
.lettre-prof .lt-ecole{
  font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--rge); font-weight:bold;
}
.lettre-prof .lt-date{
  font-family:var(--serif); font-size:17px; color:var(--enc2);
}
.lettre-prof .lt-intro{font-family:var(--serif); font-size:18px; margin-bottom:.5em}
.lettre-prof .lt-filet{
  height:1px; margin:15px 0; background:linear-gradient(90deg,
    transparent, rgba(107,87,65,.45) 15%, rgba(107,87,65,.45) 85%, transparent);
}
.lettre-prof .lt-tete{
  font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--rge); font-weight:bold; margin-bottom:13px;
}

.lettre-prof .lt-x strong{color:var(--enc);font-weight:bold}
.lettre-prof .lt-sig{
  margin:20px 0 22px; text-align:right; font-family:var(--serif);
  font-size:25px; color:#4A3B2C; letter-spacing:.1em;

}

@media(max-width:600px){ .lettre-prof{padding:20px 20px 18px}
  .lettre-prof .lt-x{font-size:15px} }
@media(prefers-reduced-motion:reduce){
  .pli-prof,.lettre-prof{animation:none}
}

/* ==================================================================
   LA SCENE — les quatre acteurs autour de l'affaire
   Trois colonnes, deux rangs : l'affaire tient la colonne du milieu sur
   toute la hauteur, les quatre acteurs occupent les coins. Celui qui
   gagne avance vers le centre, celui qui perd recule et tremble.
   ================================================================== */
/* La scene gere sa propre grille : le plateau ne doit plus imposer
   ses trois colonnes, sinon elle se retrouve coincee dans la premiere. */
.plateau.large{max-width:1400px;margin:0 auto;grid-template-columns:minmax(0,1fr)}

/* Les colonnes des acteurs gagnent ce que les gouttieres perdent :
   le medaillon est plus large, et les quatre se tiennent plus pres
   de l'ordre du jour. */
.scene{
  display:grid; gap:26px 12px; align-items:start;
  /* La colonne laterale ne porte plus un medaillon nu mais une carte
     — medaillon, nom et jauge cote a cote. Elle est donc plus large
     et bien moins haute : deux rangees de cartes font moins que deux
     rangees de medaillons, et l'ordre du jour garde sa largeur. */
  grid-template-columns:minmax(0,1fr) minmax(0,1.45fr) minmax(0,1fr);
  grid-template-rows:auto auto;
  /* Les bulles se posent AU-DESSUS des cartes : sans cet air, celles
     de la rangee du haut passaient sous le bandeau du titre. La scene
     peut se le permettre, elle a perdu plus de deux cents pixels en
     passant aux cartes. */
  margin:0 0 4px; padding-top:104px;
  --rond:150px;
}
.p-i{grid-area:1/1} .p-m{grid-area:1/3}
.p-o{grid-area:2/1} .p-p{grid-area:2/3}
/* « .centre » sert ailleurs dans le jeu a centrer un texte : sans le
   prefixe, ce « display:flex » empilait les boutons de l'ecran de
   niveau sur toute la largeur.
   Les bulles debordent des postes sur l'ordre du jour : elles ne
   peuvent le faire que si les postes passent DEVANT le centre. */
.scene > .centre{grid-area:1/2/3/3; display:flex; flex-direction:column;
  gap:10px; position:relative; z-index:1;
  /* il remonte dans l'air pris pour les bulles : rien ne se pose
     au-dessus de lui */
  margin-top:-84px}

/* ---------- un poste d'acteur ---------- */
.poste{
  /* z-index : sans lui, les deux postes du haut sont peints avant le
     centre — leurs bulles disparaissaient sous la feuille. */
  position:relative; z-index:3;
  /* Une carte : medaillon a gauche, nom et jauge a droite. Memes
     materiaux que les plaques de choix — plaque sombre, filet d'or —
     pour que le plateau tienne d'une seule matiere.
     Une GRILLE et non une rangee : la jauge est la soeur du bloc du
     nom, pas sa fille — en rangee elle se posait a COTE du nom. */
  display:grid; grid-template-columns:var(--rond) minmax(0,1fr);
  grid-template-rows:auto auto; align-items:center;
  column-gap:18px; row-gap:0;
  padding:14px 20px 14px 14px; border-radius:6px; width:100%;
  background:linear-gradient(176deg,rgba(34,25,16,.93) 0%,rgba(17,12,7,.96) 100%);
  border:1px solid rgba(214,176,106,.22);
  box-shadow:0 6px 18px rgba(0,0,0,.42);
  transition:transform .42s cubic-bezier(.22,.9,.26,1),
             filter .42s ease, opacity .42s ease,
             border-color .42s ease, box-shadow .42s ease;
  transform:scale(.985); opacity:.9;
}
body[data-niveau="II"] .poste{
  background:linear-gradient(176deg,rgba(21,28,38,.93) 0%,rgba(11,15,22,.96) 100%);
  border-color:rgba(150,185,220,.22)}
/* Concerne par l'affaire : il se penche un peu, sans qu'on le dise. */
.poste.concerne{opacity:1}
.p-i.concerne,.p-o.concerne{transform:scale(1) translateX(5px)}
.p-m.concerne,.p-p.concerne{transform:scale(1) translateX(-5px)}

/* IL A LA PAROLE. La mise en scene ecrit les bulles une a une : celui
   dont la bulle s'ecrit s'avance d'un pas et passe devant les autres.
   Quand tout est dit, plus personne n'est « maintenant » et le regard
   est libre pour les trois choix. */
.poste.parle{opacity:1}
.poste.dit-maintenant{z-index:7; opacity:1;
  border-color:rgba(216,179,112,.6);
  box-shadow:0 14px 34px rgba(0,0,0,.55)}
.poste.dit-maintenant .visage{border-color:rgba(216,179,112,.85);
  box-shadow:0 8px 22px rgba(0,0,0,.5), 0 0 0 5px rgba(216,179,112,.18)}
/* LE GROS PLAN. Le portrait se rapproche dans son medaillon pendant
   qu'il parle : rien a charger, une transformation sur l'image qui
   est deja la. */
.poste.dit-maintenant .visage img{transform:scale(1.17)}
.p-i.dit-maintenant,.p-o.dit-maintenant{transform:scale(1.045) translateX(8px)}
.p-m.dit-maintenant,.p-p.dit-maintenant{transform:scale(1.045) translateX(-8px)}

/* Il a gagne : il AVANCE vers le joueur. */
.poste.gagne{opacity:1}
.p-i.gagne,.p-o.gagne{transform:scale(1.045) translateX(12px)}
.p-m.gagne,.p-p.gagne{transform:scale(1.045) translateX(-12px)}
.poste.gagne .visage{box-shadow:0 0 0 2px rgba(63,106,46,.55)}

/* Il a perdu : il RECULE, se ternit, et tremble une fois. */
.poste.perd{filter:saturate(.72) brightness(.97); opacity:.86}
.p-i.perd,.p-o.perd{transform:scale(.95) translateX(-7px)}
.p-m.perd,.p-p.perd{transform:scale(.95) translateX(7px)}
/* Trois secousses, apres un court temps mort : la premiere partait
   avant que l'oeil ait trouve le portrait. */
.poste.perd .visage{animation:trembler .5s ease-in-out .2s 3}

.poste.perd-fort{filter:saturate(.5) brightness(.94); opacity:.84}
.p-i.perd-fort,.p-o.perd-fort{transform:scale(.93) translateX(-11px)}
.p-m.perd-fort,.p-p.perd-fort{transform:scale(.93) translateX(11px)}
.poste.perd-fort .visage{animation:trembler .44s ease-in-out .2s 6}
.poste.perd-fort .visage{box-shadow:0 0 0 2px rgba(166,48,36,.5)}
@keyframes trembler{
  0%,100%{transform:translateX(0) rotate(0)}
  16%{transform:translateX(-4px) rotate(-1.2deg)}
  36%{transform:translateX(4px) rotate(1.2deg)}
  56%{transform:translateX(-3px) rotate(-.8deg)}
  76%{transform:translateX(2px) rotate(.5deg)}
}

/* ---------- le visage ---------- */
/* Les portraits sont en 540 x 675, soit 4/5. Le cadre etait carre :
   il leur coupait la tete. Le cadre prend desormais la forme de
   l'image, et plus rien n'est rogne. */
.poste .visage{
  position:relative; width:var(--rond); flex:0 0 var(--rond); aspect-ratio:1;
  border-radius:50%; overflow:hidden; background:var(--pap2);
  border:3px solid rgba(214,176,106,.3);
  box-shadow:0 5px 14px rgba(0,0,0,.45);
  transition:box-shadow .42s ease, border-color .42s ease;
}
body[data-niveau="II"] .poste .visage{border-color:rgba(150,185,220,.3)}
.poste.gagne .visage{border-color:rgba(63,106,46,.6)}
/* LE TEMPS PASSE SUR LES VISAGES.
   « --age » va de 0 au premier tour a 1 au dernier. Le sepia monte, la
   couleur se retire, le contraste durcit : la meme image n'est jamais
   deux fois la meme, et cinq portraits par acteur deviennent un
   continuum sur dix-huit decisions. Aucune image de plus a produire. */
.poste .visage img{width:100%;height:100%;object-fit:cover;display:block;
  object-position:50% 14%;
  transform-origin:50% 24%;
  filter:sepia(calc(.14 + var(--age,0) * .3))
         saturate(calc(1 - var(--age,0) * .34))
         contrast(calc(1.03 + var(--age,0) * .14))
         brightness(calc(1 - var(--age,0) * .08));
  transition:filter 1.2s ease, transform .55s cubic-bezier(.22,.9,.26,1)}
/* et le vignettage se ferme autour du visage */
.poste .visage::after{
  content:""; position:absolute; inset:0; pointer-events:none; z-index:1;
  opacity:calc(var(--age,0) * .55);
  background:radial-gradient(circle at 50% 42%,
    transparent 40%, rgba(28,19,11,.66) 100%);
  transition:opacity 1.2s ease;
}
.poste .visage .jeton{
  position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; opacity:.42;
}
.poste .visage img ~ .jeton{display:none}
.poste .visage svg{width:46%;height:46%}

/* Il mord sur le bas du rond : trente-quatre pixels par rangee rendus
   au diametre, et le nom reste lisible — il porte son ombre. */
/* Le cartouche n'a plus lieu d'etre : la carte EST le fond sombre.
   Le nom se pose simplement a droite du medaillon. */
.poste .visage{grid-area:1/1/3/2}
.poste .ident{grid-area:1/2/2/3; align-self:end;
  display:flex;flex-direction:column;gap:1px;line-height:1.16;
  min-width:0; text-align:left; align-items:flex-start;
  pointer-events:none}
.poste .nm{font-family:var(--serif);font-size:23px;color:#F2E7D2;
  letter-spacing:.01em; line-height:1.1}
body[data-niveau="II"] .poste .nm{color:#E6EEF7}
.poste .et{font-size:10px;color:#D8B370;letter-spacing:.06em;
  text-transform:uppercase; white-space:nowrap}
body[data-niveau="II"] .poste .et{color:#9EC2E0}
.poste.critique .et{font-weight:bold}

/* la jauge, sans un chiffre */
.poste .tige{grid-area:2/2/3/3; align-self:start;
  height:7px;border-radius:4px;width:100%;max-width:200px;
  margin:9px 0 0; background:rgba(0,0,0,.55);overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.poste .tige i{display:block;height:100%;transition:width .6s ease}

/* ---------- ce qu'il dit : une bulle, pas un encart ----------
   Elle part du visage et mord sur l'ordre du jour. Elle ne passe
   jamais sur le texte : deux flotteurs invisibles, mesures apres
   coup par « calerBulles », reservent sa place et le texte la
   contourne. */
/* Tant que la mise en scene ne l'a pas atteinte, la bulle est la —
   elle occupe sa place, qui a ete mesuree — mais on ne la voit pas. */
.poste .dit[data-attente]{opacity:0}
/* Elle se pose AU-DESSUS de la carte, la queue plantee sur le
   medaillon : elle ne passe plus sur l'ordre du jour, et on voit d'un
   coup d'oeil de quelle bouche elle sort. */
.poste .dit{
  transition:opacity .25s ease;
  position:absolute; bottom:calc(100% - 26px); top:auto; z-index:6;
  width:max-content; max-width:min(300px, 94%);
  padding:11px 15px 12px; border-radius:16px;
  background:#FFFCF2; border:1.5px solid rgba(74,56,38,.6);
  box-shadow:0 9px 22px rgba(0,0,0,.5);
  font-size:14.5px; line-height:1.36; color:var(--enc);
}
.p-i .dit,.p-o .dit{left:38px}
.p-m .dit,.p-p .dit{left:38px; right:auto}
/* la queue : deux triangles, le bord puis le papier, pointes vers le bas */
.poste .dit::before,.poste .dit::after{
  content:""; position:absolute; width:0; height:0; border:11px solid transparent;
}
.poste .dit::before{top:100%; left:26px; border-top-color:rgba(74,56,38,.6)}
.poste .dit::after{top:calc(100% - 3px); left:27px; border-width:10px;
  border-top-color:#FFFCF2}

.poste.gagne .dit{border-color:rgba(63,106,46,.65)}
.poste.gagne .dit::before{border-top-color:rgba(63,106,46,.65)}
.poste.perd .dit,.poste.perd-fort .dit{border-color:rgba(166,48,36,.6)}
.poste.perd .dit::before,.poste.perd-fort .dit::before{border-top-color:rgba(166,48,36,.6)}

/* ---------- le centre : l'affaire, et le joueur ---------- */
/* En « flex », un flotteur est ignore : l'ordre du jour redevient un
   bloc, sans quoi le texte ne contournerait rien. */
.centre .ordre{display:block; position:relative}
/* Les deux encoches : invisibles, sans contenu, elles ne font que
   reserver le coin que la bulle occupe. JS leur donne leur taille. */
.centre .ordre .encoche{display:block;width:0;height:0;margin:0;padding:0;
  pointer-events:none}
.centre .ordre .encoche.eg{float:left}
.centre .ordre .encoche.ed{float:right}
.centre .ordre .d{clear:both}

/* ---------- LE CURSEUR DE LA MACHINE A ECRIRE ----------
   Il clignote au bout de la ligne qu'on est en train de frapper, et
   disparait des qu'elle est posee. C'est ce qui manquait au bruit de
   frappe : le son disait qu'on tapait, rien ne le MONTRAIT. */
.frappe::after{
  content:""; display:inline-block; vertical-align:-.14em;
  width:.46em; height:1.02em; margin-left:2px;
  background:currentColor; opacity:.8;
  animation:curseur .68s step-end infinite;
}
@keyframes curseur{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.frappe::after{animation:none;opacity:.5}}

/* ---------- l'ecran de ce qui est arrive --------------------------
   Meme scene, meme centre, mais l'onglet est rouge et le bouton
   remplace les trois plaques : on ne decide pas, on constate. */
.d-consq{--ong:var(--rge)}
.d-consq .onglet{color:var(--rge)}
.d-consq .parle span{color:var(--rge)}
.centre .apres{display:flex; justify-content:center; margin:22px 0 0}
.centre .apres[data-attente]{opacity:0; pointer-events:none}
.centre .apres button{font-size:16px; padding:12px 26px}

/* ---------- la hauteur : les quatre acteurs doivent tenir ---------
   Sur un portable, le plateau depassait l'ecran et la reaction des
   portraits se jouait hors champ. Au-dessous de neuf cents pixels de
   haut, le cadre redevient carre et l'image se cale sur le haut :
   la tete reste, le bas part. */
/* Un ecran bas ne coupe plus la tete : il reduit le diametre. Le
   visage reste entier, du premier au dernier pixel. */
/* Plus de palier par hauteur d'ecran : la mesure a montre que ce
   n'est pas la fenetre qui commande la hauteur de la scene, mais la
   colonne du centre — et elle ne change pas avec la fenetre. Les
   paliers retrecissaient les visages sans rien gagner. Seul reste un
   ecran vraiment bas, ou la bande de nom se resserre. */
@media(max-height:700px){
  .poste .nm{font-size:14.5px} .poste .et{display:none}
}

/* ---------- les trois choix : des plaques, pas des bulles ----------
   Une bulle est du papier clair, arrondi, avec une queue : c'est ce
   qu'on vous DIT. Un choix est une plaque sombre a filet d'or, aux
   coins nets, avec un jeton numerote : c'est ce que vous FAITES. */
/* ---------- LE BANDEAU DES CHOIX ----------
   Sorti de la colonne du centre, il prend toute la largeur : trois
   plaques cote a cote au lieu d'une pile. Une rangee coute environ
   95 px de hauteur la ou la pile en coutait 200, et la question
   devient une vraie bascule en travers de l'ecran. */
/* Pas de marge automatique : dans une grille, des marges auto dans
   l'axe en ligne annulent l'etirement et la boite se reduit a son
   contenu — mesure, 401 px au lieu de 1400. */
.tranche{margin:18px 0 0}
.tranche.centre .question{display:flex; align-items:center; gap:20px;
  margin:0 0 15px; grid-column:auto; white-space:nowrap}
.tranche.centre .question::before,.tranche.centre .question::after{
  content:""; flex:1 1 auto; height:1px; min-width:30px;
  background:linear-gradient(90deg,transparent,rgba(214,176,106,.55),transparent)}
/* « .centre .rep » a la meme specificite et etait ecrite apres : il
   faut la classe du bandeau EN PLUS pour l'emporter. */
.tranche.centre .rep{display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px; margin:0; counter-reset:choix}
/* Les trois restent cote a cote jusqu'a 820 px — en dessous, la
   bascule telephone (860 px) a de toute facon mis tout le plateau en
   colonne. Entre 820 et 1100, elles se resserrent au lieu de se
   casser. */
/* LA CARTE SUIT LA LARGEUR DISPONIBLE. Sur une fenetre de 920 px la
   colonne laterale ne fait plus que 253 px : medaillon, marges et nom
   n'y tenaient pas, et « Marchands » se faisait couper. Le medaillon
   et le nom descendent par paliers, mesures sur la colonne reelle. */
@media(max-width:1150px){
  .scene{--rond:124px}
  .poste{padding:11px 13px 11px 11px; column-gap:13px}
  .poste .nm{font-size:19px}
  .poste .tige{max-width:160px; height:6px}
}
@media(max-width:1000px){
  .scene{--rond:104px; padding-top:88px}
  .scene > .centre{margin-top:-72px}
  .poste{padding:9px 11px 9px 9px; column-gap:11px}
  .poste .nm{font-size:17px}
  .poste .tige{max-width:130px; margin-top:6px}
  .poste .dit{font-size:13.5px; padding:9px 12px 10px; max-width:min(260px,96%)}
}
/* un nom trop long passe a la ligne plutot que de deborder */
.poste .nm{overflow-wrap:anywhere}

@media(max-width:1100px){
  .tranche.centre .rep{gap:11px}
  .tranche.centre .choix{padding:12px 13px 13px !important; min-height:78px; gap:11px}
  .tranche.centre .choix .q{font-size:15.5px !important; line-height:1.3}
  .tranche.centre .choix::before{width:24px;height:24px;font-size:14px}
  .tranche.centre .question{gap:12px}
}
@media(max-width:820px){
  .tranche.centre .rep{grid-template-columns:minmax(0,1fr)}
  .tranche.centre .question{white-space:normal}
}
.centre .question{margin:22px 0 10px;grid-column:auto}
.centre .rep{grid-template-columns:minmax(0,1fr);gap:10px;margin:0;
  counter-reset:choix; transition:margin .3s ease}

.centre .question[data-attente],.centre .rep[data-attente]{
  opacity:0; pointer-events:none;
}
.centre .question,.centre .rep{transition:margin .3s ease}

/* Dans le bandeau, la plaque est plus haute que large : le jeton
   passe au-dessus du texte, et les trois se lisent d'un coup. */
.tranche.centre .choix{
  align-items:flex-start !important;
  padding:15px 17px 16px !important;
  min-height:84px;
}
.tranche.centre .choix .q{font-size:17px !important; line-height:1.34}
.tranche.centre .apres{margin:0}
.centre .choix{
  /* La regle generale des choix est en colonne : le jeton se posait
     au-dessus du texte au lieu d etre a sa gauche. */
  display:flex !important; flex-direction:row !important;
  align-items:center; gap:15px; text-align:left;
  counter-increment:choix;
  background:linear-gradient(176deg,#3C2D1F 0%,#241A12 100%) !important;
  color:#F2E6CE !important;
  border:1px solid rgba(214,176,106,.4) !important;
  border-left:3px solid var(--lai) !important;
  border-radius:3px !important;
  padding:13px 18px !important;
  transform:none !important;
  box-shadow:0 7px 18px rgba(0,0,0,.45);
}
/* le jeton : on peut dire « je prends la deux » */
.centre .choix::before{
  content:counter(choix);
  flex:0 0 auto; width:27px; height:27px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-size:15.5px; color:#2B2118;
  background:radial-gradient(circle at 34% 30%, #F0D79A, var(--lai) 70%, #9A7430);
  box-shadow:0 2px 5px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35);
}
.centre .choix .q{color:#F6ECD8 !important;font-size:16.5px;line-height:1.3}
.centre .choix:hover{
  transform:translateY(-2px) !important;
  border-color:var(--lai) !important;
  box-shadow:0 11px 26px rgba(0,0,0,.55), 0 0 0 1px rgba(214,176,106,.28);
}

/* elles montent l'une apres l'autre, une fois tout le monde entendu */
/* Pas d'opacite ici : si l'animation ne se jouait pas, la plaque
   resterait invisible et le joueur n'aurait plus de quoi decider. */
@keyframes choix-monte{
  from{transform:translateY(16px)}
  to{transform:none}
}
.centre .rep.montre .choix{animation:choix-monte .42s cubic-bezier(.2,.9,.3,1) backwards}
.centre .rep.montre .choix:nth-child(2){animation-delay:.1s}
.centre .rep.montre .choix:nth-child(3){animation-delay:.2s}
@media(prefers-reduced-motion:reduce){
  .centre .rep.montre .choix{animation:none}
}
/* Le joueur, personnifie : un sous-main vide au bas du centre, qui dit
   sans un mot que la place est la sienne. */
.centre .moi{
  height:9px; border-radius:0 0 3px 3px;
  background:linear-gradient(180deg,rgba(107,87,65,.3),rgba(107,87,65,.07));
  box-shadow:inset 0 1px 2px rgba(43,33,24,.2);
}
.centre .moi span{display:none}

/* ---------- les dossiers : trois languettes, pas trois panneaux ----
   Ferme, un dossier tenait encore un tiers de l'ecran : le carnet
   s'ouvrait tout seul et deployait l'annee, la population, les sept
   conditions ; le courrier vide affichait une enveloppe geante pour
   dire qu'il n'y avait rien. C'est l'encombrement que la classe a
   reproche au jeu. Desormais : une ligne chacun, et on tire. */
.appoints{
  display:flex; flex-wrap:wrap; align-items:flex-start; gap:10px;
  margin-top:22px; padding-top:13px;
  border-top:1px solid rgba(107,87,65,.22);
}
.appoints > *{flex:1 1 230px; min-width:0; align-self:flex-start}
.appoints .dossier{margin:0}
.appoints details:not([open]) > summary{padding:9px 14px}
.appoints .courrier:not([open]) .env{display:none}
.appoints .carnet:not([open]) .spirale{display:none}

/* ---------- le telephone : une colonne, les acteurs en rang ---------- */
/* ---------- le telephone : une colonne, dans l'ordre de lecture ----
   L'affaire, les quatre acteurs, puis la question. « display:contents »
   sort les enfants du centre pour qu'ils prennent leur rang entre les
   postes : sans lui, les reponses arrivaient avant les arguments. */
@media(max-width:860px){
  .scene{display:flex; flex-direction:column; gap:11px}
  .scene > .centre{display:contents}
  .centre .ordre{order:-2}
  .poste{order:0}
  .tranche .question{order:1;margin:6px 0 2px;white-space:normal}
  .tranche .rep{order:2}
  .centre .moi{display:none}
  .centre .ordre .encoche{display:none}
  .poste{flex-direction:row;align-items:center;gap:10px;transform:none!important}
  .poste{width:auto;padding:9px 11px}
  .poste .visage{width:62px;flex:0 0 62px;aspect-ratio:1;border-width:2px}
  .poste .ident{flex:0 0 96px}
  .poste .nm{font-size:15px}
  .poste .dit{position:relative;bottom:auto;max-width:none;width:auto}
  .poste .dit::before{top:16px;left:-19px;border-width:9px;
    border-top-color:transparent !important;
    border-right-color:rgba(74,56,38,.6) !important}
  .poste .ident{flex:0 0 96px}
  .poste .tige{display:none}
  .poste .dit{position:relative;flex:1;width:auto;border-radius:12px;
    padding:8px 11px;box-shadow:none}
  .poste .dit::after{display:none}
  .poste .dit::before{top:16px;left:-19px;right:auto;border-width:9px;
    border-right-color:rgba(74,56,38,.6) !important;
    border-left-color:transparent !important}
}
@media(prefers-reduced-motion:reduce){
  .poste,.poste .visage{transition:none;animation:none!important;transform:none!important}
}

/* l'ordre du jour : on lit, puis on tranche. La question marque la bascule. */
.question{grid-column:1 / -1;text-align:center;margin:18px 0 -2px;
  font-family:var(--serif);font-size:clamp(19px,2.4vw,25px);color:#E8D8BC;
  letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.75)}
body[data-niveau="II"] .question{color:#D9E3ED}
@media(max-width:1000px){.question{margin:6px 0 2px}}

/* ---------- le courrier ---------------------------------------------- */
.courrier{
  background:linear-gradient(158deg,#EFE2C6,#DCCBA6) !important;
  border:1px solid #C2A470 !important; border-radius:2px;
  padding:15px 16px 14px; color:#2A1F12 !important;
  box-shadow:0 10px 24px rgba(0,0,0,.46);
}
/* l'enveloppe : un rabat triangulaire, deux traits */
.courrier .env{
  height:46px; margin:2px 0 11px; border:1px solid #B79A63; border-radius:2px;
  background:
    linear-gradient(135deg, transparent 49.4%, #B79A63 49.4% 50.6%, transparent 50.6%),
    linear-gradient(225deg, transparent 49.4%, #B79A63 49.4% 50.6%, transparent 50.6%),
    linear-gradient(160deg,#F3E8CE,#E3D3AE);
  background-size:100% 62%,100% 62%,100% 100%;
  background-position:top left,top left,center;
  background-repeat:no-repeat;
  position:relative;
}
.courrier .cd{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:#8E2413;font-weight:bold;margin-bottom:4px}
.courrier .cq{font-size:13.5px;line-height:1.45;color:#3A2E22}
.courrier .cq.vide{font-style:italic;color:#7D6A4E}
/* un pli non ouvert : le cachet, et il remue */
.courrier.attente .env::after{
  content:""; position:absolute; left:50%; top:52%; width:22px; height:22px;
  transform:translate(-50%,-50%);
  border-radius:47% 53% 51% 49%/49% 47% 53% 51%;
  background:radial-gradient(circle at 36% 30%, #D4553A, #8E2413 62%, #5A140A);
  box-shadow:0 2px 5px rgba(0,0,0,.5);
}
.courrier.attente{opacity:0; animation:poser .42s cubic-bezier(.2,.8,.3,1) var(--d,0s) forwards,
             frisson 2.4s ease-in-out infinite;}
@keyframes frisson{
  0%,88%,100%{transform:rotate(1.4deg)}
  91%{transform:rotate(.2deg) translateX(-1.5px)}
  94%{transform:rotate(2.4deg) translateX(1.5px)}
  97%{transform:rotate(1deg)}
}

/* ---------- la frappe ------------------------------------------------ */
/* un curseur tant que la ligne s'écrit, et une hauteur réservée pour que
   rien ne saute quand le texte s'allonge */
.situ .t{min-height:1.2em}
.situ .d{min-height:3.1em}

/* ---------- petits écrans -------------------------------------------- */
@media(max-width:1000px){
  .plateau{grid-template-columns:1fr}
  .plateau .col{gap:14px}
  .col-g > *,.col-c > *,.col-d > *{transform:none}
  .courrier.attente{animation:none}
  .tableau{padding:22px 14px 14px;border-width:9px}
  .bureau::before{left:-8px;right:-8px}
  .bureau::after{left:-8px;right:-8px}
}
</style>

<script>
"use strict";
/* ==================================================================
   LE SON

   Trois boucles fournies, libres de droits, 80 kbit/s stéréo.

   Mesuré à la décompression, elles ont toutes le même défaut : un
   fondu descendant puis deux secondes de silence à la fin. Jouées en
   boucle simple, on entendrait un trou toutes les deux ou trois
   minutes. On ne les rejoue donc pas d'un bout à l'autre : on boucle
   sur la matière pleine, mesurée fichier par fichier, avec un fondu
   croisé de deux secondes et demie entre la fin et la reprise.

   Deux lecteurs alternent pour cela. Les niveaux relevés au point de
   reprise et au point de bouclage ne diffèrent que de 0,5 à 1,5 dB :
   le raccord est inaudible.

   Par-dessus, la tension du jeu ouvre un filtre, monte le volume et
   accélère de 5 % au plus ; et au-delà d'un seuil seulement, un
   battement de machine vient se poser sur la musique.
   ================================================================== */
const BOUCLES = {
  menu:{ f:"son/menu.mp3",      debut:2.00, fin:167.6 },
  fin: { f:"son/fin.mp3",       debut:0.00, fin:0     },  /* fin calée à la lecture */
  I:   { f:"son/niveau-I.mp3",  debut:0.00, fin:142.2 },
  II:  { f:"son/niveau-II.mp3", debut:0.75, fin:136.8 },
};
const CROISE = 2.5;   // secondes de fondu entre les deux lecteurs

const SON = {
  ctx:null, pret:false, actif:true, amb:null,
  /* deux réglages distincts : la musique de fond, et ce qui réagit */
  vmus:.85, veff:.9, gainMusU:null, gainEff:null,
  maitre:null, bruit:null, tension:0, tic:null,
  lecteurs:[], actifL:0, filtre:null, gainMus:null, veille:null, vmix:.55,
  horloge:null, prochain:0, battue:0,

  dispo(){ return typeof (window.AudioContext||window.webkitAudioContext)==="function"; },

  init(){
    if(this.ctx || !this.dispo()) return;
    try{
      const AC = window.AudioContext||window.webkitAudioContext;
      this.ctx = new AC();
      this.maitre = this.ctx.createGain();
      this.maitre.gain.value = this.actif ? 1 : 0;
      this.maitre.connect(this.ctx.destination);
      const n = this.ctx.sampleRate*2;
      this.bruit = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = this.bruit.getChannelData(0);
      for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
      /* la chaîne commune aux deux lecteurs : mélange, filtre, volume */
      this.filtre = this.ctx.createBiquadFilter();
      this.filtre.type="lowpass"; this.filtre.frequency.value=1600;
      this.gainMus = this.ctx.createGain(); this.gainMus.gain.value=1;
      /* La musique : filtre de tension, gain de tension, puis le volume
         choisi par le joueur. Les bruitages : leur propre volume. Les
         deux se rejoignent sous l'interrupteur. */
      this.gainMusU = this.ctx.createGain(); this.gainMusU.gain.value = this.vmus;
      this.gainEff  = this.ctx.createGain(); this.gainEff.gain.value  = this.veff;
      this.filtre.connect(this.gainMus); this.gainMus.connect(this.gainMusU);
      this.gainMusU.connect(this.maitre);
      this.gainEff.connect(this.maitre);
      this.pret = true;
      this.veiller();
    }catch(e){ this.pret=false; }
  },

  /* Deux lecteurs, créés une seule fois : createMediaElementSource ne
     peut être appelé qu'une fois par élément audio. */
  lecteur(i){
    if(this.lecteurs[i]) return this.lecteurs[i];
    const a = new Audio();
    /* Pas de crossOrigin : les fichiers viennent du même site, et le
       demander fait échouer le chargement — en file:// toujours, et sur
       un serveur qui n'envoie pas les en-têtes CORS. */
    a.preload="auto"; a.volume=1;
    const L = {a, g:null, ok:false};
    if(this.ctx){
      try{
        const src = this.ctx.createMediaElementSource(a);
        L.g = this.ctx.createGain(); L.g.gain.value = 0;
        src.connect(L.g); L.g.connect(this.filtre);
        L.ok = true;
      }catch(e){ L.g=null; a.volume=0; }
    } else { a.volume=0; }
    this.lecteurs[i]=L;
    return L;
  },

  vol(L, v, t){
    if(L.g) this.glisser(L.g.gain, v, t);
    else {
      /* repli sans Web Audio : on anime le volume de l'élément */
      const dep=L.a.volume, pas=(v-dep)/Math.max(1,t*20);
      clearInterval(L.anim);
      L.anim = setInterval(()=>{
        let x = L.a.volume + pas;
        if((pas>0 && x>=v) || (pas<0 && x<=v)){ x=v; clearInterval(L.anim); }
        try{ L.a.volume = Math.max(0,Math.min(1,x)) }catch(e){}
      }, 50);
    }
  },

  reveiller(){
    this.init();
    if(this.ctx && this.ctx.state==="suspended") this.ctx.resume().catch(()=>{});
    const L=this.lecteurs[this.actifL];
    if(L && this.actif && L.a.src) L.a.play().catch(()=>{});
  },

  couper(v){
    this.actif = v;
    try{ localStorage.setItem("pdp_son", v?"1":"0") }catch(e){}
    /* On coupe d'un coup : un fondu laisse le temps à une autre rampe
       de reprendre la main, et le joueur a cliqué pour que ça s'arrête
       maintenant. On rétablit en douceur, en revanche. */
    if(this.maitre){
      if(v) this.glisser(this.maitre.gain, 1, .3);
      else try{ this.maitre.gain.cancelScheduledValues(this.ctx.currentTime);
                this.maitre.gain.setValueAtTime(0, this.ctx.currentTime); }
           catch(e){ this.maitre.gain.value = 0; }
    }
    this.lecteurs.forEach(L=>{ if(!L) return;
      if(v){ if(L.a.src) L.a.play().catch(()=>{}) } else L.a.pause(); });
    const b=document.getElementById("btson");
    if(b){ b.textContent = v?"♪":"♪̸"; b.title = v?"Couper le son":"Rétablir le son";
            b.classList.toggle("muet", !v); }
  },

  /* La réglette. Rétablit le son si on la remonte alors qu'il était coupé :
     personne ne comprendrait qu'on pousse le volume sans rien entendre. */
  volume(v){
    this.vmus = Math.max(0, Math.min(1, v));
    try{ localStorage.setItem("pdp_vol", this.vmus.toFixed(2)) }catch(e){}
    if(this.vmus > 0 && !this.actif){ this.couper(true); }
    if(this.gainMusU) this.glisser(this.gainMusU.gain, this.vmus, .12);
  },

  /* Les bruitages : le même geste, l'autre chemin. */
  bruitage(v){
    this.veff = Math.max(0, Math.min(1, v));
    try{ localStorage.setItem("pdp_eff", this.veff.toFixed(2)) }catch(e){}
    if(this.veff > 0 && !this.actif){ this.couper(true); }
    if(this.gainEff) this.glisser(this.gainEff.gain, this.veff, .12);
    this.papier();                 /* on entend tout de suite ce qu'on règle */
  },

  glisser(param, val, t){
    if(!this.ctx) return;
    /* garde-fou : une cible qui n'est pas un nombre coupait le son en
       silence. Mieux vaut ne rien faire que tout mettre à zéro. */
    if(typeof val !== "number" || !isFinite(val)){
      console.warn("son : fondu ignoré, cible invalide", val); return;
    }
    const n=this.ctx.currentTime;
    try{ param.cancelScheduledValues(n); param.setValueAtTime(param.value,n);
         param.linearRampToValueAtTime(val, n+t); }
    catch(e){ param.value = val; }
  },

  /* Quelque chose joue-t-il, vraiment ? */
  joue(){
    return (this.lecteurs||[]).some(L => L && L.a && !L.a.paused && !L.a.ended);
  },

  /* Remettre l'ambiance en marche si elle s'est tue. Ne fait rien tant
     que tout va bien : on peut donc l'appeler aussi souvent qu'on veut. */
  relancer(){
    /* Le son est coupé : la veille ne se contente pas de ne rien faire,
       elle s'assure qu'il l'est resté. C'est la même boucle qui répare
       dans les deux sens. */
    if(!this.actif){
      try{ if(this.maitre && this.ctx){
             this.maitre.gain.cancelScheduledValues(this.ctx.currentTime);
             this.maitre.gain.setValueAtTime(0, this.ctx.currentTime); } }catch(e){}
      (this.lecteurs||[]).forEach(L=>{ if(L && L.a && !L.a.paused){
        try{ L.a.pause() }catch(e){} } });
      return;
    }
    if(!this.amb) return;
    const b = BOUCLES[this.amb];
    if(!b) return;
    this.init();
    if(!this.pret) return;
    try{ if(this.ctx.state==="suspended") this.ctx.resume().catch(()=>{}); }catch(e){}
    if(this.joue()) return;
    this.actifL = 0;
    this.demarrer(this.lecteur(0), b, true);
    this.lecteur(1);
    clearInterval(this.veille); this.veille = null;
    this.surveiller(b);
    this.lancerHorloge();
  },

  /* Le premier geste du joueur lève la règle de lecture automatique.
     Ensuite, une veille toutes les quatre secondes rattrape ce qu'un
     onglet endormi ou un refus de lecture aurait fait tomber. */
  veiller(){
    if(this.veilleGlobale) return;
    const reprise = ()=>{ try{ this.relancer() }catch(e){} };
    ["pointerdown","keydown","touchstart"].forEach(ev=>
      document.addEventListener(ev, reprise, {capture:true, passive:true}));
    document.addEventListener("visibilitychange", ()=>{
      if(!document.hidden) reprise();
    });
    this.veilleGlobale = setInterval(reprise, 4000);
  },

  /* Où brancher un bruitage. Avant l'initialisation, on retombe sur
     l'interrupteur : rien ne casse si le son n'est pas encore prêt. */
  eff(){ return this.gainEff || this.maitre; },

  /* ---------- l'ambiance --------------------------------------------- */
  ambiance(quoi){
    this.init();
    /* Pas seulement « est-ce la même ambiance ? » mais « la même, et
       elle joue vraiment ? ». Sans cela, une ambiance demandée avant
       que le son soit prêt restait inscrite et bloquait les suivantes. */
    if(this.amb===quoi && this.joue()) return;
    this.amb = quoi;
    const b = BOUCLES[quoi];
    /* hors d'une partie — menu, écran de fin — la tension retombe */
    if(quoi!=="I" && quoi!=="II"){
      this.tension = 0;
      if(this.filtre)  this.glisser(this.filtre.frequency, 7200, 2.5);
      if(this.gainMus) this.glisser(this.gainMus.gain, 1, 2.5);
      this.lecteurs.forEach(L=>{ if(L){ try{ L.a.playbackRate = 1 }catch(e){} } });
    }
    this.lecteurs.forEach(L=>{ if(L) this.vol(L, 0, .5); });
    clearInterval(this.veille); this.veille=null;
    if(!b || !this.pret){ setTimeout(()=>this.stopTous(), 700); return; }
    this.actifL = 0;
    this.demarrer(this.lecteur(0), b, true);
    this.lecteur(1);                       // prêt pour le premier croisement
    this.surveiller(b);
    this.lancerHorloge();
  },

  demarrer(L, b, fondu){
    try{
      if(L.a.getAttribute("src") !== b.f){
        L.a.src = b.f; L.a.load();
        /* fin:0 veut dire « on ne connaît pas la durée » : on la déduit
           du fichier dès qu'il est lu, pour pouvoir boucler dessus. */
        if(!b.fin) L.a.addEventListener("loadedmetadata", ()=>{
          if(L.a.duration && isFinite(L.a.duration)) b.fin = Math.max(1, L.a.duration - 1.2);
        }, {once:true});
      }
      L.a.currentTime = b.debut;
    }catch(e){}
    if(this.actif) L.a.play().catch(()=>{});
    this.vol(L, this.vmix, fondu ? 1.8 : CROISE);
  },

  /* On ne laisse jamais le fichier aller jusqu'au bout : à l'approche du
     point de bouclage, l'autre lecteur reprend au début en fondu. */
  surveiller(b){
    this.veille = setInterval(()=>{
      if(!this.amb || !BOUCLES[this.amb]) return;
      const L=this.lecteurs[this.actifL];
      if(!L || L.a.paused) return;
      /* Point de bouclage encore inconnu : on le prend dès que la durée
         est lisible, et surtout on ne boucle pas avant de le savoir —
         sinon « currentTime >= 0 - 2,5 » est vrai tout de suite. */
      if(!b.fin || !isFinite(b.fin)){
        if(L.a.duration && isFinite(L.a.duration))
          b.fin = Math.max(1, L.a.duration - 1.2);
        return;
      }
      if(L.a.currentTime >= b.fin - CROISE){
        const autre = this.lecteur(this.actifL^1);
        this.demarrer(autre, b, false);
        this.vol(L, 0, CROISE);
        const vieux = L;
        setTimeout(()=>{ try{ vieux.a.pause() }catch(e){} }, (CROISE+.4)*1000);
        this.actifL ^= 1;
      }
    }, 250);
  },

  stopTous(){
    this.lecteurs.forEach(L=>{ if(L){ try{ L.a.pause() }catch(e){} } });
  },

  /* ---------- le battement, au-delà du seuil seulement ---------------- */
  lancerHorloge(){
    if(this.horloge) return;
    this.horloge = setInterval(()=>{
      if(!this.ctx || !this.amb || this.amb==="menu") return;
      if(this.tension < .45){ this.prochain = this.ctx.currentTime + .2; return; }
      const pas = 60/(54 + this.tension*54);
      while(this.prochain < this.ctx.currentTime + .12){
        this.battre(this.prochain); this.prochain += pas;
      }
      if(this.prochain < this.ctx.currentTime) this.prochain = this.ctx.currentTime + .05;
    }, 25);
  },

  battre(t){
    this.battue++;
    const k=(this.tension-.45)/.55;
    if(this.amb==="I") this.vapeur(t, this.battue%2===0, k);
    else               this.chaine(t, this.battue%4===0, k);
  },

  vapeur(t, fort, k){
    const c=this.ctx, o=c.createOscillator(), g=c.createGain();
    o.type="sine"; o.frequency.setValueAtTime(fort?62:52, t);
    o.frequency.exponentialRampToValueAtTime(fort?30:26, t+.16);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime((fort?.17:.10)*k, t+.012);
    g.gain.exponentialRampToValueAtTime(.001, t+.22);
    o.connect(g); g.connect(this.eff()); o.start(t); o.stop(t+.26);
  },

  chaine(t, fort, k){
    const c=this.ctx, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=this.bruit; s.loop=true;
    f.type="bandpass"; f.frequency.value=fort?2600:3400; f.Q.value=9;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime((fort?.06:.035)*k, t+.004);
    g.gain.exponentialRampToValueAtTime(.001, t+(fort?.10:.05));
    s.connect(f); f.connect(g); g.connect(this.eff()); s.start(t); s.stop(t+.14);
  },

  /* « À cause de votre choix d'il y a quatre tours. » C'est le moment
     où le jeu referme une boucle, et il arrivait en silence. Trois
     notes d'un même accord, qui montent lentement et s'éteignent en
     trois secondes, posées sous la musique. Rien de perçant : des
     sinusoïdes filtrées, une attaque d'une demi-seconde, et un volume
     qui reste sous celui de la musique. */
  germe(bon){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.02;
    const f=c.createBiquadFilter(), g=c.createGain();
    f.type="lowpass"; f.frequency.value=1500; f.Q.value=.6;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.075, t+.55);     /* la nappe se lève */
    g.gain.setValueAtTime(.075, t+1.5);
    g.gain.exponentialRampToValueAtTime(.0008, t+3.2);
    f.connect(g); g.connect(this.eff());
    /* majeur quand la graine est heureuse, mineur quand elle l'est moins :
       l'oreille sait avant d'avoir lu. */
    const r = bon ? [1, 1.25, 1.5] : [1, 1.2, 1.5];
    r.forEach((x,i)=>{
      const o=c.createOscillator();
      o.type = i ? "sine" : "triangle";
      o.frequency.setValueAtTime(174.6*x, t);
      o.connect(f); o.start(t+i*.11); o.stop(t+3.3);
    });
  },

  /* Le tiroir du bureau d'enquête : du bois qui glisse sur du bois,
     puis la butée. Grave, court, sans claquement sec. */
  tiroir(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.01;
    const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=this.bruit; s.loop=true;
    f.type="lowpass"; f.frequency.setValueAtTime(380, t);
    f.frequency.linearRampToValueAtTime(900, t+.3);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.05, t+.09);
    g.gain.setValueAtTime(.05, t+.26);
    g.gain.exponentialRampToValueAtTime(.001, t+.4);
    s.connect(f); f.connect(g); g.connect(this.eff()); s.start(t); s.stop(t+.42);
    /* la butée, quand le tiroir arrive au bout */
    const o=c.createOscillator(), gb=c.createGain();
    o.type="triangle"; o.frequency.setValueAtTime(150, t+.3);
    o.frequency.exponentialRampToValueAtTime(82, t+.38);
    gb.gain.setValueAtTime(0, t+.3);
    gb.gain.linearRampToValueAtTime(.09, t+.31);
    gb.gain.exponentialRampToValueAtTime(.001, t+.42);
    o.connect(gb); gb.connect(this.eff()); o.start(t+.3); o.stop(t+.44);
  },

  /* L'enveloppe : le cachet casse, puis le papier se déchire. La
     déchirure monte en fréquence — c'est ce qui la rend reconnaissable. */
  enveloppe(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.01;
    /* le cachet */
    const o=c.createOscillator(), g0=c.createGain();
    o.type="triangle"; o.frequency.setValueAtTime(420, t);
    o.frequency.exponentialRampToValueAtTime(130, t+.07);
    g0.gain.setValueAtTime(0, t);
    g0.gain.linearRampToValueAtTime(.14, t+.006);
    g0.gain.exponentialRampToValueAtTime(.001, t+.1);
    o.connect(g0); g0.connect(this.eff()); o.start(t); o.stop(t+.12);
    /* la déchirure */
    const d=t+.1;
    const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=this.bruit; s.loop=true;
    f.type="bandpass"; f.Q.value=.9;
    f.frequency.setValueAtTime(1600, d);
    f.frequency.exponentialRampToValueAtTime(5200, d+.3);
    g.gain.setValueAtTime(0, d);
    g.gain.linearRampToValueAtTime(.055, d+.05);
    g.gain.linearRampToValueAtTime(.035, d+.2);
    g.gain.exponentialRampToValueAtTime(.001, d+.36);
    s.connect(f); f.connect(g); g.connect(this.eff()); s.start(d); s.stop(d+.38);
  },

  /* Le coup du verdict : un seul, grave et long. Il tombe trois secondes
     avant que la musique de fin s'installe. */
  verdict(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.02;
    const o=c.createOscillator(), o2=c.createOscillator(), g=c.createGain();
    o.type="sine";  o.frequency.setValueAtTime(74, t);
    o.frequency.exponentialRampToValueAtTime(44, t+1.6);
    o2.type="sine"; o2.frequency.setValueAtTime(111, t);
    o2.frequency.exponentialRampToValueAtTime(66, t+1.6);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.22, t+.04);
    g.gain.exponentialRampToValueAtTime(.0008, t+2.6);
    o.connect(g); o2.connect(g); g.connect(this.eff());
    o.start(t); o2.start(t); o.stop(t+2.8); o2.stop(t+2.8);
  },

  /* Une force passe sous quinze. Le bandeau rouge, un élève qui lit ne
     le voit pas : une note tenue, discrète, qui s'efface d'elle-même. */
  alerte(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.02;
    [466.2, 311.1].forEach((hz,i)=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type="sine"; o.frequency.value=hz;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(i?.05:.07, t+.25);
      g.gain.setValueAtTime(i?.05:.07, t+.7);
      g.gain.exponentialRampToValueAtTime(.0008, t+2.1);
      o.connect(g); g.connect(this.eff()); o.start(t); o.stop(t+2.2);
    });
  },

  /* La correction du questionnaire : une note par réponse, dans l'ordre.
     Claire quand elle est juste, sourde quand elle ne l'est pas. */
  bilan(justes){
    if(!this.pret || !justes || !justes.length) return;
    const c=this.ctx, t0=c.currentTime+.12;
    justes.forEach((ok,i)=>{
      const t=t0+i*.15;
      const o=c.createOscillator(), f=c.createBiquadFilter(), g=c.createGain();
      o.type = ok ? "sine" : "triangle";
      o.frequency.setValueAtTime(ok ? 784 : 174.6, t);
      if(!ok) o.frequency.exponentialRampToValueAtTime(146.8, t+.2);
      f.type="lowpass"; f.frequency.value = ok ? 6000 : 700;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(ok ? .1 : .085, t+.012);
      g.gain.exponentialRampToValueAtTime(.001, t+(ok ? .34 : .28));
      o.connect(f); f.connect(g); g.connect(this.eff());
      o.start(t); o.stop(t+.4);
    });
  },

  /* La machine tape tant qu'un texte s'écrit. Irrégulière, discrète, et
     toujours sous la musique : c'est une présence, pas un événement. */
  frappe(marche){
    if(!this.pret) return;
    if(!marche){ if(this.dactylo){ clearInterval(this.dactylo); this.dactylo=null; } return; }
    if(this.dactylo) return;
    const clic = ()=>{
      const c=this.ctx, t=c.currentTime+.005;
      const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
      s.buffer=this.bruit; s.loop=true;
      f.type="bandpass"; f.Q.value=2.2;
      f.frequency.value = 1900 + Math.random()*1300;   /* chaque touche sonne un peu autrement */
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.028 + Math.random()*.016, t+.003);
      g.gain.exponentialRampToValueAtTime(.001, t+.035);
      s.connect(f); f.connect(g); g.connect(this.eff()); s.start(t); s.stop(t+.05);
    };
    clic();
    this.dactylo = setInterval(()=>{
      clic();
      /* une frappe sur six se double : c'est ce qui fait la main humaine */
      if(Math.random() < .17) setTimeout(clic, 40 + Math.random()*30);
    }, 115);
  },

  /* La sonnette du chariot, quand la ligne est finie. */
  chariot(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.01;
    [2093, 3136].forEach((hz,i)=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type="sine"; o.frequency.value=hz;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(i?.022:.05, t+.004);
      g.gain.exponentialRampToValueAtTime(.0008, t+(i?.5:.8));
      o.connect(g); g.connect(this.eff()); o.start(t); o.stop(t+.9);
    });
  },

  /* ---------- la tension ---------------------------------------------- */
  majTension(){
    if(!this.pret) return;
    if(this.amb!=="I" && this.amb!=="II") return;   /* ni au menu, ni à la fin */
    if(typeof E==="undefined" || !E || !E.f) return;
    const bas = Math.min(E.f.i, E.f.o, E.f.m, E.f.p);
    const t = Math.max(0, Math.min(1, (62-bas)/52));
    this.tension = t;
    if(this.filtre)  this.glisser(this.filtre.frequency, 1100 + t*6000, 2.2);
    if(this.gainMus) this.glisser(this.gainMus.gain, 1 + t*.35, 2.2);
    this.lecteurs.forEach(L=>{ if(L){ try{ L.a.playbackRate = 1 + t*.05 }catch(e){} } });
  },

  /* ---------- les effets ponctuels ------------------------------------- */
  coup(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.02;
    const o=c.createOscillator(), g=c.createGain();
    o.type="sine"; o.frequency.setValueAtTime(96, t);
    o.frequency.exponentialRampToValueAtTime(34, t+.7);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.38, t+.02);
    g.gain.exponentialRampToValueAtTime(.001, t+1.1);
    o.connect(g); g.connect(this.eff()); o.start(t); o.stop(t+1.2);
    if(this.gainMus){
      this.glisser(this.gainMus.gain, .35, .2);
      setTimeout(()=>this.majTension(), 1100);
    }
  },

  papier(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.01;
    const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=this.bruit; s.loop=true;
    f.type="bandpass"; f.frequency.value=4200; f.Q.value=1.4;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.04, t+.03);
    g.gain.exponentialRampToValueAtTime(.001, t+.19);
    s.connect(f); f.connect(g); g.connect(this.eff()); s.start(t); s.stop(t+.22);
  },


  /* Un acteur qu'on interroge répond par une note : elle monte s'il a
     gagné, elle descend s'il a perdu, elle reste plate s'il n'a rien eu. */
  jeton(v){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.01;
    const o=c.createOscillator(), g=c.createGain();
    const base = 330;
    o.type="sine";
    o.frequency.setValueAtTime(base, t);
    if(v>0) o.frequency.exponentialRampToValueAtTime(base*1.5, t+.13);
    else if(v<0) o.frequency.exponentialRampToValueAtTime(base/1.5, t+.13);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.09, t+.012);
    g.gain.exponentialRampToValueAtTime(.001, t+.26);
    o.connect(g); g.connect(this.eff()); o.start(t); o.stop(t+.28);
  },

  horlogeUrgence(marche){
    if(!this.pret) return;
    if(!marche){ if(this.tic){ clearInterval(this.tic); this.tic=null; } return; }
    if(this.tic) return;
    let n=0;
    this.tic = setInterval(()=>{
      const c=this.ctx, t=c.currentTime+.01;
      const o=c.createOscillator(), g=c.createGain();
      o.type="square"; o.frequency.value=(n++%2)?1900:1500;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.06, t+.004);
      g.gain.exponentialRampToValueAtTime(.001, t+.05);
      o.connect(g); g.connect(this.eff()); o.start(t); o.stop(t+.07);
    }, 500);
  },

  fin(cause){
    if(!this.pret) return;
    this.horlogeUrgence(false);
    this.verdict();                  /* un seul coup, grave, sous le reste */
    const c=this.ctx, t=c.currentTime+.05;
    const freqs = cause==="verdict" ? [196, 261.6, 329.6] : [110, 146.8, 155.6];
    freqs.forEach((hz,i)=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type="sine"; o.frequency.value=hz;
      g.gain.setValueAtTime(0, t+i*.09);
      g.gain.linearRampToValueAtTime(.15, t+i*.09+.03);
      g.gain.exponentialRampToValueAtTime(.001, t+i*.09+2.6);
      o.connect(g); g.connect(this.eff()); o.start(t+i*.09); o.stop(t+i*.09+2.8);
    });
    /* la musique baisse mais ne s'arrête pas : on lit encore le verdict */
    if(this.gainMus) this.glisser(this.gainMus.gain, .45, 1.5);
  },
};

/* LES SEPT CONDITIONS ONT ETE RETIREES DU JEU le 8 octobre 2026.
