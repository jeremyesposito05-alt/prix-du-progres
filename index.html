<script>
"use strict";
/* ==================================================================
   LE SON

   Trois boucles fournies, libres de droits, 80 kbit/s stéréo.

   Mesuré à la décompression, elles ont toutes le même défaut : un
   fondu descendant puis deux secondes de silence à la fin. Jouées en
   boucle simple, on entendrait un trou toutes les deux ou trois
   minutes. On ne les rejoue donc pas d'un bout à l'autre : on boucle
   sur la matière pleine, mesurée fichier par fichier, avec un fondu
   croisé de deux secondes et demie entre la fin et la reprise.

   Deux lecteurs alternent pour cela. Les niveaux relevés au point de
   reprise et au point de bouclage ne diffèrent que de 0,5 à 1,5 dB :
   le raccord est inaudible.

   Par-dessus, la tension du jeu ouvre un filtre, monte le volume et
   accélère de 5 % au plus ; et au-delà d'un seuil seulement, un
   battement de machine vient se poser sur la musique.
   ================================================================== */
const BOUCLES = {
  menu:{ f:"son/menu.mp3",      debut:2.00, fin:167.6 },
  fin: { f:"son/fin.mp3",       debut:0.00, fin:0     },  /* fin calée à la lecture */
  I:   { f:"son/niveau-I.mp3",  debut:0.00, fin:142.2 },
  II:  { f:"son/niveau-II.mp3", debut:0.75, fin:136.8 },
};
const CROISE = 2.5;   // secondes de fondu entre les deux lecteurs

const SON = {
  ctx:null, pret:false, actif:true, amb:null,
  /* deux réglages distincts : la musique de fond, et ce qui réagit */
  vmus:.85, veff:.9, gainMusU:null, gainEff:null,
  maitre:null, bruit:null, tension:0, tic:null,
  lecteurs:[], actifL:0, filtre:null, gainMus:null, veille:null, vmix:.55,
  horloge:null, prochain:0, battue:0,

  dispo(){ return typeof (window.AudioContext||window.webkitAudioContext)==="function"; },

  init(){
    if(this.ctx || !this.dispo()) return;
    try{
      const AC = window.AudioContext||window.webkitAudioContext;
      this.ctx = new AC();
      this.maitre = this.ctx.createGain();
      this.maitre.gain.value = this.actif ? 1 : 0;
      this.maitre.connect(this.ctx.destination);
      const n = this.ctx.sampleRate*2;
      this.bruit = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = this.bruit.getChannelData(0);
      for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
      /* la chaîne commune aux deux lecteurs : mélange, filtre, volume */
      this.filtre = this.ctx.createBiquadFilter();
      this.filtre.type="lowpass"; this.filtre.frequency.value=1600;
      this.gainMus = this.ctx.createGain(); this.gainMus.gain.value=1;
      /* La musique : filtre de tension, gain de tension, puis le volume
         choisi par le joueur. Les bruitages : leur propre volume. Les
         deux se rejoignent sous l'interrupteur. */
      this.gainMusU = this.ctx.createGain(); this.gainMusU.gain.value = this.vmus;
      this.gainEff  = this.ctx.createGain(); this.gainEff.gain.value  = this.veff;
      this.filtre.connect(this.gainMus); this.gainMus.connect(this.gainMusU);
      this.gainMusU.connect(this.maitre);
      this.gainEff.connect(this.maitre);
      this.pret = true;
      this.veiller();
    }catch(e){ this.pret=false; }
  },

  /* Deux lecteurs, créés une seule fois : createMediaElementSource ne
     peut être appelé qu'une fois par élément audio. */
  lecteur(i){
    if(this.lecteurs[i]) return this.lecteurs[i];
    const a = new Audio();
    /* Pas de crossOrigin : les fichiers viennent du même site, et le
       demander fait échouer le chargement — en file:// toujours, et sur
       un serveur qui n'envoie pas les en-têtes CORS. */
    a.preload="auto"; a.volume=1;
    const L = {a, g:null, ok:false};
    if(this.ctx){
      try{
        const src = this.ctx.createMediaElementSource(a);
        L.g = this.ctx.createGain(); L.g.gain.value = 0;
        src.connect(L.g); L.g.connect(this.filtre);
        L.ok = true;
      }catch(e){ L.g=null; a.volume=0; }
    } else { a.volume=0; }
    this.lecteurs[i]=L;
    return L;
  },

  vol(L, v, t){
    if(L.g) this.glisser(L.g.gain, v, t);
    else {
      /* repli sans Web Audio : on anime le volume de l'élément */
      const dep=L.a.volume, pas=(v-dep)/Math.max(1,t*20);
      clearInterval(L.anim);
      L.anim = setInterval(()=>{
        let x = L.a.volume + pas;
        if((pas>0 && x>=v) || (pas<0 && x<=v)){ x=v; clearInterval(L.anim); }
        try{ L.a.volume = Math.max(0,Math.min(1,x)) }catch(e){}
      }, 50);
    }
  },

  reveiller(){
    this.init();
    if(this.ctx && this.ctx.state==="suspended") this.ctx.resume().catch(()=>{});
    const L=this.lecteurs[this.actifL];
    if(L && this.actif && L.a.src) L.a.play().catch(()=>{});
  },

  couper(v){
    this.actif = v;
    try{ localStorage.setItem("pdp_son", v?"1":"0") }catch(e){}
    /* On coupe d'un coup : un fondu laisse le temps à une autre rampe
       de reprendre la main, et le joueur a cliqué pour que ça s'arrête
       maintenant. On rétablit en douceur, en revanche. */
    if(this.maitre){
      if(v) this.glisser(this.maitre.gain, 1, .3);
      else try{ this.maitre.gain.cancelScheduledValues(this.ctx.currentTime);
                this.maitre.gain.setValueAtTime(0, this.ctx.currentTime); }
           catch(e){ this.maitre.gain.value = 0; }
    }
    this.lecteurs.forEach(L=>{ if(!L) return;
      if(v){ if(L.a.src) L.a.play().catch(()=>{}) } else L.a.pause(); });
    const b=document.getElementById("btson");
    if(b){ b.textContent = v?"♪":"♪̸"; b.title = v?"Couper le son":"Rétablir le son";
            b.classList.toggle("muet", !v); }
  },

  /* La réglette. Rétablit le son si on la remonte alors qu'il était coupé :
     personne ne comprendrait qu'on pousse le volume sans rien entendre. */
  volume(v){
    this.vmus = Math.max(0, Math.min(1, v));
    try{ localStorage.setItem("pdp_vol", this.vmus.toFixed(2)) }catch(e){}
    if(this.vmus > 0 && !this.actif){ this.couper(true); }
    if(this.gainMusU) this.glisser(this.gainMusU.gain, this.vmus, .12);
  },

  /* Les bruitages : le même geste, l'autre chemin. */
  bruitage(v){
    this.veff = Math.max(0, Math.min(1, v));
    try{ localStorage.setItem("pdp_eff", this.veff.toFixed(2)) }catch(e){}
    if(this.veff > 0 && !this.actif){ this.couper(true); }
    if(this.gainEff) this.glisser(this.gainEff.gain, this.veff, .12);
    this.papier();                 /* on entend tout de suite ce qu'on règle */
  },

  glisser(param, val, t){
    if(!this.ctx) return;
    /* garde-fou : une cible qui n'est pas un nombre coupait le son en
       silence. Mieux vaut ne rien faire que tout mettre à zéro. */
    if(typeof val !== "number" || !isFinite(val)){
      console.warn("son : fondu ignoré, cible invalide", val); return;
    }
    const n=this.ctx.currentTime;
    try{ param.cancelScheduledValues(n); param.setValueAtTime(param.value,n);
         param.linearRampToValueAtTime(val, n+t); }
    catch(e){ param.value = val; }
  },

  /* Quelque chose joue-t-il, vraiment ? */
  joue(){
    return (this.lecteurs||[]).some(L => L && L.a && !L.a.paused && !L.a.ended);
  },

  /* Remettre l'ambiance en marche si elle s'est tue. Ne fait rien tant
     que tout va bien : on peut donc l'appeler aussi souvent qu'on veut. */
  relancer(){
    /* Le son est coupé : la veille ne se contente pas de ne rien faire,
       elle s'assure qu'il l'est resté. C'est la même boucle qui répare
       dans les deux sens. */
    if(!this.actif){
      try{ if(this.maitre && this.ctx){
             this.maitre.gain.cancelScheduledValues(this.ctx.currentTime);
             this.maitre.gain.setValueAtTime(0, this.ctx.currentTime); } }catch(e){}
      (this.lecteurs||[]).forEach(L=>{ if(L && L.a && !L.a.paused){
        try{ L.a.pause() }catch(e){} } });
      return;
    }
    if(!this.amb) return;
    const b = BOUCLES[this.amb];
    if(!b) return;
    this.init();
    if(!this.pret) return;
    try{ if(this.ctx.state==="suspended") this.ctx.resume().catch(()=>{}); }catch(e){}
    if(this.joue()) return;
    this.actifL = 0;
    this.demarrer(this.lecteur(0), b, true);
    this.lecteur(1);
    clearInterval(this.veille); this.veille = null;
    this.surveiller(b);
    this.lancerHorloge();
  },

  /* Le premier geste du joueur lève la règle de lecture automatique.
     Ensuite, une veille toutes les quatre secondes rattrape ce qu'un
     onglet endormi ou un refus de lecture aurait fait tomber. */
  veiller(){
    if(this.veilleGlobale) return;
    const reprise = ()=>{ try{ this.relancer() }catch(e){} };
    ["pointerdown","keydown","touchstart"].forEach(ev=>
      document.addEventListener(ev, reprise, {capture:true, passive:true}));
    document.addEventListener("visibilitychange", ()=>{
      if(!document.hidden) reprise();
    });
    this.veilleGlobale = setInterval(reprise, 4000);
  },

  /* Où brancher un bruitage. Avant l'initialisation, on retombe sur
     l'interrupteur : rien ne casse si le son n'est pas encore prêt. */
  eff(){ return this.gainEff || this.maitre; },

  /* ---------- l'ambiance --------------------------------------------- */
  ambiance(quoi){
    this.init();
    /* Pas seulement « est-ce la même ambiance ? » mais « la même, et
       elle joue vraiment ? ». Sans cela, une ambiance demandée avant
       que le son soit prêt restait inscrite et bloquait les suivantes. */
    if(this.amb===quoi && this.joue()) return;
    this.amb = quoi;
    const b = BOUCLES[quoi];
    /* hors d'une partie — menu, écran de fin — la tension retombe */
    if(quoi!=="I" && quoi!=="II"){
      this.tension = 0;
      if(this.filtre)  this.glisser(this.filtre.frequency, 7200, 2.5);
      if(this.gainMus) this.glisser(this.gainMus.gain, 1, 2.5);
      this.lecteurs.forEach(L=>{ if(L){ try{ L.a.playbackRate = 1 }catch(e){} } });
    }
    this.lecteurs.forEach(L=>{ if(L) this.vol(L, 0, .5); });
    clearInterval(this.veille); this.veille=null;
    if(!b || !this.pret){ setTimeout(()=>this.stopTous(), 700); return; }
    this.actifL = 0;
    this.demarrer(this.lecteur(0), b, true);
    this.lecteur(1);                       // prêt pour le premier croisement
    this.surveiller(b);
    this.lancerHorloge();
  },

  demarrer(L, b, fondu){
    try{
      if(L.a.getAttribute("src") !== b.f){
        L.a.src = b.f; L.a.load();
        /* fin:0 veut dire « on ne connaît pas la durée » : on la déduit
           du fichier dès qu'il est lu, pour pouvoir boucler dessus. */
        if(!b.fin) L.a.addEventListener("loadedmetadata", ()=>{
          if(L.a.duration && isFinite(L.a.duration)) b.fin = Math.max(1, L.a.duration - 1.2);
        }, {once:true});
      }
      L.a.currentTime = b.debut;
    }catch(e){}
    if(this.actif) L.a.play().catch(()=>{});
    this.vol(L, this.vmix, fondu ? 1.8 : CROISE);
  },

  /* On ne laisse jamais le fichier aller jusqu'au bout : à l'approche du
     point de bouclage, l'autre lecteur reprend au début en fondu. */
  surveiller(b){
    this.veille = setInterval(()=>{
      if(!this.amb || !BOUCLES[this.amb]) return;
      const L=this.lecteurs[this.actifL];
      if(!L || L.a.paused) return;
      /* Point de bouclage encore inconnu : on le prend dès que la durée
         est lisible, et surtout on ne boucle pas avant de le savoir —
         sinon « currentTime >= 0 - 2,5 » est vrai tout de suite. */
      if(!b.fin || !isFinite(b.fin)){
        if(L.a.duration && isFinite(L.a.duration))
          b.fin = Math.max(1, L.a.duration - 1.2);
        return;
      }
      if(L.a.currentTime >= b.fin - CROISE){
        const autre = this.lecteur(this.actifL^1);
        this.demarrer(autre, b, false);
        this.vol(L, 0, CROISE);
        const vieux = L;
        setTimeout(()=>{ try{ vieux.a.pause() }catch(e){} }, (CROISE+.4)*1000);
        this.actifL ^= 1;
      }
    }, 250);
  },

  stopTous(){
    this.lecteurs.forEach(L=>{ if(L){ try{ L.a.pause() }catch(e){} } });
  },

  /* ---------- le battement, au-delà du seuil seulement ---------------- */
  lancerHorloge(){
    if(this.horloge) return;
    this.horloge = setInterval(()=>{
      if(!this.ctx || !this.amb || this.amb==="menu") return;
      if(this.tension < .45){ this.prochain = this.ctx.currentTime + .2; return; }
      const pas = 60/(54 + this.tension*54);
      while(this.prochain < this.ctx.currentTime + .12){
        this.battre(this.prochain); this.prochain += pas;
      }
      if(this.prochain < this.ctx.currentTime) this.prochain = this.ctx.currentTime + .05;
    }, 25);
  },

  battre(t){
    this.battue++;
    const k=(this.tension-.45)/.55;
    if(this.amb==="I") this.vapeur(t, this.battue%2===0, k);
    else               this.chaine(t, this.battue%4===0, k);
  },

  vapeur(t, fort, k){
    const c=this.ctx, o=c.createOscillator(), g=c.createGain();
    o.type="sine"; o.frequency.setValueAtTime(fort?62:52, t);
    o.frequency.exponentialRampToValueAtTime(fort?30:26, t+.16);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime((fort?.17:.10)*k, t+.012);
    g.gain.exponentialRampToValueAtTime(.001, t+.22);
    o.connect(g); g.connect(this.eff()); o.start(t); o.stop(t+.26);
  },

  chaine(t, fort, k){
    const c=this.ctx, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=this.bruit; s.loop=true;
    f.type="bandpass"; f.frequency.value=fort?2600:3400; f.Q.value=9;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime((fort?.06:.035)*k, t+.004);
    g.gain.exponentialRampToValueAtTime(.001, t+(fort?.10:.05));
    s.connect(f); f.connect(g); g.connect(this.eff()); s.start(t); s.stop(t+.14);
  },

  /* « À cause de votre choix d'il y a quatre tours. » C'est le moment
     où le jeu referme une boucle, et il arrivait en silence. Trois
     notes d'un même accord, qui montent lentement et s'éteignent en
     trois secondes, posées sous la musique. Rien de perçant : des
     sinusoïdes filtrées, une attaque d'une demi-seconde, et un volume
     qui reste sous celui de la musique. */
  germe(bon){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.02;
    const f=c.createBiquadFilter(), g=c.createGain();
    f.type="lowpass"; f.frequency.value=1500; f.Q.value=.6;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.075, t+.55);     /* la nappe se lève */
    g.gain.setValueAtTime(.075, t+1.5);
    g.gain.exponentialRampToValueAtTime(.0008, t+3.2);
    f.connect(g); g.connect(this.eff());
    /* majeur quand la graine est heureuse, mineur quand elle l'est moins :
       l'oreille sait avant d'avoir lu. */
    const r = bon ? [1, 1.25, 1.5] : [1, 1.2, 1.5];
    r.forEach((x,i)=>{
      const o=c.createOscillator();
      o.type = i ? "sine" : "triangle";
      o.frequency.setValueAtTime(174.6*x, t);
      o.connect(f); o.start(t+i*.11); o.stop(t+3.3);
    });
  },

  /* Le tiroir du bureau d'enquête : du bois qui glisse sur du bois,
     puis la butée. Grave, court, sans claquement sec. */
  tiroir(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.01;
    const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=this.bruit; s.loop=true;
    f.type="lowpass"; f.frequency.setValueAtTime(380, t);
    f.frequency.linearRampToValueAtTime(900, t+.3);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.05, t+.09);
    g.gain.setValueAtTime(.05, t+.26);
    g.gain.exponentialRampToValueAtTime(.001, t+.4);
    s.connect(f); f.connect(g); g.connect(this.eff()); s.start(t); s.stop(t+.42);
    /* la butée, quand le tiroir arrive au bout */
    const o=c.createOscillator(), gb=c.createGain();
    o.type="triangle"; o.frequency.setValueAtTime(150, t+.3);
    o.frequency.exponentialRampToValueAtTime(82, t+.38);
    gb.gain.setValueAtTime(0, t+.3);
    gb.gain.linearRampToValueAtTime(.09, t+.31);
    gb.gain.exponentialRampToValueAtTime(.001, t+.42);
    o.connect(gb); gb.connect(this.eff()); o.start(t+.3); o.stop(t+.44);
  },

  /* L'enveloppe : le cachet casse, puis le papier se déchire. La
     déchirure monte en fréquence — c'est ce qui la rend reconnaissable. */
  enveloppe(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.01;
    /* le cachet */
    const o=c.createOscillator(), g0=c.createGain();
    o.type="triangle"; o.frequency.setValueAtTime(420, t);
    o.frequency.exponentialRampToValueAtTime(130, t+.07);
    g0.gain.setValueAtTime(0, t);
    g0.gain.linearRampToValueAtTime(.14, t+.006);
    g0.gain.exponentialRampToValueAtTime(.001, t+.1);
    o.connect(g0); g0.connect(this.eff()); o.start(t); o.stop(t+.12);
    /* la déchirure */
    const d=t+.1;
    const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=this.bruit; s.loop=true;
    f.type="bandpass"; f.Q.value=.9;
    f.frequency.setValueAtTime(1600, d);
    f.frequency.exponentialRampToValueAtTime(5200, d+.3);
    g.gain.setValueAtTime(0, d);
    g.gain.linearRampToValueAtTime(.055, d+.05);
    g.gain.linearRampToValueAtTime(.035, d+.2);
    g.gain.exponentialRampToValueAtTime(.001, d+.36);
    s.connect(f); f.connect(g); g.connect(this.eff()); s.start(d); s.stop(d+.38);
  },

  /* Le coup du verdict : un seul, grave et long. Il tombe trois secondes
     avant que la musique de fin s'installe. */
  verdict(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.02;
    const o=c.createOscillator(), o2=c.createOscillator(), g=c.createGain();
    o.type="sine";  o.frequency.setValueAtTime(74, t);
    o.frequency.exponentialRampToValueAtTime(44, t+1.6);
    o2.type="sine"; o2.frequency.setValueAtTime(111, t);
    o2.frequency.exponentialRampToValueAtTime(66, t+1.6);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.22, t+.04);
    g.gain.exponentialRampToValueAtTime(.0008, t+2.6);
    o.connect(g); o2.connect(g); g.connect(this.eff());
    o.start(t); o2.start(t); o.stop(t+2.8); o2.stop(t+2.8);
  },

  /* Une force passe sous quinze. Le bandeau rouge, un élève qui lit ne
     le voit pas : une note tenue, discrète, qui s'efface d'elle-même. */
  alerte(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.02;
    [466.2, 311.1].forEach((hz,i)=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type="sine"; o.frequency.value=hz;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(i?.05:.07, t+.25);
      g.gain.setValueAtTime(i?.05:.07, t+.7);
      g.gain.exponentialRampToValueAtTime(.0008, t+2.1);
      o.connect(g); g.connect(this.eff()); o.start(t); o.stop(t+2.2);
    });
  },

  /* La correction du questionnaire : une note par réponse, dans l'ordre.
     Claire quand elle est juste, sourde quand elle ne l'est pas. */
  bilan(justes){
    if(!this.pret || !justes || !justes.length) return;
    const c=this.ctx, t0=c.currentTime+.12;
    justes.forEach((ok,i)=>{
      const t=t0+i*.15;
      const o=c.createOscillator(), f=c.createBiquadFilter(), g=c.createGain();
      o.type = ok ? "sine" : "triangle";
      o.frequency.setValueAtTime(ok ? 784 : 174.6, t);
      if(!ok) o.frequency.exponentialRampToValueAtTime(146.8, t+.2);
      f.type="lowpass"; f.frequency.value = ok ? 6000 : 700;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(ok ? .1 : .085, t+.012);
      g.gain.exponentialRampToValueAtTime(.001, t+(ok ? .34 : .28));
      o.connect(f); f.connect(g); g.connect(this.eff());
      o.start(t); o.stop(t+.4);
    });
  },

  /* La machine tape tant qu'un texte s'écrit. Irrégulière, discrète, et
     toujours sous la musique : c'est une présence, pas un événement. */
  frappe(marche){
    if(!this.pret) return;
    if(!marche){ if(this.dactylo){ clearInterval(this.dactylo); this.dactylo=null; } return; }
    if(this.dactylo) return;
    const clic = ()=>{
      const c=this.ctx, t=c.currentTime+.005;
      const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
      s.buffer=this.bruit; s.loop=true;
      f.type="bandpass"; f.Q.value=2.2;
      f.frequency.value = 1900 + Math.random()*1300;   /* chaque touche sonne un peu autrement */
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.028 + Math.random()*.016, t+.003);
      g.gain.exponentialRampToValueAtTime(.001, t+.035);
      s.connect(f); f.connect(g); g.connect(this.eff()); s.start(t); s.stop(t+.05);
    };
    clic();
    this.dactylo = setInterval(()=>{
      clic();
      /* une frappe sur six se double : c'est ce qui fait la main humaine */
      if(Math.random() < .17) setTimeout(clic, 40 + Math.random()*30);
    }, 115);
  },

  /* La sonnette du chariot, quand la ligne est finie. */
  chariot(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.01;
    [2093, 3136].forEach((hz,i)=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type="sine"; o.frequency.value=hz;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(i?.022:.05, t+.004);
      g.gain.exponentialRampToValueAtTime(.0008, t+(i?.5:.8));
      o.connect(g); g.connect(this.eff()); o.start(t); o.stop(t+.9);
    });
  },

  /* ---------- la tension ---------------------------------------------- */
  majTension(){
    if(!this.pret) return;
    if(this.amb!=="I" && this.amb!=="II") return;   /* ni au menu, ni à la fin */
    if(typeof E==="undefined" || !E || !E.f) return;
    const bas = Math.min(E.f.i, E.f.o, E.f.m, E.f.p);
    const t = Math.max(0, Math.min(1, (62-bas)/52));
    this.tension = t;
    if(this.filtre)  this.glisser(this.filtre.frequency, 1100 + t*6000, 2.2);
    if(this.gainMus) this.glisser(this.gainMus.gain, 1 + t*.35, 2.2);
    this.lecteurs.forEach(L=>{ if(L){ try{ L.a.playbackRate = 1 + t*.05 }catch(e){} } });
  },

  /* ---------- les effets ponctuels ------------------------------------- */
  coup(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.02;
    const o=c.createOscillator(), g=c.createGain();
    o.type="sine"; o.frequency.setValueAtTime(96, t);
    o.frequency.exponentialRampToValueAtTime(34, t+.7);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.38, t+.02);
    g.gain.exponentialRampToValueAtTime(.001, t+1.1);
    o.connect(g); g.connect(this.eff()); o.start(t); o.stop(t+1.2);
    if(this.gainMus){
      this.glisser(this.gainMus.gain, .35, .2);
      setTimeout(()=>this.majTension(), 1100);
    }
  },

  papier(){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.01;
    const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=this.bruit; s.loop=true;
    f.type="bandpass"; f.frequency.value=4200; f.Q.value=1.4;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.04, t+.03);
    g.gain.exponentialRampToValueAtTime(.001, t+.19);
    s.connect(f); f.connect(g); g.connect(this.eff()); s.start(t); s.stop(t+.22);
  },


  /* Un acteur qu'on interroge répond par une note : elle monte s'il a
     gagné, elle descend s'il a perdu, elle reste plate s'il n'a rien eu. */
  jeton(v){
    if(!this.pret) return;
    const c=this.ctx, t=c.currentTime+.01;
    const o=c.createOscillator(), g=c.createGain();
    const base = 330;
    o.type="sine";
    o.frequency.setValueAtTime(base, t);
    if(v>0) o.frequency.exponentialRampToValueAtTime(base*1.5, t+.13);
    else if(v<0) o.frequency.exponentialRampToValueAtTime(base/1.5, t+.13);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.09, t+.012);
    g.gain.exponentialRampToValueAtTime(.001, t+.26);
    o.connect(g); g.connect(this.eff()); o.start(t); o.stop(t+.28);
  },

  horlogeUrgence(marche){
    if(!this.pret) return;
    if(!marche){ if(this.tic){ clearInterval(this.tic); this.tic=null; } return; }
    if(this.tic) return;
    let n=0;
    this.tic = setInterval(()=>{
      const c=this.ctx, t=c.currentTime+.01;
      const o=c.createOscillator(), g=c.createGain();
      o.type="square"; o.frequency.value=(n++%2)?1900:1500;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.06, t+.004);
      g.gain.exponentialRampToValueAtTime(.001, t+.05);
      o.connect(g); g.connect(this.eff()); o.start(t); o.stop(t+.07);
    }, 500);
  },

  fin(cause){
    if(!this.pret) return;
    this.horlogeUrgence(false);
    this.verdict();                  /* un seul coup, grave, sous le reste */
    const c=this.ctx, t=c.currentTime+.05;
    const freqs = cause==="verdict" ? [196, 261.6, 329.6] : [110, 146.8, 155.6];
    freqs.forEach((hz,i)=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type="sine"; o.frequency.value=hz;
      g.gain.setValueAtTime(0, t+i*.09);
      g.gain.linearRampToValueAtTime(.15, t+i*.09+.03);
      g.gain.exponentialRampToValueAtTime(.001, t+i*.09+2.6);
      o.connect(g); g.connect(this.eff()); o.start(t+i*.09); o.stop(t+i*.09+2.8);
    });
    /* la musique baisse mais ne s'arrête pas : on lit encore le verdict */
    if(this.gainMus) this.glisser(this.gainMus.gain, .45, 1.5);
  },
};

 d:"« Ma machine reste à l’arrêt trois jours sur sept faute de charbon. Creusez ce canal jusqu’aux mines, et je vous promets deux filatures de plus avant Noël. »",
 ex:"Les machines à vapeur qui font tourner les filatures — les usines où l’on file le coton — brûlent du charbon, et la ville en manque. Trois d’entre elles sur cinq ont dû s’arrêter la semaine dernière. Les charretiers qui apportent le charbon depuis les mines réclament le double et livrent quand ils veulent. Un canal permettrait de le faire venir par bateau : dix fois plus à chaque voyage, et bien moins cher.",
 f:"Le charbon est la **ressource** qui rend possible toute la première révolution industrielle : c’est lui qui chauffe l’eau des machines à vapeur. La Grande-Bretagne en possède d’énormes gisements, et c’est l’une des raisons pour lesquelles la révolution industrielle commence chez elle. Mais une ressource ne sert à rien si l’on ne peut pas l’acheminer : il faut aussi des **transports**. Une péniche porte trente fois la charge d’une charrette, ce qui explique que l’Angleterre se couvre de canaux entre 1760 et 1830.",
 a:{q:"« Qu’on creuse le canal. »", e:{i:12,m:10,o:-6,p:-4}, g:["Ressources","Transports"],
    c:"Les péniches arrivent chargées. L’énergie cesse d’être un obstacle — au prix de mois de terrassement, payés par la ville."},
 b:{q:"« Le charbon viendra par la route. »", e:{i:-9,m:-6,p:3},
    c:"Les charrettes coûtent cher et arrivent à moitié vides. Les fabricants murmurent."},
 c:{q:"« Qu’on le creuse, aux frais des fabricants. »", e:{i:-1,m:1,o:-2,p:6}, g:["Ressources","Transports"],
    c:"Le canal se fera, mais plus tard et sans entrain. Halliwell paie en grinçant des dents."}},

{t:"Un mécanicien vous montre un plan.", qui:"Thomas Ainsworth, mécanicien",
 d:"« Une seule machine en bas, et tout tourne en haut, hiver comme été. J’ai vu cela fonctionner à Cromford. Il vous faut du charbon, et de l’audace. »", req:["Ressources"],
 ex:"Jusqu’ici, les filatures de la ville sont entraînées par des roues qu’une rivière fait tourner. Il faut donc s’installer au bord de l’eau, et tout s’arrête quand elle gèle ou qu’elle baisse. Le mécanicien propose autre chose : une machine à vapeur installée au sous-sol, qui entraînerait par des courroies toutes les machines des quatre étages. La dépense est considérable, et deux fabricants attendent votre décision avant d’engager la leur.",
 f:"La machine à vapeur de James Watt, perfectionnée dans les années 1770, est l’**innovation** qui change tout : jusque-là, une usine devait s’installer au bord d’une rivière pour profiter de la force de l’eau. La vapeur libère l’usine de cette contrainte — elle peut désormais s’installer près du charbon, près des ouvriers, près des marchés. Une invention ne devient une innovation que lorsqu’elle est réellement appliquée à la production : c’est ce qui se joue ici.",
 a:{q:"« Installons la machine à vapeur. »", e:{i:14,m:5,o:-8}, g:["Savoirs techniques"],
    c:"Une seule machine remplace des dizaines de bras. Ceux qui restent suivent désormais son rythme, pas le leur."},
 b:{q:"« Continuons de filer à la main. »", e:{i:-9,o:6},
    c:"On file à la main. La ville prend du retard sur Bolton et Oldham."},
 c:{q:"« Installons-la sans renvoyer personne. »", e:{i:3,o:3,m:-9}, g:["Savoirs techniques"],
    c:"La machine tourne et personne n’est renvoyé. Les comptes de la ville, eux, s’en ressentent."}},

{t:"Quarante familles attendent à la grille.", qui:"Abel Crompton, qui commande les équipes dans l’atelier",
 d:"« Elles sont là depuis l’aube, avec leurs enfants. Elles accepteront n’importe quel salaire, et c’est bien ce qui m’ennuie : les nôtres vont le comprendre. Je les prends toutes ? »",
 ex:"Elles ont marché depuis le nord du comté, où elles cultivaient des terres qu’on leur a retirées. Le contremaître a fermé la grille en attendant vos instructions, et la foule ne se disperse pas. Chacune de ces familles, c’est une paire de bras pour les machines — et des bouches de plus dans une ville qui manque déjà de logements.",
 f:"Ces familles quittent la campagne parce qu’on y a supprimé les terres communes où elles faisaient paître leurs bêtes : ce mouvement s’appelle l’**exode rural**. Il fournit aux usines la **main-d’œuvre** dont elles ont besoin — l’une des conditions de la révolution industrielle. Il produit en même temps l’**urbanisation** : Manchester passe d’environ 25 000 habitants en 1772 à plus de 300 000 en 1851. Une main-d’œuvre nombreuse et sans autre ressource accepte des salaires bas : c’est aussi ce qui rend la production rentable.",
 a:{q:"« Embauchons-les toutes. »", e:{i:10,m:4,o:-10,p:-5}, pop:.20, g:["Main-d’œuvre"],
    c:"Les filatures tournent jour et nuit. Les nouveaux venus s’entassent où ils peuvent, et tirent les salaires vers le bas."},
 b:{q:"« Refusons les nouveaux arrivants. »", e:{i:-8,o:5,p:4},
    c:"On refoule les arrivants. Les fabricants se plaignent de manquer de bras."},
 c:{q:"« N’embauchons que ceux qu’on peut loger. »", e:{i:-2,o:-2,m:-5,p:3}, pop:.08, g:["Main-d’œuvre"],
    c:"On trie à la grille. Ceux qu’on renvoie iront grossir Salford, juste de l’autre côté de la rivière."}},

{t:"Un bâtisseur propose soixante cottages.", qui:"Amos Pilkington, entrepreneur en bâtiment",
 d:"« Soixante maisons avant les premières gelées, ou rien du tout — et dans ce cas, ils resteront dans les caves où ils sont. À vous de voir. »",
 ex:"Le terrain derrière la filature a été vendu hier. L’entrepreneur propose d’y construire des maisons ouvrières accolées les unes aux autres, qui partagent leurs murs pour coûter moins cher : une seule façade, pas de cour, pas d’évacuation des eaux sales. Il peut les livrer avant l’hiver. Ce qu’on décide aujourd’hui tiendra debout pendant un siècle.",
 f:"L’**urbanisation** est bien plus rapide que la construction de logements : les villes industrielles grossissent en quelques décennies sans plan d’ensemble ni règlement. Les maisons « dos à dos » partagent trois murs sur quatre pour coûter le moins cher possible — pas de traversée d’air, une cour et des latrines pour plusieurs dizaines d’habitants. Le logement ouvrier est le premier endroit où se lit l’inégalité du progrès : la production augmente, les conditions de vie ne suivent pas.",
 a:{q:"« Bâtissons vite, et au plus bas prix. »", e:{o:9,i:2,p:-6}, pop:.10,
    c:"Des murs aussi minces que possible, mais un toit. La ville en attire davantage encore."},
 b:{q:"« Ne bâtissons aucun logement. »", e:{o:-12,i:4,p:-3}, suite:{dans:3, t:"Ils s’entassent où ils peuvent", x:"Faute de maisons, les arrivants se sont logés dans les greniers, les caves, les courettes. Trois familles par pièce dans certaines rues. Les propriétaires louent au mois et augmentent chaque mois.", e:{o:-7,p:-4,i:3}},
    c:"On s’entasse dans les caves. Chaque nouvelle arrivée aggrave la précédente."},
 c:{q:"« Bâtissons moins, mais avec cour et égout. »", e:{o:5,p:4,m:-9,i:-6}, pop:.05,
    c:"Trente maisons au lieu de soixante, mais on y respire. Pilkington double son devis."}},

{t:"Deux heures de plus par jour.", qui:"Josiah Halliwell, propriétaire d’une filature de coton",
 d:"« Liverpool veut son fil pour mars et nous n’y arriverons pas autrement. Mes ouvriers ont des bouches à nourrir : ils comprendront. »",
 ex:"Une grosse commande doit partir pour Liverpool en mars, et les machines ne produisent pas assez vite pour la livrer à temps. Les fabricants ont calculé qu’il leur manquait deux heures de travail par jour et par ouvrier. La journée passerait ainsi de douze à quatorze heures. Ils attendent votre accord avant de faire changer les horloges de l’atelier.",
 f:"Dans les années 1830, la journée ordinaire en filature va de douze à seize heures, six jours sur sept ; l’éclairage au gaz a rendu le travail de nuit possible. L’usine impose un temps nouveau : celui de la machine, qui ne s’arrête pas, et non plus celui du jour ou des saisons. C’est un changement d’**organisation du travail** au moins aussi important que les machines elles-mêmes, et c’est lui qui provoquera les premières lois sociales.",
 a:{q:"« Passons à quatorze heures par jour. »", e:{i:13,m:6,o:-14,p:-6}, suite:{dans:3, t:"Les accidents se multiplient en fin de poste", x:"Quatre mains prises dans les métiers ce mois-ci, toutes après la douzième heure. Le chirurgien de l’infirmerie tient le compte et il a commencé à le dire.", e:{o:-6,p:-5}},
    c:"Quatorze heures durant, on entre avant le jour et on sort après la nuit. Les accidents se multiplient en fin de journée."},
 b:{q:"« Restons à douze heures. »", e:{i:-7,o:9,p:4},
    c:"La commande partira en retard. Les ouvriers, eux, n’oublieront pas qui a tranché."}},

{t:"Le Parlement a voté le Factory Act.", qui:"Sir Charles Beresford, envoyé du Parlement de Londres", apres:1830,
 d:"« La loi est votée, elle s’applique à vous comme aux autres. Reste à savoir ce que cette ville en fera, puisque personne ne viendra le vérifier avant longtemps. »",
 ex:"Une loi votée à Londres vient d’arriver par la poste. Elle interdit d’employer des enfants de moins de neuf ans dans le textile et limite la journée de ceux de moins de treize ans. C’est la première fois qu’une loi prévoit des inspecteurs pour vérifier qu’on l’applique — mais ils ne sont que quatre pour tout le royaume. Les fabricants ont déjà calculé ce qu’elle leur coûterait.",
 f:"La loi de 1833 interdit le travail des enfants de moins de neuf ans dans le textile et limite à neuf heures la journée des moins de treize ans. Elle est la première à prévoir un contrôle — mais avec quatre inspecteurs pour tout le royaume, autant dire aucun. Elle marque pourtant un tournant : l’État admet que le **progrès** industriel a des effets qu’il faut encadrer. Les lois suivantes, en 1842 et 1847, iront plus loin.",
 a:{q:"« Appliquons la loi : les enfants sortent. »", e:{p:12,o:10,i:-10,m:-4},
    c:"Les plus jeunes sortent des ateliers. Certaines familles perdent d’un coup le tiers de leur revenu."},
 b:{q:"« N’appliquons pas la loi. »", e:{i:9,m:4,o:-8,p:-12}, suite:{dans:4, t:"Un inspecteur est venu de Londres", x:"Il a visité quatre filatures sans prévenir et relevé des enfants de sept ans aux machines. Son rapport part au Parlement. La ville est nommée dedans.", e:{p:-9,i:-4,o:3}, q:{texte:"Le rapport conclut à une amende et à une inspection annuelle. Un avocat de la ville propose de contester devant les tribunaux.",
     choix:[
      {q:"« Payons, et mettons-nous en règle. »", e:{p:10,o:7,i:-8,m:-3},
       c:"L’amende est réglée sans bruit et les enfants sortent des ateliers. Les fabricants parlent de capitulation."},
      {q:"« Contestons : la loi est mal rédigée. »", e:{i:7,p:-9,o:-6,m:2},
       c:"La procédure durera des années, et pendant ce temps rien ne change. Londres retient le nom de la ville."}]}},
    c:"Quatre inspecteurs pour tout le royaume : le risque est mince, et tout le monde le sait."},
 c:{q:"« Ne l’appliquons qu’aux grandes filatures. »", e:{p:-2,i:2,o:-4,m:-1},
    c:"Les grandes filatures se mettent en règle, les petits ateliers de cave continuent. La loi devient une affaire de taille."}},

{t:"L’eau croupit devant les portes.", qui:"Le docteur William Rait, qui soigne les pauvres du quartier",
 d:"« Ce ne sont pas les malades qu’il faut soigner, c’est la rue. Tant que l’eau sale restera devant les portes, je reviendrai vous voir chaque hiver avec les mêmes chiffres. »",
 ex:"Dans les rues ouvrières, il n’y a ni pavés ni canalisations pour emporter les eaux sales : on les jette devant la porte, et elles y stagnent. Le médecin a relevé cinq cas de fièvre cette semaine, tous dans la même rue. Creuser des égouts coûterait deux années de budget et supposerait d’éventrer des quartiers entiers pendant des mois.",
 f:"Avant les années 1840, aucune ville industrielle anglaise n’a d’égouts dignes de ce nom : les eaux usées stagnent dans des rues non pavées où jouent les enfants. Une enquête officielle de 1842, le rapport Chadwick, établit que l’espérance de vie moyenne d’un ouvrier de Manchester est de dix-sept ans, contre trente-huit dans un comté rural voisin. C’est l’un des documents qui obligeront l’État à intervenir : le coût humain de l’**industrialisation** devient un problème public.",
 a:{q:"« Creusons les égouts. »", e:{o:11,p:10,i:-6,m:-8}, suite:{dans:4, t:"Les fièvres ont reculé", x:"Le médecin apporte ses chiffres : deux fois moins de fièvres dans les rues assainies que dans les autres. Londres a demandé copie du rapport — on cite désormais la ville en exemple.", e:{o:9,p:11,m:3}, q:{texte:"Londres propose de financer l’extension des égouts à toute la ville — à condition d’envoyer ses propres inspecteurs contrôler les travaux.",
     choix:[
      {q:"« Acceptons leur argent et leurs inspecteurs. »", e:{o:8,p:9,i:-7,m:-4},
       c:"Les travaux s’étendent deux fois plus vite. Des fonctionnaires de Londres s’installent à demeure et regardent tout."},
      {q:"« Nous continuerons seuls, à notre rythme. »", e:{i:5,m:4,o:-5,p:-6},
       c:"La ville garde la main et l’addition. Les quartiers les plus pauvres attendront encore."}]}},
    c:"Le chantier est long et cher. Les fièvres reculent là où il passe."},
 b:{q:"« Ne creusons rien : à chacun sa rue. »", e:{o:-9,p:-8,i:5,m:3}, suite:{dans:3, t:"Le typhus part des rues sans égouts", x:"Les fièvres que le médecin annonçait sont là. Elles suivent exactement les rues où l’eau stagne — celles que vous aviez laissées en l’état. Cent quarante malades en trois semaines.", e:{o:-6,p:-6,i:-3}, q:{texte:"Le médecin demande de fermer les trois rues les plus touchées, le temps de les nettoyer. Deux filatures y ont leurs ouvriers.",
     choix:[
      {q:"« Fermons ces rues et nettoyons-les. »", e:{o:9,p:8,i:-9,m:-5},
       c:"Trois semaines de travaux et deux filatures au ralenti. L’épidémie s’arrête aux limites du quartier."},
      {q:"« Les filatures ne peuvent pas s’arrêter. »", e:{i:6,m:3,o:-10,p:-8},
       c:"On produit sans interruption. Le typhus, lui, ne s’arrête pas aux limites du quartier."}]}},
    c:"On laisse chaque propriétaire décider. Aucun ne décide rien."},
 c:{q:"« Ne creusons que les rues principales. »", e:{o:3,p:3,m:-7},
    c:"Le centre s’assainit. Les ruelles d’Ancoats, elles, restent ce qu’elles sont."}},

{t:"Liverpool propose une voie ferrée.", qui:"Ezra Duckworth, négociant à Liverpool", apres:1820,
 d:"« Une locomotive a déjà fait l’essai. Ceux qui auront la ligne prendront le marché, ceux qui ne l’auront pas le perdront. Il faut que la ville rachète les terres sur le tracé. »",
 ex:"Liverpool est le port par lequel arrive le coton brut d’Amérique et par lequel repart le fil une fois filé. Aujourd’hui, il faut une journée de charrette pour faire le trajet. Des ingénieurs proposent de construire une ligne de chemin de fer entre les deux villes : deux heures au lieu de douze. Les actionnaires de Liverpool ont réuni la moitié de l’argent et veulent une réponse ce mois-ci, sinon ils desserviront une autre ville.",
 f:"La ligne Liverpool–Manchester, ouverte en 1830, est la première au monde à relier deux grandes villes. Le chemin de fer est la deuxième grande **innovation** de transport après le canal, et il transforme l’échelle des **marchés** : ce qu’on produit ici peut être vendu partout. Il crée aussi une demande énorme de fer, de charbon et de main-d’œuvre — une innovation en entraîne d’autres, c’est ce qui fait un système.",
 a:{q:"« Ouvrons la ligne de chemin de fer. »", e:{m:14,i:9,o:-4,p:-3}, g:["Transports","Marchés"],
    c:"Le coton brut arrive le matin, le fil repart le soir. La ville change d’échelle."},
 b:{q:"« Refusons la ligne, gardons les canaux. »", e:{m:-10,i:-5,p:3},
    c:"Les péniches sont lentes et gèlent en hiver. Duckworth commence à traiter avec Leeds."},
 c:{q:"« Ouvrons-la, mais sous contrôle de la ville. »", e:{m:2,i:1,p:6,o:-2}, g:["Transports"],
    c:"La ligne se fera aux conditions du conseil. Les actionnaires de Liverpool tempêtent, puis signent."}},

{t:"Des acheteurs attendent à Hambourg.", qui:"Ezra Duckworth, négociant à Liverpool", req:["Transports"],
 d:"« J’ai des acheteurs qui attendent. Si vos métiers ne doublent pas, j’achèterai le fil à Oldham : cela ne me coûtera qu’une journée de voiture. »",
 ex:"Le fil produit ici se vend dans le monde entier, et c’est ce qui rend les machines rentables : sans acheteurs lointains, il ne servirait à rien d’en produire autant. Le négociant apporte des commandes venues d’Allemagne et du Brésil qui dépassent à elles seules la production d’une année. Il faudra produire beaucoup plus, et vite, ou les laisser partir chez un concurrent.",
 f:"Produire en masse n’a de sens que si l’on peut vendre en masse : les **marchés**, ou débouchés, sont l’une des conditions de la révolution industrielle. Le coton anglais se vend sur tous les continents, souvent dans les colonies de l’Empire britannique, qui fournissent aussi la matière première. Sans ces débouchés lointains, des machines aussi coûteuses ne seraient jamais rentables : le commerce mondial et l’industrie se développent ensemble.",
 a:{q:"« Doublons les métiers à tisser. »", e:{i:10,m:12,o:-11}, g:["Marchés"],
    c:"On produit deux fois plus avec les mêmes murs. On y tient aussi deux fois moins longtemps."},
 b:{q:"« Refusons : gardons nos cadences. »", e:{m:-11,i:-6,o:6},
    c:"La commande part à Oldham. Duckworth s’en souviendra à la prochaine."},
 c:{q:"« Doublons en embauchant, sans presser personne. »", e:{i:2,m:3,o:-6,p:-4}, pop:.12, g:["Marchés"],
    c:"On produit plus parce qu’on est plus nombreux. La ville enfle d’autant."}},

{t:"Un médecin demande une salle et deux lits.", qui:"Le docteur William Rait, qui soigne les pauvres du quartier",
 d:"« Un seul praticien pour huit mille personnes. Je ne peux pas isoler un malade, donc je ne peux arrêter aucune contagion. Donnez-moi une pièce et deux lits. »",
 ex:"Il n’existe aucun lieu de soin dans les quartiers ouvriers : le médecin examine ses malades sur le pas des portes. Il demande une salle, deux lits et de quoi acheter des médicaments — pas un hôpital. La somme est modeste. C’est le principe qui divise le conseil : faut-il que la ville soigne ceux que les usines épuisent ?",
 f:"Les villes industrielles n’ont presque aucune structure de soin pour les ouvriers : la médecine des pauvres repose sur la charité privée et sur quelques praticiens dévoués. Les épidémies y circulent d’autant plus vite que l’**urbanisation** entasse les gens. Ce sont souvent les médecins qui, en tenant des registres, produisent les premières statistiques sociales — et rendent visible ce que l’industrialisation coûte à ceux qui la font tourner.",
 a:{q:"« Ouvrons le dispensaire. »", e:{o:10,p:7,m:-6,i:-3},
    c:"Le dispensaire ne désemplit pas. On y découvre l’ampleur de ce qu’on ne voyait pas."},
 b:{q:"« Refusons le dispensaire. »", e:{o:-7,p:-4,i:3}, suite:{dans:4, t:"Une fièvre a couru faute de soins", x:"Elle est partie d’une seule cour et personne n’a pu l’arrêter : il n’y avait ni médecin ni lit pour isoler qui que ce soit. On compte les morts par famille entière.", e:{o:-6,p:-5,i:-2}},
    c:"Rait continue seul, et le dit à qui veut l’entendre."},
 c:{q:"« Ouvrons-le, aux frais des fabricants. »", e:{o:6,p:4,i:-11,m:-3},
    c:"Les fabricants paient, et ne manquent pas de rappeler que c’est eux qui paient."}},

{t:"On loue désormais les sous-sols.", qui:"Le révérend Ellis Hargreaves, pasteur du quartier",
 d:"« J’ai enterré quatre enfants cette semaine, tous venus de la même cave. On y loue le sol comme on louerait une chambre. Fermez ces logements. »",
 ex:"Faute de logements, les propriétaires ont commencé à louer les caves de leurs maisons : une pièce en sous-sol, sans fenêtre, sans évacuation, souvent inondée, où s’installe une famille entière. Cela leur rapporte autant qu’une chambre et rien ne l’interdit. Le pasteur tient le compte des enterrements de sa paroisse et il l’a apporté. Interdire ces caves mettrait à la rue ceux qui y vivent.",
 f:"Au début des années 1840, on estime que quinze à vingt mille habitants de Manchester vivent dans des caves : une pièce en sous-sol, sans fenêtre ni évacuation, souvent humide. Friedrich Engels, qui séjourne dans la ville à partir de 1842, les décrit dans *La Situation de la classe laborieuse en Angleterre*. Le logement en cave montre que la croissance de la production et l’amélioration des conditions de vie ne vont pas ensemble : le **progrès ne profite pas également à tous**.",
 a:{q:"« On ferme les logements en cave. »", e:{p:9,o:-6,i:-4,m:-2},
    c:"Les caves sont murées — et ceux qui y vivaient se retrouvent à la rue. Fermer un taudis ne crée pas un logement."},
 b:{q:"« Laissons louer les caves. »", e:{o:-8,p:-6,i:4}, suite:{dans:4, t:"On meurt dans les sous-sols", x:"Le registre des décès de la paroisse est accablant : un enterrement sur trois vient d’un logement en cave. Ce que le révérend décrivait il y a quelques années est devenu un chiffre.", e:{o:-6,p:-7}},
    c:"Sous presque chaque maison, une famille de plus. Le loyer du sous-sol devient un commerce."},
 c:{q:"« On les ferme à mesure qu’on reloge. »", e:{o:3,p:4,m:-10,i:-6},
    c:"Lent, coûteux, et personne ne dort dehors. Le conseil s’endette."}},

{t:"Une fileuse demande à vous parler.", qui:"Mary Kearsley, ouvrière fileuse dans le quartier d’Ancoats",
 d:"« Mon garçon a onze ans et il passe sous les métiers toute la journée. S’il en sort, nous ne mangeons plus. S’il y reste, il y restera pour de bon. C’est vous qui choisissez, pas moi. »",
 ex:"Dans les filatures, on emploie des enfants pour se glisser sous les machines en marche et renouer les fils qui cassent : ils sont les seuls assez petits pour passer sans qu’on arrête la production. Beaucoup y perdent des doigts, certains davantage. Une ouvrière a attendu la fin de son poste pour venir en parler ; elle repart travailler dans une heure.",
 f:"Les enfants sont employés comme « rattacheurs » : assez petits pour passer sous les machines en marche et renouer les fils cassés sans qu’on arrête la production. Le travail des enfants n’est pas une invention de l’usine — on travaillait déjà jeune à la ferme —, mais l’usine le transforme : il devient continu, surveillé, dangereux, et surtout **indispensable au salaire familial**. Une famille ouvrière ne vit pas d’un seul revenu.",
 a:{q:"« Interdisons le travail des enfants. »", e:{p:11,o:3,i:-11,m:-4}, suite:{dans:4, t:"Une école du soir a ouvert", x:"Les enfants sortis des filatures ont été pris en charge par une souscription de la paroisse. Quatre-vingts élèves le premier hiver. Les familles y ont perdu un salaire et gagné autre chose.", e:{p:10,o:7,i:-3}},
    c:"Les enfants sortent. Leurs familles perdent un salaire sur trois, et le leur disent."},
 b:{q:"« Laissons les enfants sous les machines. »", e:{i:8,o:-4,p:-10},
    c:"Ils restent sous les machines. Certains n’en ressortiront pas entiers."}},

{t:"Un contremaître veut chronométrer les gestes.", qui:"Abel Crompton, qui commande les équipes dans l’atelier", req:["Savoirs techniques"],
 d:"« Chacun à sa place, chaque geste compté. Ils n’aimeront pas, je le sais. Ils s’y feront, comme ailleurs. »",
 ex:"Jusqu’ici, chaque ouvrier travaille à peu près à son rythme, comme le faisait l’artisan avant l’usine. Le contremaître a passé trois semaines à mesurer les gestes en cachette, montre en main. Il propose d’assigner chacun à un poste fixe et de fixer le temps de chaque opération : un tiers de production en plus, sans acheter une seule machine. L’atelier a compris ce qu’il faisait.",

/* ==================================================================
   ÉTAT
   ================================================================== */
let E=null;
const app=document.getElementById("app");
const clamp=(x)=>Math.max(0,Math.min(100,x));
const fmt=n=>Math.round(n).toLocaleString("fr-FR").replace(/ | /g," ");
/* Les notions du cours sont marquees **ainsi** dans les textes ; on les
   met en gras apres echappement, pour ne jamais injecter de HTML brut. */
const gras = t => t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

const esc =s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const AN=t=>Math.round(N.a0+(N.a1-N.a0)*t/(N.tours-1));

function nouvellePartie(mode,niv){
  remonter(true);
  if(niv) N=NIVEAUX[niv];
  document.body.classList.remove("surmenu");
  document.body.dataset.niveau=N.id; peindreVille(); chercherVue();
  try{ SON.ambiance(N.id) }catch(e){}
  if(E&&E.timer){ clearInterval(E.timer); }
  stopperMachines();
  E={mode,tour:0,lus:[],f:{i:60,o:60,m:60,p:60},pop:N.pop0,acquis:[],vues:[],carnet:[],carnetOuvert:false,crLus:0,courbe:[{t:0,pop:N.pop0}],releve:[{t:0,an:N.a0,i:60,o:60,m:60,p:60}],secousse:[],aveugle:0,avertiAveugle:false,evVus:[],derEv:-9,graines:[],consq:null,fini:null,timer:null};
  piocher(); rendre();
}
const ok=c=>!c.req||c.req.every(r=>E.acquis.includes(r));
function piocher(){
  const an=E.mode==="campagne"?AN(E.tour):9999;
  let lot=N.cartes.filter(c=>!E.vues.includes(c.t)&&ok(c)&&(!c.apres||c.apres<=an));
  if(!lot.length){ E.vues=[]; lot=N.cartes.filter(c=>ok(c)&&(!c.apres||c.apres<=an)); }
  if(!lot.length) lot=N.cartes.filter(c=>!c.req);
  E.carte=lot[Math.floor(Math.random()*lot.length)];
}

function choisir(quel){
  const c=E.carte, r=c[quel];
  appliquer(r.e);
  (r.g||[]).forEach(g=>{ if(!E.acquis.includes(g)) E.acquis.push(g); });
  /* ce que cette décision fera germer plus tard */
  if(r.suite) E.graines.push({tour:E.tour+r.suite.dans, s:r.suite, de:c.t, choix:r.q, semee:E.tour});
  E.vues.push(c.t);
  /* A-t-on ouvert le dossier d'enquête avant de trancher ? */
  if(c.f && !(E.lus||[]).includes(c.t)) E.aveugle = (E.aveugle||0) + 1;
  E.carnet.push({t:c.t, q:r.q, e:r.e, an:(E.mode==="campagne"?AN(E.tour):null),
                 lu:!c.f || (E.lus||[]).includes(c.t)});
  E.consq=r.c;
  E.tour++;

  /* La croissance de la ville est elle-même une pression : plus les
     industriels sont contents, plus la population enfle, et plus
     l'entassement use les ouvriers. C'est le mécanisme d'Ancoats. */
  const taux=1+.03+E.f.i/500+(r.pop||0);
  const avant=E.pop; E.pop=Math.round(E.pop*taux);
  (E.courbe||(E.courbe=[])).push({t:E.tour, pop:E.pop});
  /* L'état des quatre forces après cette décision. C'est ce relevé qui
     permettra, à la fin, de montrer qui a payé quoi et quand. */
  (E.releve||(E.releve=[])).push({t:E.tour, an:(E.mode==="campagne"?AN(E.tour):null),
    i:Math.round(E.f.i), o:Math.round(E.f.o), m:Math.round(E.f.m), p:Math.round(E.f.p)});
  /* L'entassement s'aggrave avec la TAILLE de la ville, pas seulement
     avec son rythme : loger 400 000 personnes est plus dur que d'en
     loger 40 000. Sans cela, il suffisait de ne jamais industrialiser
     pour survivre indéfiniment — une ville éternelle et minuscule. */
  const usure=(taux-1)*13*(1+E.pop/400000);
  E.f.o=clamp(E.f.o-usure);
  /* Et les marchands ne patientent pas devant une ville qui stagne. */
  let impatience="";
  if(E.f.i<40){ E.f.m=clamp(E.f.m-1.6); impatience=" "+N.impatience; }
  E.entassement=N.croissance(avant,E.pop,usure)+impatience;

  const mort=CLES.find(k=>E.f[k]<=0);
  if(mort) return finir(mort);
  if(E.mode==="campagne"&&E.tour>=N.tours) return finir("verdict");
  const ev=evenementDu();
  if(ev) return declencher(ev);
  const gr=graineMure();
  if(gr) return germer(gr);
  const av=avertissementLecture();
  if(av) return germer(av);
  piocher(); rendre();
}

function finir(cause){
  try{ SON.fin(cause); SON.ambiance("fin"); }catch(e){}
  E.fini=cause;
  if(E.mode==="infini"){
    /* On se mesure à la POPULATION atteinte, jamais au nombre de tours :
       sinon la meilleure tactique serait de ne rien industrialiser. */
    const rec=record();
    if(E.pop>rec) try{localStorage.setItem("pdp_pop_"+N.id,E.pop)}catch(e){}
  }
  rendreFin();
}

/* ==================================================================
   RENDU
   ================================================================== */
const icone=(k,cls)=>`<svg class="${cls||""}"><use href="#${N.forces[k].ic}"/></svg>`;
function fleches(v){
  const n=Math.abs(v)<=6?1:Math.abs(v)<=12?2:3;
  return (v>0?"▲":"▼").repeat(n);
}
function impacts(e){
  return CLES.filter(k=>e[k]).map(k=>{
    const cls=e[k]>0?"up":"dn";
    return `<span class="imp ${cls}" title="${N.forces[k].nom} ${e[k]>0?"+":""}${e[k]}">
      ${icone(k)}<span class="lb">${N.forces[k].nom}</span><span class="fl">${fleches(e[k])}</span></span>`;
  }).join("");
}
function barresForces(){
  oublierSecousse();
  return `<div class="forces">${CLES.map(k=>{
    const v=E.f[k];
    const col = v>55?"var(--vert)" : v>35?"var(--accent)" : v>20?"#D08A2A" : "var(--rge)";
    /* trois paliers, pour qu'on voie venir la rupture */
    const etat = v<=10 ? "critique" : v<=20 ? "danger" : v<=35 ? "fragile" : "";
    const mot  = v<=10 ? "au bord de la rupture" : v<=20 ? "ne tiendra pas longtemps"
               : v<=35 ? "fragile" : "";
    const coup = (E.secousse||[]).indexOf(k)>=0 ? " secouee" : "";
    const dc = dernierChoix(), dv = dc && dc.e ? (dc.e[k]||0) : 0;
    const bul = bulleForce(k);
    return `<div class="force ${etat}${coup}${bul?" causant":""}"
      title="${N.forces[k].nom} — ${N.forces[k].veut}"
      ${bul?`onclick="bulle(this,'${k}')"`:""}>
      <span class="sceau"><img src="img/acteurs/${N.id}-${k}-embleme.jpg" alt=""
        loading="lazy" onerror="this.remove()">${icone(k)}</span>
      <div class="nom">${N.forces[k].nom} <b>${Math.round(v)}</b></div>
      <div class="mini"><i style="width:${v}%;background:${col}"></i></div>
      ${(()=>{ const h=humeur(dv); return h
        ? `<div class="delta ${h.sens}"><span class="fl">${h.fl}</span>${h.mot}</div>` : ""; })()}
      ${mot?`<div class="etat">${mot}</div>`:""}
      ${bul}</div>`;
  }).join("")}</div>`;
}

/* La secousse ne vaut que pour le rendu qui suit le coup. On l'efface
   une fois l'animation passée, et une seule fois même si le tableau est
   peint à deux endroits. */
let SEC_T = null;
function oublierSecousse(){
  if(!E || !E.secousse || !E.secousse.length || SEC_T) return;
  SEC_T = setTimeout(()=>{ SEC_T=null; if(E) E.secousse=[]; }, 1500);
}

/* Le bandeau d'alerte : il nomme le risque et dit ce qu'il en coûte. */
function alerte(){
  if(!E || !E.f) return "";
  const bas = CLES.filter(k=>E.f[k]<=14).sort((a,b)=>E.f[a]-E.f[b]);
  if(!bas.length) return "";
  const noms = bas.map(k=>N.forces[k].nom.toLowerCase());
  const liste = noms.map(n=>"les "+n).join(" et ");
  return `<div class="alarme">
    <strong>Attention.</strong> Vous allez perdre ${liste}.
    Si ${noms.length>1?"l’une de ces forces tombe":"cette force tombe"} à zéro, la partie s’arrête
    immédiatement — ${esc(N.forces[bas[0]].veut)}.</div>`;
}

/* ==================================================================
   LE DÉCOR — la fenêtre du bureau
   La ville derrière la vitre n'est pas un ornement : elle est la jauge
   que le joueur ne peut pas lire en chiffres. Elle grandit avec la
   population, elle s'assombrit avec l'usure ouvrière — sans que
   personne ne l'ait voté. C'est la leçon du jeu, rendue visible.
   ================================================================== */
const SC = {
  el:null, loin:null, pres:null, fum:null, vitre:null, peinte:false,
  /* positions fixes : la ville ne doit pas danser d'un tour à l'autre */
  h(i){ return ((i*2654435761)%4294967296)/4294967296 }
};

function peindreVille(){
  SC.el    = document.getElementById("scene");
  if(!SC.el) return;
  SC.loin  = document.getElementById("loin");
  SC.pres  = document.getElementById("pres");
  SC.fum   = SC.el.querySelector(".fumees");
  SC.vitre = SC.el.querySelector(".vitre");
  if(SC.peinte) return;

  let a="",b="",f="";
  /* rangée lointaine : toits et clochers, ce que la ville était déjà */
  for(let i=0;i<34;i++){
    const x=SC.h(i)*1180, w=14+SC.h(i+90)*30, h=16+SC.h(i+40)*34;
    a+=`<rect x="${x.toFixed(0)}" y="${(238-h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}"/>`;
  }
  /* rangée proche : les cheminées, une par index, révélées peu à peu */
  for(let i=0;i<30;i++){
    const x=18+SC.h(i+7)*1150, w=7+SC.h(i+61)*5, h=52+SC.h(i+23)*86;
    b+=`<rect class="che" data-i="${i}" x="${x.toFixed(0)}" y="${(292-h).toFixed(0)}"
         width="${w.toFixed(0)}" height="${h.toFixed(0)}" opacity="0"/>`;
    if(i<9) f+=`<span style="left:${(SC.h(i+7)*88).toFixed(1)}%;animation-delay:${(i*1.6).toFixed(1)}s"></span>`;
  }
  SC.loin.innerHTML=a; SC.pres.innerHTML=b; SC.fum.innerHTML=f;
  SC.peinte=true;
}

/* Une image existe-t-elle pour ce niveau ? Si oui elle remplace le décor
   peint ; si non, rien ne se voit — le jeu reste beau sans elle. */
function chercherVue(ecran){
  poserDecor(ecran);
  if(!SC.el) return;
  SC.el.classList.remove("aimg");
  const src="img/vue-"+N.id+".jpg", im=new Image();
  im.onload=()=>{ SC.el.querySelector(".vue").style.backgroundImage=`url("${src}")`;
                  SC.el.classList.add("aimg"); };
  im.src=src;
}

function majVue(){
  if(!SC.el||!E) return;
  /* combien la ville a-t-elle enflé depuis le premier tour */
  const croiss = Math.min(1, Math.log(E.pop/N.pop0+1)/Math.log(9));
  /* la suie : l'usure ouvrière d'abord, la taille de la ville ensuite */
  const suie = .16 + .34*(1-E.f.o/100) + .18*croiss;
  SC.el.style.setProperty("--suie", suie.toFixed(3));
  /* les fumées suivent l'activité des fabriques */
  SC.fum.style.opacity = (.16 + .6*(E.f.i/100)).toFixed(3);
  /* les cheminées sortent de terre à mesure que la ville grandit */
  const n = Math.round(4 + croiss*26);
  SC.pres.querySelectorAll(".che").forEach(r=>{
    r.setAttribute("opacity", (+r.dataset.i < n) ? "0.92" : "0");
  });
}

/* ==================================================================
   RENDU — un statut de texte, un dossier
   ================================================================== */
/* ==================================================================
   LA SCENE — quatre acteurs autour de l'affaire du jour
   Chaque poste porte un visage, un nom, une jauge SANS CHIFFRE, et une
   bulle qui parle tout le temps : avant la decision ce qu'il attend,
   apres ce qu'il a encaisse.
   ================================================================== */

/* Qui est concerne par la carte du jour : un acteur qu'au moins une des
   reponses touche. On ne le dit pas au joueur — on fait seulement
   avancer un peu ceux qui ont quelque chose a perdre ou a gagner. */
function concernes(c){
  /* Presque toute carte touche les quatre : les marquer tous ne dit
     rien. On garde les deux dont le sort depend LE PLUS du choix,
     c'est-a-dire ceux pour qui l'ecart entre la meilleure et la pire
     reponse est le plus grand. Le dilemme se voit, sans un chiffre. */
  const ecart = {};
  for(const fk of CLES){
    let bas = 0, haut = 0, vu = false;
    for(const k of ["a","b","c"]){
      const ch = c && c[k];
      if(!ch || !ch.e) continue;
      const v = ch.e[fk] || 0;
      if(!vu){ bas = haut = v; vu = true; }
      if(v < bas) bas = v;
      if(v > haut) haut = v;
    }
    ecart[fk] = haut - bas;
  }
  const tri = CLES.slice().filter(k=>ecart[k] > 0)
    .sort((a,b)=>ecart[b]-ecart[a]).slice(0,2);
  return new Set(tri);
}

/* Ce que l'acteur dit maintenant. Deux cas, jamais plus :
   — on vient de decider : il reagit, et sa raison est celle que porte
     la force (« pourquoi »), deja ecrite carte par carte ;
   — on n'a pas encore decide : il rappelle ce qu'il attend. */
function diraActeur(k){
  const d = dernierChoix();
  const v = d && d.e ? (d.e[k]||0) : 0;
  if(d && v){
    const logique = (N.forces[k].pourquoi || {})[v>0?"plus":"moins"] || "";
    return { txt: logique || (v>0 ? "Vous nous avez entendus." : "Nous n'oublierons pas."),
             sens: v>0 ? "gagne" : (v<=-8 ? "perd-fort" : "perd") };
  }
  return { txt: N.forces[k].veut, sens: "attend" };
}

function poste(k, c, vus){
  const v = E.f[k];
  const etat = v<=10 ? "critique" : v<=20 ? "danger" : v<=35 ? "fragile" : "";
  const mot  = v<=10 ? "au bord de la rupture" : v<=20 ? "ne tiendra pas longtemps"
             : v<=35 ? "fragile" : "";
  const dit  = diraActeur(k);
  /* avant la decision seulement : apres, la reaction parle deja */
  const pres = (!dernierChoix() && vus.has(k)) ? " concerne" : "";
  const col  = v>55?"var(--vert)" : v>35?"var(--accent)" : v>20?"#D08A2A" : "var(--rge)";
  return `<div class="poste p-${k} ${dit.sens}${pres} ${etat}">
    <div class="visage">
      <img src="img/acteurs/${N.id}-${k}-portrait.jpg" alt="" loading="lazy"
           onerror="this.remove()">
      <span class="jeton">${icone(k)}</span>
    </div>
    <div class="ident">
      <span class="nm">${esc(N.forces[k].nom)}</span>
      ${mot?`<span class="et">${mot}</span>`:""}
    </div>
    <div class="tige"><i style="width:${Math.max(3,v)}%;background:${col}"></i></div>
    <div class="dit"><span>${esc(dit.txt)}</span></div>
  </div>`;
}

function scene(c, reponses){
  const vus = concernes(c);
  const d = dernierChoix();
  return `<div class="scene" data-phase="${d?"apres":"avant"}">
    ${poste("i", c, vus)}
    ${poste("m", c, vus)}
    <div class="centre">
      <div class="situ ordre dossier d-situation">
        <i class="encoche eg" aria-hidden="true"></i>
        <i class="encoche ed" aria-hidden="true"></i>
        <span class="onglet">Affaire du jour</span>
        <div class="t"></div>
        <div class="ex"></div>
        <div class="parle">${illuPersonne(c.qui)}<span>${esc(c.qui)}</span></div>
        <div class="d"></div>
      </div>
      <div class="question">Que décidez-vous ?</div>
      ${reponses}
      <div class="moi" aria-hidden="true"><span></span></div>
    </div>
    ${poste("o", c, vus)}
    ${poste("p", c, vus)}
  </div>`;
}

/* LES BULLES ET LE TEXTE QU'ELLES NE DOIVENT PAS COUVRIR.
   Une bulle est posee par-dessus l'ordre du jour, en absolu : elle
   ignore le texte, et le texte l'ignore. On mesure donc, apres coup,
   de combien elle mord sur la feuille, et on donne cette taille aux
   deux flotteurs places en tete du bloc. Le texte les contourne, donc
   il contourne les bulles. Mesure plutot que calcul : la largeur des
   colonnes depend de la fenetre, et une formule se serait trompee. */
function calerBulles(){
  const sc = app.querySelector(".scene"); if(!sc) return;
  const ord = sc.querySelector(".ordre"); if(!ord) return;

  /* Au telephone la scene est une colonne : les bulles ne debordent
     sur rien, et toute mesure posee ici serait a defaire. */
  const rep = sc.querySelector(".rep");
  if(innerWidth <= 860){
    for(const e of sc.querySelectorAll(".encoche")) e.style.cssText = "";
    if(rep){ rep.style.marginLeft = rep.style.marginRight = "" }
    return;
  }

  /* Les trois reponses se serrent entre les deux bulles du bas. */
  if(rep){
    const ce = sc.querySelector(".centre").getBoundingClientRect();
    const bg = sc.querySelector(".p-o .dit"), bd = sc.querySelector(".p-p .dit");
    const g = bg ? Math.max(0, bg.getBoundingClientRect().right - ce.left + 14) : 0;
    const d = bd ? Math.max(0, ce.right - bd.getBoundingClientRect().left + 14) : 0;
    /* on ne laisse jamais moins de 260 px pour lire une reponse */
    const place = ce.width - g - d;
    const k = place < 260 ? Math.max(0, (ce.width - 260) / (g + d || 1)) : 1;
    rep.style.marginLeft  = Math.round(g * k) + "px";
    rep.style.marginRight = Math.round(d * k) + "px";
  }

  const r = ord.getBoundingClientRect();
  if(!r.width) return;
  const cs = getComputedStyle(ord);
  const hg = r.left  + parseFloat(cs.paddingLeft);
  const hd = r.right - parseFloat(cs.paddingRight);
  const ht = r.top   + parseFloat(cs.paddingTop);
  for(const [cote, cle] of [["eg","i"],["ed","m"]]){
    const e = ord.querySelector(".encoche." + cote);
    const b = sc.querySelector(".p-" + cle + " .dit");
    if(!e) continue;
    if(!b){ e.style.width = e.style.height = "0px"; continue; }
    const bb = b.getBoundingClientRect();
    const l = (cote === "eg") ? (bb.right - hg) : (hd - bb.left);
    const h = bb.bottom - ht;
    e.style.width  = Math.max(0, Math.round(l) + 14) + "px";
    e.style.height = Math.max(0, Math.round(h) + 10) + "px";
  }
}
let calage = 0;
addEventListener("resize", ()=>{
  clearTimeout(calage); calage = setTimeout(calerBulles, 120);
});

function rendre(){
  remonter();
  const c=E.carte;
  /* Personne n'a encore ouvert un dossier, et on est au début : on le
     montre. Dès le premier ouvert, on se tait — et de toute façon on se
     tait après le cinquième tour. */
  const guide  = ((E.lus||[]).length === 0) && E.tour < 5;
  const invite = guide && E.tour === 0;     /* la phrase, une seule fois */
  let d=0; const D=()=>`style="--d:${(d+=.085).toFixed(3)}s"`;
  const trois=["a","b","c"].filter(k=>c[k]);

  /* Les chiffres ne se montrent plus : l'eleve decide parce que c'est ce
     qu'il pense, pas parce qu'il a lu une flèche. Les dossiers passent
     sous les reponses : ils restent la, ils ne disputent plus
     l'attention a l'affaire du jour. */
  app.innerHTML=`
  ${alerte()}
  <div class="bureau"><div class="plateau large">
    ${scene(c, `<div class="rep" ${D()}>
      ${trois.map(k=>`<button class="choix" onclick="choisir('${k}')">
        <span class="q">${esc(c[k].q)}</span></button>`).join("")}
    </div>`)}
    <div class="appoints" ${D()}>
      ${c.f?`<details class="dossier d-enquete ${guide?"guide":""}">
          <summary><span class="onglet">Rapport d’enquête</span>
            <span class="cq-txt">Le bureau d’enquête a joint une note.${
              invite?`<i class="invite">Le fait historique est dedans.</i>`:""}</span>
            <span class="pli"></span></summary>
          <div class="corps">${illuDoc(c)}${corpsRapport(c)}</div></details>`:""}
      ${courrier("")}
      ${carnet("")}
    </div>
  </div></div>
  `;
  app.classList.remove("presse");
  ecrire(c.t, c.ex, c.d);
  /* Les images des portraits arrivent apres : on cale une fois tout de
     suite pour que le premier mot tombe au bon endroit, une fois la
     mise en page faite, et une fois le chargement termine. */
  calerBulles();
  requestAnimationFrame(calerBulles);
  addEventListener("load", calerBulles, { once:true });
  try{ SON.majTension(); SON.papier() }catch(e){}
  majVue();
}

/* Un clic n'importe où sur la table pose le reste des dossiers d'un coup. */
document.addEventListener("click",e=>{
  if(e.target.closest("button, summary, a")) return;
  app.classList.add("presse");

});
/* On compte les rapports d'enquête réellement ouverts : le rapport final
   dira au professeur qui a enquêté et qui a tranché à l'aveugle. */
document.addEventListener("toggle",e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains("carnet")&&E) E.carnetOuvert = t.open;
  /* un dossier qu'on déplie froisse, un pli qu'on décachette craque */
  if(t.open && t.classList){
    try{
      if(t.classList.contains("courrier")) SON.enveloppe();
      else if(t.classList.contains("d-enquete")) SON.tiroir();
      else if(t.classList.contains("carnet") || t.classList.contains("acteur")) SON.papier();
    }catch(e){}
  }
  if(t.classList&&t.classList.contains("courrier")&&t.open&&E){

    if(k&&!E.lus.includes(k)) E.lus.push(k);

},true);


/* ==================================================================
   LES ÉVÉNEMENTS — ils tombent, on ne les choisit pas
   ================================================================== */
const SECONDES_URGENCE = 20;

function evenementDu(){
  const reste = N.ev.filter(v=>!E.evVus.includes(v.t));
  if(!reste.length) return null;
  /* Jamais deux coups du sort coup sur coup : il faut pouvoir respirer,
     et redresser les jauges, entre deux. */
  if(E.tour - E.derEv < 3) return null;
  if(E.mode==="campagne"){
    /* À sa date réelle : Peterloo en 1819, le krach en 1929. */
    const an = AN(E.tour);
    return reste.find(v=>v.an<=an) || null;
  }
  /* En survie il n'y a plus de calendrier, donc le hasard. */
  return Math.random()<.22 ? reste[Math.floor(Math.random()*reste.length)] : null;
}

function declencher(ev){
  try{ SON.coup() }catch(e){}
  E.evVus.push(ev.t);
  E.derEv = E.tour;
  E.evEnCours = ev;
  appliquer(ev.e);
  if(ev.pop) E.pop = Math.round(E.pop*(1+ev.pop));
  rendreEvenement(ev);
}

function rendreEvenement(ev){
  remonter();
  app.innerHTML=`
  ${barresForces()}
  <div class="ev">
    <div class="evd">${esc(ev.date)}</div>
    <div class="evt">${esc(ev.t)}</div>
    <p class="evx">${gras(esc(ev.x))}</p>
    <div class="evs"><strong>Fait authentique.</strong> ${gras(esc(ev.src))}</div>
    <div class="evi">${impacts(ev.e)}</div>
  </div>
  <p class="centre" style="margin:20px 0 0">
    ${ev.urgence ? `<button class="plein urg" onclick="rendreUrgence()">Il faut décider maintenant</button>`
                 : `<button class="plein" onclick="suiteEvenement()">Continuer</button>`}
  </p>`;
}

function rendreUrgence(){
  remonter();
  const ev=E.evEnCours;
  if(!ev || !ev.urgence) return suiteEvenement();
  const u=ev.urgence;
  app.innerHTML=`
  ${barresForces()}
  <div class="chrono"><div class="jauge" id="jt"></div></div>
  <p class="compte">Il vous reste <b id="cpt">${SECONDES_URGENCE}</b> secondes</p>
  <div class="situ urgent">
    <div class="ct">Décision urgente — ${esc(ev.date)}</div>
    <div class="t">${esc(ev.t)}</div>
    <div class="d">${esc(u.q)}</div>
  </div>
  <div class="rep ${u.choix.length===2?"deux":""}">
    ${u.choix.map((c,i)=>`<button class="choix" onclick="urgenceChoix(${i})">
      <span class="q">${esc(c.q)}</span><span class="impacts">${impacts(c.e)}</span></button>`).join("")}
  </div>`;
  const jt=document.getElementById("jt");
  if(jt){ jt.style.transition=`width ${SECONDES_URGENCE}s linear`; requestAnimationFrame(()=>{ jt.style.width="0%" }); }
  if(window.SANS_CHRONO) return;
  try{ SON.horlogeUrgence(true) }catch(e){}
  E.reste=SECONDES_URGENCE;
  E.timer=setInterval(()=>{
    E.reste--;
    const c=document.getElementById("cpt");
    if(c) c.textContent=Math.max(0,E.reste);
    if(E.reste<=0) urgenceChoix(-1);
  },1000);
}

function urgenceChoix(i){
  try{ SON.horlogeUrgence(false) }catch(e){}
  if(E.timer){ clearInterval(E.timer); E.timer=null; }
  if(!E.evEnCours || !E.evEnCours.urgence) return suiteEvenement();
  const u=E.evEnCours.urgence;
  const r = i<0 ? u.defaut : u.choix[i];
  appliquer(r.e);
  E.consq = r.c;
  E.entassement = i<0 ? "Le temps a décidé à votre place." : "";
  suiteEvenement();
}

function suiteEvenement(){
  const mort=CLES.find(k=>E.f[k]<=0);
  if(mort) return finir(mort);
  if(E.mode==="campagne" && E.tour>=N.tours) return finir("verdict");
  piocher(); rendre();
}

/* ==================================================================
   LE COURRIER ET LA MACHINE À ÉCRIRE
   ================================================================== */

/* Un pli est-il sur le point d'arriver ? On rejoue la condition de
   evenementDu() pour le tour suivant. En survie il n'y a pas de
   calendrier, donc rien à annoncer : l'enveloppe reste muette. */
function courrierProche(){
  if(!E || E.mode!=="campagne") return false;
  const reste = N.ev.filter(v=>!E.evVus.includes(v.t));
  if(!reste.length) return false;
  if((E.tour+1) - E.derEv < 3) return false;
  const an = AN(Math.min(E.tour+1, N.tours-1));
  return reste.some(v=>v.an <= an);
}

/* Les nouvelles du dehors tombent en plein écran et disparaissent. Le
   courrier les garde : on peut les relire, et les questions de fin
   portent sur elles. */
function courrier(attr){
  const proche = courrierProche();
  const recus = E.evVus.map(t=>N.ev.find(v=>v.t===t)).filter(Boolean).reverse();
  const der = recus[0] || null;

  const resume = proche
    ? `<span class="cd">À l’instant</span>
       <span class="cq">Un pli vient d’arriver. Il n’est pas encore ouvert.</span>`
    : der
      ? `<span class="cd">${esc(der.date)}</span><span class="cq">${esc(der.t)}</span>`
      : `<span class="cq vide">Rien au courrier ce matin.</span>`;

  const neufs = Math.max(0, recus.length - (E.crLus||0));
  const classe = `courrier dossier ${proche?"attente":""} ${neufs?"neuf":""} ${der&&!proche?"ouvert":""}`;
  const cachet = neufs ? `<span class="cachet" aria-label="${neufs} pli${neufs>1?"s":""} à lire">${neufs}</span>` : "";

  /* Sans pli en attente et sans pli reçu, il n'y a rien à ouvrir : on
     n'affiche rien. Un carton vide occupait un tiers de la bande pour
     annoncer qu'il était vide. */
  if(!recus.length && !proche) return "";

  /* Ce qu'un messager peut dire sans briser le cachet. */
  const scelle = proche ? `<article class="cr-pli cr-scelle">
      <div class="cd">Cachet intact</div>
      <div class="crt">Un messager attend dans l’antichambre</div>
      <p class="crx">Le pli ne s’ouvre pas ici : il sera lu devant le conseil, à votre
      <strong>prochaine décision</strong>. Ce qu’on sait déjà, c’est qu’une nouvelle du
      dehors va tomber — et qu’elle ne vous demandera pas votre avis.
      Gardez-vous une marge sur vos quatre forces.</p>
    </article>` : "";

  return `<details class="${classe}" ${attr}>
    <summary>
      <span class="onglet">Courrier</span>${cachet}
      <span class="env"></span>
      <span class="cr-bas">
        <span class="cr-tete">${resume}</span>
        <span class="pli ${proche?"scelle":""}" data-n="${recus.length}"></span>
      </span>
    </summary>
    <div class="cr-plis">${scelle}${recus.map(v=>`<article class="cr-pli">
      <div class="cd">${esc(v.date)}</div>
      <div class="crt">${esc(v.t)}</div>
      <p class="crx">${gras(esc(v.x))}</p>
      <div class="crs"><strong>Fait authentique.</strong> ${gras(esc(v.src))}</div>
    </article>`).join("")}</div>
  </details>`;
}

/* Le titre s'inscrit, puis la réplique. On garde le texte de côté pour
   pouvoir le poser d'un coup si le joueur clique. */
function ecrire(titre, expose, replique){
  stopperMachines();
  E.ecrit = {t:titre, ex:expose||"", d:replique};
  const t=app.querySelector(".situ .t"),
        x=app.querySelector(".situ .ex"),
        r=app.querySelector(".situ .d");
  if(!t||!r) return;
  if(window.SANS_CHRONO || app.classList.contains("presse")){
    t.textContent=titre; if(x) x.textContent=E.ecrit.ex; r.textContent=replique; return;
  }
  t.textContent=""; if(x) x.textContent=""; r.textContent="";
  /* Toute l'affaire s'écrit : le titre, puis l'exposé, puis la réplique.
     L'exposé défile vite — il fait près de quatre cents caractères — et
     un clic n'importe où pose l'ensemble d'un coup. */
  try{ SON.frappe(true) }catch(e){}
  const fini = ()=>{ try{ SON.frappe(false) }catch(e){} };
  E.machines=[ taper(t, titre, 15, ()=>{
    try{ SON.chariot() }catch(e){}          /* le titre est posé */
    if(!x || !E.ecrit.ex){ E.machines.push(taper(r, replique, 7, fini)); return; }
    E.machines.push(taper(x, E.ecrit.ex, 4, ()=>{
      E.machines.push(taper(r, replique, 7, fini));
    }));
  }) ];
}

function taper(el, txt, ms, fin){
  let i=0;
  const id=setInterval(()=>{
    el.textContent = txt.slice(0, ++i);
    if(i>=txt.length){ clearInterval(id); if(fin) fin(); }
  }, ms);
  return id;
}

function stopperMachines(){
  if(E && E.machines) E.machines.forEach(clearInterval);
  if(E) E.machines=[];
  try{ SON.frappe(false) }catch(e){}
}

/* Un clic n'importe où pose le texte en entier. */
function finirEcriture(){
  stopperMachines();
  if(!E || !E.ecrit) return;
  const t=app.querySelector(".situ .t"),
        x=app.querySelector(".situ .ex"),
        r=app.querySelector(".situ .d");
  if(t) t.textContent=E.ecrit.t;
  if(x) x.textContent=E.ecrit.ex||"";
  if(r) r.textContent=E.ecrit.d;
}

/* ==================================================================
   LES CONSÉQUENCES DIFFÉRÉES
   Ce que vous avez décidé revient vous chercher.
   ================================================================== */
function graineMure(){
  if(!E || !E.graines || !E.graines.length) return null;
  const i = E.graines.findIndex(g=>g.tour<=E.tour);
  return i<0 ? null : E.graines.splice(i,1)[0];
}

function germer(gr){
  /* heureuse ou non : la somme de ce qu'elle apporte aux quatre forces */
  try{ const e=(gr.s&&gr.s.e)||{};
       SON.germe(CLES.reduce((n,k)=>n+(e[k]||0),0) >= 0); }catch(e){}
  E.evEnCours = null;
  E.graineEnCours = gr;
  appliquer(gr.s.e);
  try{ SON.coup() }catch(e){}
  rendreGraine(gr);
}

function rendreGraine(gr){
  remonter();
  /* le sens se lit dans le bilan des effets : on ne l'écrit pas deux fois */
  const bilan = CLES.reduce((s,k)=>s+(gr.s.e[k]||0), 0);
  const bon = bilan >= 0;
  const ecart = (gr.semee!=null) ? (E.tour-gr.semee) : gr.s.dans;
  app.innerHTML=`
  <div class="tableau">
    <span class="plaque">État des forces</span>
    ${barresForces()}
  </div>
  <div class="bureau"><div class="plateau un">
    <div class="ev graine ${bon?"bonne":"mauvaise"}">
      <div class="evd">${bon?"Grâce à":"À cause de"} votre choix d’il y a ${ecart} tour${ecart>1?"s":""}</div>
      <div class="origine">
        Vous aviez répondu <em>${esc(gr.choix||"—")}</em>
        à l’affaire « ${esc(gr.de).replace(/\s*\.$/,"")} ».
        <span>Ce n’est donc pas votre dernière décision qui produit ceci.</span>
      </div>
      <div class="evt">${esc(gr.s.t)}</div>
      <p class="evx">${gras(esc(gr.s.x))}</p>
      <div class="evi">${impacts(gr.s.e)}</div>
    </div>
    ${gr.s.q ? `
    <div class="question">${esc(gr.s.q.texte)}</div>
    <div class="rep ${gr.s.q.choix.length===2?"deux":""}">
      ${gr.s.q.choix.map((c,i)=>`<button class="choix" onclick="graineChoix(${i})">
        <span class="q">${esc(c.q)}</span><span class="impacts">${impacts(c.e)}</span></button>`).join("")}
    </div>`
    : `<p class="centre" style="margin:22px 0 0">
      <button class="plein" onclick="suiteGraine()">Continuer</button>
    </p>`}
  </div></div>`;
  try{ SON.majTension() }catch(e){}
  majVue();
}

/* Une conséquence peut appeler une décision de plus. */
function graineChoix(i){
  const gr=E.graineEnCours;
  if(!gr || !gr.s.q) return suiteGraine();
  const r=gr.s.q.choix[i];
  appliquer(r.e);
  E.consq=r.c; E.entassement="";
  suiteGraine();
}

function suiteGraine(){
  E.graineEnCours = null;
  const mort=CLES.find(k=>E.f[k]<=0);
  if(mort) return finir(mort);
  if(E.mode==="campagne" && E.tour>=N.tours) return finir("verdict");
  piocher(); rendre();
}
